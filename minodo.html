<script type="text/javascript">
  RED.nodes.registerType("minodo", {
    category: "function",
    color: "#a6bbcf",
    defaults: {
      name: { value: "" },
      outputPath: { value: "" },
      saveReport: { value: true },

      runSystem: { value: true },
      runNetwork: { value: true },
      runPorts: { value: false },

      runVuln: { value: false },
      trivyTarget: { value: "." },

      runHttpFp: { value: false },
      httpFpAllowInsecure: { value: false },
      httpFpTimeoutMs: { value: 2500 },

      portsTarget: { value: "127.0.0.1" },
      portsMode: { value: "nmap" },
      portsList: { value: "" },
      nmapServiceDetect: { value: false }
    },
    inputs: 1,
    outputs: 1,
    icon: "file.svg",
    label: function () {
      return this.name || "minodo";
    }
  });
</script>

<script type="text/html" data-template-name="minodo">

  <!-- PORTS -->
  <label style="display:block;">
    <input type="checkbox" id="node-input-runPorts" style="width:auto; margin-right:6px;">
    Ports scan
  </label>

  <div class="form-row" style="margin-left: 105px;">
    <label for="node-input-portsTarget" style="width:120px;">Target</label>
    <input type="text" id="node-input-portsTarget" placeholder="127.0.0.1" />
  </div>

  <div class="form-row" style="margin-left: 105px;">
    <label for="node-input-portsMode" style="width:120px;">Mode</label>
    <select id="node-input-portsMode">
      <option value="nmap">Nmap</option>
    </select>
  </div>

  <div class="form-row" style="margin-left: 105px;">
    <label for="node-input-portsList" style="width:120px;">Ports</label>
    <input type="text" id="node-input-portsList" placeholder="22,80,443,1880" />
  </div>

  <div class="form-row" style="margin-left: 105px;">
    <label for="node-input-nmapServiceDetect" style="width:120px;">Nmap -sV</label>
    <input type="checkbox" id="node-input-nmapServiceDetect" style="width:auto;" />
  </div>

  <hr/>

  <!-- TRIVY -->
  <div class="form-row">
    <label for="node-input-runVuln">
      <i class="fa fa-bug"></i> Escaneo de vulnerabilidades (Trivy)
    </label>
    <input type="checkbox" id="node-input-runVuln" style="display:inline-block; width:auto;" />
  </div>

  <div class="form-row" style="margin-left: 105px;">
    <label for="node-input-trivyTarget" style="width:120px;">Trivy target</label>
    <input type="text" id="node-input-trivyTarget" placeholder="." />
  </div>

  <hr/>

  <!-- HTTP FINGERPRINTING -->
  <div class="form-row">
    <label for="node-input-runHttpFp">
      <i class="fa fa-globe"></i> HTTP Fingerprinting
    </label>
    <input type="checkbox" id="node-input-runHttpFp" style="display:inline-block; width:auto;" />
  </div>

  <div class="form-row" style="margin-left: 105px;">
    <label for="node-input-httpFpAllowInsecure" style="width:120px;">Allow insecure</label>
    <input type="checkbox" id="node-input-httpFpAllowInsecure" style="width:auto;" />
    <div style="margin-left: 120px; font-size: 12px; opacity: 0.8;">
      Permite HTTPS con certificados self-signed (útil en LAN/lab).
    </div>
  </div>

  <div class="form-row" style="margin-left: 105px;">
    <label for="node-input-httpFpTimeoutMs" style="width:120px;">Timeout (ms)</label>
    <input type="number" id="node-input-httpFpTimeoutMs" min="500" step="100" placeholder="2500" />
  </div>

  <hr/>

  <!-- NAME -->
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <!-- MODULES -->
  <div class="form-row">
    <label><i class="fa fa-sliders"></i> Modules</label>
    <div style="margin-left: 105px;">
      <label style="display:block;">
        <input type="checkbox" id="node-input-runSystem" style="width:auto; margin-right:6px;">
        System
      </label>
      <label style="display:block;">
        <input type="checkbox" id="node-input-runNetwork" style="width:auto; margin-right:6px;">
        Network
      </label>
    </div>
  </div>

  <!-- OUTPUT -->
  <div class="form-row">
    <label for="node-input-outputPath"><i class="fa fa-folder"></i> Output path</label>
    <input type="text" id="node-input-outputPath" placeholder="~/audit-reports" />
  </div>

  <div class="form-row">
    <label for="node-input-saveReport"><i class="fa fa-save"></i> Save report</label>
    <input type="checkbox" id="node-input-saveReport" style="display:inline-block; width:auto;" />
  </div>

</script>

<script type="text/html" data-help-name="minodo">
  <p>
    Nodo de auditoría: ejecuta módulos (System/Network/Ports/Trivy/HTTP Fingerprinting),
    genera hallazgos con severidad y puede guardar reportes.
  </p>
</script>
