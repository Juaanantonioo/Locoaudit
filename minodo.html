<script type="text/javascript">
  RED.nodes.registerType("minodo", {
    category: "function",
    color: "#a6bbcf",
    defaults: {
      name: { value: "" },
      outputPath: { value: "" },
      saveReport: { value: true },

      runSystem: { value: true },
      runNetwork: { value: true },

      runPorts: { value: false },
      runVuln: { value: false },
      runHttpFp: { value: false },
      runNuclei: { value: false },

      targetType: { value: "host" },
      targets: { value: "127.0.0.1" },

      portsList: { value: "" },
      nmapServiceDetect: { value: false },

      httpFpAllowInsecure: { value: false },
      httpFpTimeoutMs: { value: 2500 },

      nucleiSeverity: { value: "" },
      nucleiTemplates: { value: "" }
    },
    inputs: 1,
    outputs: 1,
    icon: "file.svg",
    label: function () {
      return this.name || "minodo";
    },
    oneditprepare: function () {
      function updateVisibility() {
        const targetType = $("#node-input-targetType").val();
        const runPorts = $("#node-input-runPorts").is(":checked");
        const runVuln = $("#node-input-runVuln").is(":checked");
        const runHttpFp = $("#node-input-runHttpFp").is(":checked");
        const runNuclei = $("#node-input-runNuclei").is(":checked");

        $("#ports-options").toggle(runPorts);
        $("#trivy-note").toggle(runVuln);
        $("#httpfp-options").toggle(runHttpFp);
        $("#nuclei-options").toggle(runNuclei);

        if (targetType === "host") {
          $("#host-note").show();
          $("#image-note").hide();
          $("#fs-note").hide();
          $("#host-scans-note").show();
          $("#artifact-scans-note").hide();
        } else if (targetType === "docker-image") {
          $("#host-note").hide();
          $("#image-note").show();
          $("#fs-note").hide();
          $("#host-scans-note").hide();
          $("#artifact-scans-note").show();
        } else if (targetType === "filesystem") {
          $("#host-note").hide();
          $("#image-note").hide();
          $("#fs-note").show();
          $("#host-scans-note").hide();
          $("#artifact-scans-note").show();
        }
      }

      $("#node-input-targetType").on("change", updateVisibility);
      $("#node-input-runPorts").on("change", updateVisibility);
      $("#node-input-runVuln").on("change", updateVisibility);
      $("#node-input-runHttpFp").on("change", updateVisibility);
      $("#node-input-runNuclei").on("change", updateVisibility);

      updateVisibility();
    }
  });
</script>

<script type="text/html" data-template-name="minodo">

  <!-- NAME -->
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name" />
  </div>

  <hr/>

  <!-- TARGET -->
  <div class="form-row">
    <label for="node-input-targetType"><i class="fa fa-crosshairs"></i> Tipo de objetivo</label>
    <select id="node-input-targetType">
      <option value="host">Host / IP</option>
      <option value="docker-image">Imagen Docker</option>
      <option value="filesystem">Ruta del sistema de archivos</option>
    </select>
  </div>

  <div class="form-row">
    <label for="node-input-targets"><i class="fa fa-list"></i> Objetivos</label>
    <input type="text" id="node-input-targets" placeholder="127.0.0.1 o 192.168.0.10,192.168.0.20" />
  </div>

  <div id="host-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8;">
    Ejemplos: 127.0.0.1, 192.168.0.24, localhost
  </div>

  <div id="image-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8; display:none;">
    Ejemplos: cuentaatras, vulhub/httpd:2.4.49
  </div>

  <div id="fs-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8; display:none;">
    Ejemplos: . , /home/juanantonio/proyecto
  </div>

  <hr/>

  <!-- SCANS -->
  <div class="form-row">
    <label><i class="fa fa-search"></i> Escaneos</label>
    <div style="margin-left: 105px;">
      <label style="display:block;">
        <input type="checkbox" id="node-input-runPorts" style="width:auto; margin-right:6px;">
        Escaneo de puertos
      </label>

      <label style="display:block;">
        <input type="checkbox" id="node-input-runHttpFp" style="width:auto; margin-right:6px;">
        Identificación de servicios web
      </label>

      <label style="display:block;">
        <input type="checkbox" id="node-input-runNuclei" style="width:auto; margin-right:6px;">
        Escaneo de vulnerabilidades web/remotas
      </label>

      <label style="display:block;">
        <input type="checkbox" id="node-input-runVuln" style="width:auto; margin-right:6px;">
        Escaneo de vulnerabilidades del software
      </label>
    </div>
  </div>

  <div id="host-scans-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8;">
    Para objetivos de tipo Host/IP tienen sentido Nmap, la identificación web y Nuclei.
  </div>

  <div id="artifact-scans-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8; display:none;">
    Para imágenes Docker y rutas del sistema de archivos, el análisis recomendado es Trivy.
  </div>

  <!-- PORTS OPTIONS -->
  <div id="ports-options">
    <div class="form-row" style="margin-left: 105px;">
      <label for="node-input-portsList" style="width:160px;"
             title="Lista de puertos a analizar. Puedes indicar puertos individuales separados por comas.">
        Puertos a analizar
      </label>
      <input type="text" id="node-input-portsList" placeholder="22,80,443,1880" />
    </div>

    <div class="form-row" style="margin-left: 105px;">
      <label for="node-input-nmapServiceDetect" style="width:160px;"
             title="Intenta identificar qué servicio corre en cada puerto abierto y, si es posible, su versión. Puede aumentar el tiempo del escaneo.">
        Detectar servicio y versión
      </label>
      <input type="checkbox" id="node-input-nmapServiceDetect" style="width:auto;" />
    </div>

    <div class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8;">
      Intenta reconocer el software que hay detrás de un puerto abierto. Puede hacer el escaneo más lento.
    </div>
  </div>

  <!-- HTTP FP OPTIONS -->
  <div id="httpfp-options">
    <div class="form-row" style="margin-left: 105px;">
      <label for="node-input-httpFpAllowInsecure" style="width:160px;"
             title="Permite analizar servicios HTTPS aunque usen certificados autofirmados o no válidos. Útil en laboratorios y entornos internos.">
        Aceptar certificados autofirmados
      </label>
      <input type="checkbox" id="node-input-httpFpAllowInsecure" style="width:auto;" />
    </div>

    <div class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8;">
      Útil para analizar servicios HTTPS en laboratorios o redes internas aunque el certificado no sea válido.
    </div>

    <div class="form-row" style="margin-left: 105px;">
      <label for="node-input-httpFpTimeoutMs" style="width:160px;"
             title="Tiempo máximo de espera para intentar identificar un servicio web.">
        Tiempo máximo de espera (ms)
      </label>
      <input type="number" id="node-input-httpFpTimeoutMs" min="500" step="100" placeholder="2500" />
    </div>
  </div>

  <!-- NUCLEI OPTIONS -->
  <div id="nuclei-options">
    <div class="form-row" style="margin-left: 105px;">
      <label for="node-input-nucleiSeverity" style="width:160px;"
             title="Permite limitar los resultados de Nuclei a determinados niveles de severidad.">
        Filtrar severidades
      </label>
      <input type="text" id="node-input-nucleiSeverity" placeholder="critical,high,medium" />
    </div>

    <div class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8;">
      Ejemplo: critical,high,medium. Déjalo vacío para analizar todas.
    </div>

    <div class="form-row" style="margin-left: 105px;">
      <label for="node-input-nucleiTemplates" style="width:160px;"
             title="Ruta opcional a plantillas personalizadas de Nuclei.">
        Plantillas personalizadas
      </label>
      <input type="text" id="node-input-nucleiTemplates" placeholder="/ruta/a/templates" />
    </div>

    <div class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8;">
      Si no se indica ninguna ruta, se usarán las plantillas por defecto instaladas con Nuclei.
    </div>
  </div>

  <!-- TRIVY OPTIONS -->
  <div id="trivy-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8; display:none;">
    Trivy se aplicará sobre los objetivos según el tipo seleccionado: imagen Docker o ruta del sistema de archivos.
  </div>

  <hr/>

  <!-- MODULES -->
  <div class="form-row">
    <label><i class="fa fa-sliders"></i> Módulos</label>
    <div style="margin-left: 105px;">
      <label style="display:block;">
        <input type="checkbox" id="node-input-runSystem" style="width:auto; margin-right:6px;">
        System
      </label>
      <label style="display:block;">
        <input type="checkbox" id="node-input-runNetwork" style="width:auto; margin-right:6px;">
        Network
      </label>
    </div>
  </div>

  <hr/>

  <!-- OUTPUT -->
  <div class="form-row">
    <label for="node-input-outputPath"><i class="fa fa-folder"></i> Output path</label>
    <input type="text" id="node-input-outputPath" placeholder="~/audit-reports" />
  </div>

  <div class="form-row">
    <label for="node-input-saveReport"><i class="fa fa-save"></i> Save report</label>
    <input type="checkbox" id="node-input-saveReport" style="display:inline-block; width:auto;" />
  </div>

</script>

<script type="text/html" data-help-name="minodo">
  <p>
    Nodo de auditoría modular que permite ejecutar escaneos de puertos, identificación
    de servicios web, análisis remoto con Nuclei y análisis de vulnerabilidades del software
    con Trivy sobre distintos tipos de objetivos.
  </p>
</script>
