<script type="text/javascript">
    RED.nodes.registerType("lcaudit-image", {
        category: "LCAudit",
        color: "#E67E22",
        defaults: {
            name: { value: "" },
            outputPath: { value: "" },
            saveReport: { value: true },

            targetType: { value: "docker-image" },
            targets: { value: "" }
        },
        inputs: 1,
        outputs: 1,
        icon: "lcaudit-image.svg",
        label: function () {
            return this.name || "lcaudit-image";
        },
        paletteLabel: "Image Audit",
        oneditprepare: function () {
            function updateVisibility() {
                var targetType = $("#node-input-targetType").val();

                if (targetType === "docker-image") {
                    $("#image-note").show();
                    $("#fs-note").hide();
                } else {
                    $("#image-note").hide();
                    $("#fs-note").show();
                }
            }

            $("#node-input-targetType").on("change", updateVisibility);
            updateVisibility();
        }
    });
</script>

<script type="text/html" data-template-name="lcaudit-image">

  <!-- NAME -->
<div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Nombre</label>
    <input type="text" id="node-input-name" placeholder="Nombre del nodo" />
</div>

<hr />

<!-- TARGET TYPE -->
<div class="form-row">
    <label for="node-input-targetType"><i class="fa fa-cube"></i> Tipo de objetivo</label>
    <select id="node-input-targetType">
        <option value="docker-image">Imagen Docker</option>
        <option value="filesystem">Ruta del sistema de archivos</option>
    </select>
</div>

<!-- TARGETS -->
<div class="form-row">
    <label for="node-input-targets"><i class="fa fa-list"></i> Objetivos</label>
    <input type="text" id="node-input-targets" placeholder="alpine:3.18 o nginx:latest" />
</div>

<div id="image-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8;">
    Nombre de la imagen Docker. Ej: alpine:3.18, nginx:latest, mi-app:dev
</div>

<div id="fs-note" class="form-row" style="margin-left: 105px; font-size: 12px; opacity: 0.8; display:none;">
    Ruta del sistema de archivos. Ej: /home/usuario/proyecto, .
</div>

<hr />

<!-- OUTPUT -->
<div class="form-row">
    <label for="node-input-outputPath"><i class="fa fa-folder"></i> Ruta de salida</label>
    <input type="text" id="node-input-outputPath" placeholder="~/audit-reports" />
</div>

<div class="form-row">
    <label for="node-input-saveReport"><i class="fa fa-save"></i> Guardar reporte</label>
    <input type="checkbox" id="node-input-saveReport" style="display:inline-block; width:auto;" />
</div>

</script>

<script type="text/html" data-help-name="lcaudit-image">
  <p>
    <strong>LCAudit Image</strong> — Auditoría de vulnerabilidades en imágenes Docker o rutas del sistema de archivos.
  </p>
  <p>
    Ejecuta <strong>Trivy</strong> en modo <code>image</code> o <code>fs</code> para detectar
    CVEs y vulnerabilidades conocidas en el software analizado.
  </p>
  <h3>Salida</h3>
  <p><code>msg.payload</code> contiene el reporte con CVEs detectados agrupados por severidad.</p>
</script>
