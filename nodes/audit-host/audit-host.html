<script type="text/javascript">
    RED.nodes.registerType("audit-host", {
        category: "locoaudit",
        color: "#E9967A",
        defaults: {
            name:         { value: "" },
            enableCpu:    { value: true },
            enableDisk:   { value: true },
            enableSw:     { value: true },
            enableLynis:  { value: true },
            enableTrivy:  { value: true },
            enableUpdates: { value: true },
            trivyTarget:  { value: "" },
            trivySystemPkgs: { value: true },
            enableSecrets:   { value: true },
            securityEvents:       { value: true },
            securityEventsWindow: { value: 24, validate: function (v) {
                const n = parseInt(v, 10);
                return !isNaN(n) && n >= 1 && n <= 168;
            } },
            llmConfig:    { value: "", type: "llm-config", required: false }
        },
        inputs: 1,
        outputs: 1,
        icon: "lcaudit-host.svg",
        paletteLabel: "audit-host",
        label: function () {
            return this.name || "audit-host";
        },
        labelStyle: function () {
            if (this.name) {
                return "node_label_italic";
            } else {
                return "";
            }
        },
        oneditprepare: function () {
            const mostrarVentana = function () {
                $("#security-events-window-row").toggle(
                    $("#node-input-securityEvents").is(":checked")
                );
            };
            $("#node-input-securityEvents").on("change", mostrarVentana);
            mostrarVentana();
        }
    });
</script>

<script type="text/html" data-template-name="audit-host">

    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> Nombre
        </label>
        <input type="text" id="node-input-name" placeholder="audit-host">
    </div>

    <hr style="margin: 12px 0;">

    <div class="form-row">
        <label style="width: 100%; font-weight: 600; margin-bottom: 8px;">
            <i class="fa fa-cogs"></i> Módulos activos
        </label>

        <div style="padding-left: 8px; display: flex; flex-direction: column; gap: 10px;">

            <div style="display: flex; align-items: flex-start; gap: 8px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 12px;">
                <input type="checkbox" id="node-input-enableCpu" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                <div>
                    <label for="node-input-enableCpu" style="width: auto; font-weight: 600; margin: 0; cursor: pointer;">
                        <i class="fa fa-microchip"></i> CPU y memoria
                        <span style="color: #27ae60; font-size: 0.8em; font-weight: normal; margin-left: 4px;">● nativo</span>
                    </label>
                    <div style="color: #555; font-size: 0.82em; margin-top: 3px; line-height: 1.4;">
                        Mide el uso actual de la CPU (carga media) y de la RAM. No requiere ninguna instalación adicional.
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 8px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 12px;">
                <input type="checkbox" id="node-input-enableDisk" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                <div>
                    <label for="node-input-enableDisk" style="width: auto; font-weight: 600; margin: 0; cursor: pointer;">
                        <i class="fa fa-hdd-o"></i> Disco
                        <span style="color: #27ae60; font-size: 0.8em; font-weight: normal; margin-left: 4px;">● nativo</span>
                    </label>
                    <div style="color: #555; font-size: 0.82em; margin-top: 3px; line-height: 1.4;">
                        Analiza el espacio disponible y usado en cada partición del sistema. Avisa a partir del 85 % de uso (severidad media), del 90 % (alta) y del 95 % (crítica). No requiere ninguna instalación adicional.
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 8px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 12px;">
                <input type="checkbox" id="node-input-enableSw" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                <div>
                    <label for="node-input-enableSw" style="width: auto; font-weight: 600; margin: 0; cursor: pointer;">
                        <i class="fa fa-list-ul"></i> Software instalado
                        <span style="color: #27ae60; font-size: 0.8em; font-weight: normal; margin-left: 4px;">● nativo</span>
                    </label>
                    <div style="color: #555; font-size: 0.82em; margin-top: 3px; line-height: 1.4;">
                        Enumera los paquetes y aplicaciones instalados en el sistema usando el gestor nativo (brew en macOS, dpkg/rpm en Linux, wmic en Windows). Útil para inventario de activos.
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 8px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 12px;">
                <input type="checkbox" id="node-input-enableLynis" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                <div>
                    <label for="node-input-enableLynis" style="width: auto; font-weight: 600; margin: 0; cursor: pointer;">
                        <i class="fa fa-lock"></i> Lynis — hardening del sistema
                        <span style="color: #e67e22; font-size: 0.8em; font-weight: normal; margin-left: 4px;">◌ opcional · ~2 min</span>
                    </label>
                    <div style="color: #555; font-size: 0.82em; margin-top: 3px; line-height: 1.4;">
                        Revisa la configuración de seguridad del sistema: SSH, firewall, permisos de ficheros, cuentas de usuario, etc. Genera un índice de endurecimiento del 0 al 100. Requiere tener <strong>Lynis</strong> instalado; si lo activas y no está disponible, el nodo fallará con un error. En Windows no se ejecuta y aparece como no aplicable.
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 8px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 12px;">
                <input type="checkbox" id="node-input-enableUpdates" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                <div>
                    <label for="node-input-enableUpdates" style="width: auto; font-weight: 600; margin: 0; cursor: pointer;">
                        <i class="fa fa-refresh"></i> Actualizaciones pendientes del sistema
                        <span style="color: #e67e22; font-size: 0.8em; font-weight: normal; margin-left: 4px;">◌ opcional · ~10 s</span>
                    </label>
                    <div style="color: #555; font-size: 0.82em; margin-top: 3px; line-height: 1.4;">
                        Lista las actualizaciones que el sistema tiene pendientes de aplicar, y marca cuáles son de seguridad <strong>solo en los sistemas que lo indican</strong> (Windows Update, dnf y zypper); macOS, apt, pacman y apk no lo distinguen y ahí se avisa de que hay que revisarlas todas. <strong>Nunca instala nada</strong>: solo consulta. Si no se puede consultar, el nodo no falla: lo dice en un hallazgo informativo.
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 8px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 12px;">
                <input type="checkbox" id="node-input-enableTrivy" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                <div>
                    <label for="node-input-enableTrivy" style="width: auto; font-weight: 600; margin: 0; cursor: pointer;">
                        <i class="fa fa-bug"></i> Trivy — vulnerabilidades (CVEs)
                        <span style="color: #e67e22; font-size: 0.8em; font-weight: normal; margin-left: 4px;">◌ opcional · puede tardar</span>
                    </label>
                    <div style="color: #555; font-size: 0.82em; margin-top: 3px; line-height: 1.4;">
                        Compara los paquetes de tus proyectos contra bases de datos de vulnerabilidades conocidas (CVE). Detecta dependencias con fallos de seguridad sin parchear. Requiere tener <strong>Trivy</strong> instalado; si lo activas y no está disponible, el nodo fallará con un error.
                    </div>

                    <div style="margin-top: 8px;">
                        <label for="node-input-trivyTarget" style="width: auto; font-weight: 600; margin: 0; font-size: 0.85em;">
                            Carpeta a auditar
                        </label>
                        <input type="text" id="node-input-trivyTarget" placeholder="Vacío = carpeta personal del usuario (home)" style="width: 100%; margin-top: 3px;">
                        <div style="color: #555; font-size: 0.8em; margin-top: 3px; line-height: 1.4;">
                            Por defecto se audita tu carpeta personal. Puedes apuntar a una carpeta concreta de proyectos (admite <code>~/ruta</code>).
                            Se excluyen cachés (<code>.cache</code>, <code>.npm</code>, <code>.cargo/registry</code>, <code>go/pkg/mod</code>) y la papelera; <code>node_modules</code> SÍ se analiza.
                        </div>
                    </div>

                    <div style="display: flex; align-items: flex-start; gap: 8px; margin-top: 8px;">
                        <input type="checkbox" id="node-input-trivySystemPkgs" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                        <div>
                            <label for="node-input-trivySystemPkgs" style="width: auto; font-weight: 600; margin: 0; cursor: pointer; font-size: 0.85em;">
                                Auditar también los paquetes del sistema
                                <span style="color: #e67e22; font-size: 0.9em; font-weight: normal; margin-left: 4px;">◌ lento · puede tardar varios minutos</span>
                            </label>
                            <div style="color: #555; font-size: 0.8em; margin-top: 3px; line-height: 1.4;">
                                Analiza con <code>trivy rootfs /</code> los paquetes instalados por tu sistema operativo.
                                Es un análisis <strong>aparte</strong> del de tu carpeta personal, no lo sustituye.
                                Activado por defecto: es la parte del equipo que no puedes revisar por tu cuenta, y desactivarlo
                                deja un informe que <em>parece</em> completo sin serlo.
                                Si tu sistema no tiene paquetes que Trivy sepa leer (macOS, Windows, Arch), se indica en el informe
                                como comprobación no realizada, nunca como cero vulnerabilidades.
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; align-items: flex-start; gap: 8px; margin-top: 8px;">
                        <input type="checkbox" id="node-input-enableSecrets" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                        <div>
                            <label for="node-input-enableSecrets" style="width: auto; font-weight: 600; margin: 0; cursor: pointer; font-size: 0.85em;">
                                Buscar secretos y configuraciones inseguras
                                <span style="color: #e67e22; font-size: 0.9em; font-weight: normal; margin-left: 4px;">◌ puede tardar</span>
                            </label>
                            <div style="color: #555; font-size: 0.8em; margin-top: 3px; line-height: 1.4;">
                                Busca en la misma carpeta contraseñas, tokens y claves guardados en ficheros, y revisa los Dockerfile,
                                manifiestos de Kubernetes y ficheros de Terraform de tus proyectos. El informe nunca muestra el valor
                                completo de un secreto: Trivy lo enmascara.
                                Una clave privada dentro de <code>~/.ssh</code> se indica como informativa, porque es su ubicación habitual.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 8px; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px 12px;">
                <input type="checkbox" id="node-input-securityEvents" style="width: auto; margin-top: 2px; flex-shrink: 0;">
                <div style="width: 100%;">
                    <label for="node-input-securityEvents" style="width: auto; font-weight: 600; margin: 0; cursor: pointer;">
                        <i class="fa fa-user-secret"></i> Eventos de seguridad
                        <span style="color: #27ae60; font-size: 0.8em; font-weight: normal; margin-left: 4px;">● nativo</span>
                    </label>
                    <div style="color: #555; font-size: 0.82em; margin-top: 3px; line-height: 1.4;">
                        Foto fija de los eventos de seguridad recientes del host: accesos SSH (correctos y fallidos), usos de sudo/su y sesiones activas, dentro de la ventana temporal configurada. No es monitorización continua: se ejecuta, recoge y termina. Usa los logs del sistema (journalctl/auth.log en Linux, log de macOS); si no son accesibles, lo indica con un hallazgo informativo sin fallar.
                    </div>
                    <div id="security-events-window-row" style="margin-top: 8px; display: flex; align-items: center; gap: 8px;">
                        <label for="node-input-securityEventsWindow" style="width: auto; margin: 0; font-size: 0.85em;">
                            <i class="fa fa-clock-o"></i> Ventana (horas)
                        </label>
                        <input type="number" id="node-input-securityEventsWindow" min="1" max="168" step="1" style="width: 80px;">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <hr style="margin: 12px 0;">

    <div class="form-row">
        <label for="node-input-llmConfig">
            <i class="fa fa-comment"></i> Asistente IA
        </label>
        <input type="text" id="node-input-llmConfig">
    </div>
    <div class="form-row" style="color: #666; font-size: 0.82em; line-height: 1.5; margin-top: -6px;">
        <i class="fa fa-info-circle"></i>
        <strong>Opcional.</strong> Configura un modelo local (Ollama) para poder preguntar
        dudas sobre los hallazgos desde el dashboard. Si lo dejas vacío, el chat con IA no
        estará disponible, pero la auditoría funciona igual.
    </div>

    <hr style="margin: 12px 0;">

    <div class="form-row" style="color: #666; font-size: 0.85em; line-height: 1.5;">
        <i class="fa fa-info-circle"></i>
        Los módulos <em>nativos</em> funcionan siempre sin instalación adicional.
        Los módulos <em>opcionales</em> (Lynis, Trivy) requieren que la herramienta esté instalada en el sistema:
        si están activados y la herramienta no se encuentra, el nodo emitirá un <strong>error</strong>. Desactívalos si no tienes la herramienta instalada.
    </div>

</script>

<script type="text/html" data-help-name="audit-host">
    <p>
        Auditoría de seguridad del host local. Recopila información de CPU, memoria,
        disco, software instalado y ejecuta herramientas de seguridad opcionales
        (Lynis, Trivy). Opcionalmente audita los eventos de seguridad recientes
        (accesos SSH, usos de sudo/su y sesiones activas) en una ventana temporal
        configurable — foto fija, no monitorización continua.
    </p>

    <h3>Entrada</h3>
    <p>Cualquier mensaje dispara la auditoría. El contenido de <code>msg</code> no importa.</p>

    <h3>Salida</h3>
    <dl class="message-properties">
        <dt>payload.findings <span class="property-type">array</span></dt>
        <dd>Array de findings con schema <code>{ id, title, severity, evidence, fix, category, source, timestamp }</code>.</dd>

        <dt>payload.summary <span class="property-type">object</span></dt>
        <dd>Contadores por severidad y severidad máxima detectada.</dd>

        <dt>payload.host <span class="property-type">object</span></dt>
        <dd>Información del sistema operativo: hostname, platform, arch, uptime.</dd>

        <dt>payload.scanMeta <span class="property-type">object</span></dt>
        <dd>Módulos ejecutados y duración total en ms.</dd>

        <dt>payload.raw <span class="property-type">object</span></dt>
        <dd>Datos crudos de cada módulo para trazabilidad.</dd>

        <dt>payload.timestamp <span class="property-type">string</span></dt>
        <dd>Timestamp ISO 8601 del inicio de la auditoría.</dd>
    </dl>

    <h3>Severidades</h3>
    <ul>
        <li><strong>critical</strong> — disco desde el 95 %, vulnerabilidades críticas</li>
        <li><strong>high</strong> — disco desde el 90 %, memoria desde el 95 %, carga desde 1,5 por núcleo</li>
        <li><strong>medium</strong> — disco desde el 85 %, memoria desde el 85 %, carga desde 0,8 por núcleo</li>
        <li><strong>low</strong> — actualizaciones pendientes sin ninguna de seguridad</li>
        <li><strong>info</strong> — datos informativos sin riesgo detectado. En macOS la memoria es siempre informativa.</li>
    </ul>

    <h3>Herramientas externas</h3>
    <p>
        Si un módulo activado necesita <strong>Lynis</strong> o <strong>Trivy</strong> y no
        están instalados, el nodo se detiene con un error que explica cómo instalarlos o
        desactivar el módulo. En Windows, Lynis y el análisis de los paquetes del sistema
        no se ejecutan y aparecen como no aplicables.
    </p>

    <h3>Más información</h3>
    <p>
        <a href="https://cisofy.com/lynis/">Lynis</a> ·
        <a href="https://trivy.dev/">Trivy</a>
    </p>
</script>
