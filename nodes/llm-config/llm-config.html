<script type="text/javascript">
    RED.nodes.registerType("llm-config", {
        category: "config",
        defaults: {
            name:      { value: "" },
            ollamaUrl: { value: "http://127.0.0.1:11434", required: true },
            // Precargados: con un `ollama pull qwen3:8b` hecho, el nodo funciona sin tocar nada.
            model:     { value: "qwen3:8b", required: true }
        },
        label: function () {
            return this.name || this.model || "llm-config";
        },
        oneditprepare: function () {
            var $url    = $("#node-config-input-ollamaUrl");
            // El campo que Node-RED guarda: siempre en el DOM, aunque solo se vea en modo respaldo.
            var $model  = $("#node-config-input-model");
            var $select = $("#node-config-select-model");
            var $fbRow  = $("#node-config-model-fallback");
            var $msg    = $("#node-config-llm-models");
            var $reload = $("#node-config-llm-reload");
            var $btn    = $("#node-config-llm-check");
            var $out    = $("#node-config-llm-check-result");

            // La última URL consultada, para no repetir la petición en cada blur.
            var lastUrl = null;

            /** "qwen3" y "qwen3:latest" son el mismo modelo, como en comprobarModelo(). */
            function normalizarModelo(m) {
                return String(m || "").trim().toLowerCase().replace(/:latest$/, "");
            }

            /** URL utilizable: no vacía y con esquema http(s). */
            function urlValida(u) {
                return /^https?:\/\/[^\s/]+/i.test(String(u || "").trim());
            }

            function mostrarMensaje(color, html) {
                $msg.html('<span style="color:' + color + ';">' + html + "</span>");
            }

            /** Sin lista, campo de texto: con Ollama apagado también hay que poder guardar un modelo. */
            function usarCampoTexto() {
                $select.hide().prop("disabled", true);
                $fbRow.show();
            }

            /** Modo NORMAL: manda el desplegable y el texto libre desaparece. */
            function usarDesplegable() {
                $fbRow.hide();
                $select.show().prop("disabled", false);
            }

            /** Un modelo guardado que ya no está instalado se muestra marcado, sin cambiar la configuración en silencio. */
            function pintarModelos(models) {
                var current = $model.val();
                $select.empty();

                models.forEach(function (m) {
                    $select.append($("<option>").attr("value", m).text(m));
                });

                var match = models.filter(function (m) {
                    return normalizarModelo(m) === normalizarModelo(current);
                })[0];

                if (match) {
                    $select.val(match);
                } else if (current) {
                    $select.append(
                        $("<option>").attr("value", current).text(current + " — no instalado")
                    );
                    $select.val(current);
                }

                // El <select> solo pilota; lo que se guarda es el input.
                $model.val($select.val());
                usarDesplegable();

                mostrarMensaje("#3a7d3a", "✓ " + models.length + " modelo(s) disponible(s) en Ollama.");
            }

            /** Lista los modelos de la URL del formulario; si falla, modo respaldo con aviso. */
            function cargarModelos(force) {
                var url = ($url.val() || "").trim();

                if (!urlValida(url)) {
                    lastUrl = null;
                    usarCampoTexto();
                    if (url) {
                        mostrarMensaje("#a33", "URL no válida. Debe empezar por http:// o https://. Escribe el modelo a mano mientras tanto.");
                    } else {
                        mostrarMensaje("#a33", "Escribe la URL de Ollama para ver los modelos instalados.");
                    }
                    return;
                }

                // El blur salta muchas veces: no se repite la consulta al mismo servidor.
                if (!force && url === lastUrl) return;
                lastUrl = url;

                mostrarMensaje("#888", '<i class="fa fa-spinner fa-spin"></i> Consultando modelos en ' + $("<div>").text(url).html() + "…");

                $.getJSON("locoaudit/llm/models", { url: url })
                    .done(function (r) {
                        if (!r || !r.ok) {
                            usarCampoTexto();
                            // r.error es texto ajeno y mostrarMensaje pinta HTML: se escapa.
                            mostrarMensaje("#a33", "✗ " + $("<div>").text((r && r.error) || "No se pudo obtener la lista de modelos.").html() +
                                "<br>Puedes escribir el modelo a mano para guardar la configuración.");
                            return;
                        }
                        if (!r.models || r.models.length === 0) {
                            // Ollama responde pero no tiene modelos: no es un fallo de conexión.
                            usarCampoTexto();
                            mostrarMensaje("#b5651d",
                                "Ollama responde, pero no hay ningún modelo instalado. " +
                                "Instala uno desde la terminal, por ejemplo: <code>ollama pull qwen3:8b</code>, " +
                                "y pulsa ↻. Mientras tanto puedes escribir el nombre a mano.");
                            return;
                        }
                        pintarModelos(r.models);
                    })
                    .fail(function () {
                        usarCampoTexto();
                        mostrarMensaje("#a33", "✗ No se pudo consultar el listado desde el editor de Node-RED." +
                            "<br>Puedes escribir el modelo a mano para guardar la configuración.");
                    });
            }

            // Elegir en el desplegable escribe en el campo que se guarda.
            $select.on("change", function () {
                $model.val($select.val());
                $out.empty();
            });


            cargarModelos(true);

            // El botón reconsulta aunque la URL no cambie: es el caso de venir de un `ollama pull`.
            $reload.on("click", function () { cargarModelos(true); });

            // Cambiar de servidor lista los modelos de ese servidor.
            $url.on("change blur", function () { cargarModelos(false); });

            // Contra /api/tags, para ver si el modelo elegido sigue instalado.
            $btn.on("click", function () {
                var url = $url.val();
                var model = $model.val();
                $out.css("color", "#888").html('<i class="fa fa-spinner fa-spin"></i> Comprobando…');

                // Probar conexión refresca también la lista.
                cargarModelos(true);

                $.getJSON("locoaudit/llm/check", { url: url, model: model })
                    .done(function (r) {
                        if (r && r.ok) {
                            $out.css("color", "#3a7d3a").html(
                                "✓ Modelo <b>" + $("<div>").text(model).html() + "</b> disponible."
                            );
                        } else {
                            $out.css("color", "#a33").text("✗ " + ((r && r.error) || "Error desconocido."));
                        }
                    })
                    .fail(function () {
                        $out.css("color", "#a33").text("✗ No se pudo consultar el estado desde el editor.");
                    });
            });
        }
    });
</script>

<script type="text/html" data-template-name="llm-config">

    <div class="form-row">
        <label for="node-config-input-name">
            <i class="fa fa-tag"></i> Nombre
        </label>
        <input type="text" id="node-config-input-name" placeholder="LLM local">
    </div>

    <hr style="margin: 12px 0;">

    <div class="form-row">
        <label for="node-config-input-ollamaUrl">
            <i class="fa fa-server"></i> URL de Ollama
        </label>
        <input type="text" id="node-config-input-ollamaUrl" placeholder="http://127.0.0.1:11434">
    </div>

    <!-- El <select> solo elige; lo que se guarda es #node-config-input-model. -->
    <div class="form-row">
        <label for="node-config-select-model">
            <i class="fa fa-cube"></i> Modelo
        </label>
        <select id="node-config-select-model" style="width: 70%;"></select>
        <button type="button" class="red-ui-button red-ui-button-small"
                id="node-config-llm-reload" title="Volver a consultar los modelos instalados"
                style="margin-left: 6px;">
            <i class="fa fa-refresh"></i>
        </button>
    </div>

    <!-- Solo si no se pudo obtener la lista: el nodo debe poder configurarse con Ollama apagado. -->
    <div class="form-row" id="node-config-model-fallback" style="display: none;">
        <label for="node-config-input-model">
            <i class="fa fa-pencil"></i> Modelo (a mano)
        </label>
        <input type="text" id="node-config-input-model" placeholder="qwen3:8b" autocomplete="off">
    </div>

    <div class="form-row" style="margin-top: -6px;">
        <div id="node-config-llm-models"
             style="font-size: 0.85em; line-height: 1.5;"></div>
    </div>

    <div class="form-row">
        <button type="button" class="red-ui-button" id="node-config-llm-check">
            <i class="fa fa-plug"></i> Probar conexión
        </button>
        <div id="node-config-llm-check-result"
             style="margin-top: 8px; font-size: 0.85em; line-height: 1.4;"></div>
    </div>

    <hr style="margin: 12px 0;">

    <div class="form-row" style="color: #666; font-size: 0.85em; line-height: 1.5;">
        <i class="fa fa-info-circle"></i>
        Configura la conexión a un modelo de lenguaje local servido por
        <strong>Ollama</strong>. Este nodo habilita el endpoint
        <code>/locoaudit/chat</code>, que el panel de hallazgos usa para que el
        usuario pueda preguntar dudas sobre cada hallazgo y recibir explicaciones
        en lenguaje claro. No ejecuta comandos del sistema.
    </div>

</script>

<script type="text/html" data-help-name="llm-config">
    <p>
        Nodo de configuración para el asistente de chat con un LLM local
        (vía <a href="https://ollama.com/">Ollama</a>). Almacena la URL del
        servidor y el modelo a usar.
    </p>

    <h3>Campos</h3>
    <dl class="message-properties">
        <dt>URL de Ollama <span class="property-type">string</span></dt>
        <dd>URL base del servidor Ollama. Por defecto <code>http://127.0.0.1:11434</code>.</dd>

        <dt>Modelo <span class="property-type">string</span></dt>
        <dd>
            Desplegable con los modelos instalados en el Ollama de la URL configurada,
            consultados vía <code>/api/tags</code>. Se preselecciona el que ya estuviera
            guardado. Por defecto <code>qwen3:8b</code>.
        </dd>
    </dl>

    <h3>Lista de modelos</h3>
    <p>
        La lista se consulta al abrir el panel, al cambiar la URL, con el botón ↻
        y al pulsar "Probar conexión". Usa ↻ después de un
        <code>ollama pull &lt;modelo&gt;</code> para ver el modelo nuevo.
    </p>
    <p>
        <b>Si no se puede obtener la lista</b> (Ollama apagado, URL errónea o sin
        modelos instalados), el desplegable se sustituye por un campo de texto libre
        y se muestra el aviso correspondiente. Así se puede configurar el nodo aunque
        el servidor no esté disponible en ese momento. Al recuperarse la lista, vuelve
        el desplegable.
    </p>

    <h3>Probar conexión</h3>
    <p>
        El botón consulta <code>GET /api/tags</code> de Ollama y distingue los dos
        fallos posibles: <b>servidor inaccesible</b> (Ollama apagado o URL errónea)
        y <b>modelo no instalado</b> (Ollama responde, pero ese modelo no está).
    </p>
    <p>
        Elegir del desplegable no elimina la validación del runtime: el modelo se
        vuelve a comprobar al desplegar y antes de cada consulta, porque puede
        desinstalarse después de haber configurado el nodo.
    </p>

    <p>
        El tiempo máximo de espera por respuesta es interno (270000 ms) y no se configura.
    </p>

    <h3>Endpoint</h3>
    <p>
        Al desplegar al menos un nodo <code>llm-config</code> se registra el endpoint
        <code>POST /locoaudit/chat</code>, que recibe
        <code>{ finding, question, history }</code> y responde
        <code>{ ok, content }</code> o <code>{ ok:false, error }</code>.
    </p>
</script>
