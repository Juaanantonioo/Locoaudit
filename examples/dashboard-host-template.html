    // para evitar: un límite conocido de la plataforma no es un fallo.
    //
    // Sale de sysPkgs.status, la MISMA fuente que ya elige el texto en
    // sysPkgNotice(). No se compara ninguna cadena de prosa ni se lee el tono.
    sysPkgNoticeLevel() {
      var st = this.sysPkgs && this.sysPkgs.status;
      return (st === 'unsupported-manager' || st === 'supported-not-run' || st === 'failed') ? 2 : 3;
    },

    riskLabel() {
      var MAP = {
        INFO: 'Todo en orden', LOW: 'Riesgo Bajo',
        MEDIUM: 'Riesgo Moderado', HIGH: 'Riesgo Alto', CRITICAL: 'Riesgo Crítico'
      };
      return MAP[this.maxSev] || this.maxSev;
    },

    riskClass() {
      var MAP = { CRITICAL: 'critical', HIGH: 'high', MEDIUM: 'medium', LOW: 'low', INFO: 'info' };
      return MAP[this.maxSev] || 'info';
    },

    uptimeHuman() {
      return this.fmtUptime(this.auditData && this.auditData.host && this.auditData.host.uptimeSec);
    },

    scanTime() {
      var ts = this.auditData && this.auditData.timestamp;
      if (!ts) return '—';
      return new Date(ts).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    // El índice llega como MÉTRICA en scanMeta.lynis. Dejó de ser el finding
    // HOST-LYN-IDX: no señalaba ningún defecto concreto que el usuario pudiera
    // arreglar, y un índice bajo metía un 'high' en el riesgo global por su
    // cuenta. La rama de findings se conserva SOLO para payloads anteriores a
    // ese cambio (un dashboard abierto con datos de una ejecución vieja).
    lynisIdx() {
      var meta = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.lynis;
      if (meta && meta.hardeningIndex != null) return meta.hardeningIndex;

      var findings = this.auditData && this.auditData.findings;
      if (!findings) return null;
      var f = null;
      for (var i = 0; i < findings.length; i++) {
        if (findings[i].id === 'HOST-LYN-IDX') { f = findings[i]; break; }
      }
      if (!f) return null;
      var m = (f.evidence || '').match(/(\d+)\/100/);
      return m ? parseInt(m[1], 10) : null;
    },

    // Subtítulo del gauge: "167 controles · Lynis 3.1.6" cuando el payload lo trae.
    lynisMetaLine() {
      var meta = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.lynis;
      if (!meta) return '';
      var parts = [];
      if (meta.testsDone) parts.push(meta.testsDone + ' controles');
      if (meta.version) parts.push('Lynis ' + meta.version);
      return parts.join(' · ');
    },

    // Sin índice no hay dato, y "no hay dato" no se pinta de verde: neutro.
    // Los tres tramos leen los MISMOS tokens que pintan los badges de severidad.
    // Antes eran tres literales de la paleta de image dentro de host, así que el
    // gauge y los badges daban dos rojos, dos naranjas y dos verdes distintos para
    // el mismo nivel. Al leerlos del :root la divergencia no puede volver.
    // Presentacionales: solo reformatean valores que ya se muestran en otras
    // partes del informe. Ningún dato ni cálculo de negocio nuevo.
    modulesLabel() {
      var m = this.modules;
      if (!m.length) return null;
      var run = m.filter(function(x) { return x.status === 'ok'; }).length;
      return run + ' de ' + m.length;
    },

    lynisTests() {
      var meta = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.lynis;
      return (meta && meta.testsDone) || null;
    },

    // Herramientas que han producido los datos, con su versión. Salen de donde ya
    // se enseñan (el Alcance y el gauge); si una no consta, no se inventa.
    toolSources() {
      var out = [];
      var t = (this.trivyScan && this.trivyScan.trivyVersion) ||
              (this.sysPkgs && this.sysPkgs.trivyVersion);
      if (t) out.push('Trivy ' + t);
      var lm = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.lynis;
      if (lm && lm.version) out.push('Lynis ' + lm.version);
      return out.length ? out.join(' · ') : null;
    },

    lynisColor() {
      if (this.lynisIdx === null) return this.tok.textSecondary;
      if (this.lynisIdx < 30) return this.tok.critical;
      if (this.lynisIdx < 55) return this.tok.high;
      return this.tok.low;
    },

    // arc length = lynisIdx% of the visible 221-unit arc; total circumference r=44 ≈ 276
    gaugeStroke() {
      if (this.lynisIdx === null) return 0;
      return Math.round(this.lynisIdx / 100 * 221);
    },

    ramData() {
      var cm = this.auditData && this.auditData.raw && this.auditData.raw.cpuMemory;
      if (!cm || !cm.memory) return null;
      var pct = (cm.memory.usedGiB && cm.memory.totalGiB)
        ? Math.round(cm.memory.usedGiB / cm.memory.totalGiB * 100) : null;
      return {
        totalGiB: cm.memory.totalGiB,
        usedGiB:  cm.memory.usedGiB,
        pct:      pct,
        platform: cm.platform || (this.auditData.host && this.auditData.host.platform) || ''
      };
    },

    cpuData() {
      var cm = this.auditData && this.auditData.raw && this.auditData.raw.cpuMemory;
      if (!cm || !cm.cpu) return null;
      return {
        model:   cm.cpu.model  || '—',
        cores:   cm.cpu.cores  || 1,
        loadAvg: Array.isArray(cm.cpu.loadAvg) ? cm.cpu.loadAvg : null
      };
    },

    diskData() {
      var disk = this.auditData && this.auditData.raw && this.auditData.raw.disk;
      if (!Array.isArray(disk) || disk.length === 0) return [];
      var platform = this.auditData.host && this.auditData.host.platform;
      var T = this.tok;   // el color va a una cadena de estilo: ningún var() llega ahí
      return disk.filter(function(d) {
        // En macOS "/" es el volumen de solo lectura del sistema (~11 GB).
        // /System/Volumes/Data es el volumen real con los datos del usuario.
        return !(platform === 'darwin' && d.mount === '/');
      }).map(function(d) {
        var pct = d.usedPercent || 0;
        return {
          mount:       d.mount,
          usedPercent: pct,
          usedGB:      d.usedGB,
          totalGB:     d.totalGB,
          freeGB:      d.freeGB != null ? d.freeGB : Math.round((d.totalGB - d.usedGB) * 100) / 100,
          sevColor:    pct >= 90 ? T.critical : pct >= 75 ? T.high : pct >= 60 ? T.medium : T.low
        };
      });
    },

    groups() {
      var findings = this.auditData && this.auditData.findings;
      if (!findings) return [];
      var fsev = this.filterSev;   // filtro por severidad (tarjetas clicables)
      // 'disk' ESTÁ en la lista a propósito. Antes se descartaba porque la
      // tarjeta de métricas de disco ya enseña el dato, pero esa tarjeta muestra
      // CAPACIDAD (GB, %), no HALLAZGOS: un disco al 92 % contaba en la cabecera
      // y en el donut y luego no tenía fila en ninguna parte de la lista, así que
      // el usuario veía "1 alto" sin poder encontrarlo. Excluirlo además hacía
      // que las barras por categoría no sumaran el total de la cabecera.
      // `icon` es la CLAVE de un <symbol> del sprite, no un glifo: se compone como
      // '#lca-i-' + icon en la plantilla. El campo, su nombre y su papel no cambian.
      var CATS = {
        vulnerability: { icon: 'lock',    label: 'Vulnerabilidades',          order: 0 },
        cpu:           { icon: 'cpu',     label: 'Procesador (CPU)',          order: 1 },
        memory:        { icon: 'memory',  label: 'Memoria RAM',               order: 2 },
        disk:          { icon: 'disk',    label: 'Almacenamiento',            order: 3 },
        system:        { icon: 'server',  label: 'Sistema & Actualizaciones', order: 4 },
        network:       { icon: 'globe',   label: 'Red & Firewall',            order: 5 },
        'system-logs': { icon: 'list',    label: 'Logs del sistema',          order: 6 },
        other:         { icon: 'package', label: 'Otros',                     order: 99 }
      };
      var SEV_ORDER = { CRITICAL: 5, HIGH: 4, MEDIUM: 3, LOW: 2, INFO: 1 };
      var catMap = {};
      findings.forEach(function(f) {
        // Las comprobaciones no realizadas NO son hallazgos sobre el equipo: son alcance del
        // análisis, y su sitio es el bloque de al lado del panel de Alcance. Sueltas aquí,
        // aparecían como cuatro problemas más dentro de "Sistema & Actualizaciones", mezcladas
        // con hallazgos reales. Siguen en `auditData.findings` y en la exportación JSON con su
        // detalle íntegro: lo que cambia es dónde se pintan.
        if (f.skipped === true) return;
        if (fsev !== 'all' && (f.severity || '').toLowerCase() !== fsev) return;
        var c = (f.category || 'other').toLowerCase();
        var key = CATS[c] ? c : 'other';
        if (!catMap[key]) catMap[key] = [];
        catMap[key].push(f);
      });
      Object.keys(catMap).forEach(function(c) {
        // Severidad primero, y a igualdad de severidad, por subcategoría. Así
        // los controles de Lynis del mismo grupo (todos los AUTH, todos los
        // NETW) quedan contiguos dentro del acordeón que ya existe, sin abrir
        // un segundo nivel de plegado: eso obligaría a tocar openGroups,
        // toggleGroup y el clon del snapshot, que ya dio problemas con v-show.
        catMap[c].sort(function(a, b) {
          var d = (SEV_ORDER[(b.severity || '').toUpperCase()] || 0) -
                  (SEV_ORDER[(a.severity || '').toUpperCase()] || 0);
          if (d !== 0) return d;
          return (a.subcategory || '').localeCompare(b.subcategory || '', 'es');
        });
      });
      return Object.keys(catMap).map(function(c) {
        var meta = CATS[c] || { icon: 'list', label: c, order: 50 };
        return { key: c, icon: meta.icon, label: meta.label, order: meta.order, items: catMap[c] };
      }).sort(function(a, b) { return a.order - b.order; });
    },

    secEvents() {
      // payload.securityEvents = { windowHours, events: [{ts,type,user,origin,detail}], truncated }
      return (this.auditData && this.auditData.securityEvents) || null;
    },

    // Intentos de acceso (eventos que OCURRIERON): SSH OK/fallido, sudo, su,
    // logins remotos/fallidos, admin. Todo menos las sesiones activas ahora.
    accessEvents() {
      var evs = (this.secEvents && this.secEvents.events) || [];
      return evs.filter(function(e) { return e.type !== 'session'; });
    },

    // Sesiones activas AHORA MISMO (estado presente, salida de `who`): type 'session'.
    sessionEvents() {
      var evs = (this.secEvents && this.secEvents.events) || [];
      return evs.filter(function(e) { return e.type === 'session'; });
    },

    // ¿Se llegó a consultar? Una lista vacía solo tranquiliza si consta que
    // alguien miró: en Windows Home no existen `query` ni `qwinsta`, y sin esta
    // señal el panel decía "Sin sesiones remotas activas" sin haber preguntado.
    // Payloads antiguos no traen el campo → se asume que sí se consultó.
    sessionsChecked() {
      var m = this.secEvents;
      return !m || m.sessionsChecked !== false;
    },

    catBars() {
      var SEV_ORDER = { CRITICAL: 5, HIGH: 4, MEDIUM: 3, LOW: 2, INFO: 1 };
      var T = this.tok;
      // Dos colores por barra, no uno: `color` rellena la barra —ahí manda la
      // identidad— y `textColor` pinta la cifra, que es TEXTO sobre blanco y con el
      // tono base no llega al mínimo legible (3,09 medido para low, mínimo 4,5).
      var SEV_COLOR = { CRITICAL: T.critical, HIGH: T.high, MEDIUM: T.medium, LOW: T.low, INFO: T.info };
      var SEV_TEXT  = { CRITICAL: T.criticalText, HIGH: T.highText, MEDIUM: T.mediumText, LOW: T.lowText, INFO: T.infoText };
      var nonEmpty = this.groups.filter(function(g) { return g.items.length > 0; });
      if (!nonEmpty.length) return [];
      var maxCount = Math.max.apply(null, nonEmpty.map(function(g) { return g.items.length; }));
      return nonEmpty.map(function(g) {
        var maxSev = 'INFO';
        g.items.forEach(function(f) {
          var s = (f.severity || '').toUpperCase();
          if ((SEV_ORDER[s] || 0) > (SEV_ORDER[maxSev] || 0)) maxSev = s;
        });
        return {
          key:   g.key,
          label: g.label,
          count: g.items.length,
          pct:   maxCount > 0 ? Math.round(g.items.length / maxCount * 100) : 0,
          color: SEV_COLOR[maxSev] || T.textMuted,
          textColor: SEV_TEXT[maxSev] || T.textSecondary
        };
      });
    },

    donutSegments() {
      var C = 339.3; // circumference r=54
      var c = this.counts;
      var T = this.tok;   // atributo :stroke del <circle>: fuera del alcance de var()
      var total = c.critical + c.high + c.medium + c.low + c.info;
      if (total === 0) return [];
      var sevs = [
        { key: 'info',     color: T.info,     count: c.info     },
        { key: 'low',      color: T.low,      count: c.low      },
        { key: 'medium',   color: T.medium,   count: c.medium   },

    // Gramática de `fix`. Se lee LÍNEA a línea y los marcadores los pone el ORIGEN
    // (lib/normalizer.js), nunca se deducen aquí:
    //
    //   "## "  abre una rama alternativa; el resto de la línea es su subtítulo.
    //   "$ "   comando del ÚLTIMO paso de la rama abierta. No genera paso propio:
    //          el comando pertenece al paso que lo usa.
    //   "> "   nota: párrafo neutro que se pinta TRAS la lista de su rama (o tras el
    //          bloque introductorio). Nunca se numera, porque no es algo que hacer.
    //   resto  paso nuevo de la rama abierta.
    //
    // Regla de intro: si el texto trae al menos una "## ", las líneas anteriores a la
    // primera forman un párrafo introductorio SIN numerar —describen el servicio, no
    // piden nada—. Sin ninguna "## ", todo son pasos, como hasta ahora.
    //
    // Devuelve { intro: [], notes: [], branches: [{ heading, steps: [{label, cmd}], notes: [] }] }.
    // Un fix sin marcadores da una sola rama sin subtítulo y un paso por línea, que es
    // como sigue viéndose todo lo que no se ha migrado.
    //
    // Lo que había antes y NO vuelve: trocear por ". " un fix de una sola línea
    // —convertía cualquier párrafo en una secuencia numerada que nadie había escrito—
    // y adivinar comandos con una lista de verbos. Medido sobre los 63 fix reales de
    // Lynis, los de Trivy y los de eventos de Windows: cero aciertos de esa heurística.
    parseFixSteps(fix) {
      var res = { intro: [], notes: [], branches: [] };
      if (!fix) return res;
      var lineas = String(fix).split('\n')
        .map(function (l) { return l.trim(); })
        .filter(function (l) { return l; });
      var hayRamas = lineas.some(function (l) { return l.indexOf('## ') === 0; });
      var actual = null;
      function abrir(heading) {
        actual = { heading: heading, steps: [], notes: [] };
        res.branches.push(actual);
      }
      lineas.forEach(function (s) {
        if (s.indexOf('## ') === 0) { abrir(s.slice(3).trim()); return; }
        if (s.indexOf('> ') === 0) {
          var nota = s.slice(2).trim();
          // Antes de la primera rama la nota cuelga del bloque introductorio.
          if (nota) (actual ? actual.notes : res.notes).push(nota);
          return;
        }
        if (s.indexOf('$ ') === 0) {
          var cmd = s.slice(2).trim();
          if (!cmd) return;
          if (!actual) abrir(null);
          var ultimo = actual.steps[actual.steps.length - 1];

          // la etiqueta vacía. Es un fix mal formado en el origen, no un motivo para perderlo.
          if (!ultimo || ultimo.cmd) actual.steps.push({ label: '', cmd: cmd });

        if (!actual) abrir(null);

    // El botón copia SOLO el comando (finding.command); la nota se muestra aparte,
    // para que un pegado en terminal nunca arrastre texto no ejecutable.
    fixNote(f) {

      var d = Math.floor(sec / 86400);
      var h = Math.floor((sec % 86400) / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var r = '';
      if (d > 0) r += d + 'd ';
      if (h > 0) r += h + 'h ';
      r += m + 'm';
      return r.trim();
    },

    fmtDuration(ms) {
      if (!ms) return '—';
      var s = Math.floor(ms / 1000);
      var m = Math.floor(s / 60);
      return m > 0 ? m + ' min ' + (s % 60) + ' s' : s + ' s';
    },

    // Los dos colores acaban en una cadena de estilo, donde ningún var() llega:
    // se leen del :root con readTokens() en vez de repetir la paleta aquí.
    cpuBarColor(ratio) {
      if (ratio >= 0.80) return this.tok.critical;
      if (ratio >= 0.50) return this.tok.medium;
      return this.tok.low;
    },

    ramBarStyle(pct) {
      var T = this.tok;
      if (pct >= 95) return 'linear-gradient(90deg,' + T.low + ',' + T.medium + ' 70%,' + T.high + ')';
      if (pct >= 85) return T.medium;
      return T.low;
    },

    async copyCommand(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      } catch(e) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      }
    },

    // ── Chat con LLM ──────────────────────────────────────────

    // Clave estable por hallazgo: el historial vive en finding.id, no en la
    // posición dentro del grupo (que cambia al filtrar o reordenar).
    chatKey(f, groupKey, fi) {
      return (f && f.id) ? 'id:' + f.id : 'idx:' + groupKey + '-' + fi;
    },

    // Escaneo nuevo = findings nuevos: se borran todas las conversaciones para
    // no arrastrar contexto de hallazgos que ya no existen.
    resetChats() {
      this.chatEpoch++;
      this.chatOpen     = {};
      this.chatMessages = {};
      this.chatInput    = {};
      this.chatLoading  = {};
    },

    // Abre/cierra el panel de chat y, la primera vez, lanza una
    // pregunta automática para que la IA explique el hallazgo.
    // Cerrar solo oculta el panel: el historial se conserva.
    toggleChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (willOpen && !(this.chatMessages[findingKey] && this.chatMessages[findingKey].length)) {
        this.sendChat(findingKey, finding,
          'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
      }
    },

    async sendChat(findingKey, finding, presetQuestion) {
      var question = presetQuestion != null
        ? presetQuestion
        : (this.chatInput[findingKey] || '').trim();
      if (!question || this.chatLoading[findingKey]) return;

      var epoch = this.chatEpoch;

      // Historial previo (sin la pregunta actual; el backend la añade aparte)
      var history = (this.chatMessages[findingKey] || []).slice().map(function(m) {
        return { role: m.role, content: m.content };
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            finding: finding, question: question, history: history,
            auditType: this.auditData && this.auditData.auditType,
            platform: this.auditData && this.auditData.host && this.auditData.host.platform
          })
        });
        var data = await res.json();
        reply = (data && data.ok)
          ? { role: 'assistant', content: data.content }
          : { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      // Llegó un escaneo nuevo mientras esperábamos: la respuesta ya no aplica.
      if (epoch !== this.chatEpoch) return;

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    // Divide la respuesta en segmentos de texto y bloques de código (```).
    parseChatContent(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    // Markdown mínimo y seguro: escapa HTML, `código`, **negrita** y saltos de línea.
    mdInline(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    this.readTokens();
    // Segunda pasada en nextTick: si la hoja del componente aún no estuviera en el
    // head al montar, la primera lectura vuelve vacía y se conserva lo anterior.
    // Aquí ya está puesta con seguridad.
    this.$nextTick(this.readTokens);

    // Detecta si hay un nodo llm-config desplegado para mostrar (o no) el chat.
    // `model` ya venía en la respuesta y se descartaba; ahora lo enseña la cabecera
    // del chat, para que se sepa quién firma cada contestación.
    var self = this;
    fetch('/locoaudit/chat/status')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        self.llmAvailable = !!(d && d.available);
        self.llmModel = (d && d.model) || null;
      })
      .catch(function() { self.llmAvailable = false; });
  }
};
</script>

<style>
  /*LCA-STYLE-DASH:host — fuente única de estilo del export*/
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ═══ TOKENS ═══════════════════════════════════════════════════════════════
     Ningún valor de los que ya existían cambia. Lo que se añade son NOMBRES para
     hex que ya estaban escritos a mano más abajo, dentro de este mismo fichero.
     Regla seguida: un hex igual a un token pasa a var(); uno distinto que se
     repite gana token propio; uno distinto que aparece una vez se queda literal,
     con su comentario. Los tonos profundos (#3F6212, #92400E, #15803D…) NO son
     vocabulario de severidad y por eso no reciben nombre: bautizarlos invitaría a
     reutilizarlos donde no corresponde. */
  :root {
    /* Severidad. Es la referencia de diseño del proyecto y también lo que lee
       readTokens() para los atributos SVG. Intocable. */
    --critical: #DC2626;
    --critical-bg: #FEF2F2;
    --critical-border: #FECACA;
    --high: #EA580C;
    --high-bg: #FFF7ED;
    --high-border: #FED7AA;
    --medium: #D97706;
    --medium-bg: #FFFBEB;
    --medium-border: #FDE68A;
    --low: #65A30D;
    --low-bg: #F7FEE7;
    --low-border: #D9F99D;
    --info: #0EA5E9;
    --info-bg: #F0F9FF;
    --info-border: #BAE6FD;

    /* Tono 700, para cuando el color va como TEXTO.
       REVOCA la antigua regla `--X-text = var(--X)`, que se decidió por coherencia
       sin medir. Medido sobre el fondo pálido del propio nivel, el tono base da
       4,41 / 3,35 / 3,07 / 2,98 / 2,60 (critical / high / medium / low / info) y el
       mínimo WCAG AA es 4,5: falla en los cinco. Con el 700 son 5,91 / 4,88 / 4,75 /
       4,82 / 5,57.
       El tono base sigue siendo la IDENTIDAD —bordes, puntos, rellenos sólidos,
       arcos, barras—; el 700 es el que se lee. */
    --critical-text: #B91C1C;
    --high-text: #C2410C;
    --medium-text: #A16207;
    --low-text: #4D7C0F;
    --info-text: #0369A1;

    /* Chrome */
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    /* Nuevos, y solo porque ya estaban literales: --surface era el #F1F5F9 de las
       píldoras, los raíles de barra y los contadores; --text-muted el #94A3B8 de
       las etiquetas pequeñas y los chevrones. No hay --surface-2 ni --ink: serían
       #F8FAFC y #1E293B otra vez, o sea --bg y --text con otro nombre. */
    --surface: #F1F5F9;
    --text-muted: #94A3B8;

    /* Acento. Hasta ahora --accent NO estaba declarada: vivía del fallback de
       var(--accent, #7C3AED) en .dl-btn y .meta-link, una declaración escondida
       que no aparecía en ningún :root. Declararla no mueve esos dos y da al chat
       un acento propio, morado, que no compite con el azul de --info (que es un
       NIVEL DE SEVERIDAD y no debería usarse como color de interfaz). */
    --accent: #7C3AED;
    --accent-bg: #F5F3FF;
    --accent-border: #DDD6FE;
    --accent-light: #C4B5FD;

    /* Geometría */
    --radius: 12px;
    --radius-sm: 8px;
    /* Unifica los 100px y 999px que convivían para el mismo concepto. También
       absorbe el 20px de .scope-toggle: ese botón mide ~23px de alto, así que su
       radio ya renderizaba como píldora completa. */
    --radius-pill: 100px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);

    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Fira Code", monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px;
  }

  /* ── Iconos ────────────────────────────────────────────────────────────────
     Un solo <symbol> por icono, referenciado con <use>. El sprite es el primer
     hijo de .lca-report-root para que el clon del export se lo lleve; escondido
     con position/size y no con display:none, que en el informe descargado podría
     verse pisado por alguna regla !important del CSS extra. */
  .lca-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
    /* stroke y fill son heredables, así que esto alcanza al contenido del <use>. */
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: -3px;
  }
  .icon-sm { width: 13px; height: 13px; vertical-align: -2px; }
  .icon-xl { width: 44px; height: 44px; stroke-width: 1.25; }

  /* ═══ CABECERA ═════════════════════════════════════════════════════════════ */
  .header-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 26px 28px;
    display: flex;
    align-items: stretch;
    gap: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  /* La barra ya no es un gradiente decorativo fijo: es el nivel de riesgo real.
     La clase la pone riskClass, la misma que pinta el badge. */
  .header-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--text-muted);
  }
  .header-card.critical::before { background: var(--critical); }
  .header-card.high::before     { background: var(--high); }
  .header-card.medium::before   { background: var(--medium); }
  .header-card.low::before      { background: var(--low); }
  .header-card.info::before     { background: var(--info); }

  .header-main { flex: 1; min-width: 0; }
  .header-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .host-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.4px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .host-name .icon { width: 20px; height: 20px; color: var(--text-secondary); }
  /* Mono: el hostname es un identificador. */
  .host-name-text {
    font-family: var(--font-mono);
    font-size: 24px;
    overflow-wrap: anywhere;
  }

  .header-idline {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1px;
  }
  .risk-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1.5px solid var(--critical-border); }
  .risk-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1.5px solid var(--high-border); }
  .risk-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1.5px solid var(--medium-border); }
  .risk-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1.5px solid var(--low-border); }
  .risk-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1.5px solid var(--info-border); }
  .risk-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .risk-note { font-size: 13px; color: var(--text-secondary); }

  /* Rejilla de metadatos: etiqueta pequeña sobre valor. */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 14px 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-key {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-secondary);
  }
  .meta-val { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  /* Mono solo donde hay una versión, una ruta o un identificador. */
  .meta-val-mono { font-family: var(--font-mono); font-size: 12px; }
  /* Los dos botones caben en una fila: la celda ocupa el ancho de dos. */
  .meta-item-actions { grid-column: span 2; }
  .meta-item-actions .dl-group { margin-top: 1px; flex-wrap: nowrap; }
  /* En el informe exportado el prune ELIMINA .dl-group del clon, así que esta
     celda se quedaba con su etiqueta "Exportar" y nada debajo. Sin .dl-btn
     dentro, no hay nada que exportar y la celda entera desaparece. Si un
     navegador no entendiera :has(), lo peor que pasa es que vuelva a verse la
     etiqueta suelta: degrada a lo de ahora, no rompe nada. */
  .meta-item-actions:not(:has(.dl-btn)) { display: none; }

  .dl-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 11px;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .dl-btn:hover { background: var(--accent); color: #fff; }

  /* Columna derecha: el gauge, separado por una línea vertical fina. */
  .header-aside {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    padding-left: 28px;
    border-left: 1px solid var(--border);
  }
  .gauge-label-top {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-secondary);
  }
  .gauge-svg { width: 148px; height: 148px; }
  .gauge-score {
    font-size: 28px;
    font-weight: 800;
    fill: var(--text);
    letter-spacing: -1px;
  }
  .gauge-sub { font-size: 11px; fill: var(--text-secondary); }
  .gauge-verdict { font-size: 11.5px; color: var(--text-secondary); }
  .gauge-meta { font-size: 10.5px; color: var(--text-secondary); }

  @media (max-width: 820px) {
    .header-card { flex-direction: column; }
    .header-aside { padding-left: 0; padding-top: 20px; border-left: none; border-top: 1px solid var(--border); align-self: stretch; }
  }

  /* ═══ TIRA DE SEVERIDADES ══════════════════════════════════════════════════
     Una sola tarjeta con celdas separadas por un filete, no cinco tarjetas: son
     cinco cortes de la misma cifra y cinco cajas con sombra propia los leían
     como cinco asuntos distintos. */
  /* La tira y su franja comparten UNA caja: la franja no es una tarjeta aparte
     porque su trabajo es no poder leerse separada de los números. */
  .sev-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .sev-strip { display: flex; flex-wrap: wrap; }

  /* Un "0 crítico" solo tranquiliza si consta que alguien miró. Con los recuentos
     pegados a la cabecera quedan por encima de cualquier aviso de cobertura, así
     que la advertencia baja hasta ellos en vez de esperar más abajo. Ámbar y no
     rojo: no es un hallazgo, es un hueco. */
  .sev-gap {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 20px;
    background: var(--medium-bg);
    border-top: 1px solid var(--medium-border);
    font-size: 12px;
    line-height: 1.5;
    color: #92400E;
  }
  .sev-gap .icon { color: var(--medium); margin-top: 2px; }
  .sev-cell {
    flex: 1 1 150px;
    min-width: 0;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
    position: relative;
  }
  .sev-cell:first-child { border-left: none; }
  /* --bg y no --surface: sobre #F1F5F9 el .sev-cell-sub da 4,34:1 y el label/num de
     un Medio 4,49:1; sobre #F8FAFC, 4,55:1 y 4,71:1. Estados latentes —solo se ven al
     pasar el ratón o al filtrar—, que ninguna auditoría llegó a medir. */
  .sev-cell:hover { background: var(--bg); }
  .sev-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sev-cell-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .sev-cell-num {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
  }
  .sev-cell-sub { font-size: 11px; color: var(--text-secondary); }

  /* Solo los niveles CON hallazgos llevan color. */
  .sev-cell.critical { background: var(--critical-bg); }
  .sev-cell.high     { background: var(--high-bg); }
  .sev-cell.medium   { background: var(--medium-bg); }
  .sev-cell.low      { background: var(--low-bg); }
  .sev-cell.critical .sev-cell-label, .sev-cell.critical .sev-cell-num { color: var(--critical-text); }
  .sev-cell.high     .sev-cell-label, .sev-cell.high     .sev-cell-num { color: var(--high-text); }
  .sev-cell.medium   .sev-cell-label, .sev-cell.medium   .sev-cell-num { color: var(--medium-text); }
  .sev-cell.low      .sev-cell-label, .sev-cell.low      .sev-cell-num { color: var(--low-text); }

  /* A cero: gris. Un color de alarma sobre un cero es ruido, y con cinco tarjetas
     encendidas el ojo no encontraba dónde estaba el trabajo real. */
  .sev-cell.zero { background: var(--card); }
  .sev-cell.zero .sev-cell-label { color: var(--text-secondary); }
  .sev-cell.zero .sev-cell-num   { color: var(--text-secondary); }

  /* Informativos: neutra y no interactiva, no es un nivel de riesgo. */
  .sev-cell.informative { cursor: default; background: var(--card); }
  .sev-cell.informative:hover { background: var(--card); }
  .sev-cell.informative .sev-cell-label { color: var(--text-secondary); }
  .sev-cell.informative .sev-cell-num   { color: var(--text-secondary); }

  /* Filtro activo: un filete grueso arriba, dentro de la propia celda; con la
     tira compartiendo caja, una sombra alrededor no cabía. */
  .sev-cell.active::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }
  .sev-cell.active { background: var(--bg); }

  /* ═══ AVISOS ═══════════════════════════════════════════════════════════════
     UN solo componente en tres niveles. Antes había tres anatomías distintas
     (nothing-card, checks-card, scope-notice) diciendo cosas del mismo tipo con
     tres maquetaciones, tres formas de poner el icono y ninguna regla de orden.

       lvl-1 · VEREDICTO — ¿tengo algo que hacer?
       lvl-2 · COBERTURA — ¿se miró todo?
       lvl-3 · CONTEXTO  — ¿qué más conviene saber?

     El NIVEL manda en el peso: tamaño del título, densidad y si hay fondo.
     El TONO manda en el color: --notice-accent y el tinte. Son independientes a
     propósito — un aviso de nivel 3 puede ser is-warn y seguir siendo pequeño. */
  .lca-notice {
    --notice-accent: var(--text-secondary);
    --notice-bg: var(--card);
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--notice-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--notice-accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .lca-notice-icon { color: var(--notice-accent); margin-top: 1px; }
  .lca-notice-main { flex: 1; min-width: 0; }
  .lca-notice-title { font-weight: 700; color: var(--text); }
  /* "Lo has activado, pero no ha podido hacerse": lo primero que necesita leer
     quien marcó la casilla y no ve resultados. */
  .lca-notice-lead { font-size: 12.5px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .lca-notice-body { font-size: 12.5px; color: var(--text); line-height: 1.6; margin-top: 6px; }
  /* La frase que impide leer "no se ha comprobado" como "está limpio". Es
     contenido con énfasis, no una anatomía aparte. */
  .lca-notice-body.is-strong { font-weight: 600; }
  .lca-notice-body code {
    font-family: var(--font-mono);
    font-size: 11.5px; background: rgba(255,255,255,.7);
    padding: 1px 5px; border-radius: 4px;
  }
  .lca-notice-list {
    margin: 8px 0 0; padding-left: 20px;
    font-size: 12.5px; color: var(--text); line-height: 1.7;
  }
  .lca-notice-list li { margin-bottom: 2px; }
  /* Variante con estado por delante: sin viñeta, porque la viñeta y la etiqueta
     de estado compiten por el mismo sitio. */
  .lca-notice-list.is-stated { list-style: none; padding-left: 0; margin-top: 10px; }
  .lca-notice-list.is-stated li {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; padding: 3px 0; margin-bottom: 0;
    border-top: 1px solid var(--border);
  }
  /* El estado va delante porque es lo que decide si el usuario tiene algo que
     hacer con esa línea o no. */
  .lca-notice-state {
    flex: 0 0 auto; min-width: 78px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px; color: var(--text-secondary);
  }
  .lca-notice-list.is-stated li.chk-failed .lca-notice-state { color: var(--medium-text); }
  .lca-notice-name { color: var(--text); }
  .lca-notice-hint {
    font-size: 12px; color: var(--text-secondary); margin-top: 8px;
    font-family: var(--font-mono);
  }
  /* Sobrio a propósito: es información, no un aviso. Sin color de alarma. */
  .lca-notice-foot {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.08);
    font-size: 11.5px; color: var(--text-secondary);
  }
  .lca-notice-foot-list { display: block; margin-top: 3px; opacity: .85; }

  /* ── Tonos: solo color ── */
  .lca-notice.is-ok      { --notice-accent: var(--low);      --notice-bg: var(--low-bg);      border-color: var(--low-border); }
  .lca-notice.is-warn    { --notice-accent: var(--medium);   --notice-bg: var(--medium-bg);   border-color: var(--medium-border); }
  .lca-notice.is-info    { --notice-accent: var(--info);     --notice-bg: var(--info-bg);     border-color: var(--info-border); }
  .lca-notice.is-neutral { --notice-accent: var(--text-secondary); --notice-bg: var(--card);  border-color: var(--border); }
  .lca-notice.is-ok   .lca-notice-title { color: #3F6212; }
  .lca-notice.is-warn .lca-notice-title { color: #92400E; }

  /* ── Niveles: solo peso ── */
  .lca-notice.lvl-1 { padding: 16px 20px; margin-bottom: 14px; }
  .lca-notice.lvl-1 .lca-notice-title { font-size: 15px; }
  .lca-notice.lvl-1 .lca-notice-icon  { width: 18px; height: 18px; }

  .lca-notice.lvl-2 .lca-notice-title { font-size: 14px; }

  /* El nivel 3 no pide nada, así que no ocupa como si lo pidiera: sin tinte de
     fondo, letra secundaria y el color solo en el filete y el icono. */
  .lca-notice.lvl-3 {
    --notice-bg: var(--card);
    border-color: var(--border);
    padding: 12px 16px;
  }
  .lca-notice.lvl-3 .lca-notice-title { font-size: 13px; }
  .lca-notice.lvl-3 .lca-notice-body,
  .lca-notice.lvl-3 .lca-notice-lead  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-title { color: var(--text); }
  .lca-notice.lvl-3 .lca-notice-icon  { width: 14px; height: 14px; }

  /* ═══ ALCANCE DEL ANÁLISIS ═════════════════════════════════════════════════ */
  .scope-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .scope-header { display: flex; align-items: center; gap: 8px; }
  .scope-header .icon { color: var(--text-secondary); }
  .scope-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px; color: var(--text-secondary); flex: 1;
  }
  .scope-toggle {
    background: none; border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 3px 11px; font-size: 11.5px; color: var(--text-secondary);
    cursor: pointer; transition: background .15s;
  }
  .scope-toggle:hover { background: var(--bg); }

  /* Los chips pasan a rejilla clave/valor: la misma anatomía que la cabecera, y
     con sitio para la etiqueta, que en una píldora competía con el valor. */
  .scope-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px 22px;
    margin-top: 14px;
  }
  .scope-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .scope-key {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--text-secondary);
  }
  .scope-val { font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
  .scope-val code, .scope-val.meta-val-mono {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text);
  }
  .scope-item-warn .scope-key { color: var(--medium-text); }
  .scope-item-warn .scope-val { color: var(--medium-text); font-weight: 600; }

  /* ── Módulos del análisis: siguen siendo píldoras ── */
  .scope-modules { margin-top: 16px; }
  .scope-modules-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .scope-module {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 3px 10px; border-radius: var(--radius-pill);
    border: 1px solid var(--border); background: var(--card);
    color: var(--text);
  }
  .scope-module-ico { color: var(--text-muted); }
  .scope-module-state { color: var(--text-secondary); }
  .scope-module.mod-ok .scope-module-ico { color: var(--low); }
  /* Ámbar solo el que falló. El no solicitado se queda en gris: es una decisión
     del usuario, no un problema del informe. */
  .scope-module.mod-failed {
    border-color: var(--medium-border); background: var(--medium-bg);
  }
  .scope-module.mod-failed .scope-module-ico { color: var(--medium); }
  .scope-module.mod-not-requested { opacity: .72; }

  .scope-detail { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .scope-detail-block + .scope-detail-block { margin-top: 12px; }
  .scope-detail-title {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .4px; color: var(--text-secondary); margin-bottom: 5px;
  }
  .scope-detail-title.warn { color: var(--medium-text); }
  .scope-detail-item { font-size: 12px; color: var(--text); line-height: 1.6; }
  .scope-detail-item code {
    font-family: var(--font-mono);
    font-size: 11.5px; background: var(--surface); padding: 1px 5px;
    border-radius: 4px; margin-right: 4px;
  }
  .scope-detail-flow { display: flex; flex-wrap: wrap; gap: 4px; }
  .scope-detail-note { font-size: 11.5px; color: var(--text-secondary); margin-top: 4px; font-style: italic; }
  .scope-detail-note.warn { color: var(--medium-text); font-style: normal; font-weight: 600; }

  /* ═══ GRÁFICOS ═════════════════════════════════════════════════════════════ */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 20px 24px;
  }
  .chart-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .donut-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .donut-svg { width: 140px; height: 140px; flex-shrink: 0; }
  .donut-total { font-size: 28px; font-weight: 800; fill: var(--text); }
  .donut-sub   { font-size: 11px; fill: var(--text-secondary); }

  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-item  { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-name  { color: var(--text-secondary); flex: 1; }
  .legend-val   { font-weight: 700; color: var(--text); }

  .hbar-list { display: flex; flex-direction: column; gap: 14px; }
  .hbar-item { display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: 10px; }
  .hbar-label { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-track {
    height: 18px;
    background: var(--surface);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .hbar-fill { height: 100%; border-radius: var(--radius-pill); transition: width .4s; }
  .hbar-count { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-align: right; }

  /* ═══ MÉTRICAS ═════════════════════════════════════════════════════════════
     Las tres con la misma anatomía: título · cifra grande · barra · pie de dos
     datos. Antes cada tarjeta se organizaba a su manera y no se podían comparar
     de un vistazo. */
  .metrics-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .metric-card {
    flex: 1 1 260px;
    min-width: 0;
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
  }
  .metric-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .metric-header .icon { color: var(--text-secondary); }
  .metric-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
  }
  .metric-bar-section { margin-top: auto; }
  .metric-figure {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .metric-figure-unit {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--text-secondary);
    margin-left: 4px;
  }
  /* El guion de "sin dato" es TEXTO, no un icono: --text-muted da 2,56:1. */
  .metric-figure-na { color: var(--text-secondary); }
  .metric-foot {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .metric-foot-item { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .metric-foot-key {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--text-secondary);
  }
  .metric-foot-val { font-size: 11.5px; color: var(--text-secondary); overflow-wrap: anywhere; }

  .progress-bar {
    height: 10px;
    background: var(--surface);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: var(--radius-pill); }

  /* RAM */
  .ram-macos-note {
    display: flex;
    align-items: center;
    gap: 8px;
    /* Verde propio: no es severidad "baja", es una nota de plataforma. */
    background: #F0FDF4;
    border: 1px solid #BBF7D0;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12.5px;
    color: #15803D;
    margin-bottom: 14px;
  }

  /* CPU: las tres medidas de load siguen estando. */
  .cpu-loads {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .load-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    flex: 1;
  }
  .load-val    { font-size: 16px; font-weight: 700; letter-spacing: -.3px; color: var(--text); font-family: var(--font-mono); }
  .load-period { font-size: 10.5px; color: var(--text-secondary); }

  /* Disco */
  .disk-parts-container { display: flex; flex-direction: column; margin-top: auto; }
  .disk-part { margin-bottom: 16px; }
  .disk-part:last-child { margin-bottom: 0; }
  .disk-part-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  /* Mono: es una ruta de montaje. */
  .disk-mount  { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); font-family: var(--font-mono); }

  /* ═══ HALLAZGOS ════════════════════════════════════════════════════════════ */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
  }
  /* El section-header reparte con space-between; sin agrupar, las pills se
     desperdigaban a lo ancho de la fila. */
  .section-pills { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  /* Fondo de tarjeta y no --surface: sobre el gris #F1F5F9 el texto secundario da
     4,34:1 y el mínimo es 4,5. El borde ya distingue la ficha del fondo. */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    background: var(--card);
    border-radius: var(--radius-pill);
    font-size: 12px;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .pill-action { background: var(--high-bg); color: var(--high-text); border-color: var(--high-border); font-weight: 600; }
  .pill-calm   { background: var(--low-bg);  color: var(--low-text);  border-color: var(--low-border);  font-weight: 600; }

  .findings-group {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
    transition: background .12s;
  }
  .group-header:hover { background: var(--bg); }
  .group-icon { color: var(--text-secondary); }
  .group-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
  /* Severidad máxima del grupo: dice si hace falta abrirlo antes de abrirlo. */
  .group-sev { margin-right: 2px; }
  .group-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    padding: 0 6px;
  }
  .group-chevron {
    color: var(--text-muted);
    transition: transform .2s;
  }
  .group-chevron.open { transform: rotate(180deg); }

  .group-findings { border-top: 1px solid var(--border); }
  .finding-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--surface);
    cursor: pointer;
    transition: background .1s;
  }
  .finding-row:last-child { border-bottom: none; }
  .finding-row:hover { background: var(--bg); }
  .finding-chevron { color: var(--text-muted); transition: transform .2s; }
  .finding-chevron.open { transform: rotate(180deg); }

  .sev-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    flex-shrink: 0;
  }
  .sev-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1px solid var(--critical-border); }
  .sev-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1px solid var(--high-border); }
  .sev-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1px solid var(--medium-border); }
  .sev-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1px solid var(--low-border); }
  .sev-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1px solid var(--info-border); }

  .cat-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    background: var(--card);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* ── Procedencia del paquete (origin) ── */
  .origin-badge {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    flex-shrink: 0;
  }
  /* Neutro A PROPÓSITO: no comunica nivel de riesgo porque, para este equipo,
     no lo hay. Ocupa el sitio del sev-badge en la fila. */
  .origin-badge.declared {
    background: var(--card);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  /* 'installed' sí acompaña a la severidad: hereda su color componiendo con
     .sev-badge.<sev>, que ya define fondo, texto y borde. */

  .finding-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    min-width: 0;
    text-wrap: pretty;
  }
  .finding-note {
    font-size: 11px;
    font-style: italic;
    color: var(--text-secondary);
    flex-shrink: 0;
    white-space: nowrap;
  }
  @media (max-width: 760px) { .finding-note { display: none; } }

  /* ── Ficha expandida ── */
  .finding-detail {
    display: none;
    padding: 4px 18px 18px 18px;
    animation: slideDown .15s ease;
  }
  .finding-detail.open { display: block; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* Detalle común: UN panel plano con secciones, no dos tarjetas apiladas dentro de
     otra tarjeta. Tres bordes concéntricos para decir "aquí hay dos bloques" cuando
     basta una línea entre ellos. NO renombrar .detail-stack: el export conserva esta
     anatomía dentro de .finding-detail. */
  .detail-stack {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }

  /* Sin caja propia: la sección se delimita por su título y, a partir de la segunda,
     por una línea discontinua. */
  .detail-col + .detail-col {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .detail-col-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  /* Sans, no mono: la evidencia es una frase, no un valor técnico. La mono se queda
     donde hay algo que comparar carácter a carácter (.meta-value.meta-mono) y en los
     comandos (.command-text). */
  .detail-evidence {
    /* Es un <pre>: sin `inherit` explícito se cae a la monoespaciada del navegador. */
    font-family: inherit;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: auto;
    max-height: 200px;
    overflow-y: auto;
  }

  /* ── Metadatos del hallazgo: lista clave/valor ── */
  .meta-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px 18px;
