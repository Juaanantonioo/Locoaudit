        return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      };
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var hn = (payload.host && payload.host.hostname) || '';
      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">'
        + '<meta name="viewport" content="width=device-width,initial-scale=1">'
        + '<title>LoCoAudit — ' + escapar(titleMap[auditType] || 'Auditoria') + ' — ' + escapar(hn) + '</title>'
        + '<style>' + css + '\n' + extra + '</style></head><body><div class="lca-export">'
        + clone.innerHTML + '</div><script>' + toggleJs + '<\/script></body></html>';
        // LCA:SNAPSHOT:END
      } catch (e) {
        console.error('[LoCoAudit] export snapshot fallo, uso tabla de respaldo:', e);
        return this.construirInformeSencillo();
      }
    },
    construirInformeSencillo() {
      var escapar = this.escaparHtml;
      var a = this.auditData || {};
      var host = a.host || {};
      var counts = (a.summary && a.summary.counts) || {};
      var findings = a.findings || [];
      var meta = a.scanMeta || {};
      var sevOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
      var sevLabelMap = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
      var sevColor = { critical: '#B91C1C', high: '#C2410C', medium: '#A16207', low: '#15803D', info: '#0369A1' };

      var rangoDe = function(f) {
        var r = sevOrder[(f.severity || 'info').toLowerCase()];
        if (r === undefined) {
          return 9;
        } else {
          return r;
        }
      };
      var sorted = findings.slice().sort(function(x, y) { return rangoDe(x) - rangoDe(y); });

      var rows = sorted.map(function(f) {
        var sev = (f.severity || 'info').toLowerCase();
        var origen = f.image || f.category || '—';
        let arreglo;
        if (f.fix) {
          arreglo = '<code>' + escapar(f.fix) + '</code>';
        } else {
          arreglo = '—';
        }
        return '<tr>' +
          '<td><span class="sev" style="background:' + sevColor[sev] + '">' + escapar(sevLabelMap[sev] || sev) + '</span></td>' +
          '<td class="mono">' + escapar(f.id) + '</td>' +
          '<td class="mono">' + escapar(origen) + '</td>' +
          '<td>' + escapar(f.title) + '</td>' +
          '<td>' + escapar(f.evidence) + '</td>' +
          '<td>' + arreglo + '</td>' +
          '</tr>';
      }).join('');

      var sumChips = ['critical', 'high', 'medium', 'low', 'info'].map(function(s) {
        return '<span class="chip" style="border-color:' + sevColor[s] + ';color:' + sevColor[s] + '">' +
          (sevLabelMap[s]) + ': <b>' + (counts[s] || 0) + '</b></span>';
      }).join(' ');

      var dur;
      if (meta.durationMs) {
        dur = (meta.durationMs / 1000).toFixed(1) + ' s';
      } else {
        dur = '—';
      }
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var auditTitle = titleMap[a.auditType] || 'Auditoría';

      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
        '<title>LoCoAudit — ' + escapar(auditTitle) + ' — ' + escapar(host.hostname || '') + '</title>' +
        '<style>' +
        'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1e1b2e;margin:32px;background:#fff}' +
        'h1{color:#7C3AED;margin:0 0 4px}.sub{color:#666;margin:0 0 20px}' +
        '.meta{font-size:13px;color:#444;margin-bottom:16px}.meta b{color:#1e1b2e}' +
        '.chips{margin:12px 0 24px}.chip{display:inline-block;border:1px solid;border-radius:12px;padding:2px 10px;margin-right:6px;font-size:12px}' +
        'table{border-collapse:collapse;width:100%;font-size:12.5px}' +
        'th,td{border:1px solid #e5dcfa;padding:6px 8px;text-align:left;vertical-align:top}' +
        'th{background:#f3effc;color:#7C3AED}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}' +
        '.sev{color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}' +
        'code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f6f4fc;padding:1px 4px;border-radius:4px}' +
        'footer{margin-top:24px;color:#999;font-size:11px}@media print{body{margin:0}}' +
        '</style></head><body>' +
        '<h1>LoCoAudit · Auditoría de ' + escapar(auditTitle) + '</h1>' +
        '<p class="sub">' + escapar(host.hostname || '') + ' · ' + escapar(host.platform || '') + '</p>' +
        '<div class="meta">Fecha: <b>' + escapar(this.horaEscaneo || new Date().toLocaleString()) + '</b> · ' +
        'Duración: <b>' + escapar(dur) + '</b> · Hallazgos: <b>' + findings.length + '</b></div>' +
        '<div class="chips">' + sumChips + '</div>' +
        '<table><thead><tr><th>Severidad</th><th>ID</th><th>Origen</th><th>Título</th><th>Evidencia</th><th>Recomendación</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="6">Sin hallazgos.</td></tr>') + '</tbody></table>' +
        '<footer>Generado por LoCoAudit · ' + escapar(new Date().toISOString()) + '</footer>' +
        '</body></html>';
    },

    // Gramática de `fix` (marcadores puestos en lib/normalizer.js):
    // "## " abre rama, "$ " comando del último paso, "> " nota sin numerar, resto paso nuevo.
    pasosDeSolucion(fix) {
      var res = { intro: [], notes: [], branches: [] };
      if (!fix) return res;
      var lineas = String(fix).split('\n')
        .map(function (l) { return l.trim(); })
        .filter(function (l) { return l; });
      var hayRamas = lineas.some(function (l) { return l.indexOf('## ') === 0; });
      var actual = null;
      function abrir(heading) {
        actual = { heading: heading, steps: [], notes: [] };
        res.branches.push(actual);
      }
      lineas.forEach(function (s) {
        if (s.indexOf('## ') === 0) { abrir(s.slice(3).trim()); return; }
        if (s.indexOf('> ') === 0) {
          var nota = s.slice(2).trim();
          // Antes de la primera rama la nota cuelga del bloque introductorio.
          if (nota) {
            if (actual) {
              actual.notes.push(nota);
            } else {
              res.notes.push(nota);
            }
          }
          return;
        }
        if (s.indexOf('$ ') === 0) {
          var cmd = s.slice(2).trim();
          if (!cmd) return;
          if (!actual) abrir(null);
          var ultimo = actual.steps[actual.steps.length - 1];
          // Comando sin paso libre: se añade con etiqueta vacía para no perderlo.
          if (!ultimo || ultimo.cmd) actual.steps.push({ label: '', cmd: cmd });
          else ultimo.cmd = cmd;
          return;
        }
        if (hayRamas && !actual) { res.intro.push(s); return; }
        if (!actual) abrir(null);
        actual.steps.push({ label: s, cmd: null });
      });
      res.branches = res.branches.filter(function (r) {
        return r.heading || r.steps.length || r.notes.length;
      });
      return res;
    },

    // El botón copia solo el comando; la nota se muestra aparte.
    notaSolucion(f) {
      if (!f || !f.command || !f.fix) return "";
      return String(f.fix).split("\n").slice(1).join("\n").trim();
    },
    // Todos los comandos de la ficha: `command` y los pasos con "$ ".
    comandosSolucion(f) {
      if (!f || !f.fix) return [];
      var cmds;
      if (f.command) {
        cmds = [String(f.command)];
      } else {
        cmds = [];
      }
      try {
        this.pasosDeSolucion(f.fix).branches.forEach(function (r) {
          r.steps.forEach(function (st) { if (st.cmd) cmds.push(st.cmd); });
        });
      } catch (e) { /* fix ilegible: queda el comando directo, si lo hay */ }
      return cmds;
    },
    // ¿El paso de resolución contiene algún comando (directo o dentro de un paso)?
    solucionConComando(f) {
      return this.comandosSolucion(f).length > 0;
    },
    // Se mira el comando, no la prosa, para decidir el aviso de sudo.
    solucionConSudo(f) {
      return this.comandosSolucion(f).some(function (c) { return /^sudo(\s|$)/.test(String(c).trim()); });
    },

    claseSeveridad(sev) {
      return (sev || 'info').toLowerCase();
    },

    // Versión solo anotada en un fichero de dependencias; replica esAccionable() del backend.
    // '!== image' mantiene el comportamiento en payloads sin scope.
    esDeclarado(f) {
      return f && f.origin === 'declared' && f.scope !== 'image';
    },

    // El reason arrastra la traza de Trivy: se corta por "Detalle:".
    motivoCorto(r) {
      if (!r) return 'motivo no disponible';
      var t = String(r).split('Detalle:')[0].trim();
      // Solo la primera frase; el resto ya está en el aviso.
      var p = t.indexOf('. ');
      if (p > 40) t = t.slice(0, p + 1);
      if (t.length > 200) {
        return t.slice(0, 197) + '…';
      } else {
        return t;
      }
    },

    // Abrevia el home a "~".
    rutaCorta(p) {
      var t = this.escaneoTrivy && this.escaneoTrivy.target;
      if (!p) return '—';
      if (t && p.indexOf(t) === 0) {
        return '~' + p.slice(t.length);
      } else {
        return p;
      }
    },

    // ¿El finding trae metadatos estructurados de Trivy para la tira de detalles?
    tieneMeta(f) {
      return !!(f.pkg || f.installedVersion || f.fixedVersion ||
                (f.cvss != null) || f.cveCount || f.primaryUrl ||
                f.control || f.detail || f.severitySource);
    },

    etiquetaTipoLynis(f) {
      if (f.lynisType === 'warning') {
        return 'Aviso de Lynis';
      } else {
        return 'Sugerencia de Lynis';
      }
    },

    etiquetaSeveridad(sev) {
      var MAP = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
      return MAP[(sev || '').toLowerCase()] || (sev || '').toUpperCase();
    },

    etiquetaCategoria(cat) {
      var MAP = {
        vulnerability: 'Vulnerab.', cpu: 'CPU', memory: 'RAM',
        system: 'Sistema', network: 'Red', disk: 'Disco',
        'system-logs': 'Logs', secret: 'Secreto', misconfig: 'Config.', other: 'Otros'
      };
      return MAP[(cat || '').toLowerCase()] || cat || '?';
    },

    etiquetaTipoEvento(type) {
      var MAP = {
        'ssh-accepted': 'SSH OK', 'ssh-failed': 'SSH fallido',
        'sudo': 'sudo', 'sudo-failed': 'sudo fallido',
        'session': 'Sesión',
        'logon-remote': 'Login remoto', 'logon-failed': 'Login fallido',
        'logon-privileged': 'Cuenta admin'
      };
      return MAP[type] || type || '?';
    },

    claseEtiquetaEvento(type) {
      var FAILED = ['ssh-failed', 'sudo-failed', 'logon-failed'];
      if (FAILED.indexOf(type) === -1) return 'ev-ok'; // verde: logins/sudo correctos y sesiones
      // Ráfaga (>= 10 fallos, mismo umbral que severity-map) en rojo; aislados en amarillo.
      var evs = (this.eventosSeguridad && this.eventosSeguridad.events) || [];
      var fails = evs.filter(function(e) { return FAILED.indexOf(e.type) !== -1; }).length;
      if (fails >= 10) {
        return 'ev-burst';
      } else {
        return 'ev-fail';
      }
    },

    formatearEvidencia(ev) {
      if (typeof ev === 'object' && ev !== null) {
        try { return JSON.stringify(ev, null, 2); } catch(e) { return String(ev); }
      }
      return String(ev || '');
    },

    formatearTiempoActivo(sec) {
      if (!sec) return '—';
      var d = Math.floor(sec / 86400);
      var h = Math.floor((sec % 86400) / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var r = '';
      if (d > 0) r += d + 'd ';
      if (h > 0) r += h + 'h ';
      r += m + 'm';
      return r.trim();
    },

    formatearDuracion(ms) {
      if (!ms) return '—';
      var s = Math.floor(ms / 1000);
      var m = Math.floor(s / 60);
      if (m > 0) {
        return m + ' min ' + (s % 60) + ' s';
      } else {
        return s + ' s';
      }
    },

    // Colores leídos con leerTokens(): en una cadena de estilo no llega var().
    colorBarraCpu(ratio) {
      if (ratio >= 0.80) return this.tok.critical;
      if (ratio >= 0.50) return this.tok.medium;
      return this.tok.low;
    },

    estiloBarraRam(pct) {
      var T = this.tok;
      if (pct >= 95) return 'linear-gradient(90deg,' + T.low + ',' + T.medium + ' 70%,' + T.high + ')';
      if (pct >= 85) return T.medium;
      return T.low;
    },

    async copiarComando(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      } catch(e) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      }
    },

    // ── Chat con LLM ──────────────────────────────────────────

    // Clave por finding.id, no por posición (cambia al filtrar).
    claveChat(f, groupKey, fi) {
      if (f && f.id) {
        return 'id:' + f.id;
      } else {
        return 'idx:' + groupKey + '-' + fi;
      }
    },

    // Escaneo nuevo: se borran las conversaciones de hallazgos que ya no existen.
    reiniciarChats() {
      this.chatEpoch++;
      this.chatOpen     = {};
      this.chatMessages = {};
      this.chatInput    = {};
      this.chatLoading  = {};
    },

    // La primera vez lanza una pregunta automática; cerrar conserva el historial.
    alternarChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (willOpen && !(this.chatMessages[findingKey] && this.chatMessages[findingKey].length)) {
        this.enviarChat(findingKey, finding,
          'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
      }
    },

    async enviarChat(findingKey, finding, presetQuestion) {
      var question;
      if (presetQuestion != null) {
        question = presetQuestion;
      } else {
        question = (this.chatInput[findingKey] || '').trim();
      }
      if (!question || this.chatLoading[findingKey]) return;

      var epoch = this.chatEpoch;

      // Historial previo (sin la pregunta actual; el backend la añade aparte)
      var history = [];
      (this.chatMessages[findingKey] || []).forEach(function(m) {
        // Un error no es respuesta del modelo: fuera él y la pregunta que lo provocó.
        if (m.error) {
          if (history.length && history[history.length - 1].role === 'user') history.pop();
          return;
        }
        history.push({ role: m.role, content: m.content });
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            finding: finding, question: question, history: history,
            auditType: this.auditData && this.auditData.auditType,
            platform: this.auditData && this.auditData.host && this.auditData.host.platform
          })
        });
        var data = await res.json();
        if (data && data.ok) {
          reply = { role: 'assistant', content: data.content };
        } else {
          reply = { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
        }
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      // Llegó un escaneo nuevo mientras esperábamos: la respuesta ya no aplica.
      if (epoch !== this.chatEpoch) return;

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    // Divide la respuesta en segmentos de texto y bloques de código (```).
    trocearRespuesta(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.markdownEnLinea(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.markdownEnLinea(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    // Markdown mínimo y seguro: escapa HTML, `código`, **negrita** y saltos de línea.
    markdownEnLinea(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    this.leerTokens();
    // Segunda lectura por si la hoja aún no estaba en el head al montar.
    this.$nextTick(this.leerTokens);

    // Comprueba si hay un llm-config desplegado y qué modelo responde.
    var self = this;
    fetch('/locoaudit/chat/status')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        self.llmAvailable = !!(d && d.available);
        self.llmModel = (d && d.model) || null;
      })
      .catch(function() { self.llmAvailable = false; });
  }
};
</script>

<style>
  /*LCA-STYLE-DASH:host — fuente única de estilo del export*/
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ═══ TOKENS ═══ Un hex igual a un token usa var(); los tonos profundos se quedan literales. */
  :root {
    /* Severidad: referencia de diseño; también la lee leerTokens() para el SVG. */
    --critical: #DC2626;
    --critical-bg: #FEF2F2;
    --critical-border: #FECACA;
    --high: #EA580C;
    --high-bg: #FFF7ED;
    --high-border: #FED7AA;
    --medium: #D97706;
    --medium-bg: #FFFBEB;
    --medium-border: #FDE68A;
    --low: #65A30D;
    --low-bg: #F7FEE7;
    --low-border: #D9F99D;
    --info: #0EA5E9;
    --info-bg: #F0F9FF;
    --info-border: #BAE6FD;

    /* Tono 700 para texto: el tono base no llega a 4,5:1 sobre el fondo pálido de su nivel.
       El tono base queda para bordes, puntos, rellenos y barras. */
    --critical-text: #B91C1C;
    --high-text: #C2410C;
    --medium-text: #A16207;
    --low-text: #4D7C0F;
    --info-text: #0369A1;

    /* Chrome */
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    /* Superficie gris de píldoras y raíles, y gris de etiquetas pequeñas y chevrones. */
    --surface: #F1F5F9;
    --text-muted: #94A3B8;

    /* Acento morado de interfaz, distinto del azul de --info, que es una severidad. */
    --accent: #7C3AED;
    --accent-bg: #F5F3FF;
    --accent-border: #DDD6FE;
    --accent-light: #C4B5FD;

    /* Geometría */
    --radius: 12px;
    --radius-sm: 8px;
    /* Radio de píldora único. */
    --radius-pill: 100px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);

    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Fira Code", monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 24px;
  }

  /* ── Iconos: sprite de <symbol> usado con <use>, primer hijo de .lca-report-root.
     Se oculta por tamaño y no con display:none, que el CSS extra del export podría pisar. */
  .lca-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
    /* stroke y fill son heredables, así que esto alcanza al contenido del <use>. */
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: -3px;
  }
  .icon-sm { width: 13px; height: 13px; vertical-align: -2px; }
  .icon-xl { width: 44px; height: 44px; stroke-width: 1.25; }

  /* ═══ CABECERA ═════════════════════════════════════════════════════════════ */
  .header-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 26px 28px;
    display: flex;
    align-items: stretch;
    gap: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  /* La barra toma el color del riesgo real (riskClass). */
  .header-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--text-muted);
  }
  .header-card.critical::before { background: var(--critical); }
  .header-card.high::before     { background: var(--high); }
  .header-card.medium::before   { background: var(--medium); }
  .header-card.low::before      { background: var(--low); }
  .header-card.info::before     { background: var(--info); }

  .header-main { flex: 1; min-width: 0; }
  .header-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .host-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.4px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .host-name .icon { width: 20px; height: 20px; color: var(--text-secondary); }
  /* Mono: el hostname es un identificador. */
  .host-name-text {
    font-family: var(--font-mono);
    font-size: 24px;
    overflow-wrap: anywhere;
  }

  .header-idline {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1px;
  }
  .risk-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1.5px solid var(--critical-border); }
  .risk-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1.5px solid var(--high-border); }
  .risk-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1.5px solid var(--medium-border); }
  .risk-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1.5px solid var(--low-border); }
  .risk-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1.5px solid var(--info-border); }
  .risk-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .risk-note { font-size: 13px; color: var(--text-secondary); }

  /* Rejilla de metadatos: etiqueta pequeña sobre valor. */
  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 14px 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-key {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-secondary);
  }
  .meta-val { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  /* Mono solo donde hay una versión, una ruta o un identificador. */
  .meta-val-mono { font-family: var(--font-mono); font-size: 12px; }
  /* Los dos botones caben en una fila: la celda ocupa el ancho de dos. */
  .meta-item-actions { grid-column: span 2; }
  .meta-item-actions .dl-group { margin-top: 1px; flex-wrap: nowrap; }
  /* En el export se poda .dl-group: sin .dl-btn la celda "Exportar" se oculta entera. */
  .meta-item-actions:not(:has(.dl-btn)) { display: none; }

  .dl-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 11px;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .dl-btn:hover { background: var(--accent); color: #fff; }

  /* Columna derecha: el gauge, separado por una línea vertical fina. */
  .header-aside {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
    padding-left: 28px;
    border-left: 1px solid var(--border);
  }
  .gauge-label-top {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-secondary);
  }
  .gauge-svg { width: 148px; height: 148px; }
  .gauge-score {
    font-size: 28px;
    font-weight: 800;
    fill: var(--text);
    letter-spacing: -1px;
  }
  .gauge-sub { font-size: 11px; fill: var(--text-secondary); }
  .gauge-verdict { font-size: 11.5px; color: var(--text-secondary); }
  .gauge-meta { font-size: 10.5px; color: var(--text-secondary); }

  @media (max-width: 820px) {
    .header-card { flex-direction: column; }
    .header-aside { padding-left: 0; padding-top: 20px; border-left: none; border-top: 1px solid var(--border); align-self: stretch; }
  }

  /* ═══ TIRA DE SEVERIDADES ═══ Una sola tarjeta con celdas separadas por un filete. */
  /* La tira y su franja comparten caja para que no se lean por separado. */
  .sev-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .sev-strip { display: flex; flex-wrap: wrap; }

  /* Aviso de comprobaciones fallidas junto a los recuentos; ámbar porque es un hueco, no un hallazgo. */
  .sev-gap {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 20px;
    background: var(--medium-bg);
    border-top: 1px solid var(--medium-border);
    font-size: 12px;
    line-height: 1.5;
    color: #92400E;
  }
  .sev-gap .icon { color: var(--medium); margin-top: 2px; }
  .sev-cell {
    flex: 1 1 150px;
    min-width: 0;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-left: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
    position: relative;
  }
  .sev-cell:first-child { border-left: none; }
  /* --bg y no --surface: sobre --surface el texto secundario no llega a 4,5:1. */
  .sev-cell:hover { background: var(--bg); }
  .sev-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sev-cell-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  .sev-cell-num {
    font-size: 34px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
  }
  .sev-cell-sub { font-size: 11px; color: var(--text-secondary); }

  /* Solo los niveles CON hallazgos llevan color. */
  .sev-cell.critical { background: var(--critical-bg); }
  .sev-cell.high     { background: var(--high-bg); }
  .sev-cell.medium   { background: var(--medium-bg); }
  .sev-cell.low      { background: var(--low-bg); }
  /* Sobre el fondo de color, el gris secundario no llega a 4,5:1. */
  .sev-cell.critical .sev-cell-sub { color: var(--critical-text); }
  .sev-cell.high     .sev-cell-sub { color: var(--high-text); }
  .sev-cell.medium   .sev-cell-sub { color: var(--medium-text); }
  .sev-cell.low      .sev-cell-sub { color: var(--low-text); }
  .sev-cell.critical .sev-cell-label, .sev-cell.critical .sev-cell-num { color: var(--critical-text); }
  .sev-cell.high     .sev-cell-label, .sev-cell.high     .sev-cell-num { color: var(--high-text); }
  .sev-cell.medium   .sev-cell-label, .sev-cell.medium   .sev-cell-num { color: var(--medium-text); }
  .sev-cell.low      .sev-cell-label, .sev-cell.low      .sev-cell-num { color: var(--low-text); }

  /* A cero, en gris: el color queda para los niveles con trabajo real. */
  .sev-cell.zero { background: var(--card); }
  .sev-cell.zero .sev-cell-label { color: var(--text-secondary); }
  .sev-cell.zero .sev-cell-num   { color: var(--text-secondary); }

  /* Informativos: neutra y no interactiva, no es un nivel de riesgo. */
  .sev-cell.informative { cursor: default; background: var(--card); }
  .sev-cell.informative:hover { background: var(--card); }
  .sev-cell.informative .sev-cell-label { color: var(--text-secondary); }
  .sev-cell.informative .sev-cell-num   { color: var(--text-secondary); }

  /* Filtro activo: filete grueso arriba, dentro de la celda. */
  .sev-cell.active::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }
  .sev-cell.active { background: var(--bg); }

  /* ═══ AVISOS ═══ lvl-1 veredicto, lvl-2 cobertura, lvl-3 contexto.
     El nivel marca el peso y el tono (is-*) el color; son independientes. */
  .lca-notice {
    --notice-accent: var(--text-secondary);
    --notice-bg: var(--card);
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--notice-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--notice-accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .lca-notice-icon { color: var(--notice-accent); margin-top: 1px; }
  .lca-notice-main { flex: 1; min-width: 0; }
  .lca-notice-title { font-weight: 700; color: var(--text); }
  /* Lo primero que necesita leer quien activó la opción y no ve resultados. */
  .lca-notice-lead { font-size: 12.5px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .lca-notice-body { font-size: 12.5px; color: var(--text); line-height: 1.6; margin-top: 6px; }
  /* Evita que "no se ha comprobado" se lea como "está limpio". */
  .lca-notice-body.is-strong { font-weight: 600; }
  .lca-notice-body code {
    font-family: var(--font-mono);
    font-size: 11.5px; background: rgba(255,255,255,.7);
    padding: 1px 5px; border-radius: 4px;
  }
  .lca-notice-list {
    margin: 8px 0 0; padding-left: 20px;
    font-size: 12.5px; color: var(--text); line-height: 1.7;
  }
  .lca-notice-list li { margin-bottom: 2px; }
  /* Con estado delante y sin viñeta: competirían por el mismo sitio. */
  .lca-notice-list.is-stated { list-style: none; padding-left: 0; margin-top: 10px; }
  .lca-notice-list.is-stated li {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; padding: 3px 0; margin-bottom: 0;
    border-top: 1px solid var(--border);
  }
  /* El estado va delante: decide si hay algo que hacer con la línea. */
  .lca-notice-state {
    flex: 0 0 auto; min-width: 78px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px; color: var(--text-secondary);
  }
  .lca-notice-list.is-stated li.chk-failed .lca-notice-state { color: var(--medium-text); }
  .lca-notice-name { color: var(--text); }
  .lca-notice-hint {
    font-size: 12px; color: var(--text-secondary); margin-top: 8px;
    font-family: var(--font-mono);
  }
  /* Sobrio a propósito: es información, no un aviso. Sin color de alarma. */
  .lca-notice-foot {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.08);
    font-size: 11.5px; color: var(--text-secondary);
  }
  .lca-notice-foot-list { display: block; margin-top: 3px; opacity: .85; }

  /* ── Tonos: solo color ── */
  .lca-notice.is-ok      { --notice-accent: var(--low);      --notice-bg: var(--low-bg);      border-color: var(--low-border); }
  .lca-notice.is-warn    { --notice-accent: var(--medium);   --notice-bg: var(--medium-bg);   border-color: var(--medium-border); }
  .lca-notice.is-info    { --notice-accent: var(--info);     --notice-bg: var(--info-bg);     border-color: var(--info-border); }
  .lca-notice.is-neutral { --notice-accent: var(--text-secondary); --notice-bg: var(--card);  border-color: var(--border); }
  .lca-notice.is-ok   .lca-notice-title { color: #3F6212; }
  .lca-notice.is-warn .lca-notice-title { color: #92400E; }

  /* ── Niveles: solo peso ── */
  .lca-notice.lvl-1 { padding: 16px 20px; margin-bottom: 14px; }
  .lca-notice.lvl-1 .lca-notice-title { font-size: 15px; }
  .lca-notice.lvl-1 .lca-notice-icon  { width: 18px; height: 18px; }

  .lca-notice.lvl-2 .lca-notice-title { font-size: 14px; }

  /* Nivel 3: sin tinte de fondo; el color solo en el filete y el icono. */
  .lca-notice.lvl-3 {
    --notice-bg: var(--card);
    border-color: var(--border);
    padding: 12px 16px;
  }
  .lca-notice.lvl-3 .lca-notice-title { font-size: 13px; }
  .lca-notice.lvl-3 .lca-notice-body,
  .lca-notice.lvl-3 .lca-notice-lead  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-title { color: var(--text); }
  .lca-notice.lvl-3 .lca-notice-icon  { width: 14px; height: 14px; }

  /* ═══ ALCANCE DEL ANÁLISIS ═════════════════════════════════════════════════ */
  .scope-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .scope-header { display: flex; align-items: center; gap: 8px; }
  .scope-header .icon { color: var(--text-secondary); }
  .scope-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px; color: var(--text-secondary); flex: 1;
  }
  .scope-toggle {
    background: none; border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 3px 11px; font-size: 11.5px; color: var(--text-secondary);
    cursor: pointer; transition: background .15s;
  }
  .scope-toggle:hover { background: var(--bg); }

  /* Rejilla clave/valor, como la cabecera. */
  .scope-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px 22px;
    margin-top: 14px;
  }
  .scope-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .scope-key {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--text-secondary);
  }
  .scope-val { font-size: 12.5px; color: var(--text); overflow-wrap: anywhere; }
  .scope-val code, .scope-val.meta-val-mono {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text);
  }
  .scope-item-warn .scope-key { color: var(--medium-text); }
  .scope-item-warn .scope-val { color: var(--medium-text); font-weight: 600; }

  /* ── Módulos del análisis: siguen siendo píldoras ── */
  .scope-modules { margin-top: 16px; }
  .scope-modules-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .scope-module {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 3px 10px; border-radius: var(--radius-pill);
    border: 1px solid var(--border); background: var(--card);
    color: var(--text);
  }
  .scope-module-ico { color: var(--text-muted); }
  .scope-module-state { color: var(--text-secondary); }
  .scope-module.mod-ok .scope-module-ico { color: var(--low); }
  /* Ámbar solo el que falló; el no solicitado, en gris. */
  .scope-module.mod-failed {
    border-color: var(--medium-border); background: var(--medium-bg);
  }
  .scope-module.mod-failed .scope-module-ico { color: var(--medium); }
  .scope-module.mod-not-requested,
  .scope-module.mod-not-applicable { opacity: .72; }

  .scope-detail { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .scope-detail-block + .scope-detail-block { margin-top: 12px; }
  .scope-detail-title {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .4px; color: var(--text-secondary); margin-bottom: 5px;
  }
  .scope-detail-title.warn { color: var(--medium-text); }
  .scope-detail-item { font-size: 12px; color: var(--text); line-height: 1.6; }
  .scope-detail-item code {
    font-family: var(--font-mono);
    font-size: 11.5px; background: var(--surface); padding: 1px 5px;
    border-radius: 4px; margin-right: 4px;
  }
  .scope-detail-flow { display: flex; flex-wrap: wrap; gap: 4px; }
  .scope-detail-note { font-size: 11.5px; color: var(--text-secondary); margin-top: 4px; font-style: italic; }
  .scope-detail-note.warn { color: var(--medium-text); font-style: normal; font-weight: 600; }

  /* ═══ GRÁFICOS ═════════════════════════════════════════════════════════════ */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 20px 24px;
  }
  .chart-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }

  .donut-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .donut-svg { width: 140px; height: 140px; flex-shrink: 0; }
  .donut-total { font-size: 28px; font-weight: 800; fill: var(--text); }
  .donut-sub   { font-size: 11px; fill: var(--text-secondary); }

  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-item  { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-name  { color: var(--text-secondary); flex: 1; }
  .legend-val   { font-weight: 700; color: var(--text); }

  .hbar-list { display: flex; flex-direction: column; gap: 14px; }
  .hbar-item { display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: 10px; }
  .hbar-label { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-track {
    height: 18px;
    background: var(--surface);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .hbar-fill { height: 100%; border-radius: var(--radius-pill); transition: width .4s; }
  .hbar-count { font-size: 13px; font-weight: 700; color: var(--text-secondary); text-align: right; }

  /* ═══ MÉTRICAS ═══ Las tres con la misma anatomía: título, cifra, barra y pie. */
  .metrics-row {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .metric-card {
    flex: 1 1 260px;
    min-width: 0;
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
  }
  .metric-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .metric-header .icon { color: var(--text-secondary); }
  .metric-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-secondary);
  }
  .metric-bar-section { margin-top: auto; }
  .metric-figure {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .metric-figure-unit {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--text-secondary);
    margin-left: 4px;
  }
  /* El guion de "sin dato" es TEXTO, no un icono: --text-muted da 2,56:1. */
  .metric-figure-na { color: var(--text-secondary); }
  .metric-foot {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .metric-foot-item { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .metric-foot-key {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--text-secondary);
  }
  .metric-foot-val { font-size: 11.5px; color: var(--text-secondary); overflow-wrap: anywhere; }

  .progress-bar {
    height: 10px;
    background: var(--surface);
    border-radius: var(--radius-pill);
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: var(--radius-pill); }

  /* RAM */
  .ram-macos-note {
    display: flex;
    align-items: center;
    gap: 8px;
    /* Verde propio: no es severidad "baja", es una nota de plataforma. */
    background: #F0FDF4;
    border: 1px solid #BBF7D0;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 12.5px;
    color: #15803D;
    margin-bottom: 14px;
  }

  /* CPU: las tres medidas de load siguen estando. */
  .cpu-loads {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .load-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    flex: 1;
  }
