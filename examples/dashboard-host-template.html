<!--
  LoCoAudit — Dashboard de Auditoría de Host
  Template para nodo "ui_template" de @flowfuse/node-red-dashboard (Dashboard 2.0 · Vue 3)

  CÓMO USAR:
  1. Arrastra un nodo "ui_template" al lienzo
  2. Conecta:  [inject] → [audit-host] → [ui_template]
  3. Doble click en ui_template → campo "Template": pega TODO este fichero
  4. En el nodo: Group → ancho 6 o más, tipo "Widget"
  5. Despliega y abre http://127.0.0.1:1880/dashboard
-->
<template>
  <div>

    <!-- ── Sin datos ── -->
    <div v-show="state === 'idle'" class="lca-state-center">
      <div class="lca-state-ico">🔍</div>
      <h3 class="lca-state-title">Esperando auditoría de tu equipo…</h3>
      <p class="lca-state-desc">Pulsa el botón de inicio en Node-RED para analizar tu equipo.</p>
    </div>

    <!-- ── Escaneando ── -->
    <div v-show="state === 'scanning'" class="lca-state-center">
      <div class="lca-spinner"></div>
      <p class="lca-state-desc">Analizando tu equipo…</p>
    </div>

    <!-- ── Resultados ── -->
    <div v-if="state === 'done' && auditData" class="lca-report-root">

      <!-- ══ HEADER ══ -->
      <div class="header-card">
        <div class="host-info">
          <div class="host-name">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect>
              <path d="M8 21h8M12 17v4"></path>
            </svg>
            {{ auditData.host && auditData.host.hostname }}
            <span class="risk-badge" :class="riskClass">
              <span class="risk-badge-dot"></span>
              {{ riskLabel }}
            </span>
          </div>
          <div class="host-os">
            {{ auditData.host && auditData.host.release }}
            — {{ auditData.host && auditData.host.platform }}
            · {{ auditData.host && auditData.host.arch }}
          </div>
          <div class="pills-row">
            <span class="pill"><span class="pill-label">Plataforma</span> {{ auditData.host && auditData.host.platform }}</span>
            <span class="pill"><span class="pill-label">Activo</span> {{ uptimeHuman }}</span>
            <span class="pill"><span class="pill-label">Análisis</span> {{ scanTime }}</span>
            <span class="pill" v-if="auditData.scanMeta && auditData.scanMeta.durationMs">
              <span class="pill-label">Duración</span> {{ fmtDuration(auditData.scanMeta.durationMs) }}
            </span>
            <span class="dl-group">
              <button class="dl-btn" @click="downloadHtml" title="Descargar informe HTML (imprimible a PDF)">⬇ HTML</button>
              <button class="dl-btn" @click="downloadJson" title="Descargar datos JSON">⬇ JSON</button>
            </span>
          </div>
        </div>

        <!-- Gauge circular Lynis -->
        <div class="gauge-wrap" v-if="lynisIdx !== null">
          <span class="gauge-label-top">Hardening Index</span>
          <svg class="gauge-svg" viewBox="0 0 110 110">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" :stop-color="lynisColor"></stop>
                <stop offset="100%" stop-color="#EA580C"></stop>
              </linearGradient>
            </defs>
            <!-- track -->
            <circle cx="55" cy="55" r="44" fill="none" stroke="#F1F5F9"
                    stroke-width="10" stroke-dasharray="221 55"
                    stroke-dashoffset="-27.5" stroke-linecap="round"></circle>
            <!-- fill -->
            <circle cx="55" cy="55" r="44" fill="none" stroke="url(#gaugeGrad)"
                    stroke-width="10"
                    :stroke-dasharray="gaugeStroke + ' ' + (276 - gaugeStroke)"
                    stroke-dashoffset="-27.5" stroke-linecap="round"></circle>
            <text x="55" y="51" text-anchor="middle" class="gauge-score">{{ lynisIdx }}</text>
            <text x="55" y="63" text-anchor="middle" class="gauge-sub">de 100</text>
          </svg>
          <span style="font-size:11px;color:var(--text-secondary);">
            Lynis · {{ lynisIdx >= 55 ? 'Aceptable' : lynisIdx >= 30 ? 'Mejorable' : 'Deficiente' }}
          </span>
        </div>
      </div>

      <!-- ══ SEVERITY COUNTERS ══ -->
      <div class="counters-row">
        <div class="counter-card critical" :class="{ 'counter-active': filterSev === 'critical' }"
             @click="toggleSevFilter('critical')" title="Filtrar por severidad Crítico">
          <div class="counter-top">
            <span class="counter-severity">Crítico</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5">
              <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <div class="counter-num" :style="counts.critical === 0 ? {color:'#CBD5E1'} : {}">{{ counts.critical }}</div>
          <div class="counter-sub">Acción inmediata</div>
        </div>
        <div class="counter-card high" :class="{ 'counter-active': filterSev === 'high' }"
             @click="toggleSevFilter('high')" title="Filtrar por severidad Alto">
          <div class="counter-top">
            <span class="counter-severity">Alto</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EA580C" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <div class="counter-num" :style="counts.high === 0 ? {color:'#CBD5E1'} : {}">{{ counts.high }}</div>
          <div class="counter-sub">Resolver esta semana</div>
        </div>
        <div class="counter-card medium" :class="{ 'counter-active': filterSev === 'medium' }"
             @click="toggleSevFilter('medium')" title="Filtrar por severidad Medio">
          <div class="counter-top">
            <span class="counter-severity">Medio</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
          <div class="counter-num" :style="counts.medium === 0 ? {color:'#CBD5E1'} : {}">{{ counts.medium }}</div>
          <div class="counter-sub">Cuando puedas</div>
        </div>
        <div class="counter-card low" :class="{ 'counter-active': filterSev === 'low' }"
             @click="toggleSevFilter('low')" title="Filtrar por severidad Bajo">
          <div class="counter-top">
            <span class="counter-severity">Bajo</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#65A30D" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
          </div>
          <div class="counter-num" :style="counts.low === 0 ? {color:'#CBD5E1'} : {}">{{ counts.low }}</div>
          <div class="counter-sub">Opcional</div>
        </div>
      </div>

      <!-- ══ CHARTS ══ -->
      <div class="charts-row" v-if="totalFindings > 0">

        <!-- Donut SVG puro -->
        <div class="chart-card">
          <div class="chart-title">Distribución por Severidad</div>
          <div class="donut-wrap">
            <svg class="donut-svg" viewBox="0 0 140 140">
              <!-- track -->
              <circle cx="70" cy="70" r="54" fill="none" stroke="#F1F5F9" stroke-width="18"></circle>
              <!-- segmentos calculados -->
              <circle v-for="seg in donutSegments" :key="seg.key"
                      cx="70" cy="70" r="54" fill="none"
                      :stroke="seg.color" stroke-width="18"
                      :stroke-dasharray="seg.dasharray"
                      :stroke-dashoffset="seg.dashoffset"></circle>
              <text x="70" y="65" text-anchor="middle" class="donut-total">{{ totalFindings }}</text>
              <text x="70" y="79" text-anchor="middle" class="donut-sub">hallazgos</text>
            </svg>
            <div class="donut-legend">
              <div class="legend-item" v-for="seg in donutSegments" :key="'leg-'+seg.key">
                <span class="legend-dot" :style="{background: seg.color}"></span>
                <span class="legend-name">{{ sevLabel(seg.key) }}</span>
                <span class="legend-val">{{ seg.count }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Barras horizontales por categoría -->
        <div class="chart-card">
          <div class="chart-title">Hallazgos por Categoría</div>
          <div class="hbar-list">
            <div class="hbar-item" v-for="bar in catBars" :key="bar.key">
              <span class="hbar-label">{{ bar.label }}</span>
              <div class="hbar-track">
                <div class="hbar-fill" :style="{width: bar.pct + '%', background: bar.color}"></div>
              </div>
              <span class="hbar-count" :style="{color: bar.color}">{{ bar.count }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ METRICS ══ -->
      <div class="metrics-row">

        <!-- RAM -->
        <div class="metric-card" v-if="ramData">
          <div class="metric-header">
            <span class="metric-title">Memoria RAM</span>
            <span class="metric-icon">{{ ramData.platform === 'darwin' ? '🍎' : '🧠' }}</span>
          </div>
          <div class="ram-macos-note" v-if="ramData.platform === 'darwin'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Gestión unificada macOS — memoria compartida
          </div>
          <div class="metric-bar-section">
            <div class="ram-usage-row">
              <span class="ram-used">{{ ramData.usedGiB }}</span>
              <span class="ram-of">GiB de</span>
              <span class="ram-total">{{ ramData.totalGiB }} GiB</span>
            </div>
            <div class="progress-bar" v-if="ramData.pct !== null">
              <div class="progress-fill" :style="{width: ramData.pct + '%', background: ramBarStyle(ramData.pct)}"></div>
            </div>
            <div class="progress-pct" v-if="ramData.pct !== null">{{ ramData.pct }}% en uso</div>
          </div>
        </div>

        <!-- CPU -->
        <div class="metric-card" v-if="cpuData">
          <div class="metric-header">
            <span class="metric-title">Carga de CPU</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              <rect x="9" y="9" width="6" height="6"></rect>
              <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"></path>
            </svg>
          </div>
          <div class="cpu-loads" v-if="cpuData.loadAvg">
            <div class="load-pill">
              <span class="load-val">{{ cpuData.loadAvg[0] != null ? cpuData.loadAvg[0].toFixed(2) : '—' }}</span>
              <span class="load-period">1 min</span>
            </div>
            <div class="load-pill">
              <span class="load-val">{{ cpuData.loadAvg[1] != null ? cpuData.loadAvg[1].toFixed(2) : '—' }}</span>
              <span class="load-period">5 min</span>
            </div>
            <div class="load-pill">
              <span class="load-val">{{ cpuData.loadAvg[2] != null ? cpuData.loadAvg[2].toFixed(2) : '—' }}</span>
              <span class="load-period">15 min</span>
            </div>
          </div>
          <div class="metric-bar-section">
            <div class="cpu-bar-label" v-if="cpuData.loadAvg">
              Utilización estimada (load avg 1m vs. {{ cpuData.cores }} cores)
            </div>
            <div class="progress-bar" v-if="cpuData.loadAvg">
              <div class="progress-fill" :style="{
                width: Math.min(100, cpuData.loadAvg[0] / cpuData.cores * 100).toFixed(0) + '%',
                background: cpuBarColor(cpuData.loadAvg[0] / cpuData.cores)
              }"></div>
            </div>
            <div class="progress-pct" v-if="cpuData.loadAvg">
              ~{{ Math.min(100, Math.round(cpuData.loadAvg[0] / cpuData.cores * 100)) }}% · {{ cpuData.cores }} núcleos {{ cpuData.model }}
            </div>
            <div class="progress-pct" v-else>Load avg no disponible</div>
          </div>
        </div>

        <!-- Disco -->
        <div class="metric-card" v-if="diskData && diskData.length > 0">
          <div class="metric-header">
            <span class="metric-title">Almacenamiento</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
          </div>
          <div class="disk-parts-container">
            <div class="disk-part" v-for="(p, i) in diskData" :key="i">
              <div class="disk-part-header">
                <span class="disk-mount">{{ p.mount }}</span>
                <span class="disk-pct">{{ p.usedPercent }}%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" :style="{width: p.usedPercent + '%', background: p.sevColor}"></div>
              </div>
              <div class="disk-detail-row">
                <span>{{ p.usedGB }} GB usados</span>
                <span>{{ p.freeGB }} GB libres</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ FINDINGS ══ -->
      <div class="findings-section">
        <div class="section-header">
          <span class="section-title">Hallazgos de Seguridad</span>
          <span class="pill" style="background:#F1F5F9">
            {{ totalFindings }} hallazgos · {{ groups.filter(function(g){ return g.items.length > 0; }).length }} categorías activas
          </span>
        </div>

        <template v-for="g in groups" :key="g.key">
          <div class="findings-group" v-if="g.items.length > 0">
            <div class="group-header" @click="toggleGroup(g.key)">
              <span class="group-icon">{{ g.icon }}</span>
              <span class="group-name">{{ g.label }}</span>
              <span class="group-count">{{ g.items.length }}</span>
              <svg class="group-chevron" :class="{open: openGroups[g.key]}"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <div class="group-findings" v-show="openGroups[g.key]">
              <div v-for="(f, fi) in g.items" :key="g.key + '-' + fi">
                <div class="finding-row" @click="toggleFinding(g.key + '-' + fi)">
                  <span class="sev-badge" :class="sevClass(f.severity)">{{ sevLabel(f.severity) }}</span>
                  <span class="cat-badge">{{ catLabel(f.category) }}</span>
                  <span class="finding-title">{{ f.title }}</span>
                  <span class="finding-expand-icon">{{ openFindings[g.key + '-' + fi] ? '▲' : '▼' }}</span>
                </div>
                <div class="finding-detail" :class="{open: openFindings[g.key + '-' + fi]}">
                  <div class="detail-grid" v-if="f.fix">
                    <div class="detail-col">
                      <div class="detail-col-title">Impacto (Evidencia)</div>
                      <pre class="detail-evidence">{{ fmtEvidence(f.evidence) }}</pre>
                    </div>
                    <div class="detail-col">
                      <div class="detail-col-title">Pasos de Resolución</div>
                      <div class="fix-steps" v-if="!f.isCommand">
                        <div class="fix-step" v-for="(st, si) in parseFixStepsRich(f.fix)" :key="si">
                          <span class="fix-num">{{ si + 1 }}</span>
                          <template v-if="st.cmd">
                            <span class="fix-step-body">
                              <span v-if="st.label" class="fix-step-label">{{ st.label }}</span>
                              <span class="command-box command-inline">
                                <code class="command-text">{{ st.cmd }}</code>
                                <button @click.stop="copyCommand(st.cmd)"
                                        :class="{ copied: copiedKey === st.cmd }"
                                        class="command-btn">
                                  {{ copiedKey === st.cmd ? '✓ Copiado' : 'Copiar' }}
                                </button>
                              </span>
                            </span>
                          </template>
                          <template v-else>{{ st.text }}</template>
                        </div>
                      </div>
                      <p v-if="f.isCommand" class="cmd-intro">
                        Comando sugerido<span class="cmd-origin">{{ originLabel(f.source) }}</span>:
                      </p>
                      <div v-if="f.isCommand" class="command-box">
                        <code class="command-text">{{ f.command || f.fix }}</code>
                        <button @click.stop="copyCommand(f.command || f.fix)"
                                :class="{ copied: copiedKey === (f.command || f.fix) }"
                                class="command-btn">
                          {{ copiedKey === (f.command || f.fix) ? '✓ Copiado' : 'Copiar' }}
                        </button>
                      </div>
                      <p v-if="fixNote(f)" class="cmd-note">{{ fixNote(f) }}</p>
                      <div v-if="fixHasCmd(f)" class="cmd-warn">
                        <strong>LoCoAudit no ejecuta este comando por ti.</strong>
                        Cópialo y ejecútalo en tu terminal después de revisarlo.
                      </div>
                      <div v-if="/(^|\s)sudo(\s|$)/.test(f.fix || '')" class="cmd-sudo">
                        🔒 Requiere privilegios de administrador: pedirá tu contraseña de usuario. Revísalo bien antes de ejecutarlo.
                      </div>
                    </div>
                  </div>
                  <div v-if="!f.fix" style="padding:12px 0;font-style:italic;color:#6B7280;font-size:12.5px;">
                    Este hallazgo es informativo. No requiere acción inmediata.
                  </div>

                  <!-- ── Chat con IA ── -->
                  <div class="lca-chat-wrap" v-if="llmAvailable === true">
                    <button class="ai-ask-btn" @click.stop="toggleChat(g.key + '-' + fi, f)">
                      🤖 {{ chatOpen[g.key + '-' + fi] ? 'Cerrar asistente' : 'Preguntar a la IA' }}
                    </button>
                    <div class="lca-chat" v-if="chatOpen[g.key + '-' + fi]">
                      <div class="lca-chat-msgs">
                        <div v-for="(cm, ci) in (chatMessages[g.key + '-' + fi] || [])" :key="ci"
                             class="chat-msg" :class="cm.role === 'user' ? 'chat-user' : 'chat-ai'">
                          <div class="chat-bubble" :class="{ 'chat-error': cm.error }">
                            <template v-for="(seg, si) in parseChatContent(cm.content)" :key="si">
                              <div v-if="seg.type === 'text'" class="chat-text" v-html="seg.html"></div>
                              <div v-else class="command-box">
                                <code class="command-text">{{ seg.code }}</code>
                                <button @click.stop="copyCommand(seg.code)"
                                        :class="{ copied: copiedKey === seg.code }"
                                        class="command-btn">
                                  {{ copiedKey === seg.code ? '✓ Copiado' : 'Copiar' }}
                                </button>
                              </div>
                            </template>
                          </div>
                        </div>
                        <div v-if="chatLoading[g.key + '-' + fi]" class="chat-msg chat-ai">
                          <div class="chat-bubble chat-loading">
                            <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
                          </div>
                        </div>
                      </div>
                      <div class="lca-chat-input">
                        <input type="text" v-model="chatInput[g.key + '-' + fi]"
                               placeholder="Escribe tu pregunta…"
                               :disabled="chatLoading[g.key + '-' + fi]"
                               @keydown.enter.prevent="sendChat(g.key + '-' + fi, f)">
                        <button class="chat-send-btn"
                                :disabled="chatLoading[g.key + '-' + fi]"
                                @click.stop="sendChat(g.key + '-' + fi, f)">Enviar</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ── Subsección: eventos (solo grupo "Logs del sistema") ──────────── -->
              <!-- Dos tablas distintas: intentos de acceso (eventos que ocurrieron)
                   vs sesiones activas ahora mismo (estado presente). -->
              <div v-if="g.key === 'system-logs' && secEvents" class="seclog">

                <!-- (a) Intentos de acceso — SSH OK/fallido, sudo, su, logins -->
                <div class="seclog-title">Intentos de acceso (últimas {{ secEvents.windowHours }} h)</div>
                <div v-if="accessEvents.length === 0" class="seclog-empty">
                  Sin intentos en la ventana analizada ({{ secEvents.windowHours }} h).
                </div>
                <div v-else>
                  <div class="seclog-table-wrap">
                    <table class="seclog-table">
                      <thead>
                        <tr><th>Hora</th><th>Tipo</th><th>Usuario</th><th>Origen</th><th>Detalle</th></tr>
                      </thead>
                      <tbody>
                        <tr v-for="(ev, ei) in accessEvents" :key="'acc-' + ei">
                          <td class="seclog-mono">{{ ev.ts || '—' }}</td>
                          <td><span class="seclog-badge" :class="evBadgeClass(ev.type)">{{ evTypeLabel(ev.type) }}</span></td>
                          <td>{{ ev.user || '—' }}</td>
                          <td class="seclog-mono">{{ ev.origin || '—' }}</td>
                          <td class="seclog-detail">{{ ev.detail || '—' }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div v-if="secEvents.truncated" class="seclog-truncated">
                    Mostrando los {{ secEvents.events.length }} eventos más recientes.
                  </div>
                </div>

                <!-- (b) Sesiones activas ahora — estado presente (`who`). La hora
                     es la de INICIO de sesión, no la de un evento. -->
                <div class="seclog-title seclog-title-sessions">Sesiones activas ahora</div>
                <div v-if="sessionEvents.length === 0" class="seclog-empty">
                  Sin sesiones remotas activas.
                </div>
                <div v-else class="seclog-table-wrap">
                  <table class="seclog-table">
                    <thead>
                      <tr><th>Inicio de sesión</th><th>Tipo</th><th>Usuario</th><th>Origen</th><th>Detalle</th></tr>
                    </thead>
                    <tbody>
                      <tr v-for="(ev, ei) in sessionEvents" :key="'ses-' + ei">
                        <td class="seclog-mono">{{ ev.ts || '—' }}</td>
                        <td><span class="seclog-badge" :class="evBadgeClass(ev.type)">{{ evTypeLabel(ev.type) }}</span></td>
                        <td>{{ ev.user || '—' }}</td>
                        <td class="seclog-mono">{{ ev.origin || '—' }}</td>
                        <td class="seclog-detail">{{ ev.detail || '—' }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Sin hallazgos -->
        <div v-if="groups.filter(function(g){ return g.items.length > 0; }).length === 0"
             class="lca-state-center" style="padding:40px 0">
          <div class="lca-state-ico">✅</div>
          <h3 class="lca-state-title">¡Sin hallazgos!</h3>
          <p class="lca-state-desc">No se encontraron problemas en esta auditoría.</p>
        </div>
      </div>

      <!-- Footer -->
      <div style="text-align:center;padding:16px 0 8px;font-size:11px;color:var(--text-secondary);"
           v-if="auditData.scanMeta">
        LoCoAudit · Módulos: {{ (auditData.scanMeta.modulesRun || []).join(', ') }} · {{ scanTime }}
      </div>

    </div>
  </div>
</template>

<script>
export default {
  data() {
    return {
      // Filtro por severidad: clic en una tarjeta (Crítico/Alto/Medio/Bajo).
      filterSev: 'all',
      state: 'idle',
      auditData: null,
      openGroups: {},
      openFindings: {},
      copiedKey: null,
      // ── Chat con LLM (asistente IA) ──
      chatOpen: {},        // por findingKey: panel abierto/cerrado
      chatMessages: {},    // por findingKey: [{ role, content, error? }]
      chatInput: {},       // por findingKey: texto en curso
      chatLoading: {},     // por findingKey: esperando respuesta
      llmAvailable: null   // null = sin comprobar; true/false tras comprobar
    };
  },

  computed: {
    maxSev() {
      return ((this.auditData && this.auditData.summary && this.auditData.summary.maxSeverity) || 'info').toUpperCase();
    },

    counts() {
      var c = (this.auditData && this.auditData.summary && this.auditData.summary.counts) || {};
      return {
        critical: c.critical || c.CRITICAL || 0,
        high:     c.high     || c.HIGH     || 0,
        medium:   c.medium   || c.MEDIUM   || 0,
        low:      c.low      || c.LOW      || 0,
        info:     c.info     || c.INFO     || 0
      };
    },

    totalFindings() {
      var c = this.counts;
      return c.critical + c.high + c.medium + c.low + c.info;
    },

    riskLabel() {
      var MAP = {
        INFO: 'Todo en orden', LOW: 'Riesgo Bajo',
        MEDIUM: 'Riesgo Moderado', HIGH: 'Riesgo Alto', CRITICAL: 'Riesgo Crítico'
      };
      return MAP[this.maxSev] || this.maxSev;
    },

    riskClass() {
      var MAP = { CRITICAL: 'critical', HIGH: 'high', MEDIUM: 'medium', LOW: 'low', INFO: 'info' };
      return MAP[this.maxSev] || 'info';
    },

    uptimeHuman() {
      return this.fmtUptime(this.auditData && this.auditData.host && this.auditData.host.uptimeSec);
    },

    scanTime() {
      var ts = this.auditData && this.auditData.timestamp;
      if (!ts) return '—';
      return new Date(ts).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    lynisIdx() {
      var findings = this.auditData && this.auditData.findings;
      if (!findings) return null;
      var f = null;
      for (var i = 0; i < findings.length; i++) {
        if (findings[i].id === 'HOST-LYN-IDX') { f = findings[i]; break; }
      }
      if (!f) return null;
      var m = (f.evidence || '').match(/(\d+)\/100/);
      return m ? parseInt(m[1], 10) : null;
    },

    lynisColor() {
      if (this.lynisIdx === null) return '#22C55E';
      if (this.lynisIdx < 30) return '#EF4444';
      if (this.lynisIdx < 55) return '#F97316';
      return '#22C55E';
    },

    // arc length = lynisIdx% of the visible 221-unit arc; total circumference r=44 ≈ 276
    gaugeStroke() {
      if (this.lynisIdx === null) return 0;
      return Math.round(this.lynisIdx / 100 * 221);
    },

    ramData() {
      var cm = this.auditData && this.auditData.raw && this.auditData.raw.cpuMemory;
      if (!cm || !cm.memory) return null;
      var pct = (cm.memory.usedGiB && cm.memory.totalGiB)
        ? Math.round(cm.memory.usedGiB / cm.memory.totalGiB * 100) : null;
      return {
        totalGiB: cm.memory.totalGiB,
        usedGiB:  cm.memory.usedGiB,
        pct:      pct,
        platform: cm.platform || (this.auditData.host && this.auditData.host.platform) || ''
      };
    },

    cpuData() {
      var cm = this.auditData && this.auditData.raw && this.auditData.raw.cpuMemory;
      if (!cm || !cm.cpu) return null;
      return {
        model:   cm.cpu.model  || '—',
        cores:   cm.cpu.cores  || 1,
        loadAvg: Array.isArray(cm.cpu.loadAvg) ? cm.cpu.loadAvg : null
      };
    },

    diskData() {
      var disk = this.auditData && this.auditData.raw && this.auditData.raw.disk;
      if (!Array.isArray(disk) || disk.length === 0) return [];
      var platform = this.auditData.host && this.auditData.host.platform;
      return disk.filter(function(d) {
        // En macOS "/" es el volumen de solo lectura del sistema (~11 GB).
        // /System/Volumes/Data es el volumen real con los datos del usuario.
        return !(platform === 'darwin' && d.mount === '/');
      }).map(function(d) {
        var pct = d.usedPercent || 0;
        return {
          mount:       d.mount,
          usedPercent: pct,
          usedGB:      d.usedGB,
          totalGB:     d.totalGB,
          freeGB:      d.freeGB != null ? d.freeGB : Math.round((d.totalGB - d.usedGB) * 100) / 100,
          sevColor:    pct >= 90 ? '#DC2626' : pct >= 75 ? '#EA580C' : pct >= 60 ? '#D97706' : '#65A30D'
        };
      });
    },

    groups() {
      var findings = this.auditData && this.auditData.findings;
      if (!findings) return [];
      var fsev = this.filterSev;   // filtro por severidad (tarjetas clicables)
      var CATS = {
        vulnerability: { icon: '🔒', label: 'Vulnerabilidades',        order: 0 },
        cpu:           { icon: '⚙️', label: 'Procesador (CPU)',         order: 1 },
        memory:        { icon: '🧠', label: 'Memoria RAM',              order: 2 },
        system:        { icon: '🖥️', label: 'Sistema & Actualizaciones', order: 3 },
        network:       { icon: '🌐', label: 'Red & Firewall',           order: 4 },
        'system-logs': { icon: '📋', label: 'Logs del sistema',         order: 5 },
        other:         { icon: '📦', label: 'Otros',                    order: 99 }
      };
      var SEV_ORDER = { CRITICAL: 5, HIGH: 4, MEDIUM: 3, LOW: 2, INFO: 1 };
      var catMap = {};
      findings.forEach(function(f) {
        if (fsev !== 'all' && (f.severity || '').toLowerCase() !== fsev) return;
        var c = (f.category || 'other').toLowerCase();
        if (c === 'disk') return;
        var key = CATS[c] ? c : 'other';
        if (!catMap[key]) catMap[key] = [];
        catMap[key].push(f);
      });
      Object.keys(catMap).forEach(function(c) {
        catMap[c].sort(function(a, b) {
          return (SEV_ORDER[(b.severity || '').toUpperCase()] || 0) -
                 (SEV_ORDER[(a.severity || '').toUpperCase()] || 0);
        });
      });
      return Object.keys(catMap).map(function(c) {
        var meta = CATS[c] || { icon: '📋', label: c, order: 50 };
        return { key: c, icon: meta.icon, label: meta.label, order: meta.order, items: catMap[c] };
      }).sort(function(a, b) { return a.order - b.order; });
    },

    secEvents() {
      // payload.securityEvents = { windowHours, events: [{ts,type,user,origin,detail}], truncated }
      return (this.auditData && this.auditData.securityEvents) || null;
    },

    // Intentos de acceso (eventos que OCURRIERON): SSH OK/fallido, sudo, su,
    // logins remotos/fallidos, admin. Todo menos las sesiones activas ahora.
    accessEvents() {
      var evs = (this.secEvents && this.secEvents.events) || [];
      return evs.filter(function(e) { return e.type !== 'session'; });
    },

    // Sesiones activas AHORA MISMO (estado presente, salida de `who`): type 'session'.
    sessionEvents() {
      var evs = (this.secEvents && this.secEvents.events) || [];
      return evs.filter(function(e) { return e.type === 'session'; });
    },

    catBars() {
      var SEV_ORDER = { CRITICAL: 5, HIGH: 4, MEDIUM: 3, LOW: 2, INFO: 1 };
      var SEV_COLOR = { CRITICAL: '#DC2626', HIGH: '#EA580C', MEDIUM: '#D97706', LOW: '#65A30D', INFO: '#0EA5E9' };
      var nonEmpty = this.groups.filter(function(g) { return g.items.length > 0; });
      if (!nonEmpty.length) return [];
      var maxCount = Math.max.apply(null, nonEmpty.map(function(g) { return g.items.length; }));
      return nonEmpty.map(function(g) {
        var maxSev = 'INFO';
        g.items.forEach(function(f) {
          var s = (f.severity || '').toUpperCase();
          if ((SEV_ORDER[s] || 0) > (SEV_ORDER[maxSev] || 0)) maxSev = s;
        });
        return {
          key:   g.key,
          label: g.label,
          count: g.items.length,
          pct:   maxCount > 0 ? Math.round(g.items.length / maxCount * 100) : 0,
          color: SEV_COLOR[maxSev] || '#94a3b8'
        };
      });
    },

    donutSegments() {
      var C = 339.3; // circumference r=54
      var c = this.counts;
      var total = c.critical + c.high + c.medium + c.low + c.info;
      if (total === 0) return [];
      var sevs = [
        { key: 'info',     color: '#0EA5E9', count: c.info     },
        { key: 'low',      color: '#65A30D', count: c.low      },
        { key: 'medium',   color: '#D97706', count: c.medium   },
        { key: 'high',     color: '#EA580C', count: c.high     },
        { key: 'critical', color: '#DC2626', count: c.critical }
      ].filter(function(s) { return s.count > 0; });

      var offset = C / 4; // start at 12 o'clock
      return sevs.map(function(s) {
        var arc = (s.count / total) * C;
        var seg = {
          key:         s.key,
          color:       s.color,
          count:       s.count,
          dasharray:   arc.toFixed(1) + ' ' + (C - arc).toFixed(1),
          dashoffset:  offset.toFixed(2)
        };
        offset -= arc;
        return seg;
      });
    }
  },

  watch: {
    msg: {
      deep: false,
      handler(newMsg) {
        if (!newMsg) return;
        if (!newMsg.payload || !newMsg.payload.findings) {
          this.state = 'scanning';
          return;
        }
        this.auditData    = newMsg.payload;
        this.state        = 'done';
        this.openGroups   = {};
        this.openFindings = {};
      }
    }
  },

  methods: {
    toggleGroup(key) {
      this.openGroups = Object.assign({}, this.openGroups, { [key]: !this.openGroups[key] });
    },
    toggleFinding(key) {
      this.openFindings = Object.assign({}, this.openFindings, { [key]: !this.openFindings[key] });
    },
    // Filtro por severidad: clic en la tarjeta activa/desactiva ese filtro.
    toggleSevFilter(sev) {
      this.filterSev = this.filterSev === sev ? 'all' : sev;
    },

    // Origen HONESTO del comando: lo genera LoCoAudit; si el hallazgo vino de una
    // herramienta, se indica a partir de qué análisis (Trivy/Lynis/Nmap).
    originLabel(source) {
      var M = {
        trivy: '· a partir del análisis de Trivy',
        lynis: '· a partir de Lynis',
        nmap:  '· a partir de la detección de Nmap',
        native: '· recomendación de LoCoAudit',
      };
      return M[source] || '· recomendación de LoCoAudit';
    },

    // ── Descarga de reporte (HTML imprimible + JSON) ──────────────────────────
    _escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    },
    _reportBasename(ext) {
      var d = new Date();
      var p = function(n) { return String(n).padStart(2, '0'); };
      var stamp = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                  '_' + p(d.getHours()) + p(d.getMinutes());
      var type = (this.auditData && this.auditData.auditType) || 'audit';
      return 'locoaudit-' + type + '-' + stamp + '.' + ext;
    },
    _triggerDownload(filename, content, mime) {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    },
    downloadJson() {
      if (!this.auditData) return;
      this._triggerDownload(this._reportBasename('json'),
        JSON.stringify(this.auditData, null, 2), 'application/json');
    },
    downloadHtml() {
      if (!this.auditData) return;
      this._triggerDownload(this._reportBasename('html'),
        this._buildHtmlReport(), 'text/html;charset=utf-8');
    },
    _buildHtmlReport() {
      try {
        // LCA:SNAPSHOT:START — única fuente: lib/snapshot-body.txt (build-dashboards.js). NO EDITAR.
      // Snapshot del DOM ya renderizado del dashboard: fidelidad exacta, no
      // puede divergir (el export ES el dashboard, sin re-render alternativo).
      var payload = this.auditData || {};
      var auditType = payload.auditType || '';
      // 1. CSS del propio dashboard (sentinel por nodo) — fuente ÚNICA de estilo.
      var css = '', i, styles = document.querySelectorAll('style');
      var tag = 'LCA-STYLE-DASH:' + auditType;
      for (i = 0; i < styles.length; i++) { if (styles[i].textContent.indexOf(tag) >= 0) { css = styles[i].textContent; break; } }
      if (!css) for (i = 0; i < styles.length; i++) { if (styles[i].textContent.indexOf('LCA-STYLE-DASH') >= 0) { css = styles[i].textContent; break; } }
      if (!css) for (i = 0; i < styles.length; i++) { if (styles[i].textContent.length > css.length) css = styles[i].textContent; }
      // 2. Foto del contenedor de resultados de ESTE dashboard (this.$el primero,
      //    por si hay varios dashboards en la misma página).
      var root = (this.$el && this.$el.querySelector && this.$el.querySelector('.lca-report-root')) || document.querySelector('.lca-report-root') || this.$el;
      var clone = root.cloneNode(true);
      // Quitar lo que necesita servidor (chat IA) y los botones de descarga.
      clone.querySelectorAll('.dl-group,.ia-dl-group,.lca-chat-wrap,.ai-ask-btn,.ia-ask-btn,[class*="chat"]').forEach(function (n) { n.remove(); });
      // 3. Convertir los grupos y hallazgos en acordeón interactivo (como el
      //    ui_template): la cabecera lleva data-lca-acc y su cuerpo (el hermano
      //    siguiente) se abre/cierra con el toggle vanilla embebido. Estado
      //    inicial = igual que el dashboard: grupos ABIERTOS, detalles CERRADOS.
      clone.querySelectorAll('[class*="group-header"]').forEach(function (h) {
        h.setAttribute('data-lca-acc', 'g');
        var b = h.nextElementSibling;
        if (b) { b.style.display = ''; b.classList.add('open'); b.setAttribute('data-lca-open', '1');
          var cv = h.querySelector('[class*="chevron"]'); if (cv) cv.classList.add('open'); }
      });
      clone.querySelectorAll('[class*="finding-row"],[class*="finding-header"]').forEach(function (h) {
        h.setAttribute('data-lca-acc', 'f');
        var b = h.nextElementSibling;
        if (b) { b.classList.remove('open'); b.setAttribute('data-lca-open', '0'); }
      });
      // 4. CSS extra del export + toggle/copiar (vanilla) + documento autocontenido.
      var extra = '.dl-group,.ia-dl-group,.lca-chat-wrap,.ai-ask-btn,.ia-ask-btn{display:none!important}'
        + '[data-lca-acc]{cursor:pointer}.command-btn,.ia-copy-btn{cursor:pointer}'
        + '@media print{[class*="finding-detail"],[class*="finding-body"],[class*="group-body"],[class*="group-findings"]{display:block!important;max-height:none!important;opacity:1!important;overflow:visible!important}}';
      var toggleJs = "(function(){document.addEventListener('click',function(e){var cb=e.target.closest('.command-btn,.ia-copy-btn');if(cb){var box=cb.parentElement,c=box&&box.querySelector('code');var t=c?c.textContent:'';try{navigator.clipboard.writeText(t);}catch(_){}var o=cb.textContent;cb.textContent='\\u2713 Copiado';setTimeout(function(){cb.textContent=o;},1500);return;}var h=e.target.closest('[data-lca-acc]');if(!h)return;var b=h.nextElementSibling;if(!b)return;var willOpen=b.getAttribute('data-lca-open')==='0';b.style.display=willOpen?'':'none';b.classList.toggle('open',willOpen);b.setAttribute('data-lca-open',willOpen?'1':'0');var cv=h.querySelector('[class*=chevron]');if(cv)cv.classList.toggle('open',willOpen);});})();";
      var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var hn = (payload.host && payload.host.hostname) || '';
      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">'
        + '<meta name="viewport" content="width=device-width,initial-scale=1">'
        + '<title>LoCoAudit — ' + esc(titleMap[auditType] || 'Auditoria') + ' — ' + esc(hn) + '</title>'
        + '<style>' + css + '\n' + extra + '</style></head><body><div class="lca-export">'
        + clone.innerHTML + '</div><script>' + toggleJs + '<\/script></body></html>';
        // LCA:SNAPSHOT:END
      } catch (e) {
        console.error('[LoCoAudit] export snapshot fallo, uso tabla de respaldo:', e);
        return this._buildHtmlReportFallback();
      }
    },
    _buildHtmlReportFallback() {
      var esc = this._escHtml;
      var a = this.auditData || {};
      var host = a.host || {};
      var counts = (a.summary && a.summary.counts) || {};
      var findings = a.findings || [];
      var meta = a.scanMeta || {};
      var sevOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
      var sevLabelMap = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
      var sevColor = { critical: '#B91C1C', high: '#C2410C', medium: '#A16207', low: '#15803D', info: '#0369A1' };

      var rank = function(f) {
        var r = sevOrder[(f.severity || 'info').toLowerCase()];
        return r === undefined ? 9 : r;
      };
      var sorted = findings.slice().sort(function(x, y) { return rank(x) - rank(y); });

      var rows = sorted.map(function(f) {
        var sev = (f.severity || 'info').toLowerCase();
        var origen = f.image || f.category || '—';
        return '<tr>' +
          '<td><span class="sev" style="background:' + sevColor[sev] + '">' + esc(sevLabelMap[sev] || sev) + '</span></td>' +
          '<td class="mono">' + esc(f.id) + '</td>' +
          '<td class="mono">' + esc(origen) + '</td>' +
          '<td>' + esc(f.title) + '</td>' +
          '<td>' + esc(f.evidence) + '</td>' +
          '<td>' + (f.fix ? '<code>' + esc(f.fix) + '</code>' : '—') + '</td>' +
          '</tr>';
      }).join('');

      var sumChips = ['critical', 'high', 'medium', 'low', 'info'].map(function(s) {
        return '<span class="chip" style="border-color:' + sevColor[s] + ';color:' + sevColor[s] + '">' +
          (sevLabelMap[s]) + ': <b>' + (counts[s] || 0) + '</b></span>';
      }).join(' ');

      var dur = meta.durationMs ? (meta.durationMs / 1000).toFixed(1) + ' s' : '—';
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var auditTitle = titleMap[a.auditType] || 'Auditoría';

      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
        '<title>LoCoAudit — ' + esc(auditTitle) + ' — ' + esc(host.hostname || '') + '</title>' +
        '<style>' +
        'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1e1b2e;margin:32px;background:#fff}' +
        'h1{color:#7C3AED;margin:0 0 4px}.sub{color:#666;margin:0 0 20px}' +
        '.meta{font-size:13px;color:#444;margin-bottom:16px}.meta b{color:#1e1b2e}' +
        '.chips{margin:12px 0 24px}.chip{display:inline-block;border:1px solid;border-radius:12px;padding:2px 10px;margin-right:6px;font-size:12px}' +
        'table{border-collapse:collapse;width:100%;font-size:12.5px}' +
        'th,td{border:1px solid #e5dcfa;padding:6px 8px;text-align:left;vertical-align:top}' +
        'th{background:#f3effc;color:#7C3AED}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}' +
        '.sev{color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}' +
        'code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f6f4fc;padding:1px 4px;border-radius:4px}' +
        'footer{margin-top:24px;color:#999;font-size:11px}@media print{body{margin:0}}' +
        '</style></head><body>' +
        '<h1>LoCoAudit · Auditoría de ' + esc(auditTitle) + '</h1>' +
        '<p class="sub">' + esc(host.hostname || '') + ' · ' + esc(host.platform || '') + '</p>' +
        '<div class="meta">Fecha: <b>' + esc(this.scanTime || new Date().toLocaleString()) + '</b> · ' +
        'Duración: <b>' + esc(dur) + '</b> · Hallazgos: <b>' + findings.length + '</b></div>' +
        '<div class="chips">' + sumChips + '</div>' +
        '<table><thead><tr><th>Severidad</th><th>ID</th><th>Origen</th><th>Título</th><th>Evidencia</th><th>Recomendación</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="6">Sin hallazgos.</td></tr>') + '</tbody></table>' +
        '<footer>Generado por LoCoAudit · ' + esc(new Date().toISOString()) + '</footer>' +
        '</body></html>';
    },

    parseFixSteps(fix) {
      if (!fix) return [];
      if (fix.indexOf('\n') >= 0) {
        return fix.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
      }
      if (fix.indexOf('. ') >= 0) {
        var parts = fix.split('. ').map(function(s) { return s.trim(); }).filter(Boolean);
        return parts.map(function(s, i) { return i < parts.length - 1 ? s + '.' : s; });
      }
      return [fix];
    },

    // Detecta si un paso de resolución es (o contiene) un comando ejecutable.
    // Soporta dos formas: la línea entera es comando, o "Etiqueta: comando".
    // Devuelve { label, cmd } o null. Mismo criterio que finding-schema::_isCmd
    // más los verbos que aparecen embebidos en prosa (ufw/netstat/apachectl…).
    stepCmd(step) {
      var s = (step || '').trim();
      var CMD = /^(sudo|brew|npm|yarn|pip|composer|go|apt|dnf|yum|winget|choco|lsof|nslookup|kill|systemctl|launchctl|bundle|cargo|rabbitmqctl|jupyter|auditpol|nginx|netsh|net\s+stop|netstat|ufw|apachectl|systemsetup)\b/i;
      if (CMD.test(s)) return { label: '', cmd: s };
      var idx = s.indexOf(': ');
      if (idx >= 0) {
        var after = s.slice(idx + 2).trim();
        if (CMD.test(after)) return { label: s.slice(0, idx + 1), cmd: after };
      }
      return null;
    },

    // Pasos enriquecidos: cada paso es { label, cmd } (comando copiable) o { text }.
    // El fix puede traer el comando en la 1ª línea y una nota explicativa debajo.
    // El botón copia SOLO el comando (finding.command); la nota se muestra aparte,
    // para que un pegado en terminal nunca arrastre texto no ejecutable.
    fixNote(f) {
      if (!f || !f.command || !f.fix) return "";
      return String(f.fix).split("\n").slice(1).join("\n").trim();
    },
    // ¿El paso de resolución contiene algún comando (directo o dentro de un paso)?
    fixHasCmd(f) {
      if (!f || !f.fix) return false;
      if (f.command) return true;
      try { return this.parseFixStepsRich(f.fix).some(function (s) { return !!s.cmd; }); }
      catch (e) { return false; }
    },
    parseFixStepsRich(fix) {
      var self = this;
      return this.parseFixSteps(fix).map(function(step) {
        var c = self.stepCmd(step);
        return c ? { label: c.label, cmd: c.cmd, text: null }
                 : { label: null, cmd: null, text: step };
      });
    },

    sevClass(sev) {
      return (sev || 'info').toLowerCase();
    },

    sevLabel(sev) {
      var MAP = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
      return MAP[(sev || '').toLowerCase()] || (sev || '').toUpperCase();
    },

    catLabel(cat) {
      var MAP = {
        vulnerability: 'Vulnerab.', cpu: 'CPU', memory: 'RAM',
        system: 'Sistema', network: 'Red', disk: 'Disco',
        'system-logs': 'Logs', other: 'Otros'
      };
      return MAP[(cat || '').toLowerCase()] || cat || '?';
    },

    evTypeLabel(type) {
      var MAP = {
        'ssh-accepted': 'SSH OK', 'ssh-failed': 'SSH fallido',
        'sudo': 'sudo', 'sudo-failed': 'sudo fallido',
        'session': 'Sesión',
        'logon-remote': 'Login remoto', 'logon-failed': 'Login fallido',
        'logon-privileged': 'Admin'
      };
      return MAP[type] || type || '?';
    },

    evBadgeClass(type) {
      var FAILED = ['ssh-failed', 'sudo-failed', 'logon-failed'];
      if (FAILED.indexOf(type) === -1) return 'ev-ok'; // verde: logins/sudo correctos y sesiones
      // Ráfaga: nº total de fallos en la ventana >= 10 (mismo umbral que el
      // finding de fuerza bruta de severity-map) → rojo; aislados → amarillo
      var evs = (this.secEvents && this.secEvents.events) || [];
      var fails = evs.filter(function(e) { return FAILED.indexOf(e.type) !== -1; }).length;
      return fails >= 10 ? 'ev-burst' : 'ev-fail';
    },

    fmtEvidence(ev) {
      if (typeof ev === 'object' && ev !== null) {
        try { return JSON.stringify(ev, null, 2); } catch(e) { return String(ev); }
      }
      return String(ev || '');
    },

    fmtUptime(sec) {
      if (!sec) return '—';
      var d = Math.floor(sec / 86400);
      var h = Math.floor((sec % 86400) / 3600);
      var m = Math.floor((sec % 3600) / 60);
      var r = '';
      if (d > 0) r += d + 'd ';
      if (h > 0) r += h + 'h ';
      r += m + 'm';
      return r.trim();
    },

    fmtDuration(ms) {
      if (!ms) return '—';
      var s = Math.floor(ms / 1000);
      var m = Math.floor(s / 60);
      return m > 0 ? m + ' min ' + (s % 60) + ' s' : s + ' s';
    },

    cpuBarColor(ratio) {
      if (ratio >= 0.80) return '#DC2626';
      if (ratio >= 0.50) return '#D97706';
      return '#65A30D';
    },

    ramBarStyle(pct) {
      if (pct >= 95) return 'linear-gradient(90deg,#65A30D,#D97706 70%,#EA580C)';
      if (pct >= 85) return '#D97706';
      return '#65A30D';
    },

    async copyCommand(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      } catch(e) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      }
    },

    // ── Chat con LLM ──────────────────────────────────────────
    // Abre/cierra el panel de chat y, la primera vez, lanza una
    // pregunta automática para que la IA explique el hallazgo.
    toggleChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (willOpen && !(this.chatMessages[findingKey] && this.chatMessages[findingKey].length)) {
        this.sendChat(findingKey, finding,
          'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
      }
    },

    async sendChat(findingKey, finding, presetQuestion) {
      var question = presetQuestion != null
        ? presetQuestion
        : (this.chatInput[findingKey] || '').trim();
      if (!question || this.chatLoading[findingKey]) return;

      // Historial previo (sin la pregunta actual; el backend la añade aparte)
      var history = (this.chatMessages[findingKey] || []).slice().map(function(m) {
        return { role: m.role, content: m.content };
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            finding: finding, question: question, history: history,
            auditType: this.auditData && this.auditData.auditType,
            platform: this.auditData && this.auditData.host && this.auditData.host.platform
          })
        });
        var data = await res.json();
        reply = (data && data.ok)
          ? { role: 'assistant', content: data.content }
          : { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    // Divide la respuesta en segmentos de texto y bloques de código (```).
    parseChatContent(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    // Markdown mínimo y seguro: escapa HTML, `código`, **negrita** y saltos de línea.
    mdInline(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    // Detecta si hay un nodo llm-config desplegado para mostrar (o no) el chat.
    var self = this;
    fetch('/locoaudit/chat/status')
      .then(function(r) { return r.json(); })
      .then(function(d) { self.llmAvailable = !!(d && d.available); })
      .catch(function() { self.llmAvailable = false; });
  }
};
</script>
