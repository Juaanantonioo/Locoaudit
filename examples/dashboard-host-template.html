      <!-- ══ SPRITE DE ICONOS ══ -->

        <symbol id="lca-i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"></path></symbol>

        <symbol id="lca-i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></symbol>
        <symbol id="lca-i-package" viewBox="0 0 24 24"><path d="M21 8.5v7a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4a2 2 0 0 1-1-1.7v-7a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4a2 2 0 0 1 1 1.7z"></path><path d="m3.3 7.5 8.7 5 8.7-5M12 22v-9.5"></path></symbol>

        <symbol id="lca-i-gauge" viewBox="0 0 24 24"><path d="M3 18a9 9 0 1 1 18 0"></path><path d="m12 14 4-4"></path></symbol>
        <symbol id="lca-i-puzzle" viewBox="0 0 24 24"><path d="M9 3h6v3a2 2 0 0 0 4 0V3h2v6h-3a2 2 0 0 0 0 4h3v6h-6v-3a2 2 0 0 0-4 0v3H5v-6h3a2 2 0 0 0 0-4H5V3h4z"></path></symbol>
        <symbol id="lca-i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4.5L3 9"></path><path d="M4 13a8 8 0 0 0 14 4.5L21 15"></path><path d="M3 4v5h5M21 20v-5h-5"></path></symbol>
        <symbol id="lca-i-scale" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-2.5 6h5zM19 7l-2.5 6h5z"></path></symbol>
        <symbol id="lca-i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 .5l2.5-2.5a4 4 0 0 0-5.7-5.7L11.5 6.7"></path><path d="M14 11a4 4 0 0 0-6-.5L5.5 13a4 4 0 0 0 5.7 5.7l1.3-1.3"></path></symbol>
        <symbol id="lca-i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"></path></symbol>
        <symbol id="lca-i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></symbol>
        <symbol id="lca-i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9 9a2.8 2.8 0 0 1-5-5z"></path><path d="m14.7 6.3 3-3 3 3-3 3"></path></symbol>

      <!-- ══ HEADER ══ -->
      <!-- La barra superior ya no es un gradiente fijo: toma el color del nivel de
           riesgo real. `riskClass` (computed, más abajo) es la misma que pinta el
           badge, así que no hay dos definiciones del riesgo. -->
      <div class="header-card" :class="riskClass">
        <div class="header-main">
          <div class="header-eyebrow">LoCoAudit · Auditoría de host</div>
          <div class="host-name">
            <svg class="icon"><use href="#lca-i-monitor"></use></svg>
            <span class="host-name-text">{{ auditData.host && auditData.host.hostname }}</span>
          </div>
          <div class="header-idline">
            <span class="risk-badge" :class="riskClass">
              <span class="risk-badge-dot"></span>
              {{ riskLabel }}
            </span>
            <!-- Texto corto: la MISMA cadena que ya resume la sección de hallazgos.
                 No es copy nuevo, es el recuento que el usuario va a volver a leer
                 abajo, adelantado a donde mira primero. -->
            <span class="risk-note">{{ act.total > 0 ? act.total + ' requieren tu atención' : 'Nada que arreglar' }}</span>
          </div>

          <!-- Rejilla clave/valor: etiqueta pequeña sobre valor. Los tres datos que
               antes vivían en .host-os (release, platform, arch) están aquí, sin
               cambiar de fuente ni de formato. -->
          <div class="meta-grid">
            <div class="meta-item">
              <span class="meta-key">Plataforma</span>
              <span class="meta-val">{{ auditData.host && auditData.host.platform }} · {{ auditData.host && auditData.host.arch }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Versión</span>
              <span class="meta-val meta-val-mono">{{ auditData.host && auditData.host.release }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Activo</span>
              <span class="meta-val">{{ uptimeHuman }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Análisis</span>
              <span class="meta-val">{{ scanTime }}</span>
            </div>
            <div class="meta-item" v-if="auditData.scanMeta && auditData.scanMeta.durationMs">
              <span class="meta-key">Duración</span>
              <span class="meta-val">{{ fmtDuration(auditData.scanMeta.durationMs) }}</span>
            </div>
            <div class="meta-item" v-if="modulesLabel">
              <span class="meta-key">Módulos</span>
              <span class="meta-val">{{ modulesLabel }}</span>
            </div>
            <div class="meta-item" v-if="lynisTests">
              <span class="meta-key">Controles</span>
              <span class="meta-val">{{ lynisTests }}</span>
            </div>
            <div class="meta-item meta-item-actions">
              <span class="meta-key">Exportar</span>
              <span class="dl-group">
                <button class="dl-btn" @click="downloadHtml" title="Descargar informe HTML (imprimible a PDF)">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> HTML
                </button>
                <button class="dl-btn" @click="downloadJson" title="Descargar datos JSON">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> JSON
                </button>
              </span>
            </div>
          </div>
        </div>

        <!-- Gauge circular Lynis, separado por una línea vertical fina (border-left) -->
        <div class="header-aside" v-if="lynisIdx !== null">
          <span class="gauge-label-top">Hardening Index</span>
          <svg class="gauge-svg" viewBox="0 0 110 110">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" :stop-color="lynisColor"></stop>
                <stop offset="100%" :stop-color="tok.high"></stop>
              </linearGradient>
            </defs>
            <!-- track -->
            <circle cx="55" cy="55" r="44" fill="none" :stroke="tok.surface"
                    stroke-width="10" stroke-dasharray="221 55"
                    stroke-dashoffset="-27.5" stroke-linecap="round"></circle>
            <!-- fill -->
            <circle cx="55" cy="55" r="44" fill="none" stroke="url(#gaugeGrad)"
                    stroke-width="10"
                    :stroke-dasharray="gaugeStroke + ' ' + (276 - gaugeStroke)"
                    stroke-dashoffset="-27.5" stroke-linecap="round"></circle>
            <text x="55" y="51" text-anchor="middle" class="gauge-score">{{ lynisIdx }}</text>
            <text x="55" y="63" text-anchor="middle" class="gauge-sub">de 100</text>
          </svg>
          <span class="gauge-verdict">
            Lynis · {{ lynisIdx >= 55 ? 'Aceptable' : lynisIdx >= 30 ? 'Mejorable' : 'Deficiente' }}
          </span>
          <span v-if="lynisMetaLine" class="gauge-meta">{{ lynisMetaLine }}</span>
        </div>
      </div>

      <!-- ══ SEVERIDADES ══ -->
      <!-- Cuentan ACCIONABLES (summary.actionable.counts), no el total: si
           siguieran contando todo, la cabecera diría "Nada que arreglar" con un
           9 en CRÍTICO justo debajo. Los informativos tienen su propia celda,
           neutra, para que no desaparezcan del recuento.
           Una sola tira con separadores finos, no cinco tarjetas sueltas: cinco
           bloques con borde y sombra propios se leían como cinco cosas distintas
           cuando son cinco cortes de la misma cifra. Solo los niveles con
           hallazgos llevan color; los que están a cero van en gris (.zero).
           VA AQUÍ, pegada a la cabecera y ANTES de los avisos: las cifras son lo
           primero que se busca, y empujarlas por debajo de tres tarjetas de
           matices las escondía. -->
      <div class="sev-block">
        <div class="sev-strip">
          <div class="sev-cell critical" role="button" tabindex="0"
               :aria-pressed="filterSev === 'critical' ? 'true' : 'false'"
               :class="{ 'active': filterSev === 'critical', 'zero': !act.counts.critical }"
               @click="toggleSevFilter('critical')" @keydown.enter.prevent="toggleSevFilter('critical')"
               @keydown.space.prevent="toggleSevFilter('critical')"
               title="Filtrar por severidad Crítico">
            <span class="sev-cell-label">Crítico</span>
            <span class="sev-cell-num">{{ act.counts.critical || 0 }}</span>
            <span class="sev-cell-sub">Acción inmediata</span>
          </div>
          <div class="sev-cell high" role="button" tabindex="0"
               :aria-pressed="filterSev === 'high' ? 'true' : 'false'"
               :class="{ 'active': filterSev === 'high', 'zero': !act.counts.high }"
               @click="toggleSevFilter('high')" @keydown.enter.prevent="toggleSevFilter('high')"
               @keydown.space.prevent="toggleSevFilter('high')"
               title="Filtrar por severidad Alto">
            <span class="sev-cell-label">Alto</span>
            <span class="sev-cell-num">{{ act.counts.high || 0 }}</span>
            <span class="sev-cell-sub">Resolver esta semana</span>
          </div>
          <div class="sev-cell medium" role="button" tabindex="0"
               :aria-pressed="filterSev === 'medium' ? 'true' : 'false'"
               :class="{ 'active': filterSev === 'medium', 'zero': !act.counts.medium }"
               @click="toggleSevFilter('medium')" @keydown.enter.prevent="toggleSevFilter('medium')"
               @keydown.space.prevent="toggleSevFilter('medium')"
               title="Filtrar por severidad Medio">
            <span class="sev-cell-label">Medio</span>
            <span class="sev-cell-num">{{ act.counts.medium || 0 }}</span>
            <span class="sev-cell-sub">Cuando puedas</span>
          </div>
          <div class="sev-cell low" role="button" tabindex="0"
               :aria-pressed="filterSev === 'low' ? 'true' : 'false'"
               :class="{ 'active': filterSev === 'low', 'zero': !act.counts.low }"
               @click="toggleSevFilter('low')" @keydown.enter.prevent="toggleSevFilter('low')"
               @keydown.space.prevent="toggleSevFilter('low')"
               title="Filtrar por severidad Bajo">
            <span class="sev-cell-label">Bajo</span>
            <span class="sev-cell-num">{{ act.counts.low || 0 }}</span>
            <span class="sev-cell-sub">Opcional</span>
          </div>
          <!-- Sin role="button": no filtra, no es interactiva. -->
          <div class="sev-cell informative" v-if="inf.total > 0"
               title="Hallazgos que no requieren ninguna acción por tu parte">
            <span class="sev-cell-label">Informativos</span>
            <span class="sev-cell-num">{{ inf.total }}</span>
            <span class="sev-cell-sub">Solo para tu información</span>
          </div>
        </div>
        <!-- Franja al pie de la tira, no una tarjeta aparte. Con los recuentos
             pegados a la cabecera, un "0 crítico" queda por encima de cualquier
             aviso de cobertura, y eso es el falso verde que la regla "fallo de
             herramienta ≠ dato negativo" existe para impedir: un cero solo
             tranquiliza si consta que alguien miró. La franja va PEGADA a los
             números, dentro de su misma caja, para que no se puedan leer sin ella. -->
        <div class="sev-gap" v-if="failedCheckFindings.length > 0">
          <svg class="icon icon-sm"><use href="#lca-i-alert"></use></svg>
          <span>
            <strong>{{ failedCheckFindings.length }}</strong>
            {{ failedCheckFindings.length === 1 ? 'comprobación no se ha completado' : 'comprobaciones no se han completado' }}:
            estos recuentos no cubren todo tu equipo.
          </span>
        </div>
      </div>

      <!-- ══ AVISOS ══ ═════════════════════════════════════════════════════════
           Un solo componente (.lca-notice) en tres niveles, en vez de las tres
           anatomías que había (nothing-card, checks-card, scope-notice) sin regla
           de orden ni de cuándo aparecía cada una.

             nivel 1 · VEREDICTO — ¿tengo algo que hacer?
             nivel 2 · COBERTURA — ¿se miró todo?
             nivel 3 · CONTEXTO  — ¿qué más conviene saber?

           El corte entre 2 y 3 es lo importante: el nivel 2 son huecos de ESTA
           ejecución, que se cierran reintentando, activando el módulo o instalando
           la herramienta; el nivel 3 es cómo es este equipo siempre. Trivy no lee
           los paquetes de macOS y no lo hará mañana tampoco: eso no es un agujero,
           es el alcance real, y pintarlo en ámbar sería el falso positivo que la
           regla del proyecto existe para evitar.
           El tono es independiente del nivel: un aviso de nivel 3 puede ser warn. -->

      <!-- ── Nivel 1 · VEREDICTO ──────────────────────────────────────────────
           SOLO cuando no hay nada accionable, para explicar por qué no lo hay.
           Con trabajo pendiente no se renderiza: la cabecera y la tira ya lo han
           dicho con una cifra, y repetirlo en prosa resta en vez de sumar.
           Dos estados excluyentes: 'clean' es verde; 'partial' es ámbar porque la
           conclusión está limitada por comprobaciones que fallaron, y un verde ahí
           sería una conclusión sobre partes que nadie llegó a mirar. -->
      <div class="lca-notice lvl-1 is-ok" v-if="nothingState === 'clean'">
        <svg class="icon lca-notice-icon"><use href="#lca-i-check-circle"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">No hay nada que tengas que arreglar en tu equipo</div>
          <div class="lca-notice-body" v-for="(frase, i) in nothingBuckets" :key="i" v-html="frase"></div>
          <!-- Que el usuario apague un módulo no es un agujero del que avisarle en
               amarillo: es una decisión suya. Se dice, porque la conclusión no cubre
               lo que no se miró, pero en tono sobrio y sin icono de alarma. -->
          <div class="lca-notice-foot" v-if="disabledNote">
            {{ disabledNote }}
            <span class="lca-notice-foot-list">{{ modulesNotRequested.map(function(m){ return m.label; }).join(' · ') }}</span>
          </div>
        </div>
      </div>

      <div class="lca-notice lvl-1 is-warn" v-if="nothingState === 'partial'">
        <svg class="icon lca-notice-icon"><use href="#lca-i-alert"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">No hay nada que arreglar <u>entre lo que sí se ha podido comprobar</u></div>
          <div class="lca-notice-body">
            <strong>{{ failedCheckFindings.length }}</strong>
            {{ failedCheckFindings.length === 1 ? 'comprobación se ha intentado y no ha podido completarse' : 'comprobaciones se han intentado y no han podido completarse' }},
            así que esta conclusión no cubre todo tu equipo.
          </div>
          <ul class="lca-notice-list">
            <li v-for="f in failedCheckFindings" :key="f.id">{{ f.title }}</li>
          </ul>
          <div class="lca-notice-body" v-for="(frase, i) in nothingBuckets" :key="'b' + i" v-html="frase"></div>
          <div class="lca-notice-body">
            <strong>Revisa el alcance del análisis</strong> aquí debajo: dice exactamente qué se ha
            mirado y qué no. Cero hallazgos en una comprobación que no se ejecutó no significa que
            esa parte esté limpia, significa que nadie la ha mirado.
          </div>
          <!-- Lista aparte de la de arriba, a propósito: apagado y caído no se
               mezclan ni cuando coinciden. -->
          <div class="lca-notice-foot" v-if="disabledNote">
            {{ disabledNote }}
            <span class="lca-notice-foot-list">{{ modulesNotRequested.map(function(m){ return m.label; }).join(' · ') }}</span>
          </div>
        </div>
      </div>

      <!-- ── Nivel 2 · COBERTURA ──────────────────────────────────────────────
           Qué NO se miró en esta ejecución. -->

      <!-- Un solo bloque para todas las comprobaciones no realizadas, igual que
           HOST-CVE-DECLARED agrupa las declaradas: cuatro tarjetas informativas
           sueltas se leían como cuatro cosas que arreglar.
           NO se parte por estado aunque sus ítems mezclen failed / not-applicable
           / disabled: lo agrega buildSkippedChecksSummary() en el backend y
           recomponerlo aquí crearía un segundo recuento que acabaría divergiendo.
           El matiz lo lleva cada línea con su propio estado. -->
      <div class="lca-notice lvl-2" v-if="checksSkipped"
           :class="checksSkipped.failed > 0 ? 'is-warn' : 'is-neutral'">
        <svg class="icon lca-notice-icon"><use :href="checksSkipped.failed > 0 ? '#lca-i-alert' : '#lca-i-info'"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ checksSkipped.title }}</div>
          <div class="lca-notice-body" v-for="(frase, i) in checksSkipped.evidence.split('\n\n')" :key="i">
            {{ frase }}
          </div>
          <!-- Una línea por módulo. El estado va delante porque es lo que decide si el
               usuario tiene algo que hacer con esa línea o no. -->
          <ul class="lca-notice-list is-stated">
            <li v-for="it in checksSkipped.items" :key="it.id" :class="'chk-' + it.estado">
              <span class="lca-notice-state">{{
                it.estado === 'failed' ? 'no se pudo'
                : it.estado === 'not-applicable' ? 'no aplica'
                : 'desactivada' }}</span>
              <span class="lca-notice-name">{{ it.title }}</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Un trozo del home que no se pudo leer es un AGUJERO en el informe,
           no un detalle. Mismo razonamiento que el objetivo inalcanzable del
           dashboard de red: no encontrar nada ≠ que no haya nada. -->
      <div class="lca-notice lvl-2 is-warn" v-if="skippedByError.length">
        <svg class="icon lca-notice-icon"><use href="#lca-i-alert"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">Una parte de tu carpeta personal no se ha podido analizar</div>
          <div class="lca-notice-body">
            Que no aparezca ningún hallazgo de
            <strong>{{ skippedByError.map(function(s){ return s.name; }).join(', ') }}</strong>
            no quiere decir que esté limpia: quiere decir que no se ha podido comprobar.
          </div>
        </div>
      </div>

      <!-- Paquetes del sistema. El MISMO computed alimenta el nivel 2 y el 3; lo
           que decide cuál es sysPkgNoticeLevel, que mira el estado y no el tono. -->
      <div class="lca-notice lvl-2" :class="'is-' + sysPkgNotice.tone"
           v-if="sysPkgNotice && sysPkgNoticeLevel === 2">
        <svg class="icon lca-notice-icon"><use :href="'#lca-i-' + sysPkgNotice.ico"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ sysPkgNotice.title }}</div>
          <div class="lca-notice-lead" v-if="sysPkgNotice.lead">{{ sysPkgNotice.lead }}</div>
          <div class="lca-notice-body">{{ sysPkgNotice.body }}</div>
          <!-- La frase que impide leer "no se ha comprobado" como "está limpio".
               Es contenido con énfasis, no una anatomía aparte. -->
          <div class="lca-notice-body is-strong" v-if="sysPkgNotice.warning">{{ sysPkgNotice.warning }}</div>
          <div class="lca-notice-hint" v-if="sysPkgNotice.hint">{{ sysPkgNotice.hint }}</div>
        </div>
      </div>

      <!-- ── Nivel 3 · CONTEXTO ───────────────────────────────────────────────
           Cómo es este equipo, siempre. No se cierra reintentando, así que no
           lleva ámbar ni pide nada. -->
      <div class="lca-notice lvl-3" :class="'is-' + sysPkgNotice.tone"
           v-if="sysPkgNotice && sysPkgNoticeLevel === 3">
        <svg class="icon lca-notice-icon"><use :href="'#lca-i-' + sysPkgNotice.ico"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ sysPkgNotice.title }}</div>
          <div class="lca-notice-lead" v-if="sysPkgNotice.lead">{{ sysPkgNotice.lead }}</div>
          <div class="lca-notice-body">{{ sysPkgNotice.body }}</div>
          <div class="lca-notice-body is-strong" v-if="sysPkgNotice.warning">{{ sysPkgNotice.warning }}</div>
          <div class="lca-notice-hint" v-if="sysPkgNotice.hint">{{ sysPkgNotice.hint }}</div>
        </div>
      </div>

      <!-- ══ ALCANCE DEL ESCANEO ══ -->
      <!-- Qué se ha mirado, antes de qué se ha encontrado. Sin esto el usuario ve
           "37 hallazgos" y concluye que su equipo está cubierto: es ausencia de
           datos presentada como resultado, el mismo patrón que el tick verde
           sobre un host que no responde. -->
      <div class="scope-card" v-if="trivyScan || sysPkgNotice || modules.length">
        <div class="scope-header">
          <svg class="icon"><use href="#lca-i-search"></use></svg>
          <span class="scope-title">Alcance del análisis</span>
          <button class="scope-toggle" v-if="trivyScan" @click="scopeOpen = !scopeOpen">
            {{ scopeOpen ? 'Ocultar detalle' : 'Ver detalle' }}
          </button>
        </div>

        <div class="scope-grid" v-if="trivyScan">
          <div class="scope-item">
            <span class="scope-key">Carpeta</span>
            <span class="scope-val"><code>{{ trivyScan.target }}</code></span>
          </div>
          <div class="scope-item" v-if="scannedChildren.length">
            <span class="scope-key">Subcarpetas analizadas</span>
            <span class="scope-val">{{ scannedChildren.length }}</span>
          </div>
          <div class="scope-item" v-if="skippedByChoice.length">
            <span class="scope-key">Excluidas</span>
            <span class="scope-val">{{ skippedByChoice.length }}</span>
          </div>
          <div class="scope-item scope-item-warn" v-if="skippedByError.length">
            <span class="scope-key">Sin analizar</span>
            <span class="scope-val">{{ skippedByError.length }}</span>
          </div>
          <div class="scope-item" v-if="trivyScan.durationMs">
            <!-- "Duración carpeta" y no "Duración" a secas: desde que el escaneo
                 de paquetes del sistema se suma, hay dos y tardan cosas distintas. -->
            <span class="scope-key">{{ sysPkgs && sysPkgs.durationMs ? 'Duración carpeta' : 'Duración' }}</span>
            <span class="scope-val">{{ fmtDuration(trivyScan.durationMs) }}</span>
          </div>
          <!-- Paquetes del sistema, con la CIFRA y su FUENTE. Antes decía solo
               "analizados" / "no analizados", que no permite distinguir un
               análisis que cubrió 2056 paquetes de uno que cubrió tres. La
               fuente va escrita porque justo al lado hay otra cuenta de
               paquetes, la de sw-inventory, que sale de dpkg/rpm y da otro
               número: son dos medidas distintas y no se intentan cuadrar. -->
          <div class="scope-item" v-if="sysPkgs" :class="sysPkgs.status === 'scanned' ? '' : 'scope-item-warn'">
            <span class="scope-key">Paquetes del sistema</span>
            <span class="scope-val">
              <template v-if="sysPkgs.status === 'scanned'">
                {{ sysPkgs.packages != null ? sysPkgs.packages + ' analizados' : 'analizados' }}
                <template v-if="sysPkgs.osFamily"> · {{ sysPkgs.osFamily }}{{ sysPkgs.osName ? ' ' + sysPkgs.osName : '' }}</template>
                <template v-if="sysPkgs.trivyVersion"> · Trivy {{ sysPkgs.trivyVersion }}</template>
              </template>
              <template v-else>no analizados</template>
            </span>
          </div>
          <!-- El inventario de sw-inventory, con SU fuente. Misma pregunta,
               otra herramienta, otro número. -->
          <div class="scope-item" v-if="swPkgs && swPkgs.packages != null">
            <span class="scope-key">Inventario de software</span>
            <span class="scope-val">{{ swPkgs.packages }} paquetes<template v-if="swPkgs.source"> · según {{ swPkgs.source }}</template></span>
          </div>
          <div class="scope-item" v-if="sysPkgs && sysPkgs.durationMs">
            <span class="scope-key">Duración sistema</span>
            <span class="scope-val">{{ fmtDuration(sysPkgs.durationMs) }}</span>
          </div>
          <div class="scope-item" v-if="trivyScan.trivyVersion">
            <span class="scope-key">Trivy</span>
            <span class="scope-val meta-val-mono">{{ trivyScan.trivyVersion }}</span>
          </div>
        </div>

        <!-- Qué se pidió y qué se ejecutó, los siete módulos. Trazabilidad del
             informe exportado: sin esto, quien lo lee dentro de seis meses no
             puede saber si una ausencia fue una decisión o un fallo. -->
        <div class="scope-modules" v-if="modules.length">
          <div class="scope-detail-title">Módulos del análisis</div>
          <div class="scope-modules-grid">
            <span class="scope-module" v-for="m in modules" :key="m.id" :class="'mod-' + m.status">
              <svg class="icon icon-sm scope-module-ico"><use :href="m.status === 'ok' ? '#lca-i-check' : m.status === 'failed' ? '#lca-i-alert' : '#lca-i-minus'"></use></svg>
              {{ m.label }}
              <span class="scope-module-state">{{ m.status === 'ok' ? 'analizado' : m.status === 'failed' ? 'no se pudo' : 'no solicitado' }}</span>
            </span>
          </div>
        </div>

        <!-- Detalle: las dos naturalezas de "omitida" separadas a propósito.
             Una es una decisión; la otra es un hueco en el informe. -->
        <div class="scope-detail" v-show="scopeOpen && trivyScan">
          <div class="scope-detail-block" v-if="skippedByChoice.length">
            <div class="scope-detail-title">Excluidas a propósito ({{ skippedByChoice.length }})</div>
            <div class="scope-detail-item" v-for="(s, i) in skippedByChoice" :key="'c-' + i">
              <code>{{ s.name }}</code> — {{ s.reason }}
            </div>
            <div class="scope-detail-note">
              Solo contienen ficheros temporales o descargados. No hay nada que actualizar en ellas.
            </div>
          </div>
          <div class="scope-detail-block" v-if="skippedByError.length">
            <div class="scope-detail-title warn">No se han podido analizar ({{ skippedByError.length }})</div>
            <div class="scope-detail-item" v-for="(s, i) in skippedByError" :key="'e-' + i">
              <code>{{ s.name }}</code> — {{ shortReason(s.reason) }}
              <span v-if="s.durationMs"> (tras {{ fmtDuration(s.durationMs) }})</span>
            </div>
            <div class="scope-detail-note warn">
              Su contenido NO está incluido en este informe.
            </div>
          </div>
          <div class="scope-detail-block" v-if="scannedChildren.length">
            <div class="scope-detail-title">Analizadas ({{ scannedChildren.length }})</div>
            <div class="scope-detail-item scope-detail-flow">
              <code v-for="(s, i) in scannedChildren" :key="'s-' + i">{{ s.name }}</code>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ CHARTS ══ -->
      <div class="charts-row" v-if="totalFindings > 0">

        <!-- Donut SVG puro -->
        <div class="chart-card">
          <div class="chart-title">Distribución por Severidad</div>
          <div class="donut-wrap">
            <svg class="donut-svg" viewBox="0 0 140 140">
              <!-- track -->
              <circle cx="70" cy="70" r="54" fill="none" :stroke="tok.surface" stroke-width="18"></circle>
              <!-- segmentos calculados -->
              <circle v-for="seg in donutSegments" :key="seg.key"
                      cx="70" cy="70" r="54" fill="none"
                      :stroke="seg.color" stroke-width="18"
                      :stroke-dasharray="seg.dasharray"
                      :stroke-dashoffset="seg.dashoffset"></circle>
              <!-- El anillo sigue mostrando la mezcla de severidades de TODOS los
                   hallazgos; el número del centro cuenta solo los accionables.
                   Un "96" grande describía trabajo pendiente que no existe. -->
              <text x="70" y="65" text-anchor="middle" class="donut-total">{{ act.total }}</text>
              <text x="70" y="79" text-anchor="middle" class="donut-sub">de {{ totalFindings }} · a revisar</text>
            </svg>
            <div class="donut-legend">
              <div class="legend-item" v-for="seg in donutSegments" :key="'leg-'+seg.key">
                <span class="legend-dot" :style="{background: seg.color}"></span>
                <span class="legend-name">{{ sevLabel(seg.key) }}</span>
                <span class="legend-val">{{ seg.count }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Barras horizontales por categoría -->
        <div class="chart-card">
          <div class="chart-title">Hallazgos por Categoría</div>
          <div class="hbar-list">
            <div class="hbar-item" v-for="bar in catBars" :key="bar.key">
              <span class="hbar-label">{{ bar.label }}</span>
              <div class="hbar-track">
                <div class="hbar-fill" :style="{width: bar.pct + '%', background: bar.color}"></div>
              </div>
              <span class="hbar-count" :style="{color: bar.textColor}">{{ bar.count }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ MÉTRICAS ══ -->
      <!-- Las tres con la MISMA anatomía: título · cifra grande · barra · dos datos
           al pie. Antes cada una se estructuraba a su manera (RAM con su fila de
           GiB, CPU con tres píldoras de load, disco con su cabecera por partición)
           y comparar de un vistazo era imposible.
           Las tres píldoras de load 1m/5m/15m SIGUEN estando: son tres datos, y un
           pie de dos celdas que se comiera dos de ellos sería perder información,
           no simplificar. Van como bloque propio dentro del pie de CPU. -->
      <div class="metrics-row">

        <!-- RAM -->
        <div class="metric-card" v-if="ramData">
          <div class="metric-header">
            <span class="metric-title">Memoria RAM</span>
            <svg class="icon"><use :href="ramData.platform === 'darwin' ? '#lca-i-apple' : '#lca-i-memory'"></use></svg>
          </div>
          <div class="ram-macos-note" v-if="ramData.platform === 'darwin'">
            <svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg>
            Gestión unificada macOS — memoria compartida
          </div>
          <div class="metric-bar-section">
            <div class="metric-figure">
              {{ ramData.usedGiB }}<span class="metric-figure-unit">GiB</span>
            </div>
            <div class="progress-bar" v-if="ramData.pct !== null">
              <div class="progress-fill" :style="{width: ramData.pct + '%', background: ramBarStyle(ramData.pct)}"></div>
            </div>
            <div class="metric-foot">
              <div class="metric-foot-item" v-if="ramData.pct !== null">
                <span class="metric-foot-key">En uso</span>
                <span class="metric-foot-val">{{ ramData.pct }}%</span>
              </div>
              <div class="metric-foot-item">
                <span class="metric-foot-key">Total</span>
                <span class="metric-foot-val">{{ ramData.totalGiB }} GiB</span>
              </div>
            </div>
          </div>
        </div>

        <!-- CPU -->
        <div class="metric-card" v-if="cpuData">
          <div class="metric-header">
            <span class="metric-title">Carga de CPU</span>
            <svg class="icon"><use href="#lca-i-cpu"></use></svg>
          </div>
          <div class="metric-bar-section">
            <div class="metric-figure" v-if="cpuData.loadAvg">
              ~{{ Math.min(100, Math.round(cpuData.loadAvg[0] / cpuData.cores * 100)) }}<span class="metric-figure-unit">%</span>
            </div>
            <div class="metric-figure metric-figure-na" v-else>—</div>
            <div class="progress-bar" v-if="cpuData.loadAvg">
              <div class="progress-fill" :style="{
                width: Math.min(100, cpuData.loadAvg[0] / cpuData.cores * 100).toFixed(0) + '%',
                background: cpuBarColor(cpuData.loadAvg[0] / cpuData.cores)
              }"></div>
            </div>
            <div class="metric-foot">
              <div class="metric-foot-item">
                <span class="metric-foot-key">Estimación</span>
                <span class="metric-foot-val" v-if="cpuData.loadAvg">load avg 1m vs. {{ cpuData.cores }} núcleos</span>
                <span class="metric-foot-val" v-else>Load avg no disponible</span>
              </div>
              <div class="metric-foot-item">
                <span class="metric-foot-key">Procesador</span>
                <span class="metric-foot-val">{{ cpuData.cores }} núcleos · {{ cpuData.model }}</span>
              </div>
            </div>
            <div class="cpu-loads" v-if="cpuData.loadAvg">
              <div class="load-pill">
                <span class="load-val">{{ cpuData.loadAvg[0] != null ? cpuData.loadAvg[0].toFixed(2) : '—' }}</span>
                <span class="load-period">1 min</span>
              </div>
              <div class="load-pill">
                <span class="load-val">{{ cpuData.loadAvg[1] != null ? cpuData.loadAvg[1].toFixed(2) : '—' }}</span>
                <span class="load-period">5 min</span>
              </div>
              <div class="load-pill">
                <span class="load-val">{{ cpuData.loadAvg[2] != null ? cpuData.loadAvg[2].toFixed(2) : '—' }}</span>
                <span class="load-period">15 min</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Disco: la misma anatomía, repetida por partición. -->
        <div class="metric-card" v-if="diskData && diskData.length > 0">
          <div class="metric-header">
            <span class="metric-title">Almacenamiento</span>
            <svg class="icon"><use href="#lca-i-disk"></use></svg>
          </div>
          <div class="disk-parts-container">
            <div class="disk-part" v-for="(p, i) in diskData" :key="i">
              <div class="disk-part-header">
                <span class="disk-mount">{{ p.mount }}</span>
              </div>
              <div class="metric-figure">
                {{ p.usedPercent }}<span class="metric-figure-unit">%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" :style="{width: p.usedPercent + '%', background: p.sevColor}"></div>
              </div>
              <div class="metric-foot">
                <div class="metric-foot-item">
                  <span class="metric-foot-key">Usados</span>
                  <span class="metric-foot-val">{{ p.usedGB }} GB</span>
                </div>
                <div class="metric-foot-item">
                  <span class="metric-foot-key">Libres</span>
                  <span class="metric-foot-val">{{ p.freeGB }} GB</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ FINDINGS ══ -->
      <div class="findings-section">
        <div class="section-header">
          <span class="section-title">Hallazgos de Seguridad</span>
          <!-- "96 hallazgos" mezclaba lo accionable con lo informativo y hacía
               que un lockfile de un plugin que el usuario no usa se leyera como
               trabajo pendiente. Las cifras vienen de summary.actionable /
               summary.informative: el backend es el único que decide qué cuenta. -->
          <span class="section-pills">
            <span class="pill pill-action" v-if="act.total > 0">{{ act.total }} requieren tu atención</span>
            <span class="pill pill-calm" v-else>Nada que arreglar</span>
            <span class="pill" v-if="inf.total > 0">{{ inf.total }} informativos</span>
            <span class="pill">{{ activeGroups }} categorías</span>
          </span>
        </div>

        <template v-for="g in groups" :key="g.key">
          <div class="findings-group" v-if="g.items.length > 0">
            <div class="group-header" @click="toggleGroup(g.key)">
              <svg class="icon group-icon"><use :href="'#lca-i-' + g.icon"></use></svg>
              <span class="group-name">{{ g.label }}</span>
              <!-- Severidad máxima del grupo: g.items viene ordenado por severidad
                   descendente (ver groups()), así que [0] ES el máximo. Sin computed
                   nuevo y sin un segundo criterio que pueda divergir del orden. -->
              <span class="sev-badge group-sev" :class="sevClass(g.items[0].severity)">{{ sevLabel(g.items[0].severity) }}</span>
              <span class="group-count">{{ g.items.length }}</span>
              <svg class="icon group-chevron" :class="{open: openGroups[g.key]}"><use href="#lca-i-chevron"></use></svg>
            </div>
            <div class="group-findings" v-show="openGroups[g.key]">
              <div v-for="(f, fi) in g.items" :key="g.key + '-' + fi">
                <div class="finding-row" @click="toggleFinding(g.key + '-' + fi)">
                  <!-- 'declared': el CVSS describe la vulnerabilidad si la
                       ejecutaras, no el estado de este equipo. Pintarlo ALTO en
                       la fila lo hacía indistinguible de un hallazgo real. El
                       número sigue disponible, dentro del desplegable, junto a
                       los datos que lo justifican. -->
                  <span v-if="isDeclared(f)" class="origin-badge declared"
                        title="Versión anotada en un fichero de dependencias. No hay software instalado con esa versión en tu equipo.">Declarado</span>
                  <template v-else>
                    <span class="sev-badge" :class="sevClass(f.severity)">{{ sevLabel(f.severity) }}</span>
                    <!-- Sin píldora "Instalado": es el caso POR DEFECTO y etiquetarlo era ruido.
                         En un informe donde casi todo está instalado, la marca aparecía en casi
                         todas las tarjetas y dejaba de informar. "Declarado" se queda porque
                         marca la excepción, y va con la nota que evita la confusión. -->
                  </template>
                  <!-- La etiqueta del grupo de control (AUTH → "Autenticación y
                       contraseñas") gana a la de categoría cuando existe: dentro
                       de "Sistema & Actualizaciones" es lo único que distingue
                       treinta tarjetas de Lynis entre sí. -->
                  <span class="cat-badge">{{ f.subcategory || catLabel(f.category) }}</span>
                  <span class="finding-title">{{ f.title }}</span>
                  <span v-if="isDeclared(f)" class="finding-note">anotado en un lockfile · nada que actualizar</span>
                  <!-- La clase lleva "chevron" a propósito: el toggle vanilla del
                       export hace h.querySelector('[class*=chevron]') sobre la FILA
                       además de sobre la cabecera del grupo, así que con este nombre
                       el informe descargado también gira la flecha al desplegar. Con
                       el ▲/▼ de texto anterior no podía. -->
                  <svg class="icon icon-sm finding-chevron" :class="{open: openFindings[g.key + '-' + fi]}"><use href="#lca-i-chevron"></use></svg>
                </div>
                <div class="finding-detail" :class="{open: openFindings[g.key + '-' + fi]}">
                  <div class="detail-stack" v-if="f.evidence || f.fix">
                    <!-- La evidencia no depende del fix: un hallazgo informativo sin pasos que dar
                         sigue teniendo algo que contar, y colgarla del mismo v-if la escondía. -->
                    <div class="detail-col" v-if="f.evidence">
                      <div class="detail-col-title">Evidencia</div>
                      <pre class="detail-evidence">{{ fmtEvidence(f.evidence) }}</pre>

                      <!-- Tira de metadatos: datos estructurados de Trivy (findings CVE) -->
                      <div v-if="hasMeta(f)" class="meta-strip">
                        <div v-if="f.pkg" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-package"></use></svg> Paquete</span>
                          <span class="meta-value">{{ f.pkg }}</span>
                        </div>
                        <div v-if="f.installedVersion" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-tag"></use></svg> Instalada</span>
                          <span class="meta-value meta-mono">{{ f.installedVersion }}</span>
                        </div>
                        <div v-if="f.fixedVersion" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-check"></use></svg> Corregida</span>
                          <span class="meta-value meta-mono meta-fixed">{{ f.fixedVersion }}</span>
                        </div>
                        <div v-else-if="f.pkg" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-check"></use></svg> Corregida</span>
                          <span class="meta-value meta-nofix">sin parche</span>
                        </div>
                        <div v-if="f.cvss != null" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-gauge"></use></svg> CVSS</span>
                          <span class="meta-value">
                            {{ f.cvss }}
                            <span class="cvss-chip" :class="sevClass(f.severity)">{{ sevLabel(f.severity) }}</span>
                          </span>
                        </div>
                        <div v-if="f.cveCount > 1" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-puzzle"></use></svg> CVEs</span>
                          <span class="meta-value">{{ f.cveCount }}</span>
                        </div>
                        <!-- Metadatos de control (Lynis). El código va aquí, de
                             dato secundario: el título de la tarjeta es la
                             descripción legible, no el identificador. -->
                        <div v-if="f.control" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-tag"></use></svg> Control Lynis</span>
                          <span class="meta-value meta-mono">{{ f.control }}</span>
                        </div>
                        <div v-if="f.lynisType" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-alert"></use></svg> Tipo</span>
                          <span class="meta-value">{{ lynisTypeLabel(f) }}</span>
                        </div>
                        <div v-if="f.detail" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-search"></use></svg> Detalle</span>
                          <span class="meta-value meta-mono">{{ f.detail }}</span>
                        </div>
                        <div v-if="f.actionType === 'reboot'" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-refresh"></use></svg> Requiere</span>
                          <span class="meta-value">Reiniciar el equipo</span>
                        </div>
                        <!-- Lynis NO puntúa sus controles: el nivel lo pone
                             LoCoAudit. Decirlo en la tarjeta es la única forma
                             de que el usuario sepa de quién es el juicio. -->
                        <div v-if="f.severitySource === 'locoaudit'" class="meta-cell"
                             title="Lynis no asigna severidad a sus controles. Este nivel lo establece LoCoAudit según el tipo de control (AUTH, FIRE, NETW…) y según si es un aviso o una sugerencia.">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-scale"></use></svg> Severidad</span>
                          <span class="meta-value">
                            {{ sevLabel(f.severity) }}
                            <span class="meta-muted">· criterio de LoCoAudit</span>
                          </span>
                        </div>
                        <div class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-search"></use></svg> Fuente</span>
                          <span class="meta-value">{{ originLabel(f.source) }}</span>
                        </div>
                        <div class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-link"></use></svg> Advisory</span>
                          <a v-if="f.primaryUrl" class="meta-value meta-link" :href="f.primaryUrl" target="_blank" rel="noopener">{{ f.advisoryLabel || 'Ver' }} <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                          <span v-else class="meta-value meta-muted" title="Trivy no aporta una URL pública fiable para este hallazgo">no disponible</span>
                        </div>
                      </div>
                    </div>
                    <div class="detail-col" v-if="f.fix">
                      <div class="detail-col-title">Resolución</div>
                      <!-- Una rama por alternativa ("si no lo necesitas" / "si lo necesitas"):
                           son caminos EXCLUYENTES, y encadenarlos en una sola lista los hacía
                           pasar por pasos consecutivos. Dentro de cada rama sí hay orden, y por
                           eso es un <ol>: el número lo pone el navegador, no un <span>. -->
                      <template v-if="!f.isCommand">
                        <!-- Un solo parseo por ficha: el v-for sobre un array de un
                             elemento evita repetir la llamada en cada bloque. -->
                        <div class="fix-plan" v-for="(fx, xi) in [parseFixSteps(f.fix)]" :key="xi">
                          <!-- Lo anterior a la primera rama describe el servicio: va sin
                               numerar, porque no es un paso que nadie tenga que dar. -->
                          <p v-for="(ln, ii) in fx.intro" :key="'i' + ii" class="fix-intro">{{ ln }}</p>
                          <p v-for="(nt, ni) in fx.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                          <div class="fix-branch" v-for="(br, bi) in fx.branches" :key="bi">
                            <div v-if="br.heading" class="fix-branch-title">{{ br.heading }}</div>
                            <ol class="fix-steps" v-if="br.steps.length"
                                :class="{ 'fix-steps-single': br.steps.length === 1 && !br.heading }">
                              <li class="fix-step" v-for="(st, si) in br.steps" :key="si">
                                <span v-if="st.label" class="fix-step-label">{{ st.label }}</span>
                                <!-- El comando va DENTRO del paso que lo usa, no como paso aparte. -->
                                <span v-if="st.cmd" class="command-box command-inline">
                                  <code class="command-text">{{ st.cmd }}</code>
                                  <button @click.stop="copyCommand(st.cmd)"
                                          :class="{ copied: copiedKey === st.cmd }"
                                          class="command-btn">
                                    <svg class="icon icon-sm" v-if="copiedKey === st.cmd"><use href="#lca-i-check"></use></svg>{{ copiedKey === st.cmd ? ' Copiado' : 'Copiar' }}
                                  </button>
                                </span>
                              </li>
                            </ol>
                            <p v-for="(nt, ni) in br.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                          </div>
                        </div>
                      </template>
                      <p v-if="f.isCommand" class="cmd-intro">
                        Comando sugerido<span class="cmd-origin">{{ originLabel(f.source) }}</span>:
                      </p>
                      <div v-if="f.isCommand" class="command-box">
                        <code class="command-text">{{ f.command || f.fix }}</code>
                        <button @click.stop="copyCommand(f.command || f.fix)"
                                :class="{ copied: copiedKey === (f.command || f.fix) }"
                                class="command-btn">
                          <svg class="icon icon-sm" v-if="copiedKey === (f.command || f.fix)"><use href="#lca-i-check"></use></svg>{{ copiedKey === (f.command || f.fix) ? ' Copiado' : 'Copiar' }}
                        </button>
                      </div>
                      <p v-if="fixNote(f)" class="cmd-note">{{ fixNote(f) }}</p>
                      <!-- UNA nota por ficha, neutra. Antes eran dos cajas ámbar —"no lo
                           ejecuto" y "pide sudo"— que pintaban de aviso lo que solo es cómo
                           funciona la herramienta. El ámbar queda para la severidad Media. -->
                      <div v-if="fixHasCmd(f)" class="cmd-note cmd-note-safety">
                        <svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg>
                        <span>LoCoAudit no ejecuta estos comandos: cópialos y revísalos antes de ejecutarlos.<template v-if="fixNeedsSudo(f)"> Requieren privilegios de administrador.</template></span>
                      </div>
                    </div>
                  </div>
                  <!-- Sin pasos de resolución. TRES textos, no uno: "no requiere acción
                       inmediata" es FALSO para un GRUB sin contraseña —sí la requiere, lo que
                       falta es el paso—, y afirmarlo convierte una carencia de dato nuestra en
                       una conclusión sobre la severidad del hallazgo. -->
                  <div v-if="!f.fix" class="nofix-note">
                    <template v-if="f.noAction">
                      Este hallazgo es informativo. No requiere acción inmediata.
                    </template>
                    <template v-else-if="f.primaryUrl">
                      LoCoAudit no tiene un paso concreto para este control.
                      <a :href="f.primaryUrl" target="_blank" rel="noopener">Consulta su ficha oficial <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                    </template>
                    <template v-else>
                      <!-- Sin ficha a la que remitir tampoco hay control de Lynis detrás: son
                           los informativos nativos (CPU, memoria, disco, inventario, resúmenes),
                           y para ellos "no requiere acción" SÍ es cierto. -->
                      Este hallazgo es informativo. No requiere acción inmediata.
                    </template>
                  </div>

                  <!-- ── Chat con IA ── -->
                  <div class="lca-chat-wrap" v-if="llmAvailable === true">
                    <button class="ai-ask-btn" @click.stop="toggleChat(chatKey(f, g.key, fi), f)">
                      <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                      {{ chatOpen[chatKey(f, g.key, fi)] ? 'Cerrar asistente' : 'Preguntar a la IA' }}
                    </button>
                    <div class="lca-chat" v-if="chatOpen[chatKey(f, g.key, fi)]">
                      <!-- Cabecera con el modelo: /locoaudit/chat/status YA devuelve
                           `model` (llm-config.js) y hasta ahora se tiraba. Quien lee la
                           respuesta necesita saber quién la ha escrito. -->
                      <div class="lca-chat-head">
                        <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                        <span class="lca-chat-head-title">Asistente</span>
                        <span class="lca-chat-model" v-if="llmModel">{{ llmModel }}</span>
                      </div>
                      <div class="lca-chat-msgs">
                        <div v-for="(cm, ci) in (chatMessages[chatKey(f, g.key, fi)] || [])" :key="ci"
                             class="chat-msg" :class="cm.role === 'user' ? 'chat-user' : 'chat-ai'">
                          <div class="chat-bubble" :class="{ 'chat-error': cm.error }">
                            <template v-for="(seg, si) in parseChatContent(cm.content)" :key="si">
                              <div v-if="seg.type === 'text'" class="chat-text" v-html="seg.html"></div>
                              <div v-else class="command-box">
                                <code class="command-text">{{ seg.code }}</code>
                                <button @click.stop="copyCommand(seg.code)"
                                        :class="{ copied: copiedKey === seg.code }"
                                        class="command-btn">
                                  <svg class="icon icon-sm" v-if="copiedKey === seg.code"><use href="#lca-i-check"></use></svg>{{ copiedKey === seg.code ? ' Copiado' : 'Copiar' }}
                                </button>
                              </div>
                            </template>
                          </div>
                        </div>
                        <div v-if="chatLoading[chatKey(f, g.key, fi)]" class="chat-msg chat-ai">
                          <div class="chat-bubble chat-loading">
                            <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
                          </div>
                        </div>
                      </div>
                      <div class="lca-chat-input">
                        <input type="text" v-model="chatInput[chatKey(f, g.key, fi)]"
                               placeholder="Escribe tu pregunta…"
                               :disabled="chatLoading[chatKey(f, g.key, fi)]"
                               @keydown.enter.prevent="sendChat(chatKey(f, g.key, fi), f)">
                        <button class="chat-send-btn"
                                :disabled="chatLoading[chatKey(f, g.key, fi)]"
                                @click.stop="sendChat(chatKey(f, g.key, fi), f)">Enviar</button>
                      </div>
                      <!-- El aviso va al pie y no en un modal: se lee después de la
                           respuesta, que es cuando el usuario decide si actuar. -->
                      <div class="lca-chat-foot">
                        Un modelo de lenguaje puede equivocarse. Contrasta lo que te diga
                        con la evidencia del hallazgo antes de ejecutar nada.
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ── Subsección: eventos (solo grupo "Logs del sistema") ──────────── -->
              <!-- Dos tablas distintas: intentos de acceso (eventos que ocurrieron)
                   vs sesiones activas ahora mismo (estado presente). -->
              <div v-if="g.key === 'system-logs' && secEvents" class="seclog">

                <!-- (a) Intentos de acceso — SSH OK/fallido, sudo, su, logins -->
                <div class="seclog-title">Intentos de acceso (últimas {{ secEvents.windowHours }} h)</div>
                <div v-if="accessEvents.length === 0" class="seclog-empty">
                  Sin intentos en la ventana analizada ({{ secEvents.windowHours }} h).
                </div>
                <div v-else>
                  <div class="seclog-table-wrap">
                    <table class="seclog-table">
                      <thead>
                        <tr><th>Hora</th><th>Tipo</th><th>Usuario</th><th>Origen</th><th>Detalle</th></tr>
                      </thead>
                      <tbody>
                        <tr v-for="(ev, ei) in accessEvents" :key="'acc-' + ei">
                          <td class="seclog-mono">{{ ev.ts || '—' }}</td>
                          <td><span class="seclog-badge" :class="evBadgeClass(ev.type)">{{ evTypeLabel(ev.type) }}</span></td>
                          <td>{{ ev.user || '—' }}</td>
                          <td class="seclog-mono">{{ ev.origin || '—' }}</td>
                          <td class="seclog-detail">{{ ev.detail || '—' }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div v-if="secEvents.truncated" class="seclog-truncated">
                    Mostrando los {{ secEvents.events.length }} eventos más recientes.
                  </div>
                </div>

                <!-- (b) Sesiones activas ahora — estado presente (`who`). La hora
                     es la de INICIO de sesión, no la de un evento. -->
                <div class="seclog-title seclog-title-sessions">Sesiones activas ahora</div>
                <div v-if="sessionEvents.length === 0" class="seclog-empty">
                  <template v-if="sessionsChecked">Sin sesiones remotas activas.</template>
                  <template v-else>
                    No se ha podido comprobar quién tiene la sesión abierta: este
                    equipo no dispone de la herramienta que lo consulta. La lista
                    vacía no significa que no haya nadie conectado.
                  </template>
                </div>
                <div v-else class="seclog-table-wrap">
                  <table class="seclog-table">
                    <thead>
                      <tr><th>Inicio de sesión</th><th>Tipo</th><th>Usuario</th><th>Origen</th><th>Detalle</th></tr>
                    </thead>
                    <tbody>
                      <tr v-for="(ev, ei) in sessionEvents" :key="'ses-' + ei">
                        <td class="seclog-mono">{{ ev.ts || '—' }}</td>
                        <td><span class="seclog-badge" :class="evBadgeClass(ev.type)">{{ evTypeLabel(ev.type) }}</span></td>
                        <td>{{ ev.user || '—' }}</td>
                        <td class="seclog-mono">{{ ev.origin || '—' }}</td>
                        <td class="seclog-detail">{{ ev.detail || '—' }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Sin hallazgos -->
        <div v-if="groups.filter(function(g){ return g.items.length > 0; }).length === 0"
             class="lca-state-center lca-state-inline">
          <svg class="icon icon-xl lca-state-ico"><use href="#lca-i-check-circle"></use></svg>
          <h3 class="lca-state-title">¡Sin hallazgos!</h3>
          <p class="lca-state-desc">No se encontraron problemas en esta auditoría.</p>
        </div>
      </div>

      <!-- Footer: herramienta · fuentes · marca temporal. Las versiones salen de
           donde ya se muestran arriba (scanMeta.lynis.version, trivyScan/sysPkgs
           .trivyVersion); no hay ninguna consulta nueva. -->
      <div class="report-foot" v-if="auditData.scanMeta">
        <div class="report-foot-item">
          <span class="report-foot-key">Herramienta</span>
          <span class="report-foot-val">LoCoAudit · auditoría de host</span>
        </div>
        <div class="report-foot-item" v-if="toolSources">
          <span class="report-foot-key">Fuentes</span>
          <span class="report-foot-val">{{ toolSources }}</span>
        </div>
        <div class="report-foot-item" v-if="(auditData.scanMeta.modulesRun || []).length">
          <span class="report-foot-key">Módulos</span>
          <span class="report-foot-val">{{ (auditData.scanMeta.modulesRun || []).join(', ') }}</span>
        </div>
        <div class="report-foot-item">
          <span class="report-foot-key">Generado</span>
          <span class="report-foot-val">{{ scanTime }}</span>
        </div>
      </div>

    </div>
  </div>
</template>

<script>
export default {
  data() {
    return {
      // Filtro por severidad: clic en una tarjeta (Crítico/Alto/Medio/Bajo).
      filterSev: 'all',
      state: 'idle',
      auditData: null,
      openGroups: {},
      openFindings: {},
      copiedKey: null,
      // Detalle del alcance (subcarpetas analizadas / excluidas / fallidas):
      // cerrado por defecto, el aviso importante ya se ve sin desplegar nada.
      scopeOpen: false,
      // ── Chat con LLM (asistente IA) ──
      chatOpen: {},        // por findingKey: panel abierto/cerrado
      chatMessages: {},    // por findingKey: [{ role, content, error? }]
      chatInput: {},       // por findingKey: texto en curso
      chatLoading: {},     // por findingKey: esperando respuesta
      chatEpoch: 0,        // se incrementa con cada escaneo: descarta respuestas en vuelo
      llmAvailable: null,  // null = sin comprobar; true/false tras comprobar
      llmModel: null,      // modelo que responde; /locoaudit/chat/status ya lo devuelve

      // ── Tokens de color leídos del CSS ───────────────────────────────────────
      // Los colores que acaban en un ATRIBUTO SVG o en una cadena de estilo no los
      // alcanza ningún var(), así que antes estaban escritos a mano aquí abajo. Eso
      // los convertía en una segunda fuente de verdad, y se desincronizaron: el
      // gauge de Lynis pintaba la paleta de image (#EF4444/#F97316/#22C55E) dentro
      // de host, cuyos badges son #DC2626/#EA580C/#65A30D.
      // Ahora se LEEN del :root con getComputedStyle (ver readTokens): el CSS sigue
      // siendo la única autoridad del color y el JS solo lo consulta.
      // Vacíos hasta la primera lectura: un valor vacío no pinta nada, mientras que
      // una constante de respaldo volvería a ser la segunda fuente que sobra.
      tok: {
        critical: '', high: '', medium: '', low: '', info: '',
        criticalText: '', highText: '', mediumText: '', lowText: '', infoText: '',
        surface: '', textMuted: '', textSecondary: ''
      }
    };
  },

  computed: {
    maxSev() {
      return ((this.auditData && this.auditData.summary && this.auditData.summary.maxSeverity) || 'info').toUpperCase();
    },

    counts() {
      var c = (this.auditData && this.auditData.summary && this.auditData.summary.counts) || {};
      return {
        critical: c.critical || c.CRITICAL || 0,
        high:     c.high     || c.HIGH     || 0,
        medium:   c.medium   || c.MEDIUM   || 0,
        low:      c.low      || c.LOW      || 0,
        info:     c.info     || c.INFO     || 0
      };
    },

    totalFindings() {
      var c = this.counts;
      return c.critical + c.high + c.medium + c.low + c.info;
    },

    // ── Recuento segmentado ───────────────────────────────────────────────────
    // Lo calcula el backend (summarize() en lib/severity-map.js) porque el
    // predicado que decide qué es accionable es EL MISMO que decide el riesgo
    // global: replicarlo aquí crearía dos definiciones que acaban divergiendo.
    // Payloads anteriores a la segmentación no traen los campos → todo cuenta
    // como accionable, que es el comportamiento de siempre.
    act() {
      var s = this.auditData && this.auditData.summary;
      if (s && s.actionable) return s.actionable;
      return { counts: this.counts, total: this.totalFindings, maxSeverity: this.maxSev.toLowerCase() };
    },

    inf() {
      var s = this.auditData && this.auditData.summary;
      if (s && s.informative) return s.informative;
      return { counts: { info: 0, low: 0, medium: 0, high: 0, critical: 0 }, total: 0 };
    },

    activeGroups() {
      return this.groups.filter(function(g) { return g.items.length > 0; }).length;
    },

    // ── Partición por ORIGEN REAL del hallazgo ────────────────────────────────
    // Cuatro buckets, cada uno comprobado en el propio dato y no supuesto por el
    // contexto. Es lo que permite que el texto de la tarjeta afirme solo lo que
    // se ha verificado: si no hay ningún hallazgo `declared`, la frase sobre
    // ficheros de dependencias NO se renderiza.
    allFindings() {
      return (this.auditData && this.auditData.findings) || [];
    },

    // Comprobaciones que no llegaron a ejecutarse. Sale de `f.skipped`, que sella
    // createFinding() en lib/finding-schema.js, nunca del sufijo '-SKIP' del id:
    // el id es una etiqueta y esto es un hecho.
    //
    // OJO: `skippedByChoice` / `skippedByError`, más abajo, son OTRA cosa —
    // subcarpetas del home dentro del escaneo de Trivy—. Estos son MÓDULOS.
    skippedFindings() {
      return this.allFindings.filter(function(f) { return f.skipped === true; });
    },

    // Un módulo que apagó el usuario NO es una comprobación caída. Se distingue
    // por `kind === 'disabled'`, sellado en audit-host.js, nunca leyendo el
    // texto de `reason`. Mezclarlos ponía la tarjeta en ámbar por una decisión
    // deliberada del usuario, que es exactamente el aviso que no hay que dar.
    disabledFindings() {
      return this.skippedFindings.filter(function(f) { return f.kind === 'disabled'; });
    },

    // Límites del sistema: Trivy no lee los paquetes de macOS ni de Windows, Lynis no existe
    // para Windows nativo. No se arreglan reintentando, así que no son un agujero del informe:
    // son su alcance real. El flag lo sella createFinding() desde la lista única
    // SKIP_KINDS_NO_APLICA de lib/normalizer.js; aquí no se repite ninguna lista de kinds.
    notApplicableFindings() {
      return this.skippedFindings.filter(function(f) { return f.notApplicable === true; });
    },

    // Lo que SÍ es un agujero en el informe: se pidió, se podía, y no salió. Definido por
    // EXCLUSIÓN de los otros dos, no con un tercer predicado: así las tres partes suman
    // siempre el total y no pueden divergir si mañana aparece otro kind.
    failedCheckFindings() {
      var fuera = this.disabledFindings.concat(this.notApplicableFindings);
      return this.skippedFindings.filter(function(f) { return fuera.indexOf(f) === -1; });
    },

    // El resumen agregado que produce buildSkippedChecksSummary() en lib/normalizer.js, a
    // partir de ESTOS MISMOS findings. No se recompone aquí: dos recuentos de comprobaciones
    // no realizadas acabarían divergiendo.
    checksSkipped() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.checksSkipped) || null;
    },

    // ── Módulos, desde scanMeta ───────────────────────────────────────────────
    // Los siete, no solo los que dejan finding. Solo Lynis y Trivy emiten un
    // hallazgo al omitirse; los otros cinco devuelven null y no dejan rastro, así
    // que contar findings cubriría dos de siete. Payloads viejos no traen el
    // campo → lista vacía y la vista se comporta como antes.
    modules() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.modules) || [];
    },

    modulesNotRequested() {
      return this.modules.filter(function(m) { return m.status === 'not-requested'; });
    },

    // Resúmenes de lo no accionable (HOST-CVE-DECLARED, HOST-OS-CVE-UNFIXED).
    // `aggregate` lo sella createFinding(). Van aparte de los informativos
    // normales porque no describen un hecho del equipo: resumen hallazgos.
    aggregateFindings() {
      return this.allFindings.filter(function(f) { return f.aggregate === true; });
    },

    // Informativos normales: CPU, RAM, disco, inventario. Datos del equipo, ni
    // fallos de comprobación ni resúmenes.
    inventoryFindings() {
      return this.allFindings.filter(function(f) {
        return !f.skipped && !f.aggregate &&
               (f.severity || 'info').toLowerCase() === 'info';
      });
    },

    // Cuántos hallazgos le piden algo al usuario. Lo calcula el BACKEND
    // (summarize() en lib/severity-map.js) y aquí solo se lee, por lo mismo que
    // act() e inf(): el predicado que decide qué es accionable es el mismo que
    // decide el riesgo de la cabecera, y replicarlo aquí crearía dos
    // definiciones que acaban divergiendo. Un hallazgo `declared` de severidad
    // alta cuenta como NO accionable, y por eso esta cifra no es "severidad
    // distinta de info".
    actionableCount() {
      return this.act.total;
    },

    // Tres estados excluyentes:
    //   'clean'   — nada que arreglar y nada CAÍDO. Verde.
    //   'partial' — nada que arreglar ENTRE LO COMPROBADO, con agujeros. Ámbar.
    //   null      — hay trabajo pendiente: manda la lista, no una tarjeta.
    //
    // Lo que decide el ámbar son los FALLOS, no los apagados. Que el usuario
    // desactive un módulo es una decisión suya, no un agujero del que haya que
    // avisarle en amarillo: eso se dice al pie, en tono sobrio.
    nothingState() {
      if (this.totalFindings === 0) return null;
      if (this.actionableCount > 0) return null;
      return this.failedCheckFindings.length > 0 ? 'partial' : 'clean';
    },

    // Los módulos apagados a mano. Sale de scanMeta.modules y NO de los findings:
    // solo Lynis y Trivy dejan hallazgo al omitirse, así que contar findings
    // cubriría dos de siete módulos. La frase y la lista salen del mismo sitio.
    disabledNote() {
      var n = this.modulesNotRequested.length;
      if (!n) return null;
      return n === 1
        ? '1 comprobación no se ha ejecutado porque la desactivaste:'
        : n + ' comprobaciones no se han ejecutado porque las desactivaste:';
    },

    // El cuerpo se COMPONE: una frase por bucket que exista. Nunca se afirma un
    // origen que no se haya comprobado en el hallazgo.
    // El cuerpo se COMPONE: una frase por bucket que exista de verdad.
    //
    // Ya NO hay frase sobre ficheros de dependencias: esas vulnerabilidades se
    // colapsan ahora en un único HOST-CVE-DECLARED que se explica solo, en su
    // propia tarjeta y con su propio texto. Repetirlo aquí era decir lo mismo en
    // dos sitios, y la versión de aquí lo afirmaba de TODOS los hallazgos sin
    // haberlo comprobado en ninguno.
    nothingBuckets() {
      var out = [];
      var nAgg = this.aggregateFindings.length;
      var nInv = this.inventoryFindings.length;

      if (nAgg > 0) {
        out.push(
          (nAgg === 1 ? 'Hay <strong>1 resumen</strong> de vulnerabilidades que no puedes accionar'
                      : 'Hay <strong>' + nAgg + ' resúmenes</strong> de vulnerabilidades que no puedes accionar') +
          '. Cada uno explica en su tarjeta de qué se trata y por qué no hay nada que hacer.'
        );
      }

      if (nInv > 0) {
        out.push(
          (nInv === 1 ? 'Hay <strong>1 hallazgo informativo</strong>'
                      : 'Hay <strong>' + nInv + ' hallazgos informativos</strong>') +
          ' sobre el estado de tu equipo (procesador, memoria, almacenamiento, software ' +
          'instalado). Son datos, no problemas.'
        );
      }

      if (out.length) {
        out.push('Se listan para que sepas qué hay en tu equipo, no como tareas pendientes.');
      }
      return out;
    },

    // ── Alcance del escaneo ───────────────────────────────────────────────────
    // parsed.scan de trivy-fs.js, tal cual: target, skipDirs, durationMs,
    // resolvedFrom, trivyVersion y children.{scanned,skipped}.
    trivyScan() {
      var raw = this.auditData && this.auditData.raw;
      var t = raw && raw.trivy;
      return (t && !t.skipped && t.scan) || null;
    },

    // Hijos del home excluidos A PROPÓSITO (caché, papelera, exclusiones).
    // Es una decisión, no un agujero: se muestra en tono neutro.
    skippedByChoice() {
      var ch = this.trivyScan && this.trivyScan.children;
      return ((ch && ch.skipped) || []).filter(function(s) { return s.kind !== 'error'; });
    },

    // Hijos que NO se pudieron analizar (unidad de red que no responde,
    // permisos). Esto SÍ es un agujero en el informe y el usuario tiene que
    // verlo: que no salga nada de esa carpeta no quiere decir que esté limpia.
    skippedByError() {
      var ch = this.trivyScan && this.trivyScan.children;
      return ((ch && ch.skipped) || []).filter(function(s) { return s.kind === 'error'; });
    },

    scannedChildren() {
      var ch = this.trivyScan && this.trivyScan.children;
      return (ch && ch.scanned) || [];
    },

    sysPkgs() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.systemPackages) || null;
    },

    // Inventario de software (sw-inventory), con su propia fuente. Está aquí y no
    // mezclado con sysPkgs a propósito: cuenta la misma población con otra
    // herramienta y da otra cifra, y fundirlas inventaría un número que ninguna
    // de las dos respalda.
    swPkgs() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.swInventory) || null;
    },

    // Texto por ESTADO y por gestor, no un caso especial más un genérico: cada
    // situación tiene una salida distinta para el usuario. El estado lo produce
    // systemPackagesSupport() en nodes/audit-host/modules/trivy-fs.js.
    sysPkgNotice() {
      var sp = this.sysPkgs;
      if (!sp) return null;
      var mgr = sp.managerLabel || sp.manager || 'tu gestor de paquetes';
      var plat = (this.auditData && this.auditData.host && this.auditData.host.platform) || '';

      if (sp.status === 'unsupported-manager') {
        return {
          tone: 'warn', ico: 'alert',
          title: 'Los paquetes del sistema no se han analizado',
          // `requested` distingue "no se analizó porque nadie lo pidió" de
          // "lo pediste y no se pudo". Antes el segundo caso abortaba el nodo
          // entero; ahora la auditoría continúa y hay que decirlo.
          lead: sp.requested ? 'Lo has activado en la configuración del nodo, pero no ha podido hacerse.' : null,
          body: 'Trivy ha analizado este equipo y no ha reconocido su base de datos de paquetes' +
                (sp.manager ? ' (tu distribución usa ' + mgr + ')' : '') + '. ' +
                'Tu carpeta personal sí se ha analizado y los hallazgos de abajo la cubren, pero todo el ' +
                'software instalado por el sistema ha quedado fuera.',
          warning: 'Esto no quiere decir que esos paquetes estén libres de vulnerabilidades: quiere decir que no se han podido comprobar.',
          hint: sp.manager === 'pacman' ? 'Mantenlos al día por tu cuenta con: sudo pacman -Syu' : null
        };
      }
      if (sp.status === 'supported-not-run') {
        return {
          tone: 'info', ico: 'info',
          title: 'Solo se ha analizado tu carpeta personal',
          lead: null,
          body: 'La opción está desactivada en el nodo, así que el software instalado por el sistema ' +
                'no está incluido en este informe. Si Trivy sabe leer los paquetes de este equipo ' +
                'es algo que solo se puede saber ejecutándolo: el informe de Trivy es quien lo dice, ' +
                'y aquí no se ha llegado a pedir.',
          warning: 'No se ha comprobado: no es lo mismo que estar limpio.',
          hint: 'Para incluirlo, vuelve a marcar «Auditar también los paquetes del sistema» en la ' +
                'configuración del nodo audit-host. Va activado por defecto y tarda varios minutos.'
        };
      }
      if (sp.status === 'scanned') {
        // Cada mitad del texto sale de su propia fuente: la carpeta, del escaneo
        // de trivy-fs; los paquetes, del informe de trivy-rootfs. Solo se afirma
        // lo que hay dato para afirmar. Si trivy-fs no llegó a correr, la frase
        // de la carpeta no se escribe.
        var carpeta = this.trivyScan && this.trivyScan.target;
        var nSub = this.scannedChildren.length;
        var sistema = sp.packages != null
          ? sp.packages + ' paquetes del sistema (' + (sp.osFamily || 'el sistema') +
            (sp.osName ? ' ' + sp.osName : '') + ', según Trivy)'
          : 'el software instalado por el sistema operativo';
        return {
          tone: 'ok', ico: 'check',
          title: carpeta
            ? 'Se ha analizado tu carpeta personal y los paquetes del sistema'
            : 'Se han analizado los paquetes del sistema',
          lead: null,
          body: (carpeta
                  ? 'El informe cubre ' + carpeta + (nSub ? ' (' + nSub + ' subcarpetas)' : '') + ' y '
                  : 'El informe cubre ') +
                sistema + '. ' +
                'Es la cobertura más completa que LoCoAudit puede ofrecer en este equipo.',
          warning: null, hint: null
        };
      }
      if (sp.status === 'failed') {
        return {
          tone: 'warn', ico: 'alert',
          title: 'El análisis de los paquetes del sistema falló',
          lead: null,
          body: 'Se intentó, pero no llegó a terminar: ' + (sp.reason || 'motivo no disponible') + '.',
          // Que falle una parte ya no tira la otra: decirlo evita que el usuario
          // dé por perdida la auditoría entera.
          warning: 'Tu carpeta personal sí se ha analizado, y los hallazgos de abajo la cubren. Lo que falta es el software instalado por el sistema.',
          hint: null
        };
      }
      // not-applicable: dos plataformas, dos motivos distintos y dos salidas
      // distintas para el usuario. No se pueden fusionar en una frase.
      if (plat === 'darwin') {
        return {
          tone: 'info', ico: 'info',
          title: 'En macOS no se analizan los paquetes del sistema',
          lead: null,
          body: 'macOS no tiene un gestor de paquetes de sistema que Trivy pueda leer. Homebrew instala software tuyo, ' +
                'no del sistema operativo. Se ha analizado tu carpeta personal.',
          warning: null,
          hint: 'Las actualizaciones de seguridad de macOS las gestiona Apple: revísalas en Ajustes del Sistema → General → Actualización de software.'
        };
      }
      return {
        tone: 'info', ico: 'info',
        title: 'En Windows no se analizan los paquetes del sistema',
        lead: null,
        body: 'Trivy no analiza el software instalado de Windows. Se ha analizado tu carpeta personal de usuario.',
        warning: null,
        hint: 'Mantén el sistema al día con Windows Update y revisa tus programas con: winget upgrade --all'
      };
    },

    // Nivel del aviso de paquetes del sistema: 2 (cobertura) o 3 (contexto).
    //
    // El corte NO es por tono, es por si el hueco se puede cerrar. Nivel 2 son
    // huecos de ESTA ejecución —el gestor no lo reconoce Trivy, no se pidió, o se
    // intentó y falló—: se cierran instalando, activando o reintentando. Nivel 3 es
    // cómo es este equipo siempre: macOS no tiene un gestor de paquetes de sistema
    // que Trivy sepa leer, y eso no cambia mañana. Pintar el nivel 3 en ámbar sería
    // el falso positivo que la regla "fallo de herramienta ≠ dato negativo" existe
