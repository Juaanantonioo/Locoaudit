<template>
  <div>

    <!-- ── Sin datos ── -->
    <!-- Icono en línea: este estado queda fuera de .lca-report-root y no ve el sprite. -->
    <div v-show="state === 'idle'" class="lca-state-center">
      <svg class="icon icon-xl lca-state-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path>
      </svg>
      <h3 class="lca-state-title">Esperando auditoría de tu equipo…</h3>
      <p class="lca-state-desc">Pulsa el botón de inicio en Node-RED para analizar tu equipo.</p>
    </div>

    <!-- ── Escaneando ── -->
    <div v-show="state === 'scanning'" class="lca-state-center">
      <div class="lca-spinner"></div>
      <p class="lca-state-desc">Analizando tu equipo…</p>
    </div>

    <!-- ── Resultados ── -->
    <div v-if="state === 'done' && auditData" class="lca-report-root">

      <!-- ══ SPRITE DE ICONOS ══ -->
      <!-- Primer hijo de .lca-report-root para que el sprite viaje con el clon del export.
           No renombrar la clase: no debe casar con el prune del export ni con el @media print. -->
      <svg class="lca-sprite" aria-hidden="true" focusable="false"><defs>
        <symbol id="lca-i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></symbol>
        <symbol id="lca-i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></symbol>
        <symbol id="lca-i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></symbol>
        <symbol id="lca-i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></symbol>
        <symbol id="lca-i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></symbol>
        <symbol id="lca-i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></symbol>
        <symbol id="lca-i-minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
        <symbol id="lca-i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"></path></symbol>
        <symbol id="lca-i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></symbol>
        <symbol id="lca-i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></symbol>
        <symbol id="lca-i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></symbol>
        <symbol id="lca-i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></symbol>
        <symbol id="lca-i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"></path></symbol>
        <symbol id="lca-i-memory" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2"></rect><path d="M7 17v3M12 17v3M17 17v3M7 11v2M12 11v2M17 11v2"></path></symbol>
        <symbol id="lca-i-apple" viewBox="0 0 24 24"><path d="M16.5 12.5c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.5-.2-2.8.8-3.6.8-.7 0-1.9-.8-3.1-.8-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.4-.9-2.3-3.8z"></path><path d="M14.2 5.3c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2-.5 2.7-1.3z"></path></symbol>
        <symbol id="lca-i-disk" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></symbol>
        <symbol id="lca-i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></symbol>
        <symbol id="lca-i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path></symbol>
        <symbol id="lca-i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"></path></symbol>
        <symbol id="lca-i-package" viewBox="0 0 24 24"><path d="M21 8.5v7a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4a2 2 0 0 1-1-1.7v-7a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4a2 2 0 0 1 1 1.7z"></path><path d="m3.3 7.5 8.7 5 8.7-5M12 22v-9.5"></path></symbol>
        <symbol id="lca-i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h8l8.6 8.6a2 2 0 0 1 0 1.8z"></path><path d="M7.5 7.5h.01"></path></symbol>
        <symbol id="lca-i-gauge" viewBox="0 0 24 24"><path d="M3 18a9 9 0 1 1 18 0"></path><path d="m12 14 4-4"></path></symbol>
        <symbol id="lca-i-puzzle" viewBox="0 0 24 24"><path d="M9 3h6v3a2 2 0 0 0 4 0V3h2v6h-3a2 2 0 0 0 0 4h3v6h-6v-3a2 2 0 0 0-4 0v3H5v-6h3a2 2 0 0 0 0-4H5V3h4z"></path></symbol>
        <symbol id="lca-i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4.5L3 9"></path><path d="M4 13a8 8 0 0 0 14 4.5L21 15"></path><path d="M3 4v5h5M21 20v-5h-5"></path></symbol>
        <symbol id="lca-i-scale" viewBox="0 0 24 24"><path d="M12 3v18M7 21h10M5 7h14M5 7l-2.5 6h5zM19 7l-2.5 6h5z"></path></symbol>
        <symbol id="lca-i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 .5l2.5-2.5a4 4 0 0 0-5.7-5.7L11.5 6.7"></path><path d="M14 11a4 4 0 0 0-6-.5L5.5 13a4 4 0 0 0 5.7 5.7l1.3-1.3"></path></symbol>
        <symbol id="lca-i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"></path></symbol>
        <symbol id="lca-i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></symbol>
        <symbol id="lca-i-tool" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9 9a2.8 2.8 0 0 1-5-5z"></path><path d="m14.7 6.3 3-3 3 3-3 3"></path></symbol>
      </defs></svg>

      <!-- ══ HEADER ══ -->
      <!-- La barra toma el color del riesgo real; claseRiesgo es la misma que pinta el badge. -->
      <div class="header-card" :class="claseRiesgo">
        <div class="header-main">
          <div class="header-eyebrow">LoCoAudit · Auditoría de host</div>
          <div class="host-name">
            <svg class="icon"><use href="#lca-i-monitor"></use></svg>
            <span class="host-name-text">{{ auditData.host && auditData.host.hostname }}</span>
          </div>
          <div class="header-idline">
            <span class="risk-badge" :class="claseRiesgo">
              <span class="risk-badge-dot"></span>
              {{ etiquetaRiesgo }}
            </span>
            <!-- Mismo recuento que la sección de hallazgos, adelantado a la cabecera. -->
            <span class="risk-note"><template v-if="aRevisar.total > 0">{{ aRevisar.total + ' requieren tu atención' }}</template><template v-else>Nada que arreglar</template></span>
          </div>

          <!-- Rejilla clave/valor: etiqueta pequeña sobre valor. -->
          <div class="meta-grid">
            <div class="meta-item">
              <span class="meta-key">Plataforma</span>
              <span class="meta-val">{{ auditData.host && auditData.host.platform }} · {{ auditData.host && auditData.host.arch }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Versión</span>
              <span class="meta-val meta-val-mono">{{ auditData.host && auditData.host.release }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Activo</span>
              <span class="meta-val">{{ tiempoActivo }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Análisis</span>
              <span class="meta-val">{{ horaEscaneo }}</span>
            </div>
            <div class="meta-item" v-if="auditData.scanMeta && auditData.scanMeta.durationMs">
              <span class="meta-key">Duración</span>
              <span class="meta-val">{{ formatearDuracion(auditData.scanMeta.durationMs) }}</span>
            </div>
            <div class="meta-item" v-if="etiquetaModulos">
              <span class="meta-key">Módulos</span>
              <span class="meta-val">{{ etiquetaModulos }}</span>
            </div>
            <div class="meta-item" v-if="controlesLynis">
              <span class="meta-key">Controles</span>
              <span class="meta-val">{{ controlesLynis }}</span>
            </div>
            <div class="meta-item meta-item-actions">
              <span class="meta-key">Exportar</span>
              <span class="dl-group">
                <button class="dl-btn" @click="descargarHtml" title="Descargar informe HTML (imprimible a PDF)">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> HTML
                </button>
                <button class="dl-btn" @click="descargarJson" title="Descargar datos JSON">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> JSON
                </button>
              </span>
            </div>
          </div>
        </div>

        <!-- Gauge circular Lynis, separado por una línea vertical fina (border-left) -->
        <div class="header-aside" v-if="indiceLynis !== null">
          <span class="gauge-label-top">Hardening Index</span>
          <svg class="gauge-svg" viewBox="0 0 110 110">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" :stop-color="colorLynis"></stop>
                <stop offset="100%" :stop-color="tok.high"></stop>
              </linearGradient>
            </defs>
            <!-- track -->
            <circle cx="55" cy="55" r="44" fill="none" :stroke="tok.surface"
                    stroke-width="10" stroke-dasharray="221 55"
                    stroke-dashoffset="-27.5" stroke-linecap="round"></circle>
            <!-- fill -->
            <circle cx="55" cy="55" r="44" fill="none" stroke="url(#gaugeGrad)"
                    stroke-width="10"
                    :stroke-dasharray="trazoIndicador + ' ' + (276 - trazoIndicador)"
                    stroke-dashoffset="-27.5" stroke-linecap="round"></circle>
            <text x="55" y="51" text-anchor="middle" class="gauge-score">{{ indiceLynis }}</text>
            <text x="55" y="63" text-anchor="middle" class="gauge-sub">de 100</text>
          </svg>
          <span class="gauge-verdict">
            Lynis · <template v-if="indiceLynis >= 55">Aceptable</template><template v-else-if="indiceLynis >= 30">Mejorable</template><template v-else>Deficiente</template>
          </span>
          <span v-if="lineaMetaLynis" class="gauge-meta">{{ lineaMetaLynis }}</span>
        </div>
      </div>

      <!-- ══ SEVERIDADES ══ -->
      <!-- Cuentan solo los accionables (summary.actionable.counts); los informativos van aparte.
           Va pegada a la cabecera y antes de los avisos: es lo primero que se busca. -->
      <div class="sev-block">
        <div class="sev-strip">
          <div class="sev-cell critical" role="button" tabindex="0"
               :aria-pressed="pulsado('critical')"
               :class="{ 'active': filterSev === 'critical', 'zero': !aRevisar.counts.critical }"
               @click="alternarFiltroSeveridad('critical')" @keydown.enter.prevent="alternarFiltroSeveridad('critical')"
               @keydown.space.prevent="alternarFiltroSeveridad('critical')"
               title="Filtrar por severidad Crítico">
            <span class="sev-cell-label">Crítico</span>
            <span class="sev-cell-num">{{ aRevisar.counts.critical || 0 }}</span>
            <span class="sev-cell-sub">Acción inmediata</span>
          </div>
          <div class="sev-cell high" role="button" tabindex="0"
               :aria-pressed="pulsado('high')"
               :class="{ 'active': filterSev === 'high', 'zero': !aRevisar.counts.high }"
               @click="alternarFiltroSeveridad('high')" @keydown.enter.prevent="alternarFiltroSeveridad('high')"
               @keydown.space.prevent="alternarFiltroSeveridad('high')"
               title="Filtrar por severidad Alto">
            <span class="sev-cell-label">Alto</span>
            <span class="sev-cell-num">{{ aRevisar.counts.high || 0 }}</span>
            <span class="sev-cell-sub">Resolver esta semana</span>
          </div>
          <div class="sev-cell medium" role="button" tabindex="0"
               :aria-pressed="pulsado('medium')"
               :class="{ 'active': filterSev === 'medium', 'zero': !aRevisar.counts.medium }"
               @click="alternarFiltroSeveridad('medium')" @keydown.enter.prevent="alternarFiltroSeveridad('medium')"
               @keydown.space.prevent="alternarFiltroSeveridad('medium')"
               title="Filtrar por severidad Medio">
            <span class="sev-cell-label">Medio</span>
            <span class="sev-cell-num">{{ aRevisar.counts.medium || 0 }}</span>
            <span class="sev-cell-sub">Cuando puedas</span>
          </div>
          <div class="sev-cell low" role="button" tabindex="0"
               :aria-pressed="pulsado('low')"
               :class="{ 'active': filterSev === 'low', 'zero': !aRevisar.counts.low }"
               @click="alternarFiltroSeveridad('low')" @keydown.enter.prevent="alternarFiltroSeveridad('low')"
               @keydown.space.prevent="alternarFiltroSeveridad('low')"
               title="Filtrar por severidad Bajo">
            <span class="sev-cell-label">Bajo</span>
            <span class="sev-cell-num">{{ aRevisar.counts.low || 0 }}</span>
            <span class="sev-cell-sub">Opcional</span>
          </div>
          <!-- Sin role="button": no filtra, no es interactiva. -->
          <div class="sev-cell informative" v-if="informativos.total > 0"
               title="Hallazgos que no requieren ninguna acción por tu parte">
            <span class="sev-cell-label">Informativos</span>
            <span class="sev-cell-num">{{ informativos.total }}</span>
            <span class="sev-cell-sub">Solo para tu información</span>
          </div>
        </div>
        <!-- Dentro de la misma caja que los recuentos: un cero solo tranquiliza si consta que se miró. -->
        <div class="sev-gap" v-if="comprobacionesFallidas.length > 0">
          <svg class="icon icon-sm"><use href="#lca-i-alert"></use></svg>
          <span>
            <strong>{{ comprobacionesFallidas.length }}</strong>
            <template v-if="comprobacionesFallidas.length === 1"> comprobación no se ha completado</template><template v-else> comprobaciones no se han completado</template>:
            estos recuentos no cubren todo tu equipo.
          </span>
        </div>
      </div>

      <!-- ══ AVISOS ══ .lca-notice en tres niveles: 1 veredicto, 2 cobertura, 3 contexto.
           El nivel 2 se arregla reintentando; el 3 es el alcance real del equipo. El tono es independiente. -->

      <!-- ── Nivel 1 · VEREDICTO: solo cuando no hay nada accionable.
           'clean' en verde; 'partial' en ámbar porque hay comprobaciones que fallaron. -->
      <div class="lca-notice lvl-1 is-ok" v-if="estadoSinHallazgos === 'clean'">
        <svg class="icon lca-notice-icon"><use href="#lca-i-check-circle"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">No hay nada que tengas que arreglar en tu equipo</div>
          <div class="lca-notice-body" v-for="(frase, i) in motivosSinHallazgos" :key="i" v-html="frase"></div>
          <!-- Un módulo apagado es decisión del usuario: se menciona en tono sobrio, sin alarma. -->
          <div class="lca-notice-foot" v-if="notaDesactivados">
            {{ notaDesactivados }}
            <span class="lca-notice-foot-list">{{ modulosNoSolicitados.map(function(m){ return m.label; }).join(' · ') }}</span>
          </div>
        </div>
      </div>

      <div class="lca-notice lvl-1 is-warn" v-if="estadoSinHallazgos === 'partial'">
        <svg class="icon lca-notice-icon"><use href="#lca-i-alert"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">No hay nada que arreglar <u>entre lo que sí se ha podido comprobar</u></div>
          <div class="lca-notice-body">
            <strong>{{ comprobacionesFallidas.length }}</strong>
            <template v-if="comprobacionesFallidas.length === 1"> comprobación se ha intentado y no ha podido completarse</template><template v-else> comprobaciones se han intentado y no han podido completarse</template>,
            así que esta conclusión no cubre todo tu equipo.
          </div>
          <ul class="lca-notice-list">
            <li v-for="f in comprobacionesFallidas" :key="f.id">{{ f.title }}</li>
          </ul>
          <div class="lca-notice-body" v-for="(frase, i) in motivosSinHallazgos" :key="'b' + i" v-html="frase"></div>
          <div class="lca-notice-body">
            <strong>Revisa el alcance del análisis</strong> aquí debajo: dice exactamente qué se ha
            mirado y qué no. Cero hallazgos en una comprobación que no se ejecutó no significa que
            esa parte esté limpia, significa que nadie la ha mirado.
          </div>
          <!-- Apagado y caído van en listas separadas aunque coincidan. -->
          <div class="lca-notice-foot" v-if="notaDesactivados">
            {{ notaDesactivados }}
            <span class="lca-notice-foot-list">{{ modulosNoSolicitados.map(function(m){ return m.label; }).join(' · ') }}</span>
          </div>
        </div>
      </div>

      <!-- ── Nivel 2 · COBERTURA: qué no se miró en esta ejecución. -->

      <!-- Un solo bloque para todas las comprobaciones no realizadas.
           El recuento viene de resumenOmitidas(); cada línea lleva su propio estado. -->
      <div class="lca-notice lvl-2" v-if="omitidas"
           :class="claseAviso()">
        <svg class="icon lca-notice-icon"><use :href="iconoAviso()"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ omitidas.title }}</div>
          <div class="lca-notice-body" v-for="(frase, i) in omitidas.evidence.split('\n\n')" :key="i">
            {{ frase }}
          </div>
          <!-- Una línea por módulo, con el estado delante. -->
          <ul class="lca-notice-list is-stated">
            <li v-for="it in omitidas.items" :key="it.id" :class="'chk-' + it.estado">
              <span class="lca-notice-state"><template v-if="it.estado === 'failed'">no se pudo</template><template v-else-if="it.estado === 'not-applicable'">no aplica</template><template v-else>desactivada</template></span>
              <span class="lca-notice-name">{{ it.title }}</span>
            </li>
          </ul>
        </div>
      </div>

      <!-- Una parte del home sin leer es un hueco del informe: no encontrar nada no es que no haya nada. -->
      <div class="lca-notice lvl-2 is-warn" v-if="excluidasPorError.length">
        <svg class="icon lca-notice-icon"><use href="#lca-i-alert"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">Una parte de tu carpeta personal no se ha podido analizar</div>
          <div class="lca-notice-body">
            Que no aparezca ningún hallazgo de
            <strong>{{ excluidasPorError.map(function(s){ return s.name; }).join(', ') }}</strong>
            no quiere decir que esté limpia: quiere decir que no se ha podido comprobar.
          </div>
        </div>
      </div>

      <!-- Paquetes del sistema: el mismo computed sirve al nivel 2 y al 3; decide nivelAvisoPaquetes. -->
      <div class="lca-notice lvl-2" :class="'is-' + avisoPaquetes.tone"
           v-if="avisoPaquetes && nivelAvisoPaquetes === 2">
        <svg class="icon lca-notice-icon"><use :href="'#lca-i-' + avisoPaquetes.ico"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ avisoPaquetes.title }}</div>
          <div class="lca-notice-lead" v-if="avisoPaquetes.lead">{{ avisoPaquetes.lead }}</div>
          <div class="lca-notice-body">{{ avisoPaquetes.body }}</div>
          <!-- Evita que "no se ha comprobado" se lea como "está limpio". -->
          <div class="lca-notice-body is-strong" v-if="avisoPaquetes.warning">{{ avisoPaquetes.warning }}</div>
          <div class="lca-notice-hint" v-if="avisoPaquetes.hint">{{ avisoPaquetes.hint }}</div>
        </div>
      </div>

      <!-- ── Nivel 3 · CONTEXTO: cómo es este equipo siempre; no lleva ámbar. -->
      <div class="lca-notice lvl-3" :class="'is-' + avisoPaquetes.tone"
           v-if="avisoPaquetes && nivelAvisoPaquetes === 3">
        <svg class="icon lca-notice-icon"><use :href="'#lca-i-' + avisoPaquetes.ico"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ avisoPaquetes.title }}</div>
          <div class="lca-notice-lead" v-if="avisoPaquetes.lead">{{ avisoPaquetes.lead }}</div>
          <div class="lca-notice-body">{{ avisoPaquetes.body }}</div>
          <div class="lca-notice-body is-strong" v-if="avisoPaquetes.warning">{{ avisoPaquetes.warning }}</div>
          <div class="lca-notice-hint" v-if="avisoPaquetes.hint">{{ avisoPaquetes.hint }}</div>
        </div>
      </div>

      <!-- ══ ALCANCE DEL ESCANEO ══ -->
      <!-- Qué se ha mirado antes de qué se ha encontrado, para no confundir falta de datos con resultado. -->
      <div class="scope-card" v-if="escaneoTrivy || avisoPaquetes || modulos.length">
        <div class="scope-header">
          <svg class="icon"><use href="#lca-i-search"></use></svg>
          <span class="scope-title">Alcance del análisis</span>
          <button class="scope-toggle" v-if="escaneoTrivy" @click="scopeOpen = !scopeOpen">
            <template v-if="scopeOpen">Ocultar detalle</template><template v-else>Ver detalle</template>
          </button>
        </div>

        <div class="scope-grid" v-if="escaneoTrivy">
          <div class="scope-item">
            <span class="scope-key">Carpeta</span>
            <span class="scope-val"><code>{{ escaneoTrivy.target }}</code></span>
          </div>
          <div class="scope-item" v-if="carpetasAnalizadas.length">
            <span class="scope-key">Subcarpetas analizadas</span>
            <span class="scope-val">{{ carpetasAnalizadas.length }}</span>
          </div>
          <div class="scope-item" v-if="excluidasAProposito.length">
            <span class="scope-key">Excluidas</span>
            <span class="scope-val">{{ excluidasAProposito.length }}</span>
          </div>
          <div class="scope-item scope-item-warn" v-if="excluidasPorError.length">
            <span class="scope-key">Sin analizar</span>
            <span class="scope-val">{{ excluidasPorError.length }}</span>
          </div>
          <div class="scope-item" v-if="escaneoTrivy.durationMs">
            <!-- Hay dos duraciones (carpeta y paquetes), de ahí la etiqueta. -->
            <span class="scope-key"><template v-if="paquetesSistema && paquetesSistema.durationMs">Duración carpeta</template><template v-else>Duración</template></span>
            <span class="scope-val">{{ formatearDuracion(escaneoTrivy.durationMs) }}</span>
          </div>
          <!-- Cifra y fuente: sw-inventory cuenta otra cosa con otra herramienta y no se cuadran. -->
          <div class="scope-item" v-if="paquetesSistema" :class="{ 'scope-item-warn': paquetesSistema.status !== 'scanned' }">
            <span class="scope-key">Paquetes del sistema</span>
            <span class="scope-val">
              <template v-if="paquetesSistema.status === 'scanned'">
                <template v-if="paquetesSistema.packages != null">{{ paquetesSistema.packages + ' analizados' }}</template><template v-else>analizados</template> <template v-if="paquetesSistema.osFamily"> · {{ paquetesSistema.osFamily }}<template v-if="paquetesSistema.osName">{{ ' ' + paquetesSistema.osName }}</template><template v-else></template></template>
                <template v-if="paquetesSistema.trivyVersion"> · Trivy {{ paquetesSistema.trivyVersion }}</template>
              </template>
              <template v-else>no analizados</template>
            </span>
          </div>
          <!-- Inventario de sw-inventory, con su propia fuente. -->
          <div class="scope-item" v-if="paquetesSoftware && paquetesSoftware.packages != null">
            <span class="scope-key">Inventario de software</span>
            <span class="scope-val">{{ paquetesSoftware.packages }} paquetes<template v-if="paquetesSoftware.source"> · según {{ paquetesSoftware.source }}</template></span>
          </div>
          <div class="scope-item" v-if="paquetesSistema && paquetesSistema.durationMs">
            <span class="scope-key">Duración sistema</span>
            <span class="scope-val">{{ formatearDuracion(paquetesSistema.durationMs) }}</span>
          </div>
          <div class="scope-item" v-if="escaneoTrivy.trivyVersion">
            <span class="scope-key">Trivy</span>
            <span class="scope-val meta-val-mono">{{ escaneoTrivy.trivyVersion }}</span>
          </div>
        </div>

        <!-- Los siete módulos, para saber después si una ausencia fue decisión o fallo. -->
        <div class="scope-modules" v-if="modulos.length">
          <div class="scope-detail-title">Módulos del análisis</div>
          <div class="scope-modules-grid">
            <span class="scope-module" v-for="m in modulos" :key="m.id" :class="'mod-' + m.status">
              <svg class="icon icon-sm scope-module-ico"><use :href="iconoModulo(m)"></use></svg>
              {{ m.label }}
              <span class="scope-module-state"><template v-if="m.status === 'ok'">analizado</template><template v-else-if="m.status === 'failed'">no se pudo</template><template v-else-if="m.status === 'not-applicable'">no aplica</template><template v-else>no solicitado</template></span>
            </span>
          </div>
        </div>

        <!-- Excluidas a propósito (decisión) y fallidas (hueco del informe), por separado. -->
        <div class="scope-detail" v-show="scopeOpen && escaneoTrivy">
          <div class="scope-detail-block" v-if="excluidasAProposito.length">
            <div class="scope-detail-title">Excluidas a propósito ({{ excluidasAProposito.length }})</div>
            <div class="scope-detail-item" v-for="(s, i) in excluidasAProposito" :key="'c-' + i">
              <code>{{ s.name }}</code> — {{ s.reason }}
            </div>
            <div class="scope-detail-note">
              Solo contienen ficheros temporales o descargados. No hay nada que actualizar en ellas.
            </div>
          </div>
          <div class="scope-detail-block" v-if="excluidasPorError.length">
            <div class="scope-detail-title warn">No se han podido analizar ({{ excluidasPorError.length }})</div>
            <div class="scope-detail-item" v-for="(s, i) in excluidasPorError" :key="'e-' + i">
              <code>{{ s.name }}</code> — {{ motivoCorto(s.reason) }}
              <span v-if="s.durationMs"> (tras {{ formatearDuracion(s.durationMs) }})</span>
            </div>
            <div class="scope-detail-note warn">
              Su contenido NO está incluido en este informe.
            </div>
          </div>
          <div class="scope-detail-block" v-if="carpetasAnalizadas.length">
            <div class="scope-detail-title">Analizadas ({{ carpetasAnalizadas.length }})</div>
            <div class="scope-detail-item scope-detail-flow">
              <code v-for="(s, i) in carpetasAnalizadas" :key="'s-' + i">{{ s.name }}</code>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ CHARTS ══ -->
      <div class="charts-row" v-if="totalHallazgos > 0">

        <!-- Donut SVG puro -->
        <div class="chart-card">
          <div class="chart-title">Distribución por Severidad</div>
          <div class="donut-wrap">
            <svg class="donut-svg" viewBox="0 0 140 140">
              <!-- track -->
              <circle cx="70" cy="70" r="54" fill="none" :stroke="tok.surface" stroke-width="18"></circle>
              <!-- segmentos calculados -->
              <circle v-for="seg in segmentosDonut" :key="seg.key"
                      cx="70" cy="70" r="54" fill="none"
                      :stroke="seg.color" stroke-width="18"
                      :stroke-dasharray="seg.dasharray"
                      :stroke-dashoffset="seg.dashoffset"></circle>
              <!-- El anillo mezcla todas las severidades; el número central cuenta solo los accionables. -->
              <text x="70" y="65" text-anchor="middle" class="donut-total">{{ aRevisar.total }}</text>
              <text x="70" y="79" text-anchor="middle" class="donut-sub">de {{ totalHallazgos }} · a revisar</text>
            </svg>
            <div class="donut-legend">
              <div class="legend-item" v-for="seg in segmentosDonut" :key="'leg-'+seg.key">
                <span class="legend-dot" :style="{background: seg.color}"></span>
                <span class="legend-name">{{ etiquetaSeveridad(seg.key) }}</span>
                <span class="legend-val">{{ seg.count }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Barras horizontales por categoría -->
        <div class="chart-card">
          <div class="chart-title">Hallazgos por Categoría</div>
          <div class="hbar-list">
            <div class="hbar-item" v-for="bar in barrasCategoria" :key="bar.key">
              <span class="hbar-label">{{ bar.label }}</span>
              <div class="hbar-track">
                <div class="hbar-fill" :style="{width: bar.pct + '%', background: bar.color}"></div>
              </div>
              <span class="hbar-count" :style="{color: bar.textColor}">{{ bar.count }}</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ MÉTRICAS ══ -->
      <!-- Las tres con la misma anatomía: título, cifra, barra y pie de dos datos.
           Las píldoras de load 1m/5m/15m van como bloque propio en el pie de CPU. -->
      <div class="metrics-row">

        <!-- RAM -->
        <div class="metric-card" v-if="datosRam">
          <div class="metric-header">
            <span class="metric-title">Memoria RAM</span>
            <svg class="icon"><use :href="iconoRam()"></use></svg>
          </div>
          <div class="ram-macos-note" v-if="datosRam.platform === 'darwin'">
            <svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg>
            Gestión unificada macOS — memoria compartida
          </div>
          <div class="metric-bar-section">
            <div class="metric-figure">
              {{ datosRam.usedGiB }}<span class="metric-figure-unit">GiB</span>
            </div>
            <div class="progress-bar" v-if="datosRam.pct !== null">
              <div class="progress-fill" :style="{width: datosRam.pct + '%', background: estiloBarraRam(datosRam.pct)}"></div>
            </div>
            <div class="metric-foot">
              <div class="metric-foot-item" v-if="datosRam.pct !== null">
                <span class="metric-foot-key">En uso</span>
                <span class="metric-foot-val">{{ datosRam.pct }}%</span>
              </div>
              <div class="metric-foot-item">
                <span class="metric-foot-key">Total</span>
                <span class="metric-foot-val">{{ datosRam.totalGiB }} GiB</span>
              </div>
            </div>
          </div>
        </div>

        <!-- CPU -->
        <div class="metric-card" v-if="datosCpu">
          <div class="metric-header">
            <span class="metric-title">Carga de CPU</span>
            <svg class="icon"><use href="#lca-i-cpu"></use></svg>
          </div>
          <div class="metric-bar-section">
            <div class="metric-figure" v-if="datosCpu.loadAvg">
              ~{{ Math.min(100, Math.round(datosCpu.loadAvg[0] / datosCpu.cores * 100)) }}<span class="metric-figure-unit">%</span>
            </div>
            <div class="metric-figure metric-figure-na" v-else>—</div>
            <div class="progress-bar" v-if="datosCpu.loadAvg">
              <div class="progress-fill" :style="{
                width: Math.min(100, datosCpu.loadAvg[0] / datosCpu.cores * 100).toFixed(0) + '%',
                background: colorBarraCpu(datosCpu.loadAvg[0] / datosCpu.cores)
              }"></div>
            </div>
            <div class="metric-foot">
              <div class="metric-foot-item">
                <span class="metric-foot-key">Estimación</span>
                <span class="metric-foot-val" v-if="datosCpu.loadAvg">load avg 1m vs. {{ datosCpu.cores }} núcleos</span>
                <span class="metric-foot-val" v-else>Load avg no disponible</span>
              </div>
              <div class="metric-foot-item">
                <span class="metric-foot-key">Procesador</span>
                <span class="metric-foot-val">{{ datosCpu.cores }} núcleos · {{ datosCpu.model }}</span>
              </div>
            </div>
            <div class="cpu-loads" v-if="datosCpu.loadAvg">
              <div class="load-pill">
                <span class="load-val"><template v-if="datosCpu.loadAvg[0] != null">{{ datosCpu.loadAvg[0].toFixed(2) }}</template><template v-else>—</template></span>
                <span class="load-period">1 min</span>
              </div>
              <div class="load-pill">
                <span class="load-val"><template v-if="datosCpu.loadAvg[1] != null">{{ datosCpu.loadAvg[1].toFixed(2) }}</template><template v-else>—</template></span>
                <span class="load-period">5 min</span>
              </div>
              <div class="load-pill">
                <span class="load-val"><template v-if="datosCpu.loadAvg[2] != null">{{ datosCpu.loadAvg[2].toFixed(2) }}</template><template v-else>—</template></span>
                <span class="load-period">15 min</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Disco: la misma anatomía, repetida por partición. -->
        <div class="metric-card" v-if="datosDisco && datosDisco.length > 0">
          <div class="metric-header">
            <span class="metric-title">Almacenamiento</span>
            <svg class="icon"><use href="#lca-i-disk"></use></svg>
          </div>
          <div class="disk-parts-container">
            <div class="disk-part" v-for="(p, i) in datosDisco" :key="i">
              <div class="disk-part-header">
                <span class="disk-mount">{{ p.mount }}</span>
              </div>
              <div class="metric-figure">
                {{ p.usedPercent }}<span class="metric-figure-unit">%</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" :style="{width: p.usedPercent + '%', background: p.sevColor}"></div>
              </div>
              <div class="metric-foot">
                <div class="metric-foot-item">
                  <span class="metric-foot-key">Usados</span>
                  <span class="metric-foot-val">{{ p.usedGB }} GB</span>
                </div>
                <div class="metric-foot-item">
                  <span class="metric-foot-key">Libres</span>
                  <span class="metric-foot-val">{{ p.freeGB }} GB</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ══ FINDINGS ══ -->
      <div class="findings-section">
        <div class="section-header">
          <span class="section-title">Hallazgos de Seguridad</span>
          <!-- Accionables e informativos por separado; las cifras las decide el backend (summary). -->
          <span class="section-pills">
            <span class="pill pill-action" v-if="aRevisar.total > 0">{{ aRevisar.total }} requieren tu atención</span>
            <span class="pill pill-calm" v-else>Nada que arreglar</span>
            <span class="pill" v-if="informativos.total > 0">{{ informativos.total }} informativos</span>
            <span class="pill">{{ gruposActivos }} categorías</span>
          </span>
        </div>

        <template v-for="g in grupos" :key="g.key">
          <div class="findings-group" v-if="g.items.length > 0">
            <div class="group-header" @click="alternarGrupo(g.key)">
              <svg class="icon group-icon"><use :href="'#lca-i-' + g.icon"></use></svg>
              <span class="group-name">{{ g.label }}</span>
              <!-- g.items viene ordenado por severidad descendente, así que [0] es el máximo. -->
              <span class="sev-badge group-sev" :class="claseSeveridad(g.items[0].severity)">{{ etiquetaSeveridad(g.items[0].severity) }}</span>
              <span class="group-count">{{ g.items.length }}</span>
              <svg class="icon group-chevron" :class="{open: openGroups[g.key]}"><use href="#lca-i-chevron"></use></svg>
            </div>
            <div class="group-findings" v-show="openGroups[g.key]">
              <p v-if="g.key === 'system' && notaSistema" class="group-note" :class="{ 'group-note-warn': notaSistema.pendiente }">{{ notaSistema.texto }}</p>
              <div v-for="(f, fi) in g.items" :key="g.key + '-' + fi">
                <div class="finding-row" @click="alternarHallazgo(g.key + '-' + fi)">
                  <!-- Declarado: el CVSS no describe este equipo, así que no se pinta su severidad en la fila. -->
                  <span v-if="esDeclarado(f)" class="origin-badge declared"
                        title="Versión anotada en un fichero de dependencias. No hay software instalado con esa versión en tu equipo.">Declarado</span>
                  <template v-else>
                    <span class="sev-badge" :class="claseSeveridad(f.severity)">{{ etiquetaSeveridad(f.severity) }}</span>
                    <!-- Sin píldora "Instalado": es el caso por defecto; solo se marca la excepción. -->
                  </template>
                  <!-- La subcategoría (grupo de control de Lynis) gana a la categoría cuando existe. -->
                  <span class="cat-badge">{{ f.subcategory || etiquetaCategoria(f.category) }}</span>
                  <span class="finding-title">{{ f.title }}</span>
                  <span v-if="esDeclarado(f)" class="finding-note">anotado en un lockfile · nada que actualizar</span>
                  <!-- La clase contiene "chevron" para que el toggle del export también gire la flecha. -->
                  <svg class="icon icon-sm finding-chevron" :class="{open: openFindings[g.key + '-' + fi]}"><use href="#lca-i-chevron"></use></svg>
                </div>
                <div class="finding-detail" :class="{open: openFindings[g.key + '-' + fi]}">
                  <div class="detail-stack" v-if="f.evidence || f.fix">
                    <!-- La evidencia se muestra aunque no haya fix. -->
                    <div class="detail-col" v-if="f.evidence">
                      <div class="detail-col-title">Evidencia</div>
                      <pre class="detail-evidence">{{ formatearEvidencia(f.evidence) }}</pre>

                      <!-- Tira de metadatos: datos estructurados de Trivy (findings CVE) -->
                      <div v-if="tieneMeta(f)" class="meta-strip">
                        <div v-if="f.pkg" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-package"></use></svg> Paquete</span>
                          <span class="meta-value">{{ f.pkg }}</span>
                        </div>
                        <div v-if="f.installedVersion" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-tag"></use></svg> Instalada</span>
                          <span class="meta-value meta-mono">{{ f.installedVersion }}</span>
                        </div>
                        <div v-if="f.fixedVersion" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-check"></use></svg> Corregida</span>
                          <span class="meta-value meta-mono meta-fixed">{{ f.fixedVersion }}</span>
                        </div>
                        <div v-else-if="f.pkg" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-check"></use></svg> Corregida</span>
                          <span class="meta-value meta-nofix">sin parche</span>
                        </div>
                        <div v-if="f.cvss != null" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-gauge"></use></svg> CVSS</span>
                          <span class="meta-value">
                            {{ f.cvss }}
                            <span class="cvss-chip" :class="claseSeveridad(f.severity)">{{ etiquetaSeveridad(f.severity) }}</span>
                          </span>
                        </div>
                        <div v-if="f.cveCount > 1" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-puzzle"></use></svg> CVEs</span>
                          <span class="meta-value">{{ f.cveCount }}</span>
                        </div>
                        <!-- Metadatos de control (Lynis): el código va como dato secundario. -->
                        <div v-if="f.control" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-tag"></use></svg> Control Lynis</span>
                          <span class="meta-value meta-mono">{{ f.control }}</span>
                        </div>
                        <div v-if="f.lynisType" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-alert"></use></svg> Tipo</span>
                          <span class="meta-value">{{ etiquetaTipoLynis(f) }}</span>
                        </div>
                        <div v-if="f.detail" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-search"></use></svg> Detalle</span>
                          <span class="meta-value meta-mono">{{ f.detail }}</span>
                        </div>
                        <div v-if="f.actionType === 'reboot'" class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-refresh"></use></svg> Requiere</span>
                          <span class="meta-value">Reiniciar el equipo</span>
                        </div>
                        <!-- Lynis no puntúa sus controles: se indica que el nivel lo pone LoCoAudit. -->
                        <div v-if="f.severitySource === 'locoaudit'" class="meta-cell"
                             title="Lynis no asigna severidad a sus controles. Este nivel lo establece LoCoAudit según el tipo de control (AUTH, FIRE, NETW…) y según si es un aviso o una sugerencia.">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-scale"></use></svg> Severidad</span>
                          <span class="meta-value">
                            {{ etiquetaSeveridad(f.severity) }}
                            <span class="meta-muted">· criterio de LoCoAudit</span>
                          </span>
                        </div>
                        <div class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-search"></use></svg> Fuente</span>
                          <span class="meta-value">{{ etiquetaOrigen(f.source) }}</span>
                        </div>
                        <div class="meta-cell">
                          <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-link"></use></svg> Advisory</span>
                          <a v-if="f.primaryUrl" class="meta-value meta-link" :href="f.primaryUrl" target="_blank" rel="noopener">{{ f.advisoryLabel || 'Ver' }} <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                          <span v-else class="meta-value meta-muted" title="Trivy no aporta una URL pública fiable para este hallazgo">no disponible</span>
                        </div>
                      </div>
                    </div>
                    <div class="detail-col" v-if="f.fix">
                      <div class="detail-col-title">Resolución</div>
                      <!-- Una rama por alternativa excluyente; dentro de cada rama, pasos en orden (<ol>). -->
                      <template v-if="!f.isCommand">
                        <!-- v-for sobre un array de un elemento: parsea el fix una sola vez. -->
                        <div class="fix-plan" v-for="(fx, xi) in [pasosDeSolucion(f.fix)]" :key="xi">
                          <!-- La intro describe el servicio y va sin numerar. -->
                          <p v-for="(ln, ii) in fx.intro" :key="'i' + ii" class="fix-intro">{{ ln }}</p>
                          <p v-for="(nt, ni) in fx.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                          <div class="fix-branch" v-for="(br, bi) in fx.branches" :key="bi">
                            <div v-if="br.heading" class="fix-branch-title">{{ br.heading }}</div>
                            <ol class="fix-steps" v-if="br.steps.length"
                                :class="{ 'fix-steps-single': br.steps.length === 1 && !br.heading }">
                              <li class="fix-step" v-for="(st, si) in br.steps" :key="si">
                                <span v-if="st.label" class="fix-step-label">{{ st.label }}</span>
                                <!-- El comando va DENTRO del paso que lo usa, no como paso aparte. -->
                                <span v-if="st.cmd" class="command-box command-inline">
                                  <code class="command-text">{{ st.cmd }}</code>
                                  <button @click.stop="copiarComando(st.cmd)"
                                          :class="{ copied: copiedKey === st.cmd }"
                                          class="command-btn">
                                    <svg class="icon icon-sm" v-if="copiedKey === st.cmd"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === st.cmd"> Copiado</template><template v-else>Copiar</template>
                                  </button>
                                </span>
                              </li>
                            </ol>
                            <p v-for="(nt, ni) in br.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                          </div>
                        </div>
                      </template>
                      <p v-if="f.isCommand" class="cmd-intro">
                        Comando sugerido<span class="cmd-origin">{{ etiquetaOrigen(f.source) }}</span>:
                      </p>
                      <div v-if="f.isCommand" class="command-box">
                        <code class="command-text">{{ f.command || f.fix }}</code>
                        <button @click.stop="copiarComando(f.command || f.fix)"
                                :class="{ copied: copiedKey === (f.command || f.fix) }"
                                class="command-btn">
                          <svg class="icon icon-sm" v-if="copiedKey === (f.command || f.fix)"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === (f.command || f.fix)"> Copiado</template><template v-else>Copiar</template>
                        </button>
                      </div>
                      <p v-if="notaSolucion(f)" class="cmd-note">{{ notaSolucion(f) }}</p>
                      <!-- Una sola nota neutra por ficha; el ámbar se reserva para la severidad Media. -->
                      <div v-if="solucionConComando(f)" class="cmd-note cmd-note-safety">
                        <svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg>
                        <span>LoCoAudit no ejecuta estos comandos: cópialos y revísalos antes de ejecutarlos.<template v-if="solucionConSudo(f)"> Requieren privilegios de administrador.</template></span>
                      </div>
                    </div>
                  </div>
                  <!-- Sin pasos: tres textos distintos, porque "no requiere acción" no siempre es cierto. -->
                  <div v-if="!f.fix" class="nofix-note">
                    <template v-if="f.noAction">
                      Este hallazgo es informativo. No requiere acción inmediata.
                    </template>
                    <template v-else-if="f.primaryUrl">
                      LoCoAudit no tiene un paso concreto para este control.
                      <a :href="f.primaryUrl" target="_blank" rel="noopener">Consulta su ficha oficial <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                    </template>
                    <template v-else>
                      <!-- Informativos nativos (CPU, memoria, disco...): aquí "no requiere acción" sí es cierto. -->
                      Este hallazgo es informativo. No requiere acción inmediata.
                    </template>
                  </div>

                  <!-- ── Chat con IA ── -->
                  <div class="lca-chat-wrap" v-if="llmAvailable === true">
                    <button class="ai-ask-btn" @click.stop="alternarChat(claveChat(f, g.key, fi), f)">
                      <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                      <template v-if="chatOpen[claveChat(f, g.key, fi)]"> Cerrar asistente</template><template v-else> Preguntar a la IA</template>
                    </button>
                    <div class="lca-chat" v-if="chatOpen[claveChat(f, g.key, fi)]">
                      <!-- Cabecera con el modelo, para saber quién ha escrito la respuesta. -->
                      <div class="lca-chat-head">
                        <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                        <span class="lca-chat-head-title">Asistente</span>
                        <span class="lca-chat-model" v-if="llmModel">{{ llmModel }}</span>
                      </div>
                      <div class="lca-chat-msgs">
                        <div v-for="(cm, ci) in (chatMessages[claveChat(f, g.key, fi)] || [])" :key="ci"
                             class="chat-msg" :class="claseMensaje(cm)">
                          <div class="chat-bubble" :class="{ 'chat-error': cm.error }">
                            <template v-for="(seg, si) in trocearRespuesta(cm.content)" :key="si">
                              <div v-if="seg.type === 'text'" class="chat-text" v-html="seg.html"></div>
                              <div v-else class="command-box">
                                <code class="command-text">{{ seg.code }}</code>
                                <button @click.stop="copiarComando(seg.code)"
                                        :class="{ copied: copiedKey === seg.code }"
                                        class="command-btn">
                                  <svg class="icon icon-sm" v-if="copiedKey === seg.code"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === seg.code"> Copiado</template><template v-else>Copiar</template>
                                </button>
                              </div>
                            </template>
                          </div>
                        </div>
                        <div v-if="chatLoading[claveChat(f, g.key, fi)]" class="chat-msg chat-ai">
                          <div class="chat-bubble chat-loading">
                            <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
                          </div>
                        </div>
                      </div>
                      <div class="lca-chat-input">
                        <input type="text" v-model="chatInput[claveChat(f, g.key, fi)]"
                               placeholder="Escribe tu pregunta…"
                               :disabled="chatLoading[claveChat(f, g.key, fi)]"
                               @keydown.enter.prevent="enviarChat(claveChat(f, g.key, fi), f)">
                        <button class="chat-send-btn"
                                :disabled="chatLoading[claveChat(f, g.key, fi)]"
                                @click.stop="enviarChat(claveChat(f, g.key, fi), f)">Enviar</button>
                      </div>
                      <!-- El aviso va al pie y no en un modal: se lee después de la
                           respuesta, que es cuando el usuario decide si actuar. -->
                      <div class="lca-chat-foot">
                        Un modelo de lenguaje puede equivocarse. Contrasta lo que te diga
                        con la evidencia del hallazgo antes de ejecutar nada.
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- ── Subsección: eventos (solo grupo "Logs del sistema") ──────────── -->
              <!-- Dos tablas distintas: intentos de acceso (eventos que ocurrieron)
                   vs sesiones activas ahora mismo (estado presente). -->
              <div v-if="g.key === 'system-logs' && eventosSeguridad" class="seclog">

                <!-- (a) Intentos de acceso — SSH OK/fallido, sudo, su, logins -->
                <div class="seclog-title">Intentos de acceso (últimas {{ eventosSeguridad.windowHours }} h)</div>
                <div v-if="eventosAcceso.length === 0" class="seclog-empty">
                  Sin intentos en la ventana analizada ({{ eventosSeguridad.windowHours }} h).
                </div>
                <div v-else>
                  <div class="seclog-table-wrap">
                    <table class="seclog-table">
                      <thead>
                        <tr><th>Hora</th><th>Tipo</th><th>Usuario</th><th>Origen</th><th>Detalle</th></tr>
                      </thead>
                      <tbody>
                        <tr v-for="(ev, ei) in eventosAcceso" :key="'acc-' + ei">
                          <td class="seclog-mono">{{ ev.ts || '—' }}</td>
                          <td><span class="seclog-badge" :class="claseEtiquetaEvento(ev.type)">{{ etiquetaTipoEvento(ev.type) }}</span></td>
                          <td>{{ ev.user || '—' }}</td>
                          <td class="seclog-mono">{{ ev.origin || '—' }}</td>
                          <td class="seclog-detail">{{ ev.detail || '—' }}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div v-if="eventosSeguridad.truncated" class="seclog-truncated">
                    Mostrando los {{ eventosSeguridad.events.length }} eventos más recientes.
                  </div>
                </div>

                <!-- (b) Sesiones activas ahora (`who`); la hora es la de inicio de sesión. -->
                <div class="seclog-title seclog-title-sessions">Sesiones activas ahora</div>
                <div v-if="eventosSesion.length === 0" class="seclog-empty">
                  <template v-if="sesionesRevisadas">Sin sesiones remotas activas.</template>
                  <template v-else>
                    No se ha podido comprobar quién tiene la sesión abierta: este
                    equipo no dispone de la herramienta que lo consulta. La lista
                    vacía no significa que no haya nadie conectado.
                  </template>
                </div>
                <div v-else class="seclog-table-wrap">
                  <table class="seclog-table">
                    <thead>
                      <tr><th>Inicio de sesión</th><th>Tipo</th><th>Usuario</th><th>Origen</th><th>Detalle</th></tr>
                    </thead>
                    <tbody>
                      <tr v-for="(ev, ei) in eventosSesion" :key="'ses-' + ei">
                        <td class="seclog-mono">{{ ev.ts || '—' }}</td>
                        <td><span class="seclog-badge" :class="claseEtiquetaEvento(ev.type)">{{ etiquetaTipoEvento(ev.type) }}</span></td>
                        <td>{{ ev.user || '—' }}</td>
                        <td class="seclog-mono">{{ ev.origin || '—' }}</td>
                        <td class="seclog-detail">{{ ev.detail || '—' }}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </template>

        <!-- Sin hallazgos -->
        <div v-if="grupos.filter(function(g){ return g.items.length > 0; }).length === 0"
             class="lca-state-center lca-state-inline">
          <svg class="icon icon-xl lca-state-ico"><use href="#lca-i-check-circle"></use></svg>
          <h3 class="lca-state-title">¡Sin hallazgos!</h3>
          <p class="lca-state-desc">No se encontraron problemas en esta auditoría.</p>
        </div>
      </div>

      <!-- Pie: herramienta, fuentes y marca temporal, con las versiones ya mostradas arriba. -->
      <div class="report-foot" v-if="auditData.scanMeta">
        <div class="report-foot-item">
          <span class="report-foot-key">Herramienta</span>
          <span class="report-foot-val">LoCoAudit · auditoría de host</span>
        </div>
        <div class="report-foot-item" v-if="herramientas">
          <span class="report-foot-key">Fuentes</span>
          <span class="report-foot-val">{{ herramientas }}</span>
        </div>
        <div class="report-foot-item" v-if="(auditData.scanMeta.modulesRun || []).length">
          <span class="report-foot-key">Módulos</span>
          <span class="report-foot-val">{{ (auditData.scanMeta.modulesRun || []).join(', ') }}</span>
        </div>
        <div class="report-foot-item">
          <span class="report-foot-key">Generado</span>
          <span class="report-foot-val">{{ horaEscaneo }}</span>
        </div>
      </div>

    </div>
  </div>
</template>

<script>
export default {
  data() {
    return {
      // Filtro por severidad: clic en una tarjeta (Crítico/Alto/Medio/Bajo).
      filterSev: 'all',
      state: 'idle',
      auditData: null,
      openGroups: {},
      openFindings: {},
      copiedKey: null,
      // Detalle del alcance cerrado por defecto; el aviso importante ya se ve sin desplegar.
      scopeOpen: false,
      // ── Chat con LLM (asistente IA) ──
      chatOpen: {},        // por findingKey: panel abierto/cerrado
      chatMessages: {},    // por findingKey: [{ role, content, error? }]
      chatInput: {},       // por findingKey: texto en curso
      chatLoading: {},     // por findingKey: esperando respuesta
      chatEpoch: 0,        // se incrementa con cada escaneo: descarta respuestas en vuelo
      llmAvailable: null,  // null = sin comprobar; true/false tras comprobar
      llmModel: null,      // modelo que responde; /locoaudit/chat/status ya lo devuelve

      // ── Tokens de color leídos del :root (ver leerTokens) para atributos SVG y estilos en JS.
      // Vacíos hasta la primera lectura: sin constantes de respaldo que dupliquen el CSS.
      tok: {
        critical: '', high: '', medium: '', low: '', info: '',
        criticalText: '', highText: '', mediumText: '', lowText: '', infoText: '',
        surface: '', textMuted: '', textSecondary: ''
      }
    };
  },

  computed: {
    severidadMaxima() {
      return ((this.auditData && this.auditData.summary && this.auditData.summary.maxSeverity) || 'info').toUpperCase();
    },

    conteos() {
      var c = (this.auditData && this.auditData.summary && this.auditData.summary.counts) || {};
      return {
        critical: c.critical || c.CRITICAL || 0,
        high:     c.high     || c.HIGH     || 0,
        medium:   c.medium   || c.MEDIUM   || 0,
        low:      c.low      || c.LOW      || 0,
        info:     c.info     || c.INFO     || 0
      };
    },

    totalHallazgos() {
      var c = this.conteos;
      return c.critical + c.high + c.medium + c.low + c.info;
    },

    // ── Recuento segmentado: lo calcula el backend (resumir() en lib/severity-map.js).
    // Payloads antiguos sin estos campos: todo cuenta como accionable.
    aRevisar() {
      var s = this.auditData && this.auditData.summary;
      if (s && s.actionable) return s.actionable;
      return { counts: this.conteos, total: this.totalHallazgos, maxSeverity: this.severidadMaxima.toLowerCase() };
    },

    informativos() {
      var s = this.auditData && this.auditData.summary;
      if (s && s.informative) return s.informative;
      return { counts: { info: 0, low: 0, medium: 0, high: 0, critical: 0 }, total: 0 };
    },

    gruposActivos() {
      return this.grupos.filter(function(g) { return g.items.length > 0; }).length;
    },

    // ── Partición por origen real del hallazgo, comprobado en el propio dato.
    todosLosHallazgos() {
      return (this.auditData && this.auditData.findings) || [];
    },

    // Comprobaciones no ejecutadas, según `f.skipped` (no el sufijo -SKIP del id).
    // Ojo: excluidasAProposito/excluidasPorError son subcarpetas del home, no módulos.
    hallazgosOmitidos() {
      return this.todosLosHallazgos.filter(function(f) { return f.skipped === true; });
    },

    // Módulo apagado por el usuario (kind === 'disabled'): no es una comprobación caída.
    hallazgosDesactivados() {
      return this.hallazgosOmitidos.filter(function(f) { return f.kind === 'disabled'; });
    },

    // Límites de la plataforma (p. ej. Trivy sin paquetes de macOS): alcance real, no un hueco.
    // El flag lo pone crearHallazgo() desde SKIP_KINDS_NO_APLICA.
    hallazgosNoAplican() {
      return this.hallazgosOmitidos.filter(function(f) { return f.notApplicable === true; });
    },

    // Hueco real del informe; por exclusión de los otros dos, así las tres partes suman el total.
    comprobacionesFallidas() {
      var fuera = this.hallazgosDesactivados.concat(this.hallazgosNoAplican);
      return this.hallazgosOmitidos.filter(function(f) { return fuera.indexOf(f) === -1; });
    },

    // Resumen de resumenOmitidas(); no se recompone aquí para no tener dos recuentos.
    omitidas() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.checksSkipped) || null;
    },

    // ── Los siete módulos desde scanMeta: solo Lynis y Trivy dejan finding al omitirse.
    // Payloads antiguos sin el campo: lista vacía.
    modulos() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.modules) || [];
    },

    modulosNoSolicitados() {
      return this.modulos.filter(function(m) { return m.status === 'not-requested'; });
    },

    // Resúmenes no accionables (HOST-CVE-DECLARED), marcados con `aggregate`.
    hallazgosAgregados() {
      return this.todosLosHallazgos.filter(function(f) { return f.aggregate === true; });
    },

    // Informativos normales: CPU, RAM, disco, inventario.
    hallazgosInventario() {
      return this.todosLosHallazgos.filter(function(f) {
        return !f.skipped && !f.aggregate &&
               (f.severity || 'info').toLowerCase() === 'info';
      });
    },

    // Hallazgos accionables, calculados en el backend; un `declared` alto no cuenta.
    numAccionables() {
      return this.aRevisar.total;
    },

    // 'clean' sin nada pendiente ni caído; 'partial' con fallos; null si hay trabajo pendiente.
    // El ámbar lo deciden los fallos, no los módulos apagados.
    estadoSinHallazgos() {
      if (this.totalHallazgos === 0) return null;
      if (this.numAccionables > 0) return null;
      if (this.comprobacionesFallidas.length > 0) {
        return 'partial';
      } else {
        return 'clean';
      }
    },

    // Módulos apagados a mano, desde scanMeta.modules (los findings solo cubren dos de siete).
    notaDesactivados() {
      var n = this.modulosNoSolicitados.length;
      if (!n) return null;
      if (n === 1) {
        return '1 comprobación no se ha ejecutado porque la desactivaste:';
      } else {
        return n + ' comprobaciones no se han ejecutado porque las desactivaste:';
      }
    },

    // Una frase por bucket que exista de verdad; los declarados se explican en su propia tarjeta.
    motivosSinHallazgos() {
      var out = [];
      var nAgg = this.hallazgosAgregados.length;
      var nInv = this.hallazgosInventario.length;

      if (nAgg > 0) {
        let frase;
        if (nAgg === 1) {
          frase = 'Hay <strong>1 resumen</strong> de vulnerabilidades que no puedes accionar';
        } else {
          frase = 'Hay <strong>' + nAgg + ' resúmenes</strong> de vulnerabilidades que no puedes accionar';
        }
        out.push(
          frase +
          '. Cada uno explica en su tarjeta de qué se trata y por qué no hay nada que hacer.'
        );
      }

      if (nInv > 0) {
        let frase;
        if (nInv === 1) {
          frase = 'Hay <strong>1 hallazgo informativo</strong>';
        } else {
          frase = 'Hay <strong>' + nInv + ' hallazgos informativos</strong>';
        }
        out.push(
          frase +
          ' sobre el estado de tu equipo (procesador, memoria, almacenamiento, software ' +
          'instalado). Son datos, no problemas.'
        );
      }

      if (out.length) {
        out.push('Se listan para que sepas qué hay en tu equipo, no como tareas pendientes.');
      }
      return out;
    },

    // ── Alcance del escaneo: parsed.scan de trivy-fs.js tal cual.
    escaneoTrivy() {
      var raw = this.auditData && this.auditData.raw;
      var t = raw && raw.trivy;
      return (t && !t.skipped && t.scan) || null;
    },

    // Subcarpetas excluidas a propósito: decisión, tono neutro.
    excluidasAProposito() {
      var ch = this.escaneoTrivy && this.escaneoTrivy.children;
      return ((ch && ch.skipped) || []).filter(function(s) { return s.kind !== 'error'; });
    },

    // Subcarpetas que no se pudieron analizar: hueco del informe que el usuario debe ver.
    excluidasPorError() {
      var ch = this.escaneoTrivy && this.escaneoTrivy.children;
      return ((ch && ch.skipped) || []).filter(function(s) { return s.kind === 'error'; });
    },

    carpetasAnalizadas() {
      var ch = this.escaneoTrivy && this.escaneoTrivy.children;
      return (ch && ch.scanned) || [];
    },

    paquetesSistema() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.systemPackages) || null;
    },

    // Nota de Sistema & Actualizaciones: si el sistema está al día, lo que queda no tiene parche.
    notaSistema() {
      var sp = this.paquetesSistema;
      if (!sp || sp.status !== 'scanned') return null;
      var m = this.auditData.scanMeta;
      var upd = m && m.pendingUpdates;
      var pendientes = (sp.fixablePackages || 0) > 0 || (upd && upd.total > 0);
      if (pendientes) {
        return {
          pendiente: true,
          texto: 'Tu sistema tiene actualizaciones pendientes. Actualízalo entero, no paquete a paquete, ' +
                 'y reinicia si se instala un kernel nuevo. Después vuelve a auditar.'
        };
      }
      if ((sp.unfixedVulns || 0) > 0) {
        return {
          pendiente: false,
          texto: 'Tu sistema está actualizado. Las vulnerabilidades marcadas «sin corrección» todavía no tienen ' +
                 'parche de tu distribución, así que no puedes hacer nada más que mantener el sistema al día.'
        };
      }
      return null;
    },

    // Inventario de sw-inventory: otra herramienta y otra cifra, no se mezcla con paquetesSistema.
    paquetesSoftware() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.swInventory) || null;
    },

    // Texto por estado y gestor; el estado lo da soportePaquetesSistema() en trivy-fs.js.
    avisoPaquetes() {
      var sp = this.paquetesSistema;
      if (!sp) return null;
      var mgr = sp.managerLabel || sp.manager || 'tu gestor de paquetes';
      var plat = (this.auditData && this.auditData.host && this.auditData.host.platform) || '';

      if (sp.status === 'unsupported-manager') {
        // `requested` distingue "nadie lo pidió" de "lo pediste y no se pudo".
        let entrada;
        if (sp.requested) {
          entrada = 'Lo has activado en la configuración del nodo, pero no ha podido hacerse.';
        } else {
          entrada = null;
        }
        let gestor;
        if (sp.manager) {
          gestor = ' (tu distribución usa ' + mgr + ')';
        } else {
          gestor = '';
        }
        let consejo;
        if (sp.manager === 'pacman') {
          consejo = 'Mantenlos al día por tu cuenta con: sudo pacman -Syu';
        } else {
          consejo = null;
        }
        return {
          tone: 'warn', ico: 'alert',
          title: 'Los paquetes del sistema no se han analizado',
          lead: entrada,
          body: 'Trivy ha analizado este equipo y no ha reconocido su base de datos de paquetes' +
                gestor + '. ' +
                'Tu carpeta personal sí se ha analizado y los hallazgos de abajo la cubren, pero todo el ' +
                'software instalado por el sistema ha quedado fuera.',
          warning: 'Esto no quiere decir que esos paquetes estén libres de vulnerabilidades: quiere decir que no se han podido comprobar.',
          hint: consejo
        };
      }
      if (sp.status === 'supported-not-run') {
        return {
          tone: 'info', ico: 'info',
          title: 'Solo se ha analizado tu carpeta personal',
          lead: null,
          body: 'La opción está desactivada en el nodo, así que el software instalado por el sistema ' +
                'no está incluido en este informe. Si Trivy sabe leer los paquetes de este equipo ' +
                'es algo que solo se puede saber ejecutándolo: el informe de Trivy es quien lo dice, ' +
                'y aquí no se ha llegado a pedir.',
          warning: 'No se ha comprobado: no es lo mismo que estar limpio.',
          hint: 'Para incluirlo, vuelve a marcar «Auditar también los paquetes del sistema» en la ' +
                'configuración del nodo audit-host. Va activado por defecto y tarda varios minutos.'
        };
      }
      if (sp.status === 'scanned') {
        // Cada mitad sale de su fuente (trivy-fs y trivy-rootfs); sin dato, no se escribe la frase.
        var carpeta = this.escaneoTrivy && this.escaneoTrivy.target;
        var nSub = this.carpetasAnalizadas.length;
        var sistema;
        if (sp.packages != null) {
          let version;
          if (sp.osName) {
            version = ' ' + sp.osName;
          } else {
            version = '';
          }
          sistema = sp.packages + ' paquetes del sistema (' + (sp.osFamily || 'el sistema') +
              version + ', según Trivy)';
        } else {
          sistema = 'el software instalado por el sistema operativo';
        }
        let titulo;
        let cobertura;
        if (carpeta) {
          titulo = 'Se ha analizado tu carpeta personal y los paquetes del sistema';
          let subcarpetas;
          if (nSub) {
            subcarpetas = ' (' + nSub + ' subcarpetas)';
          } else {
            subcarpetas = '';
          }
          cobertura = 'El informe cubre ' + carpeta + subcarpetas + ' y ';
        } else {
          titulo = 'Se han analizado los paquetes del sistema';
          cobertura = 'El informe cubre ';
        }
        return {
          tone: 'ok', ico: 'check',
          title: titulo,
          lead: null,
          body: cobertura +
                sistema + '. ' +
                'Es la cobertura más completa que LoCoAudit puede ofrecer en este equipo.',
          warning: null, hint: null
        };
      }

    grupos() {
