  }

  /* ── PORT GRID ───────────────────────────────────────────────── */
  .port-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .port-card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 16px 14px;
    border: 1px solid var(--border);
    border-left: 4px solid;
    position: relative;
    transition: box-shadow .15s, transform .15s;
    cursor: default;
  }
  .port-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.07); transform: translateY(-1px); }

  .port-card.sev-high     { background: var(--high-bg);     border-left-color: var(--high); }
  .port-card.sev-medium   { background: var(--medium-bg);   border-left-color: var(--medium); }
  .port-card.sev-info     { background: var(--info-bg);     border-left-color: var(--info); }
  .port-card.sev-low      { background: var(--low-bg);      border-left-color: var(--low); }
  .port-card.sev-critical { background: var(--critical-bg); border-left-color: var(--critical); }

  .port-sev-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 7px; border-radius: 10px;
  }
  /* Fondo pálido y texto 700, igual que en host. Antes el fondo era el BORDE claro
     (--X-border) y el texto el tono base: `.info` daba 2,09:1, el peor contraste de
     los tres dashboards. Herencia del renombrado --sev-X-badge → --X-border. */
  .port-sev-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1px solid var(--high-border); }
  .port-sev-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1px solid var(--medium-border); }
  .port-sev-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1px solid var(--info-border); }
  .port-sev-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1px solid var(--low-border); }
  .port-sev-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1px solid var(--critical-border); }

  .port-number {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .port-service {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
  }
  .port-meta {
    display: flex; flex-direction: column; gap: 3px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.06);
  }
  .port-meta-item {
    font-size: 11.5px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 5px;
  }
  /* Sobre la tarjeta TINTADA por severidad el texto secundario se queda en 4,46:1.
     La etiqueta es neutra ("Proceso", "Versión"), así que va en el color de texto
     principal: el peso lo marcan el tamaño y las mayúsculas, no el gris. */
  .port-meta-item .meta-key {
    color: var(--text);
    font-size: 10.5px;
    min-width: 48px;
  }
  .port-meta-item code {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
  }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 24px;
    gap: 12px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .empty-state .empty-ico { color: var(--text-muted); margin-bottom: 4px; }
  .empty-title { font-size: 18px; font-weight: 600; color: var(--low); }
  /* El verde de arriba comunica "correcto"; cuando no hubo auditoría, gris. */
  .empty-title--neutral { color: var(--text-secondary); }
  .empty-sub { font-size: 14px; color: var(--text-secondary); text-align: center; }

  /* ── TWO-COLUMN ROW ──────────────────────────────────────────── */
  .two-col {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    align-items: start;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  /* Bar chart */
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 130px;
    padding: 0 4px;
    margin: 18px 0 14px;
  }
  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    height: 100%;
    justify-content: flex-end;
    gap: 5px;
    cursor: pointer;
    border-radius: 8px;
    padding: 4px 2px;
    transition: background .15s;
  }
  .bar-col:hover { background: var(--accent-dim); }
  .bar-col-active { background: var(--accent-dim); box-shadow: inset 0 0 0 2px var(--accent); }
  .filter-empty {
    margin-top: 12px; font-size: 12.5px; color: var(--text-secondary);
    background: var(--card); border: 1px dashed var(--border);
    border-radius: 8px; padding: 10px 12px; text-align: center;
  }
  .filter-empty a { color: var(--accent); font-weight: 600; text-decoration: none; margin-left: 6px; }
  .bar-count {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .bar-fill {
    width: 100%;
    border-radius: 6px 6px 2px 2px;
    transition: height .4s cubic-bezier(.4,0,.2,1);
    min-height: 4px;
    position: relative;
  }
  .bar-ports {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: absolute;
    bottom: 6px;
    left: 0; right: 0;
  }
  /* Los números de puerto van DENTRO de la barra, así que su fondo es el relleno de
     la severidad, y ninguno de esos rellenos es lo bastante oscuro para texto blanco:
     2,77 sobre info, 3,09 sobre low, 3,19 sobre medium. Una sombra de texto no
     cuenta como contraste —WCAG mide color contra color—, así que lo que hay debajo
     tiene que ser oscuro de verdad: una píldora propia. */
  .bar-port-num {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    background: rgba(15, 23, 42, .82);
    border-radius: 3px;
    padding: 1px 3px;
    display: inline-block;
  }
  .bar-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }
  .bar-axis {
    height: 1px;
    background: var(--border);
    margin: 0 4px 10px;
  }
  .bar-total-label {
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .bar-total-label strong {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
  }

  /* Table */
  .port-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .port-table th {
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-secondary);
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
  }
  .port-table td {
    padding: 9px 10px;
    vertical-align: middle;
  }
  .port-table tr:nth-child(even) td { background: var(--bg); }
  .port-table tr:last-child td:first-child { border-radius: 0 0 0 8px; }
  .port-table tr:last-child td:last-child  { border-radius: 0 0 8px 0; }

  .port-table .td-port {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }
  .port-table .td-service {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .port-table .td-process {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
  }

  .badge {
    display: inline-block;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 8px; border-radius: 10px;
  }
  .badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1px solid var(--high-border); }
  .badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1px solid var(--medium-border); }
  .badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1px solid var(--info-border); }
  .badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1px solid var(--low-border); }
  .badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1px solid var(--critical-border); }
  .badge.cat      { background: var(--accent-bg); color: var(--accent); }

  /* ── FINDINGS ────────────────────────────────────────────────── */
  .findings-list { display: flex; flex-direction: column; gap: 8px; }

  .vulnerability-groups { display: flex; flex-direction: column; gap: 10px; }
  .vulnerability-group {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .vulnerability-group-header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 13px 16px; background: var(--surface); border-left: 4px solid var(--medium);
    cursor: pointer; user-select: none;
  }
  .vulnerability-group-header:hover { background: var(--bg); }
  .vulnerability-group-port { display: flex; flex-direction: column; gap: 2px; }
  .vulnerability-group-label {
    color: var(--text-secondary); font-size: 9.5px; font-weight: 700;
    letter-spacing: .7px; text-transform: uppercase;
  }
  .vulnerability-group-port code, .vulnerability-id { font-family: var(--font-mono); }
  .vulnerability-group-service { flex: 1; color: var(--text); font-size: 13px; font-weight: 600; }
  .vulnerability-group-count { color: var(--text-secondary); font-size: 11px; white-space: nowrap; }
  .vulnerability-group-chevron { color: var(--text-muted); transition: transform .2s; }
  .vulnerability-group-chevron.open { transform: rotate(180deg); }
  .vulnerability-group-body { padding: 12px 16px 16px; }
  .vulnerability-finding + .vulnerability-finding { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .vulnerability-finding-title { color: var(--text); font-size: 13px; font-weight: 600; }
  .vulnerability-provenance {
    margin-top: 8px; padding: 9px 11px; border-left: 3px solid var(--medium);
    border-radius: var(--radius-sm); background: var(--medium-bg); color: var(--text);
    font-size: 12px; line-height: 1.55;
  }
  .vulnerability-list { max-height: 280px; overflow-y: auto; margin-top: 10px; border-top: 1px solid var(--border); }
  .vulnerability-card {
    display: grid; grid-template-columns: minmax(150px, 1fr) auto auto minmax(90px, auto);
    align-items: center; gap: 12px; padding: 9px 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .vulnerability-card + .vulnerability-card { margin-top: 6px; }
  .vulnerability-card-score { color: var(--text-secondary); font-size: 11.5px; white-space: nowrap; }
  .vulnerability-card-score strong { color: var(--text); font-family: var(--font-mono); font-size: 12px; }
  .vulnerability-advisory { color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: none; }
  .vulnerability-advisory:hover { text-decoration: underline; }
  .vulnerability-advisory.is-unavailable { color: var(--text-secondary); font-weight: 400; }
  .vulnerability-resolution {
