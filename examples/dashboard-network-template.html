  /* ═══ TOKENS ═══ Mismo vocabulario que host, la referencia de diseño. */
  :root {
    /* Severidad, idéntica a host; la lee leerTokens() para estilos en JS. */
    --critical: #DC2626;
    --critical-bg: #FEF2F2;
    --critical-border: #FECACA;
    --high: #EA580C;
    --high-bg: #FFF7ED;
    --high-border: #FED7AA;
    --medium: #D97706;
    --medium-bg: #FFFBEB;
    --medium-border: #FDE68A;
    /* `low` con color propio: una escala con un nivel sin color no se lee como escala. */
    --low: #65A30D;
    --low-bg: #F7FEE7;
    --low-border: #D9F99D;
    /* `info` no hace de acento: un color no puede ser severidad e interfaz a la vez. */
    --info: #0EA5E9;
    --info-bg: #F0F9FF;
    --info-border: #BAE6FD;

    /* Tono 700 para texto: el tono base no llega a 4,5:1 sobre el fondo pálido de su nivel.
       El tono base queda para bordes, puntos, rellenos y barras. */
    --critical-text: #B91C1C;
    --high-text: #C2410C;
    --medium-text: #A16207;
    --low-text: #4D7C0F;
    --info-text: #0369A1;

    /* Chrome neutro: el módulo se identifica por icono y etiqueta; el color es para la severidad. */
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    --surface: #F1F5F9;
    --text-muted: #94A3B8;

    /* Acento compartido por los tres dashboards. */
    --accent: #7C3AED;
    --accent-bg: #F5F3FF;
    --accent-border: #DDD6FE;
    --accent-light: #C4B5FD;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 100px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);

    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Fira Code", monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
  }

  /* ── Iconos: sprite de <symbol> usado con <use>, primer hijo de .lca-report-root.
     Se oculta por tamaño y no con display:none, que el CSS extra del export podría pisar. */
  .lca-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: -3px;
  }
  .icon-sm { width: 13px; height: 13px; vertical-align: -2px; }
  .icon-xl { width: 44px; height: 44px; stroke-width: 1.25; }

  /* Sin pasos de resolución: informa de qué falta, sin fingir un veredicto. */
  .nofix-note {
    padding: 12px 0;
    font-style: italic;
    color: var(--text-secondary);
    font-size: 12.5px;
  }
  .nofix-note a { color: inherit; font-style: normal; text-decoration: underline; }

  /* ═══ CABECERA ═══ Misma anatomía que host. */
  .header-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 26px 28px;
    display: flex;
    align-items: stretch;
    gap: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .header-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--text-muted);
  }
  .header-card.critical::before    { background: var(--critical); }
  .header-card.high::before        { background: var(--high); }
  .header-card.medium::before      { background: var(--medium); }
  .header-card.low::before         { background: var(--low); }
  .header-card.info::before        { background: var(--info); }
  /* "No auditado" no es un nivel de riesgo: es ausencia de datos. Gris. */
  .header-card.not-audited::before { background: var(--text-muted); }

  .header-main { flex: 1; min-width: 0; }
  .header-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .host-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.4px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .host-name .icon { width: 20px; height: 20px; color: var(--text-secondary); }
  /* Mono: el hostname es un identificador. */
  .host-name-text {
    font-family: var(--font-mono);
    font-size: 24px;
    overflow-wrap: anywhere;
  }

  .header-idline {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1px;
  }
  /* Cada nivel con su familia completa: fondo pálido, texto y borde del mismo color. */
  .risk-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1.5px solid var(--critical-border); }
  .risk-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1.5px solid var(--high-border); }
  .risk-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1.5px solid var(--medium-border); }
  .risk-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1.5px solid var(--low-border); }
  .risk-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1.5px solid var(--info-border); }
  /* Ausencia de datos, no ausencia de riesgo. Gris neutro, nunca verde. */
  .risk-badge.not-audited { background: var(--surface); color: var(--text-secondary); border: 1.5px solid var(--border); }
  .risk-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .risk-note { font-size: 13px; color: var(--text-secondary); }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 14px 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-key {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-secondary);
  }
  .meta-val { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  /* Mono solo donde hay una dirección, un rango o un identificador. */
  .meta-val-mono { font-family: var(--font-mono); font-size: 12px; }
  .meta-item-actions { grid-column: span 2; }
  .meta-item-wide { grid-column: span 3; }
  @media (max-width: 1100px) { .meta-item-wide { grid-column: span 2; } }
  .meta-item-actions .dl-group { margin-top: 1px; flex-wrap: nowrap; }
  /* En el export se poda .dl-group: sin .dl-btn la celda "Exportar" se oculta entera. */
  .meta-item-actions:not(:has(.dl-btn)) { display: none; }

  .dl-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 11px;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .dl-btn:hover { background: var(--accent); color: #fff; }

  /* Columna derecha: el hueco que en host ocupa el gauge de Lynis. */
  .header-aside {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 190px;
    padding-left: 28px;
    border-left: 1px solid var(--border);
  }
  .aside-label-top {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-secondary);
  }
  .port-count-num {
    font-family: var(--font-mono);
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--text);
  }
  /* Todos los puertos son informativos: no hay nada que arreglar. */
  .port-count-num.all-info { color: var(--low); }
  /* Objetivo no auditado: gris, nunca el verde de "todo correcto". */
  .port-count-num.no-data { color: var(--text-secondary); }
  .port-count-note { font-size: 11px; color: var(--text-secondary); text-align: center; }

  .port-breakdown {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    margin-top: 4px;
  }
  .port-breakdown-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .port-breakdown-row.is-zero { opacity: .5; }
  .port-breakdown-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .port-breakdown-name { color: var(--text-secondary); flex: 1; }
  .port-breakdown-val { font-weight: 700; color: var(--text); font-family: var(--font-mono); }

  @media (max-width: 820px) {
    .header-card { flex-direction: column; }
    .header-aside { padding-left: 0; padding-top: 20px; border-left: none; border-top: 1px solid var(--border); align-self: stretch; }
  }

  /* ═══ AVISOS ═══ Mismo .lca-notice de host: el nivel marca el peso y el tono el color. */
  .lca-notice {
    --notice-accent: var(--text-secondary);
    --notice-bg: var(--card);
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--notice-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--notice-accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .lca-notice-icon { color: var(--notice-accent); margin-top: 1px; }
  .lca-notice-main { flex: 1; min-width: 0; }
  .lca-notice-title { font-weight: 700; color: var(--text); }
  .lca-notice-lead { font-size: 12.5px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .lca-notice-body { font-size: 12.5px; color: var(--text); line-height: 1.6; margin-top: 6px; }
  .lca-notice-body.is-strong { font-weight: 600; }
  /* scanWarn.desc trae saltos de línea que forman parte del texto. */
  .lca-notice-body.is-prewrap { white-space: pre-line; }
  .lca-notice-list {
    margin: 8px 0 0; padding-left: 20px;
    font-size: 12.5px; color: var(--text); line-height: 1.7;
  }
  .lca-notice-list li { margin-bottom: 2px; }
  .lca-notice-hint {
    font-size: 12px; color: var(--text-secondary); margin-top: 8px;
    font-family: var(--font-mono);
  }
  .lca-notice-foot {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.08);
    font-size: 11.5px; color: var(--text-secondary);
  }

  .lca-notice.is-ok      { --notice-accent: var(--low);      --notice-bg: var(--low-bg);      border-color: var(--low-border); }
  .lca-notice.is-warn    { --notice-accent: var(--medium);   --notice-bg: var(--medium-bg);   border-color: var(--medium-border); }
  .lca-notice.is-info    { --notice-accent: var(--info);     --notice-bg: var(--info-bg);     border-color: var(--info-border); }
  .lca-notice.is-neutral { --notice-accent: var(--text-secondary); --notice-bg: var(--card);  border-color: var(--border); }
  .lca-notice.is-ok   .lca-notice-title { color: #3F6212; }
  .lca-notice.is-warn .lca-notice-title { color: #92400E; }

  .lca-notice.lvl-1 { padding: 16px 20px; margin-bottom: 14px; }
  .lca-notice.lvl-1 .lca-notice-title { font-size: 15px; }
  .lca-notice.lvl-1 .lca-notice-icon  { width: 18px; height: 18px; }
  .lca-notice.lvl-2 .lca-notice-title { font-size: 14px; }
  .lca-notice.lvl-3 {
    --notice-bg: var(--card);
    border-color: var(--border);
    padding: 12px 16px;
  }
  .lca-notice.lvl-3 .lca-notice-title { font-size: 13px; color: var(--text); }
  .lca-notice.lvl-3 .lca-notice-body,
  .lca-notice.lvl-3 .lca-notice-lead  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-icon  { width: 14px; height: 14px; }

  /* ═══ PIE DEL INFORME ══════════════════════════════════════════════════════ */
  .report-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 28px;
    margin-top: 20px;
    padding: 14px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .report-foot-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .report-foot-key {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .7px; color: var(--text-secondary);
  }
  .report-foot-val { font-size: 11.5px; color: var(--text-secondary); overflow-wrap: anywhere; }

  /* ── MAIN CONTENT ─────────────────────────────────────────────── */
  .main { padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; }

  /* ── SECTION TITLE ───────────────────────────────────────────── */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── PORT GRID ───────────────────────────────────────────────── */
  .port-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .port-card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 16px 14px;
    border: 1px solid var(--border);
    border-left: 4px solid;
    position: relative;
    transition: box-shadow .15s, transform .15s;
    cursor: default;
  }
  .port-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,.07); transform: translateY(-1px); }

  .port-card.sev-high     { background: var(--high-bg);     border-left-color: var(--high); }
  .port-card.sev-medium   { background: var(--medium-bg);   border-left-color: var(--medium); }
  .port-card.sev-info     { background: var(--info-bg);     border-left-color: var(--info); }
  .port-card.sev-low      { background: var(--low-bg);      border-left-color: var(--low); }
  .port-card.sev-critical { background: var(--critical-bg); border-left-color: var(--critical); }

  .port-sev-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 7px; border-radius: 10px;
  }
  /* Fondo pálido y texto 700, como host, por contraste. */
  .port-sev-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1px solid var(--high-border); }
  .port-sev-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1px solid var(--medium-border); }
  .port-sev-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1px solid var(--info-border); }
  .port-sev-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1px solid var(--low-border); }
  .port-sev-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1px solid var(--critical-border); }

  .port-number {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 4px;
  }
  .port-service {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
  }
  .port-meta {
    display: flex; flex-direction: column; gap: 3px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.06);
  }
  .port-meta-item {
    font-size: 11.5px; color: var(--text-secondary);
    display: flex; align-items: center; gap: 5px;
  }
  /* Sobre la tarjeta tintada el gris secundario no llega a 4,5:1: se usa el texto principal. */
  .port-meta-item .meta-key {
    color: var(--text);
    font-size: 10.5px;
    min-width: 48px;
  }
  .port-meta-item code {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text);
  }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 24px;
    gap: 12px;
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .empty-state .empty-ico { color: var(--text-muted); margin-bottom: 4px; }
  .empty-title { font-size: 18px; font-weight: 600; color: var(--low); }
  /* El verde de arriba comunica "correcto"; cuando no hubo auditoría, gris. */
  .empty-title--neutral { color: var(--text-secondary); }
  .empty-sub { font-size: 14px; color: var(--text-secondary); text-align: center; }

  /* ── TWO-COLUMN ROW ──────────────────────────────────────────── */
  .two-col {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
    align-items: start;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  /* Bar chart */
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    height: 130px;
    padding: 0 4px;
    margin: 18px 0 14px;
  }
  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    height: 100%;
    justify-content: flex-end;
    gap: 5px;
    cursor: pointer;
    border-radius: 8px;
    padding: 4px 2px;
    transition: background .15s;
  }
  .bar-col:hover { background: var(--accent-dim); }
  .bar-col-active { background: var(--accent-dim); box-shadow: inset 0 0 0 2px var(--accent); }
  .filter-empty {
    margin-top: 12px; font-size: 12.5px; color: var(--text-secondary);
    background: var(--card); border: 1px dashed var(--border);
    border-radius: 8px; padding: 10px 12px; text-align: center;
  }
  .filter-empty a { color: var(--accent); font-weight: 600; text-decoration: none; margin-left: 6px; }
  .bar-count {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .bar-fill {
    width: 100%;
    border-radius: 6px 6px 2px 2px;
    transition: height .4s cubic-bezier(.4,0,.2,1);
    min-height: 4px;
    position: relative;
  }
  .bar-ports {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    position: absolute;
    bottom: 6px;
    left: 0; right: 0;
  }
  /* Números dentro de la barra: ningún relleno da contraste con blanco, así que llevan píldora oscura. */
  .bar-port-num {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    background: rgba(15, 23, 42, .82);
    border-radius: 3px;
    padding: 1px 3px;
    display: inline-block;
  }
  .bar-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
  }
  .bar-axis {
    height: 1px;
    background: var(--border);
    margin: 0 4px 10px;
  }
  .bar-total-label {
    text-align: center;
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .bar-total-label strong {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
  }

  /* Table */
  .port-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .port-table th {
    text-align: left;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text-secondary);
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--border);
  }
  .port-table td {
    padding: 9px 10px;
    vertical-align: middle;
  }
  .port-table tr:nth-child(even) td { background: var(--bg); }
  .port-table tr:last-child td:first-child { border-radius: 0 0 0 8px; }
  .port-table tr:last-child td:last-child  { border-radius: 0 0 8px 0; }

  .port-table .td-port {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }
  .port-table .td-service {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-secondary);
  }
  .port-table .td-process {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
  }

  .badge {
    display: inline-block;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 2px 8px; border-radius: 10px;
  }
