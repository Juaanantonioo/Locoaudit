<template>
  <div>

    <!-- ── Sin datos ── -->
    <!-- Icono en línea: este estado queda fuera de .lca-report-root y no ve el sprite. -->
    <div v-show="state === 'idle'" class="lca-state-center">
      <svg class="icon icon-xl lca-state-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path>
      </svg>
      <h3 class="lca-state-title">Esperando auditoría de red…</h3>
      <p class="lca-state-desc">Pulsa el botón de inicio en Node-RED para escanear los puertos de tu equipo.</p>
    </div>

    <!-- ── Escaneando ── -->
    <div v-show="state === 'scanning'" class="lca-state-center">
      <div class="lca-spinner"></div>
      <p class="lca-state-desc">Escaneando puertos…</p>
    </div>

    <!-- ── Resultados ── -->
    <div v-if="state === 'done' && auditData" class="lca-report-root">

      <!-- ══ SPRITE DE ICONOS ══ -->
      <!-- Primer hijo de .lca-report-root para que el sprite viaje con el clon del export.
           No renombrar la clase: no debe casar con el prune del export ni con el @media print. -->
      <svg class="lca-sprite" aria-hidden="true" focusable="false"><defs>
        <symbol id="lca-i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path></symbol>
        <symbol id="lca-i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></symbol>
        <symbol id="lca-i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></symbol>
        <symbol id="lca-i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></symbol>
        <symbol id="lca-i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></symbol>
        <symbol id="lca-i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></symbol>
        <symbol id="lca-i-antenna" viewBox="0 0 24 24"><path d="M5 15a9 9 0 0 1 0-11M8.5 12.5a4.5 4.5 0 0 1 0-6"></path><circle cx="12" cy="9.5" r="1.6"></circle><path d="M15.5 6.5a4.5 4.5 0 0 1 0 6M19 4a9 9 0 0 1 0 11M12 11v10M9 21h6"></path></symbol>
        <symbol id="lca-i-minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
        <symbol id="lca-i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"></path></symbol>
        <symbol id="lca-i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></symbol>
        <symbol id="lca-i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></symbol>
        <symbol id="lca-i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></symbol>
        <symbol id="lca-i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"></path></symbol>
        <symbol id="lca-i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></symbol>
      </defs></svg>

      <!-- ══ HEADER ══ -->
      <!-- Misma anatomía que host; el hueco del gauge lo ocupa el contador de puertos.
           La barra toma el color del riesgo real (claseRiesgo), igual que el badge. -->
      <div class="header-card" :class="claseRiesgo">
        <div class="header-main">
          <div class="header-eyebrow">LoCoAudit · Auditoría de red</div>
          <div class="host-name">
            <svg class="icon"><use href="#lca-i-globe"></use></svg>
            <span class="host-name-text">{{ auditData.host && auditData.host.hostname }}</span>
          </div>
          <div class="header-idline">
            <span class="risk-badge" :class="claseRiesgo">
              <span class="risk-badge-dot"></span>
              {{ etiquetaRiesgo }}
            </span>
            <!-- Mismo recuento que la columna derecha. -->
            <span class="risk-note"><template v-if="sinDatosPuertos">Sin datos de puertos</template><template v-else-if="totalDonut === 1">{{ totalDonut + ' puerto abierto' }}</template><template v-else>{{ totalDonut + ' puertos abiertos' }}</template></span>
          </div>

          <div class="meta-grid">
            <div class="meta-item">
              <span class="meta-key">Plataforma</span>
              <span class="meta-val">{{ auditData.host && auditData.host.platform }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Fuente</span>
              <span class="meta-val">{{ etiquetaFuente }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Modo</span>
              <span class="meta-val">{{ etiquetaModo }}</span>
            </div>
            <div class="meta-item" v-if="etiquetaObjetivo">
              <span class="meta-key">Objetivo</span>
              <span class="meta-val meta-val-mono">{{ etiquetaObjetivo }}</span>
            </div>
            <div class="meta-item" v-if="etiquetaNombreHost">
              <span class="meta-key">Nombre</span>
              <span class="meta-val meta-val-mono">{{ etiquetaNombreHost }}</span>
            </div>
            <!-- Celda ancha: el rango de puertos es largo y estiraría la fila. -->
            <div class="meta-item meta-item-wide" v-if="etiquetaRango">
              <span class="meta-key">Puertos</span>
              <span class="meta-val meta-val-mono">{{ etiquetaRango }}</span>
            </div>
            <div class="meta-item" v-if="auditData.scanMeta && auditData.scanMeta.durationMs">
              <span class="meta-key">Duración</span>
              <span class="meta-val">{{ etiquetaDuracion }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Análisis</span>
              <span class="meta-val">{{ horaEscaneo }}</span>
            </div>
            <div class="meta-item meta-item-actions">
              <span class="meta-key">Exportar</span>
              <span class="dl-group">
                <button class="dl-btn" @click="descargarHtml" title="Descargar informe HTML (imprimible a PDF)">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> HTML
                </button>
                <button class="dl-btn" @click="descargarJson" title="Descargar datos JSON">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> JSON
                </button>
              </span>
            </div>
          </div>
        </div>

        <!-- Puertos abiertos por severidad, desde columnasBarras (el mismo computed que el gráfico). -->
        <div class="header-aside">
          <span class="aside-label-top">Puertos abiertos</span>
          <div class="port-count-num" :class="{ 'all-info': todoInformativo && !sinDatosPuertos, 'no-data': sinDatosPuertos }">{{ etiquetaNumPuertos }}</div>
          <!-- Sin datos no hay desglose: un reparto de ceros se leería como "limpio". -->
          <div class="port-breakdown" v-if="!sinDatosPuertos && totalDonut > 0">
            <div class="port-breakdown-row" v-for="col in columnasBarras" :key="'hb-' + col.sev"
                 :class="{ 'is-zero': col.count === 0 }">
              <span class="port-breakdown-dot" :style="{ background: colorPunto(col) }"></span>
              <span class="port-breakdown-name">{{ col.label }}</span>
              <span class="port-breakdown-val">{{ col.count }}</span>
            </div>
          </div>
          <span class="port-count-note" v-else-if="sinDatosPuertos">No se ha llegado a escanear</span>
          <span class="port-count-note" v-else>Sin servicios de red visibles</span>
        </div>
      </div>

      <!-- ══ AVISOS ══ .lca-notice en tres niveles, como host. avisoEscaneo es siempre cobertura (nivel 2):
           neutro si el objetivo no responde, ámbar si el escaneo quedó a medias. -->
      <div class="lca-notice lvl-2" v-if="avisoEscaneo"
           :class="claseAviso()">
        <svg class="icon lca-notice-icon"><use :href="iconoAviso()"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ avisoEscaneo.title }}</div>
          <div class="lca-notice-body is-prewrap">{{ avisoEscaneo.desc }}</div>
        </div>
      </div>


      <!-- ══ MAIN ══ -->
      <main class="main">

        <!-- 1 · MAPA DE PUERTOS -->
        <section>
          <div class="section-title">Mapa de puertos</div>
          <!-- 0 puertos: verde si el objetivo respondió; neutro si no hubo auditoría. -->
          <div class="port-grid" v-if="puertosOrdenados.length > 0">
            <div v-for="(p, i) in puertosVisibles" :key="'pg-'+i"
                 class="port-card" :class="'sev-' + (p.severity || 'info').toLowerCase()">
              <span class="port-sev-badge" :class="(p.severity || 'info').toLowerCase()">
                {{ etiquetaSeveridad(p.severity) }}
              </span>
              <div class="port-number">{{ p.port }}</div>
              <div class="port-service">{{ p.service || 'unknown' }}</div>
              <div class="port-meta" v-if="p.process || p.version">
                <div class="port-meta-item" v-if="p.process">
                  <span class="meta-key">Proceso</span>
                  <code>{{ p.process }}<template v-if="p.pid != null">{{ ' (' + p.pid + ')' }}</template><template v-else></template></code>
                </div>
                <div class="port-meta-item" v-if="p.version">
                  <span class="meta-key">Versión</span>
                  <code>{{ p.version }}</code>
                </div>
                <div class="port-meta-item" v-if="p.protocol">
                  <span class="meta-key">Proto</span>
                  <code>{{ p.protocol }}</code>
                </div>
              </div>
            </div>
          </div>
          <div class="empty-state" v-else-if="noAuditado">
            <svg class="icon icon-xl empty-ico"><use href="#lca-i-antenna"></use></svg>
            <div class="empty-title empty-title--neutral">Auditoría no realizada</div>
            <div class="empty-sub">
              No se ha podido contactar con <strong>{{ etiquetaObjetivo || 'el objetivo' }}</strong>, así que no se ha escaneado ningún puerto.<br>
              Esto <strong>no</strong> quiere decir que el equipo esté seguro: quiere decir que no se ha podido comprobar.
            </div>
          </div>
          <div class="empty-state" v-else>
            <svg class="icon icon-xl empty-ico"><use href="#lca-i-check-circle"></use></svg>
            <div class="empty-title">Sin puertos expuestos</div>
            <div class="empty-sub">El escaneo no encontró puertos abiertos.<br>Tu equipo no tiene servicios de red visibles.</div>
          </div>
          <div v-if="puertosOrdenados.length > 0 && puertosVisibles.length === 0" class="filter-empty">
            Ningún puerto con severidad <strong>{{ etiquetaSeveridad(filterSev) }}</strong>.
            <a href="#" @click.prevent="filterSev = 'all'">Quitar filtro</a>
          </div>
        </section>

        <!-- 2 · BARRA DE SEVERIDAD + TABLA DE PUERTOS -->
        <div class="two-col" v-if="puertosOrdenados.length > 0">

          <!-- Gráfico de barras -->
          <div class="card">
            <div class="section-title" style="margin-bottom:0">Exposición por severidad</div>
            <div class="bar-chart">
              <div class="bar-col" v-for="col in columnasBarras" :key="col.sev"
                   :class="{ 'bar-col-active': filterSev === col.sev }"
                   @click="alternarFiltroSeveridad(col.sev)" title="Filtrar por esta severidad">
                <div class="bar-count" :style="{ color: colorCifra(col) }">{{ col.count }}</div>
                <div class="bar-fill"
                     :style="{ background: col.color, height: col.height + 'px', opacity: opacidadBarra(col) }">
                  <div class="bar-ports">
                    <div class="bar-port-num" v-for="p in col.ports" :key="p">{{ p }}</div>
                  </div>
                </div>
                <div class="bar-label">{{ col.label }}</div>
              </div>
            </div>
            <div class="bar-axis"></div>
            <div class="bar-total-label">
              <strong>{{ totalDonut }}</strong> puerto<template v-if="totalDonut !== 1">s</template><template v-else></template> abierto<template v-if="totalDonut !== 1">s</template><template v-else></template>
            </div>
          </div>

          <!-- Tabla resumen -->
          <div class="card" style="padding:18px">
            <div class="section-title" style="margin-bottom:12px">Resumen de puertos</div>
            <table class="port-table">
              <thead>
                <tr>
                  <th>Puerto</th>
                  <th>Servicio</th>
                  <th>Proceso</th>
                  <th>Severidad</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(p, i) in puertosVisibles" :key="'tr-'+i">
                  <td class="td-port">{{ p.port }}</td>
                  <td class="td-service">{{ p.service || 'unknown' }}</td>
                  <td class="td-process">{{ p.process || '—' }}</td>
                  <td>
                    <span class="badge" :class="(p.severity || 'info').toLowerCase()">{{ etiquetaSeveridad(p.severity) }}</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 3 · HALLAZGOS, AGRUPADOS POR PUERTO -->
        <!-- Una sola lista agrupada por puerto; agrupa, no fusiona: cada hallazgo mantiene su ficha. -->
        <section v-if="gruposHallazgos.length > 0">
          <div class="section-title">Hallazgos</div>
          <div class="findings-list">
            <template v-for="g in gruposHallazgos" :key="g.key">
              <!-- No renombrar .group-header ni .group-body: el export los busca por subcadena
                   y el cuerpo debe ser el hermano siguiente de la cabecera. -->
              <div class="findings-group">
                <div class="group-header" @click="alternarGrupo(g.key)">
                  <code v-if="g.port != null" class="group-port">{{ g.port }}/{{ g.protocol }}</code>
                  <span v-else class="group-port group-port-general">General</span>
                  <span class="group-service"><template v-if="g.port == null">Estado del escaneo</template><template v-else>{{ g.service || 'servicio no identificado' }}</template></span>
                  <code v-if="g.version" class="group-version">{{ g.version }}</code>
                  <span class="group-sevs">
                    <span v-if="g.sev.critical" class="gsev critical">{{ g.sev.critical }}</span>
                    <span v-if="g.sev.high"     class="gsev high">{{ g.sev.high }}</span>
                    <span v-if="g.sev.medium"   class="gsev medium">{{ g.sev.medium }}</span>
                    <span v-if="g.sev.low"      class="gsev low">{{ g.sev.low }}</span>
                    <span v-if="g.sev.info"     class="gsev info">{{ g.sev.info }}</span>
                  </span>
                  <svg class="icon icon-sm group-chevron" :class="{ open: grupoAbierto(g.key) }"><use href="#lca-i-chevron"></use></svg>
                </div>
                <div class="group-body" v-show="grupoAbierto(g.key)">
                  <div class="finding-item" v-for="(f, fi) in g.findings" :key="g.key + '-' + fi">
                    <div class="finding-header" @click="alternarHallazgo(g.key + '-' + fi)">
                      <span class="badge" :class="(f.severity || 'info').toLowerCase()">{{ etiquetaSeveridad(f.severity) }}</span>
                      <!-- Tipo según el prefijo del id (ver etiquetaTipo). -->
                      <span class="badge cat" v-if="etiquetaTipo(f)">{{ etiquetaTipo(f) }}</span>
                      <div class="finding-title">{{ f.title }}</div>
                      <code class="finding-id" v-if="f.id">{{ f.id }}</code>
                      <svg class="icon icon-sm finding-chevron" :class="{ open: openFindings[g.key + '-' + fi] }"><use href="#lca-i-chevron"></use></svg>
                    </div>
                    <div class="finding-body" :class="{ open: openFindings[g.key + '-' + fi] }">
                      <div class="detail-stack" v-if="f.evidence || f.fix || filasCve(f).length">
                        <!-- La evidencia se muestra aunque no haya fix. -->
                        <div class="detail-col" v-if="f.evidence">
                          <div class="detail-col-title">Evidencia</div>
                          <pre class="detail-evidence">{{ f.evidence }}</pre>

                          <!-- Tira de metadatos: solo NET-VULN-*, con datos de vulners vía NSE. -->
                          <div v-if="tieneMeta(f)" class="meta-strip">
                            <div v-if="f.service" class="meta-cell">
                              <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-antenna"></use></svg> Servicio</span>
                              <span class="meta-value">{{ f.service }}</span>
                            </div>
                            <div v-if="f.version" class="meta-cell">
                              <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-info"></use></svg> Versión anunciada</span>
                              <span class="meta-value meta-mono">{{ f.version }}</span>
                            </div>
                            <div v-if="cvssMaximo(f) != null" class="meta-cell">
                              <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-alert"></use></svg> CVSS máximo</span>
                              <span class="meta-value">
                                {{ Number(cvssMaximo(f)).toFixed(1) }}
                                <span class="cvss-chip" :class="(f.severity || 'info').toLowerCase()">{{ etiquetaSeveridad(f.severity) }}</span>
                              </span>
                            </div>
                            <div class="meta-cell">
                              <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg> CVE</span>
                              <span class="meta-value">{{ filasCve(f).length }}</span>
                            </div>
                            <div class="meta-cell">
                              <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-search"></use></svg> Fuente</span>
                              <span class="meta-value">Nmap + vulners</span>
                            </div>
                          </div>
                        </div>

                        <!-- Todos los CVE, ordenados por nota y sin scroll interno, para que salgan enteros al imprimir. -->
                        <div class="detail-col" v-if="filasCve(f).length">
                          <div class="detail-col-title">CVE publicados</div>
                          <table class="cve-table">
                            <thead>
                              <tr><th>CVE</th><th>CVSS</th><th>Severidad</th><th>Ficha</th></tr>
                            </thead>
                            <tbody>
                              <tr v-for="v in filasCve(f)" :key="v.id">
                                <td><code class="cve-id">{{ v.id }}</code></td>
                                <td><span class="cve-score"><template v-if="v.cvss != null">{{ Number(v.cvss).toFixed(1) }}</template><template v-else>—</template></span></td>
                                <td>
                                  <span class="cvss-chip" :class="(v.severity || 'info').toLowerCase()">{{ etiquetaSeveridad(v.severity) }}</span>
                                  <span v-if="v.isExploit" class="cve-exploit">exploit público</span>
                                </td>
                                <td>
                                  <a v-if="v.url" class="meta-link" :href="v.url" target="_blank" rel="noopener">{{ v.label || 'Ver' }} <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                                  <span v-else class="meta-muted">no disponible</span>
                                </td>
                              </tr>
                            </tbody>
                          </table>
                          <p v-if="f.provenance" class="cve-origin">
                            <svg class="icon icon-sm"><use href="#lca-i-info"></use></svg>
                            <span><strong>Procedencia.</strong> {{ f.provenance }}</span>
                          </p>
                        </div>

                        <div class="detail-col" v-if="f.fix">
                          <div class="detail-col-title">Resolución</div>
                          <!-- Una rama por alternativa excluyente; dentro de cada rama, pasos en orden (<ol>). -->
                          <template v-if="!f.isCommand">
                            <!-- v-for sobre un array de un elemento: parsea el fix una sola vez. -->
                            <div class="fix-plan" v-for="(fx, xi) in [pasosDeSolucion(f.fix)]" :key="xi">
                              <!-- La intro describe el servicio y va sin numerar. -->
                              <p v-for="(ln, ii) in fx.intro" :key="'i' + ii" class="fix-intro">{{ ln }}</p>
                              <p v-for="(nt, ni) in fx.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                              <div class="fix-branch" v-for="(br, bi) in fx.branches" :key="bi">
                                <div v-if="br.heading" class="fix-branch-title">{{ br.heading }}</div>
                                <ol class="fix-steps" v-if="br.steps.length"
                                    :class="{ 'fix-steps-single': br.steps.length === 1 && !br.heading }">
                                  <li class="fix-step" v-for="(st, si) in br.steps" :key="si">
                                    <span v-if="st.label" class="fix-step-label">{{ st.label }}</span>
                                    <!-- El comando va DENTRO del paso que lo usa, no como paso aparte. -->
                                    <span v-if="st.cmd" class="command-box command-inline">
                                      <code class="command-text">{{ st.cmd }}</code>
                                      <button @click.stop="copiarComando(st.cmd)"
                                              :class="{ copied: copiedKey === st.cmd }"
                                              class="command-btn">
                                        <svg class="icon icon-sm" v-if="copiedKey === st.cmd"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === st.cmd"> Copiado</template><template v-else>Copiar</template>
                                      </button>
                                    </span>
                                  </li>
                                </ol>
                                <p v-for="(nt, ni) in br.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                              </div>
                            </div>
                          </template>
                          <p v-if="f.isCommand" class="cmd-intro">
                            Comando sugerido<span class="cmd-origin">{{ etiquetaOrigen(f.source) }}</span>:
                          </p>
                          <div v-if="f.isCommand" class="command-box">
                            <code class="command-text">{{ f.command || f.fix }}</code>
                            <button @click.stop="copiarComando(f.command || f.fix)"
                                    :class="{ copied: copiedKey === (f.command || f.fix) }"
                                    class="command-btn">
                              <svg class="icon icon-sm" v-if="copiedKey === (f.command || f.fix)"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === (f.command || f.fix)"> Copiado</template><template v-else>Copiar</template>
                            </button>
                          </div>
                          <p v-if="notaSolucion(f)" class="cmd-note">{{ notaSolucion(f) }}</p>
                          <!-- Una sola nota neutra por ficha; el ámbar se reserva para la severidad Media. -->
                          <div v-if="solucionConComando(f)" class="cmd-note cmd-note-safety">
                            <svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg>
                            <span>LoCoAudit no ejecuta estos comandos: cópialos y revísalos antes de ejecutarlos.<template v-if="solucionConSudo(f)"> Requieren privilegios de administrador.</template></span>
                          </div>
                        </div>
                      </div>
                      <!-- Mismos tres textos que host: distingue "no hace falta" de "no tenemos el paso". -->
                      <div v-if="!f.fix" class="nofix-note">
                        <template v-if="f.noAction">
                          Este hallazgo es informativo. No requiere acción inmediata.
                        </template>
                        <template v-else-if="f.primaryUrl">
                          LoCoAudit no tiene un paso concreto para este hallazgo.
                          <a :href="f.primaryUrl" target="_blank" rel="noopener">Más información <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                        </template>
                        <template v-else>
                          Este hallazgo es informativo. No requiere acción inmediata.
                        </template>
                      </div>

                      <!-- ── Chat con IA ── -->
                      <div class="lca-chat-wrap" v-if="llmAvailable === true">
                        <button class="ai-ask-btn" @click.stop="alternarChat(claveChat(f, g.key + '-' + fi), f)">
                          <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                          <template v-if="chatOpen[claveChat(f, g.key + '-' + fi)]"> Cerrar asistente</template><template v-else> Preguntar a la IA</template>
                        </button>
                        <div class="lca-chat" v-if="chatOpen[claveChat(f, g.key + '-' + fi)]">
                          <!-- Cabecera con el modelo, para saber quién ha escrito la respuesta. -->
                          <div class="lca-chat-head">
                            <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                            <span class="lca-chat-head-title">Asistente</span>
                            <span class="lca-chat-model" v-if="llmModel">{{ llmModel }}</span>
                          </div>
                          <div class="lca-chat-msgs">
                            <div v-for="(cm, ci) in (chatMessages[claveChat(f, g.key + '-' + fi)] || [])" :key="ci"
                                 class="chat-msg" :class="claseMensaje(cm)">
                              <div class="chat-bubble" :class="{ 'chat-error': cm.error }">
                                <template v-for="(seg, si) in trocearRespuesta(cm.content)" :key="si">
                                  <div v-if="seg.type === 'text'" class="chat-text" v-html="seg.html"></div>
                                  <div v-else class="command-box">
                                    <code class="command-text">{{ seg.code }}</code>
                                    <button @click.stop="copiarComando(seg.code)"
                                            :class="{ copied: copiedKey === seg.code }"
                                            class="command-btn">
                                      <svg class="icon icon-sm" v-if="copiedKey === seg.code"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === seg.code"> Copiado</template><template v-else>Copiar</template>
                                    </button>
                                  </div>
                                </template>
                              </div>
                            </div>
                            <div v-if="chatLoading[claveChat(f, g.key + '-' + fi)]" class="chat-msg chat-ai">
                              <div class="chat-bubble chat-loading">
                                <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
                              </div>
                            </div>
                          </div>
                          <div class="lca-chat-input">
                            <input type="text" v-model="chatInput[claveChat(f, g.key + '-' + fi)]"
                                   placeholder="Escribe tu pregunta…"
                                   :disabled="chatLoading[claveChat(f, g.key + '-' + fi)]"
                                   @keydown.enter.prevent="enviarChat(claveChat(f, g.key + '-' + fi), f)">
                            <button class="chat-send-btn"
                                    :disabled="chatLoading[claveChat(f, g.key + '-' + fi)]"
                                    @click.stop="enviarChat(claveChat(f, g.key + '-' + fi), f)">Enviar</button>
                          </div>
                          <!-- Aviso al pie: se lee después de la respuesta, antes de actuar. -->
                          <div class="lca-chat-foot">
                            Un modelo de lenguaje puede equivocarse. Contrasta lo que te diga
                            con la evidencia del hallazgo antes de ejecutar nada.
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </section>

        <!-- Sin hallazgos (nunca si no se ha auditado: eso no es un "todo bien") -->
        <div v-if="puertosOrdenados.length === 0 && gruposHallazgos.length === 0 && !noAuditado"
             class="lca-state-center lca-state-inline">
          <svg class="icon icon-xl lca-state-ico"><use href="#lca-i-check-circle"></use></svg>
          <h3 class="lca-state-title">¡Sin hallazgos!</h3>
          <p class="lca-state-desc">No se encontraron puertos de riesgo en esta auditoría.</p>
        </div>

        <!-- Footer -->
        <div class="report-foot" v-if="auditData.scanMeta">
          <div class="report-foot-item">
            <span class="report-foot-key">Herramienta</span>
            <span class="report-foot-val">LoCoAudit · auditoría de red</span>
          </div>
          <div class="report-foot-item">
            <span class="report-foot-key">Fuentes</span>
            <span class="report-foot-val">{{ etiquetaFuente }} · modo {{ etiquetaModo }}</span>
          </div>
          <div class="report-foot-item">
            <span class="report-foot-key">Generado</span>
            <span class="report-foot-val">{{ horaEscaneo }}</span>
          </div>
        </div>

      </main>

    </div>
  </div>
</template>

<script>
export default {
  data() {
    return {
      state: 'idle',
      auditData: null,
      openFindings: {},
      copiedKey: null,
      // Filtro por severidad: clic en una barra de "Exposición por severidad".
      filterSev: 'all',
      // Los grupos nacen abiertos; solo se guarda lo que el usuario cierra (ver grupoAbierto).
      openGroups: {},
      // ── Chat con LLM (asistente IA) ──
      chatOpen: {},        // por findingKey: panel abierto/cerrado
      chatMessages: {},    // por findingKey: [{ role, content, error? }]
      chatInput: {},       // por findingKey: texto en curso
      chatLoading: {},     // por findingKey: esperando respuesta
      chatEpoch: 0,        // se incrementa con cada escaneo: descarta respuestas en vuelo
      chatModel: {},       // por findingKey: modelo con el que empezó la conversación
      llmAvailable: null,  // null = sin comprobar; true/false tras comprobar
      llmModel: null,      // modelo que responde; /locoaudit/chat/status ya lo devuelve

      // ── Tokens de color leídos del :root (ver leerTokens) para estilos en JS.
      // Vacíos hasta la primera lectura: sin constantes de respaldo que dupliquen el CSS.
      tok: {
        critical: '', high: '', medium: '', low: '', info: '',
        criticalText: '', highText: '', mediumText: '', lowText: '', infoText: '',
        surface: '', textMuted: '', textSecondary: ''
      }
    };
  },

  computed: {
    severidadMaxima() {
      return (this.auditData && this.auditData.summary && this.auditData.summary.maxSeverity) || 'info';
    },

    conteos() {
      var c = (this.auditData && this.auditData.summary && this.auditData.summary.counts) || {};
      return {
        critical: c.critical || 0,
        high:     c.high     || 0,
        medium:   c.medium   || 0,
        low:      c.low      || 0,
        info:     c.info     || 0
      };
    },

    todoInformativo() {
      var c = this.conteos;
      return c.critical === 0 && c.high === 0 && c.medium === 0 && c.low === 0;
    },

    // ── Estado del objetivo: lo decide host-discovery.js (nmap -sn), no la severidad.
    // Payloads antiguos sin el campo: 'reachable'.
    estadoObjetivo() {
      var meta = this.auditData && this.auditData.scanMeta;
      return (meta && meta.targetState) || 'reachable';
    },

    // Único interruptor del modo neutro en toda la vista.
    noAuditado() {
      return this.estadoObjetivo === 'unreachable';
    },

    // Sin recuento si el objetivo no respondió o el escaneo no terminó:
    // cero por no mirar y cero por no haber puertos no se pintan igual.
    sinDatosPuertos() {
      var meta = this.auditData && this.auditData.scanMeta;
      return this.noAuditado || (meta && meta.scanStatus === 'inconclusive');
    },

    claseRiesgo() {
      if (this.noAuditado) {
        return 'not-audited';
      } else {
        return this.severidadMaxima;
      }
    },

    etiquetaRiesgo() {
      if (this.noAuditado) return 'No auditado';
      var MAP = {
        critical: 'Riesgo Crítico', high: 'Riesgo Alto',
        medium: 'Riesgo Moderado', low: 'Riesgo Bajo', info: 'Sin Riesgo'
      };
      return MAP[this.severidadMaxima] || this.severidadMaxima;
    },

    etiquetaNumPuertos() {
      if (this.sinDatosPuertos) {
        return '—';
      } else {
        return this.totalDonut;
      }
    },

    avisoEscaneo() {
      var meta = this.auditData && this.auditData.scanMeta;
      var st = meta && meta.scanStatus;

      // 1. El objetivo no responde: no hay auditoría que interpretar.
      if (this.noAuditado) {
        var disc = (meta && meta.discovery) || {};
        var host = this.etiquetaObjetivo || 'el objetivo';
        // El motivo solo afina el texto; la decisión ya está tomada arriba.
        var causa;
        if (disc.reason === 'host-unreach' || disc.reason === 'net-unreach') {
          causa = 'Este equipo no sabe por dónde llegar hasta ' + host + ': no es que no conteste, es que no hay ruta de red hasta él.';
        } else {
          causa = host + ' no ha respondido a la comprobación previa.';
        }
        let forzado;
        if (meta && meta.forceScan) {
          forzado = ' (Se ha escaneado de todas formas por tener activada la opción "Escanear aunque el equipo no responda".)';
        } else {
          forzado = '';
        }
        return {
          neutral: true,
          title: 'No se ha podido auditar ' + host,
          desc: causa + '\n' +
                'Causas posibles: el equipo está apagado, la dirección IP no es la correcta, ' +
                'no hay ruta de red hasta él (otra subred) o hay una VPN levantada que cambia el camino.\n' +
                'Comprueba primero que responde: ping ' + host + '\n' +
                'No se ha escaneado ningún puerto: la ausencia de hallazgos NO significa que el equipo esté protegido.' +
                forzado
        };
      }

      if (!st || st === 'ok') return null;
      if (st === 'inconclusive') {
        return {
          title: 'Escaneo no concluyente',
          desc: 'El escaneo no terminó (posible firewall que lo ralentiza). ' +
                'Un resultado de 0 puertos NO garantiza que el host sea seguro. ' +
                'Prueba el modo Completo o aumenta el timeout.'
        };
      }
      return {
        title: 'El host no respondió al descubrimiento',
        desc: 'Puede estar protegido por un firewall. El nodo ya usa -Pn; ' +
              'prueba el modo Completo para un rango de puertos mayor.'
      };
    },

    horaEscaneo() {
      var ts = this.auditData && this.auditData.timestamp;
      if (!ts) return '—';
      return new Date(ts).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    etiquetaDuracion() {
      var ms = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.durationMs;
      if (!ms) return '—';
      if (ms >= 1000) {
        return (ms / 1000).toFixed(1) + 's';
      } else {
        return ms + 'ms';
      }
    },

    etiquetaFuente() {
      // 'none' es que no se escanearon puertos (equipo sin responder): sin Nmap el nodo falla antes.
      var src = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.portSource;
      if (src === 'nmap') {
        return 'Nmap';
      } else {
        return 'Nmap, sin escaneo de puertos';
      }
    },

    etiquetaModo() {
      var MAP = { rapido: 'Rápido', standard: 'Estándar', full: 'Completo', custom: 'Personalizado' };
      var mode = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.scanMode;
      return MAP[mode] || mode || 'Estándar';
    },

    etiquetaObjetivo() {
      var meta = this.auditData && this.auditData.scanMeta;
      if (!meta) return null;
      return meta.target || meta.customTarget || null;
    },

    etiquetaNombreHost() {
      var meta = this.auditData && this.auditData.scanMeta;
      var h = meta && meta.hostname;
      // Sin PTR no se pinta nada, ni un guion, como el resto de campos opcionales.
      if (!h) return null;
      // Si el PTR repite el target (p. ej. localhost), se omite.
      if (h === this.etiquetaObjetivo) return null;
      return h;
    },

    etiquetaRango() {
      var meta = this.auditData && this.auditData.scanMeta;
      return (meta && meta.portRange) || null;
    },

    puertosOrdenados() {
      var ports = this.auditData && this.auditData.raw && this.auditData.raw.ports;
      if (!Array.isArray(ports)) return [];
      var SEV_ORDER = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      return ports.slice().sort(function(a, b) {
        return (SEV_ORDER[(b.severity || 'info').toLowerCase()] || 0) -
               (SEV_ORDER[(a.severity || 'info').toLowerCase()] || 0);
      });
    },

    hallazgosOrdenados() {
      var findings = this.auditData && this.auditData.findings;
      if (!Array.isArray(findings)) return [];
      var SEV_ORDER = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      return findings.slice().sort(function(a, b) {
        return (SEV_ORDER[(b.severity || 'info').toLowerCase()] || 0) -
               (SEV_ORDER[(a.severity || 'info').toLowerCase()] || 0);
      });
    },

    // Filtro por severidad (clic en una barra de "Exposición por severidad").
    puertosVisibles() {
      var self = this;
      if (this.filterSev === 'all') return this.puertosOrdenados;
      return this.puertosOrdenados.filter(function(p) {
        return (p.severity || 'info').toLowerCase() === self.filterSev;
      });
    },
    hallazgosVisibles() {
      var self = this;
      if (this.filterSev === 'all') return this.hallazgosOrdenados;
      return this.hallazgosOrdenados.filter(function(f) {
        return (f.severity || 'info').toLowerCase() === self.filterSev;
      });
    },

    // Grupos por puerto+protocolo: agrupa sin fusionar NET-VULN y NET-PORT del mismo puerto.
    // Los hallazgos sin puerto van a "General", al principio.
    gruposHallazgos() {
      var rank = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      var grupos = {};
      var orden = [];
      this.hallazgosVisibles.forEach(function (f) {
        var conPuerto = Number.isInteger(f.port);
        var protocol = f.protocol || 'tcp';
        var key;
        if (conPuerto) {
          key = f.port + '/' + protocol;
        } else {
          key = 'general';
        }
        if (!grupos[key]) {
          let puerto;
          let protocolo;
          if (conPuerto) {
            puerto = f.port;
            protocolo = protocol;
          } else {
            puerto = null;
            protocolo = null;
          }
          grupos[key] = {
            key: key,
            port: puerto,
            protocol: protocolo,
            service: null,
            version: null,
            findings: [],
            maxSeverity: 'info',
            sev: { critical: 0, high: 0, medium: 0, low: 0, info: 0 }
          };
          orden.push(key);
        }
        var g = grupos[key];
        g.findings.push(f);
        // Servicio y versión del primer hallazgo que los traiga (NET-PORT no siempre).
        if (!g.service && f.service) g.service = f.service;
        if (!g.version && f.version) g.version = f.version;
        var sev = (f.severity || 'info').toLowerCase();
        if (g.sev[sev] != null) g.sev[sev]++;
        if ((rank[sev] || 0) > (rank[g.maxSeverity] || 0)) g.maxSeverity = sev;
      });
      return orden.map(function (k) {
        var g = grupos[k];
        g.findings.sort(function (a, b) {
          return (rank[(b.severity || 'info').toLowerCase()] || 0) -
                 (rank[(a.severity || 'info').toLowerCase()] || 0);
        });
        return g;
      }).sort(function (a, b) {
        // "General" primero: si algo no se pudo mirar, se lee antes que cualquier recuento.
        if ((a.port == null) !== (b.port == null)) {
          if (a.port == null) {
            return -1;
          } else {
            return 1;
          }
        }
        return (rank[b.maxSeverity] || 0) - (rank[a.maxSeverity] || 0) ||
               (a.port || 0) - (b.port || 0);
      });
    },

    columnasBarras() {
      var ports = this.puertosOrdenados;
      // Color en cadena de estilo: se lee del :root porque var() no llega ahí.
      var T = this.tok;
      // `color` rellena la barra; `textColor` (tono 700) pinta la cifra con contraste suficiente.
      var defs = [
        { sev: 'high',   label: 'Alto',  color: T.high,   textColor: T.highText },
        { sev: 'medium', label: 'Medio', color: T.medium, textColor: T.mediumText },
        { sev: 'low',    label: 'Bajo',  color: T.low,    textColor: T.lowText },
        { sev: 'info',   label: 'Info',  color: T.info,   textColor: T.infoText }
      ];
      var cols = defs.map(function(d) {
        var matching = ports.filter(function(p) {
          return (p.severity || 'info').toLowerCase() === d.sev;
        });
        return {
          sev:   d.sev,
          label: d.label,
          color: d.color,
          textColor: d.textColor,
          count: matching.length,
          ports: matching.slice(0, 3).map(function(p) { return p.port; })
        };
      });
      var maxCount = Math.max.apply(null, cols.map(function(c) { return c.count; }));
      if (maxCount === 0) maxCount = 1;
      cols.forEach(function(c) {
        c.height = Math.max(4, Math.round((c.count / maxCount) * 110));
      });
      return cols;
    },

    totalDonut() {
      var meta = this.auditData && this.auditData.scanMeta;
      var open = meta && meta.portsOpen;
      let abiertos;
      if (open != null) {
        abiertos = open;
      } else {
        abiertos = null;
      }
      return abiertos || this.puertosOrdenados.length;
    }
  },

  watch: {
    msg: {
      deep: false,
      handler(newMsg) {
        if (!newMsg) return;
        if (!newMsg.payload || !newMsg.payload.findings) {
          this.state = 'scanning';
          return;
        }
        this.auditData    = newMsg.payload;
        this.state        = 'done';
        this.leerTokens();   // síncrono: el primer pintado de los resultados ya va con color
        this.openFindings = {};
        this.reiniciarChats();
        this.consultarEstadoLlm();   // la cabecera del chat muestra el modelo del llm-config de este resultado
      }
    }
  },

  methods: {
    colorPunto(col) {
      if (col.count > 0) {
        return col.color;
      } else {
        return 'var(--text-muted)';
      }
    },

    claseAviso() {
      if (this.avisoEscaneo.neutral) {
        return 'is-neutral';
      } else {
        return 'is-warn';
      }
    },

    iconoAviso() {
      if (this.avisoEscaneo.neutral) {
        return '#lca-i-antenna';
      } else {
        return '#lca-i-alert';
      }
    },

    colorCifra(col) {
      if (col.count > 0) {
        return col.textColor;
      } else {
        return 'var(--text-secondary)';
      }
    },

    opacidadBarra(col) {
      if (col.count > 0) {
        return '1';
      } else {
        return '0.18';
      }
    },

    claseMensaje(cm) {
      if (cm.role === 'user') {
        return 'chat-user';
      } else {
        return 'chat-ai';
      }
    },

    // ── Lee los tokens del :root para estilos en JS, donde no llega var().
    // Si una lectura vuelve vacía se conserva la anterior.
    leerTokens() {
      var cs;
      try { cs = getComputedStyle(document.documentElement); } catch (e) { return; }
      var NOMBRES = {
        critical: '--critical', high: '--high', medium: '--medium', low: '--low',
        info: '--info', surface: '--surface', textMuted: '--text-muted',
        textSecondary: '--text-secondary',
        // El tono legible, para los sitios donde el color va como TEXTO.
        criticalText: '--critical-text', highText: '--high-text',
        mediumText: '--medium-text', lowText: '--low-text', infoText: '--info-text'
      };
      var next = Object.assign({}, this.tok), got = false;
      Object.keys(NOMBRES).forEach(function(k) {
        var v = (cs.getPropertyValue(NOMBRES[k]) || '').trim();
        if (v) { next[k] = v; got = true; }
      });
      if (got) this.tok = next;
    },

    alternarHallazgo(key) {
      this.openFindings = Object.assign({}, this.openFindings, { [key]: !this.openFindings[key] });
    },
    // Abiertos por defecto: el estado guarda solo los cerrados.
    grupoAbierto(key) {
      return this.openGroups[key] !== false;
    },
    alternarGrupo(key) {
      this.openGroups = Object.assign({}, this.openGroups, {
        [key]: !this.grupoAbierto(key)
      });
    },
    // Tipo según el prefijo del id; un id desconocido devuelve "" y no se pinta píldora.
    etiquetaTipo(f) {
      var M = {
        'NET-PORT': 'Exposición',
        'NET-VULN': 'CVE',
        'NET-SVC':  'Configuración',
        'NET-TLS':  'TLS',
        'NET-CFG':  'Configuración',
        'NET-SCAN': 'Estado',
        'NET-DEP':  'Estado',
        'NET-HOST': 'Estado',
        'NET-NSE':  'Estado'
      };
      return M[String((f && f.id) || '').split('-').slice(0, 2).join('-')] || '';
    },
    // Todas las filas de CVE, por nota descendente, sin recorte.
    filasCve(f) {
      var v = f && f.vulnerabilities;
      if (!Array.isArray(v) || !v.length) return [];
      return v.slice().sort(function (a, b) {
        let notaB;
        if (b.cvss == null) {
          notaB = -1;
        } else {
          notaB = b.cvss;
        }
        let notaA;
        if (a.cvss == null) {
          notaA = -1;
        } else {
          notaA = a.cvss;
        }
        return notaB - notaA;
      });
    },
    cvssMaximo(f) {
      var max = null;
      this.filasCve(f).forEach(function (v) {
        if (v.cvss != null && (max == null || v.cvss > max)) max = v.cvss;
      });
      return max;
    },
    // La tira de metadatos solo tiene sentido donde hay datos estructurados detrás.
    tieneMeta(f) {
      return this.filasCve(f).length > 0;
    },
    // Filtro por severidad: clic en la barra activa/desactiva ese filtro.
    alternarFiltroSeveridad(sev) {
      if (this.filterSev === sev) {
        this.filterSev = 'all';
      } else {
        this.filterSev = sev;
      }
    },

    // Origen del comando: lo genera LoCoAudit a partir del análisis de la herramienta.
    etiquetaOrigen(source) {
      var M = {
        trivy: '· a partir del análisis de Trivy',
        lynis: '· a partir de Lynis',
        nmap:  '· a partir de la detección de Nmap',
        native: '· recomendación de LoCoAudit',
      };
      return M[source] || '· recomendación de LoCoAudit';
    },

    // ── Descarga de reporte (HTML imprimible + JSON) ──────────────────────────
    escaparHtml(s) {
      let valor;
      if (s == null) {
        valor = '';
      } else {
        valor = s;
      }
      return String(valor)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    },
    nombreInforme(ext) {
      var d = new Date();
      var dosCifras = function(n) { return String(n).padStart(2, '0'); };
      var stamp = d.getFullYear() + '-' + dosCifras(d.getMonth() + 1) + '-' + dosCifras(d.getDate()) +
                  '_' + dosCifras(d.getHours()) + dosCifras(d.getMinutes());
      var type = (this.auditData && this.auditData.auditType) || 'audit';
      return 'locoaudit-' + type + '-' + stamp + '.' + ext;
    },
    descargar(filename, content, mime) {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    },
    descargarJson() {
      if (!this.auditData) return;
      this.descargar(this.nombreInforme('json'),
        JSON.stringify(this.auditData, null, 2), 'application/json');
    },
    descargarHtml() {
      if (!this.auditData) return;
      this.descargar(this.nombreInforme('html'),
        this.construirInforme(), 'text/html;charset=utf-8');
    },
    construirInforme() {
      try {
        // LCA:SNAPSHOT:START — única fuente: lib/snapshot-body.txt (build-dashboards.js). NO EDITAR.
      // El export es una foto del DOM ya renderizado, así no puede divergir del dashboard.
      var payload = this.auditData || {};
      var auditType = payload.auditType || '';
      // 1. CSS del propio dashboard, localizado por su sentinel.
      var css = '', i, styles = document.querySelectorAll('style');
      var tag = 'LCA-STYLE-DASH:' + auditType;
      for (i = 0; i < styles.length; i++) { if (styles[i].textContent.indexOf(tag) >= 0) { css = styles[i].textContent; break; } }
      if (!css) for (i = 0; i < styles.length; i++) { if (styles[i].textContent.indexOf('LCA-STYLE-DASH') >= 0) { css = styles[i].textContent; break; } }
      if (!css) for (i = 0; i < styles.length; i++) { if (styles[i].textContent.length > css.length) css = styles[i].textContent; }
      // 2. Contenedor de ESTE dashboard; this.$el primero por si hay varios en la página.
      var root = (this.$el && this.$el.querySelector && this.$el.querySelector('.lca-report-root')) || document.querySelector('.lca-report-root') || this.$el;
      var clone = root.cloneNode(true);
      // Quitar lo que necesita servidor (chat IA) y los botones de descarga.
      clone.querySelectorAll('.dl-group,.ia-dl-group,.lca-chat-wrap,.ai-ask-btn,.ia-ask-btn,[class*="chat"]').forEach(function (n) { n.remove(); });
      // 3. Acordeón con el toggle embebido: grupos abiertos y detalles cerrados, como el dashboard.
      clone.querySelectorAll('[class*="group-header"]').forEach(function (h) {
        h.setAttribute('data-lca-acc', 'g');
        var b = h.nextElementSibling;
        if (b) { b.style.display = ''; b.classList.add('open'); b.setAttribute('data-lca-open', '1');
          var cv = h.querySelector('[class*="chevron"]'); if (cv) cv.classList.add('open'); }
      });
      clone.querySelectorAll('[class*="finding-row"],[class*="finding-header"]').forEach(function (h) {
        h.setAttribute('data-lca-acc', 'f');
        var b = h.nextElementSibling;
        if (b) { b.classList.remove('open'); b.setAttribute('data-lca-open', '0'); }
      });
      // 4. CSS extra, toggle/copiar y documento autocontenido.
      // El detalle del alcance llega oculto por v-show; en el informe se fuerza visible y sin botón.
      var extra = '.dl-group,.ia-dl-group,.lca-chat-wrap,.ai-ask-btn,.ia-ask-btn,.scope-toggle{display:none!important}'
        + '.scope-detail{display:block!important}'
        + '[data-lca-acc]{cursor:pointer}.command-btn,.ia-copy-btn{cursor:pointer}'
        + '@media print{[class*="finding-detail"],[class*="finding-body"],[class*="group-body"],[class*="group-findings"]{display:block!important;max-height:none!important;opacity:1!important;overflow:visible!important}}';
      var toggleJs = "(function(){document.addEventListener('click',function(e){var cb=e.target.closest('.command-btn,.ia-copy-btn');if(cb){var box=cb.parentElement,c=box&&box.querySelector('code');var t='';if(c){t=c.textContent;}try{navigator.clipboard.writeText(t);}catch(_){}var o=cb.textContent;cb.textContent='\\u2713 Copiado';setTimeout(function(){cb.textContent=o;},1500);return;}var h=e.target.closest('[data-lca-acc]');if(!h)return;var b=h.nextElementSibling;if(!b)return;var willOpen=b.getAttribute('data-lca-open')==='0';if(willOpen){b.style.display='';}else{b.style.display='none';}b.classList.toggle('open',willOpen);if(willOpen){b.setAttribute('data-lca-open','1');}else{b.setAttribute('data-lca-open','0');}var cv=h.querySelector('[class*=chevron]');if(cv)cv.classList.toggle('open',willOpen);});})();";
      var escapar = function (s) {
        var texto;
        if (s == null) {
          texto = '';
        } else {
          texto = s;
        }
        return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      };
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var hn = (payload.host && payload.host.hostname) || '';
      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">'
        + '<meta name="viewport" content="width=device-width,initial-scale=1">'
        + '<title>LoCoAudit — ' + escapar(titleMap[auditType] || 'Auditoria') + ' — ' + escapar(hn) + '</title>'
        // Etiqueta style partida: el editor de Node-RED busca bloques style en todo el texto y tomaría esta cadena por CSS.
        + '<' + 'style>' + css + '\n' + extra + '</style></head><body><div class="lca-export">'
        + clone.innerHTML + '</div><script>' + toggleJs + '<\/script></body></html>';
        // LCA:SNAPSHOT:END
      } catch (e) {
        console.error('[LoCoAudit] export snapshot fallo, uso tabla de respaldo:', e);
        return this.construirInformeSencillo();
      }
    },
    construirInformeSencillo() {
      var escapar = this.escaparHtml;
      var a = this.auditData || {};
      var host = a.host || {};
      var counts = (a.summary && a.summary.counts) || {};
      var findings = a.findings || [];
      var meta = a.scanMeta || {};
      var sevOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
      var sevLabelMap = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
      var sevColor = { critical: '#B91C1C', high: '#C2410C', medium: '#A16207', low: '#15803D', info: '#0369A1' };

      var rangoDe = function(f) {
        var r = sevOrder[(f.severity || 'info').toLowerCase()];
        if (r === undefined) {
          return 9;
        } else {
          return r;
        }
      };
      var sorted = findings.slice().sort(function(x, y) { return rangoDe(x) - rangoDe(y); });

      var rows = sorted.map(function(f) {
        var sev = (f.severity || 'info').toLowerCase();
        var origen = f.image || f.category || '—';
        let arreglo;
        if (f.fix) {
          arreglo = '<code>' + escapar(f.fix) + '</code>';
        } else {
          arreglo = '—';
        }
        return '<tr>' +
          '<td><span class="sev" style="background:' + sevColor[sev] + '">' + escapar(sevLabelMap[sev] || sev) + '</span></td>' +
          '<td class="mono">' + escapar(f.id) + '</td>' +
          '<td class="mono">' + escapar(origen) + '</td>' +
          '<td>' + escapar(f.title) + '</td>' +
          '<td>' + escapar(f.evidence) + '</td>' +
          '<td>' + arreglo + '</td>' +
          '</tr>';
      }).join('');

      var sumChips = ['critical', 'high', 'medium', 'low', 'info'].map(function(s) {
        return '<span class="chip" style="border-color:' + sevColor[s] + ';color:' + sevColor[s] + '">' +
          (sevLabelMap[s]) + ': <b>' + (counts[s] || 0) + '</b></span>';
      }).join(' ');

      var dur;
      if (meta.durationMs) {
        dur = (meta.durationMs / 1000).toFixed(1) + ' s';
      } else {
        dur = '—';
      }
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var auditTitle = titleMap[a.auditType] || 'Auditoría';

      // Si el objetivo no respondió, el informe no puede leerse como "sin hallazgos = seguro".
      var notAudited = meta.targetState === 'unreachable';
      var notice;
      if (notAudited) {
        notice = '<div class="notice"><b>Auditoría no realizada.</b> No se pudo contactar con ' +
            escapar(meta.target || meta.customTarget || 'el objetivo') +
            ', por lo que no se escaneó ningún puerto. La ausencia de hallazgos NO indica que el equipo esté protegido.</div>';
      } else {
        notice = '';
      }

      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
        '<title>LoCoAudit — ' + escapar(auditTitle) + ' — ' + escapar(host.hostname || '') + '</title>' +
        '<' + 'style>' +
        'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1e1b2e;margin:32px;background:#fff}' +
        'h1{color:#7C3AED;margin:0 0 4px}.sub{color:#666;margin:0 0 20px}' +
        '.meta{font-size:13px;color:#444;margin-bottom:16px}.meta b{color:#1e1b2e}' +
        '.chips{margin:12px 0 24px}.chip{display:inline-block;border:1px solid;border-radius:12px;padding:2px 10px;margin-right:6px;font-size:12px}' +
        'table{border-collapse:collapse;width:100%;font-size:12.5px}' +
        'th,td{border:1px solid #e5dcfa;padding:6px 8px;text-align:left;vertical-align:top}' +
        'th{background:#f3effc;color:#7C3AED}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}' +
        '.sev{color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}' +
        'code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f6f4fc;padding:1px 4px;border-radius:4px}' +
        'footer{margin-top:24px;color:#999;font-size:11px}@media print{body{margin:0}}' +
        '.notice{border:1px solid #cbd5e1;border-left:4px solid #64748b;background:#f8fafc;' +
        'color:#334155;padding:10px 12px;border-radius:6px;margin:0 0 16px;font-size:13px}' +
        '</style></head><body>' +
        '<h1>LoCoAudit · Auditoría de ' + escapar(auditTitle) + '</h1>' +
        '<p class="sub">' + escapar(host.hostname || '') + ' · ' + escapar(host.platform || '') + '</p>' +
        notice +
        '<div class="meta">Fecha: <b>' + escapar(this.horaEscaneo || new Date().toLocaleString()) + '</b> · ' +
        'Duración: <b>' + escapar(dur) + '</b> · Hallazgos: <b>' + findings.length + '</b></div>' +
        '<div class="chips">' + sumChips + '</div>' +
        '<table><thead><tr><th>Severidad</th><th>ID</th><th>Origen</th><th>Título</th><th>Evidencia</th><th>Recomendación</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="6">Sin hallazgos.</td></tr>') + '</tbody></table>' +
        '<footer>Generado por LoCoAudit · ' + escapar(new Date().toISOString()) + '</footer>' +
        '</body></html>';
    },

    // Gramática de `fix` (marcadores puestos en origen), copia del parser de host:
    // "## " abre rama, "$ " comando del último paso, "> " nota sin numerar, resto paso nuevo.
    pasosDeSolucion(fix) {
      var res = { intro: [], notes: [], branches: [] };
      if (!fix) return res;
      var lineas = String(fix).split('\n')
        .map(function (l) { return l.trim(); })
        .filter(function (l) { return l; });
      var hayRamas = lineas.some(function (l) { return l.indexOf('## ') === 0; });
      var actual = null;
      function abrir(heading) {
        actual = { heading: heading, steps: [], notes: [] };
        res.branches.push(actual);
      }
      lineas.forEach(function (s) {
        if (s.indexOf('## ') === 0) { abrir(s.slice(3).trim()); return; }
        if (s.indexOf('> ') === 0) {
          var nota = s.slice(2).trim();
          // Antes de la primera rama la nota cuelga del bloque introductorio.
          if (nota) {
            if (actual) {
              actual.notes.push(nota);
            } else {
              res.notes.push(nota);
            }
          }
          return;
        }
        if (s.indexOf('$ ') === 0) {
          var cmd = s.slice(2).trim();
          if (!cmd) return;
          if (!actual) abrir(null);
          var ultimo = actual.steps[actual.steps.length - 1];
          // Comando sin paso libre: se añade con etiqueta vacía para no perderlo.
          if (!ultimo || ultimo.cmd) actual.steps.push({ label: '', cmd: cmd });
          else ultimo.cmd = cmd;
          return;
        }
        if (hayRamas && !actual) { res.intro.push(s); return; }
        if (!actual) abrir(null);
        actual.steps.push({ label: s, cmd: null });
      });
      res.branches = res.branches.filter(function (r) {
        return r.heading || r.steps.length || r.notes.length;
      });
      return res;
    },

    // El botón copia solo el comando; la nota se muestra aparte.
    notaSolucion(f) {
      if (!f || !f.command || !f.fix) return "";
      return String(f.fix).split("\n").slice(1).join("\n").trim();
    },
    // Todos los comandos de la ficha: `command` y los pasos con "$ ".
    comandosSolucion(f) {
      if (!f || !f.fix) return [];
      var cmds;
      if (f.command) {
        cmds = [String(f.command)];
      } else {
        cmds = [];
      }
      try {
        this.pasosDeSolucion(f.fix).branches.forEach(function (r) {
          r.steps.forEach(function (st) { if (st.cmd) cmds.push(st.cmd); });
        });
      } catch (e) { /* fix ilegible: queda el comando directo, si lo hay */ }
      return cmds;
    },
    // ¿El paso de resolución contiene algún comando (directo o dentro de un paso)?
    solucionConComando(f) {
      return this.comandosSolucion(f).length > 0;
    },
    // Se mira el comando, no la prosa, para decidir el aviso de sudo.
    solucionConSudo(f) {
      return this.comandosSolucion(f).some(function (c) { return /^sudo(\s|$)/.test(String(c).trim()); });
    },

    etiquetaSeveridad(sev) {
      var MAP = { high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info', critical: 'Crítico' };
      return MAP[(sev || '').toLowerCase()] || (sev || '').toUpperCase();
    },

    formatearFecha(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    async copiarComando(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      } catch(e) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      }
    },

    // ── Chat con LLM ──────────────────────────────────────────

    // Clave por finding.id, no por posición (cambia al filtrar).
    claveChat(f, fi) {
      if (f && f.id) {
        return 'id:' + f.id;
      } else {
        return 'idx:' + fi;
      }
    },

    // Escaneo nuevo: se borran las conversaciones de hallazgos que ya no existen.
    reiniciarChats() {
      this.chatEpoch++;
      this.chatOpen     = {};
      this.chatMessages = {};
      this.chatInput    = {};
      this.chatLoading  = {};
      this.chatModel    = {};
    },

    // Estado del asistente para el llm-config de este resultado. Resuelve con la respuesta, o null si falla.
    consultarEstadoLlm() {
      var self = this;
      var id = this.auditData && this.auditData.llmConfigId;
      var url = '/locoaudit/chat/status';
      if (id) url += '?llmConfigId=' + encodeURIComponent(id);
      return fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          self.llmAvailable = !!(d && d.available);
          self.llmModel = (d && d.model) || null;
          return d || null;
        })
        .catch(function() { return null; });
    },

    // Cerrar conserva el historial. Al abrir se vuelve a preguntar el modelo: si no es el de la
    // conversación guardada, se descarta y empieza otra con la pregunta automática.
    alternarChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (!willOpen) return;
      var self = this;
      var epoch = this.chatEpoch;
      this.consultarEstadoLlm().then(function(d) {
        // Escaneo nuevo o panel cerrado mientras se consultaba: no se toca nada.
        if (epoch !== self.chatEpoch || !self.chatOpen[findingKey]) return;
        if (d && !d.available) return;
        // Con una respuesta en vuelo no se borra: acabaría en la conversación nueva.
        if (self.chatLoading[findingKey]) return;
        var model = (d && d.model) || null;
        var prev = self.chatMessages[findingKey];
        if (d && prev && prev.length && model !== self.chatModel[findingKey]) {
          self.chatMessages = Object.assign({}, self.chatMessages, { [findingKey]: [] });
          prev = null;
        }
        if (!(prev && prev.length)) {
          self.chatModel = Object.assign({}, self.chatModel, { [findingKey]: model });
          self.enviarChat(findingKey, finding,
            'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
        }
      });
    },

    async enviarChat(findingKey, finding, presetQuestion) {
      var question;
      if (presetQuestion != null) {
        question = presetQuestion;
      } else {
        question = (this.chatInput[findingKey] || '').trim();
      }
      if (!question || this.chatLoading[findingKey]) return;

      var epoch = this.chatEpoch;
      var history = [];
      (this.chatMessages[findingKey] || []).forEach(function(m) {
        // Un error no es respuesta del modelo: fuera él y la pregunta que lo provocó.
        if (m.error) {
          if (history.length && history[history.length - 1].role === 'user') history.pop();
          return;
        }
        history.push({ role: m.role, content: m.content });
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            finding: finding, question: question, history: history,
            auditType: this.auditData && this.auditData.auditType,
            platform: this.auditData && this.auditData.host && this.auditData.host.platform,
            llmConfigId: (this.auditData && this.auditData.llmConfigId) || null
          })
        });
        var data = await res.json();
        if (data && data.ok) {
          reply = { role: 'assistant', content: data.content };
        } else {
          reply = { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
        }
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      // Llegó un escaneo nuevo mientras esperábamos: la respuesta ya no aplica.
      if (epoch !== this.chatEpoch) return;

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    trocearRespuesta(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.markdownEnLinea(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.markdownEnLinea(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    markdownEnLinea(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    this.leerTokens();
    // Segunda lectura por si la hoja aún no estaba en el head al montar.
    this.$nextTick(this.leerTokens);

    // Comprueba si hay un llm-config desplegado y qué modelo responde.
    var self = this;
    this.consultarEstadoLlm().then(function(d) { if (!d) self.llmAvailable = false; });
  }
};
</script>

<style>
  /*LCA-STYLE-DASH:network — fuente única de estilo del export*/
