<template>
  <div>

    <!-- ── Sin datos ── -->
    <!-- Icono en línea y no <use>: el sprite vive DENTRO de .lca-report-root para
         viajar con el clon del export, y este estado está fuera de esa raíz. -->
    <div v-show="state === 'idle'" class="lca-state-center">
      <svg class="icon icon-xl lca-state-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path>
      </svg>
      <h3 class="lca-state-title">Esperando auditoría de red…</h3>
      <p class="lca-state-desc">Pulsa el botón de inicio en Node-RED para escanear los puertos de tu equipo.</p>
    </div>

    <!-- ── Escaneando ── -->
    <div v-show="state === 'scanning'" class="lca-state-center">
      <div class="lca-spinner"></div>
      <p class="lca-state-desc">Escaneando puertos…</p>
    </div>

    <!-- ── Resultados ── -->
    <div v-if="state === 'done' && auditData" class="lca-report-root">

      <!-- ══ SPRITE DE ICONOS ══ -->
      <!-- Primer hijo de .lca-report-root A PROPÓSITO: el export clona ESTA raíz, así
           que el sprite viaja con ella y los <use href="#lca-i-…"> del informe
           descargado siguen resolviendo. Un sprite colocado fuera se quedaría atrás y
           el HTML exportado saldría sin un solo icono, en silencio.
           Su clase no contiene ninguna subcadena que el prune del export borre
           (dl-group, chat, ai-ask-btn, lca-chat-wrap) ni que el @media print toque
           (finding-detail, finding-body, group-body, group-findings). No renombrar. -->
      <svg class="lca-sprite" aria-hidden="true" focusable="false"><defs>
        <symbol id="lca-i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"></path></symbol>
        <symbol id="lca-i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></symbol>
        <symbol id="lca-i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></symbol>
        <symbol id="lca-i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></symbol>
        <symbol id="lca-i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></symbol>
        <symbol id="lca-i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></symbol>
        <symbol id="lca-i-antenna" viewBox="0 0 24 24"><path d="M5 15a9 9 0 0 1 0-11M8.5 12.5a4.5 4.5 0 0 1 0-6"></path><circle cx="12" cy="9.5" r="1.6"></circle><path d="M15.5 6.5a4.5 4.5 0 0 1 0 6M19 4a9 9 0 0 1 0 11M12 11v10M9 21h6"></path></symbol>
        <symbol id="lca-i-minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
        <symbol id="lca-i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"></path></symbol>
        <symbol id="lca-i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></symbol>
        <symbol id="lca-i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></symbol>
        <symbol id="lca-i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></symbol>
        <symbol id="lca-i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"></path></symbol>
        <symbol id="lca-i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></symbol>
      </defs></svg>

      <!-- ══ HEADER ══ -->
      <!-- Misma anatomía que host: eyebrow, nombre grande, badge de riesgo con el
           recuento al lado, rejilla de metadatos etiqueta-sobre-valor, y una columna
           derecha separada por una línea fina. El hueco que en host ocupa el gauge de
           Lynis lo ocupa aquí el contador de puertos abiertos, con su desglose por
           severidad debajo.
           La barra superior toma el color del riesgo real vía `riskClass`, la misma
           clase que pinta el badge: no hay dos definiciones del riesgo. -->
      <div class="header-card" :class="riskClass">
        <div class="header-main">
          <div class="header-eyebrow">LoCoAudit · Auditoría de red</div>
          <div class="host-name">
            <svg class="icon"><use href="#lca-i-globe"></use></svg>
            <span class="host-name-text">{{ auditData.host && auditData.host.hostname }}</span>
          </div>
          <div class="header-idline">
            <span class="risk-badge" :class="riskClass">
              <span class="risk-badge-dot"></span>
              {{ riskLabel }}
            </span>
            <!-- Texto corto: el mismo recuento que la columna derecha enseña en
                 grande. No es copy nuevo. -->
            <span class="risk-note">{{ noPortData ? 'Sin datos de puertos' : donutTotal + (donutTotal === 1 ? ' puerto abierto' : ' puertos abiertos') }}</span>
          </div>

          <div class="meta-grid">
            <div class="meta-item">
              <span class="meta-key">Plataforma</span>
              <span class="meta-val">{{ auditData.host && auditData.host.platform }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Fuente</span>
              <span class="meta-val">{{ srcLabel }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Modo</span>
              <span class="meta-val">{{ modeLabel }}</span>
            </div>
            <div class="meta-item" v-if="targetLabel">
              <span class="meta-key">Objetivo</span>
              <span class="meta-val meta-val-mono">{{ targetLabel }}</span>
            </div>
            <div class="meta-item" v-if="hostnameLabel">
              <span class="meta-key">Nombre</span>
              <span class="meta-val meta-val-mono">{{ hostnameLabel }}</span>
            </div>
            <!-- El rango de puertos es una lista larga: en una celda de una columna
                 se parte en ocho líneas y estira toda la fila de la rejilla. -->
            <div class="meta-item meta-item-wide" v-if="rangeLabel">
              <span class="meta-key">Puertos</span>
              <span class="meta-val meta-val-mono">{{ rangeLabel }}</span>
            </div>
            <div class="meta-item" v-if="auditData.scanMeta && auditData.scanMeta.durationMs">
              <span class="meta-key">Duración</span>
              <span class="meta-val">{{ durLabel }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Análisis</span>
              <span class="meta-val">{{ scanTime }}</span>
            </div>
            <div class="meta-item meta-item-actions">
              <span class="meta-key">Exportar</span>
              <span class="dl-group">
                <button class="dl-btn" @click="downloadHtml" title="Descargar informe HTML (imprimible a PDF)">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> HTML
                </button>
                <button class="dl-btn" @click="downloadJson" title="Descargar datos JSON">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> JSON
                </button>
              </span>
            </div>
          </div>
        </div>

        <!-- Columna derecha: puertos abiertos y su reparto por severidad.
             El desglose sale de `barCols`, EL MISMO computed que alimenta el gráfico
             de barras de más abajo: dos recuentos de puertos por severidad acabarían
             divergiendo. -->
        <div class="header-aside">
          <span class="aside-label-top">Puertos abiertos</span>
          <div class="port-count-num" :class="{ 'all-info': allInfo && !noPortData, 'no-data': noPortData }">{{ portCountLabel }}</div>
          <!-- Sin datos no hay desglose que enseñar: un reparto de ceros se lee como
               "todo comprobado y limpio", que es justo lo que no ocurrió. -->
          <div class="port-breakdown" v-if="!noPortData && donutTotal > 0">
            <div class="port-breakdown-row" v-for="col in barCols" :key="'hb-' + col.sev"
                 :class="{ 'is-zero': col.count === 0 }">
              <span class="port-breakdown-dot" :style="{ background: col.count > 0 ? col.color : 'var(--text-muted)' }"></span>
              <span class="port-breakdown-name">{{ col.label }}</span>
              <span class="port-breakdown-val">{{ col.count }}</span>
            </div>
          </div>
          <span class="port-count-note" v-else-if="noPortData">No se ha llegado a escanear</span>
          <span class="port-count-note" v-else>Sin servicios de red visibles</span>
        </div>
      </div>

      <!-- ══ AVISOS ══ ═════════════════════════════════════════════════════════
           El mismo componente de host (.lca-notice), mismos tres niveles:
             nivel 1 · VEREDICTO — ¿tengo algo que hacer?
             nivel 2 · COBERTURA — ¿se miró todo?
             nivel 3 · CONTEXTO  — ¿qué más conviene saber?
           `scanWarn` es COBERTURA en los dos casos que produce, porque los dos dicen
           lo mismo: no se llegó a mirar del todo. Cambia el tono, no el nivel —
           neutro cuando el objetivo no responde (no hay nada que reprochar) y ámbar
           cuando el escaneo se quedó a medias. -->
      <div class="lca-notice lvl-2" v-if="scanWarn"
           :class="scanWarn.neutral ? 'is-neutral' : 'is-warn'">
        <svg class="icon lca-notice-icon"><use :href="scanWarn.neutral ? '#lca-i-antenna' : '#lca-i-alert'"></use></svg>
        <div class="lca-notice-main">
          <div class="lca-notice-title">{{ scanWarn.title }}</div>
          <div class="lca-notice-body is-prewrap">{{ scanWarn.desc }}</div>
        </div>
      </div>


      <!-- ══ MAIN ══ -->
      <main class="main">

        <!-- 1 · MAPA DE PUERTOS -->
        <section>
          <div class="section-title">Mapa de puertos</div>
          <!-- 0 puertos NO significa lo mismo en los dos casos:
               objetivo alcanzable sin puertos = resultado bueno (verde);
               objetivo que no responde        = no hubo auditoría (neutro). -->
          <div class="port-grid" v-if="sortedPorts.length > 0">
            <div v-for="(p, i) in visiblePorts" :key="'pg-'+i"
                 class="port-card" :class="'sev-' + (p.severity || 'info').toLowerCase()">
              <span class="port-sev-badge" :class="(p.severity || 'info').toLowerCase()">
                {{ sevLabel(p.severity) }}
              </span>
              <div class="port-number">{{ p.port }}</div>
              <div class="port-service">{{ p.service || 'unknown' }}</div>
              <div class="port-meta" v-if="p.process || p.version">
                <div class="port-meta-item" v-if="p.process">
                  <span class="meta-key">Proceso</span>
                  <code>{{ p.process }}{{ p.pid != null ? ' (' + p.pid + ')' : '' }}</code>
                </div>
                <div class="port-meta-item" v-if="p.version">
                  <span class="meta-key">Versión</span>
                  <code>{{ p.version }}</code>
                </div>
                <div class="port-meta-item" v-if="p.protocol">
                  <span class="meta-key">Proto</span>
                  <code>{{ p.protocol }}</code>
                </div>
              </div>
            </div>
          </div>
          <div class="empty-state" v-else-if="notAudited">
            <svg class="icon icon-xl empty-ico"><use href="#lca-i-antenna"></use></svg>
            <div class="empty-title empty-title--neutral">Auditoría no realizada</div>
            <div class="empty-sub">
              No se ha podido contactar con <strong>{{ targetLabel || 'el objetivo' }}</strong>, así que no se ha escaneado ningún puerto.<br>
              Esto <strong>no</strong> quiere decir que el equipo esté seguro: quiere decir que no se ha podido comprobar.
            </div>
          </div>
          <div class="empty-state" v-else>
            <svg class="icon icon-xl empty-ico"><use href="#lca-i-check-circle"></use></svg>
            <div class="empty-title">Sin puertos expuestos</div>
            <div class="empty-sub">El escaneo no encontró puertos abiertos.<br>Tu equipo no tiene servicios de red visibles.</div>
          </div>
          <div v-if="sortedPorts.length > 0 && visiblePorts.length === 0" class="filter-empty">
            Ningún puerto con severidad <strong>{{ sevLabel(filterSev) }}</strong>.
            <a href="#" @click.prevent="filterSev = 'all'">Quitar filtro</a>
          </div>
        </section>

        <!-- 2 · BARRA DE SEVERIDAD + TABLA DE PUERTOS -->
        <div class="two-col" v-if="sortedPorts.length > 0">

          <!-- Gráfico de barras -->
          <div class="card">
            <div class="section-title" style="margin-bottom:0">Exposición por severidad</div>
            <div class="bar-chart">
              <div class="bar-col" v-for="col in barCols" :key="col.sev"
                   :class="{ 'bar-col-active': filterSev === col.sev }"
                   @click="toggleSevFilter(col.sev)" title="Filtrar por esta severidad">
                <div class="bar-count" :style="{ color: col.count > 0 ? col.textColor : 'var(--text-secondary)' }">{{ col.count }}</div>
                <div class="bar-fill"
                     :style="{ background: col.color, height: col.height + 'px', opacity: col.count > 0 ? '1' : '0.18' }">
                  <div class="bar-ports">
                    <div class="bar-port-num" v-for="p in col.ports" :key="p">{{ p }}</div>
                  </div>
                </div>
                <div class="bar-label">{{ col.label }}</div>
              </div>
            </div>
            <div class="bar-axis"></div>
            <div class="bar-total-label">
              <strong>{{ donutTotal }}</strong> puerto{{ donutTotal !== 1 ? 's' : '' }} abierto{{ donutTotal !== 1 ? 's' : '' }}
            </div>
          </div>

          <!-- Tabla resumen -->
          <div class="card" style="padding:18px">
            <div class="section-title" style="margin-bottom:12px">Resumen de puertos</div>
            <table class="port-table">
              <thead>
                <tr>
                  <th>Puerto</th>
                  <th>Servicio</th>
                  <th>Proceso</th>
                  <th>Severidad</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(p, i) in visiblePorts" :key="'tr-'+i">
                  <td class="td-port">{{ p.port }}</td>
                  <td class="td-service">{{ p.service || 'unknown' }}</td>
                  <td class="td-process">{{ p.process || '—' }}</td>
                  <td>
                    <span class="badge" :class="(p.severity || 'info').toLowerCase()">{{ sevLabel(p.severity) }}</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 3 · VULNERABILIDADES POR PUERTO -->
        <section v-if="vulnerabilityGroups.length > 0">
          <div class="section-title">Vulnerabilidades por puerto</div>
          <div class="vulnerability-groups">
            <article v-for="group in vulnerabilityGroups" :key="group.key" class="vulnerability-group">
              <header class="vulnerability-group-header" @click="toggleVulnerabilityGroup(group.key)">
                <div class="vulnerability-group-port">
                  <span class="vulnerability-group-label">Puerto</span>
                  <code>{{ group.port }}/{{ group.protocol }}</code>
                </div>
                <span class="vulnerability-group-service">{{ group.service || 'Servicio desconocido' }}</span>
                <span class="badge" :class="group.maxSeverity">{{ sevLabel(group.maxSeverity) }}</span>
                <span class="vulnerability-group-count">{{ group.vulnerabilityCount }} CVE{{ group.vulnerabilityCount === 1 ? '' : 's' }}</span>
                <svg class="icon icon-sm vulnerability-group-chevron" :class="{ open: isVulnerabilityGroupOpen(group.key) }"><use href="#lca-i-chevron"></use></svg>
              </header>
              <div class="vulnerability-group-body" v-show="isVulnerabilityGroupOpen(group.key)">
                <div v-for="finding in group.findings" :key="finding.id" class="vulnerability-finding">
                  <div class="vulnerability-finding-title">{{ finding.title }}</div>
                  <div class="vulnerability-list">
                    <article v-for="v in finding.vulnerabilities" :key="v.id" class="vulnerability-card">
                      <code class="vulnerability-id">{{ v.id }}</code>
                      <span class="vulnerability-card-score">CVSS <strong>{{ v.cvss != null ? Number(v.cvss).toFixed(1) : 'sin nota' }}</strong></span>
                      <span class="badge" :class="v.severity">{{ sevLabel(v.severity) }}</span>
                      <a v-if="v.url" class="vulnerability-advisory" :href="v.url" target="_blank" rel="noopener">
                        {{ v.label || 'Advisory' }} <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg>
                      </a>
                      <span v-else class="vulnerability-advisory is-unavailable">Fuente no disponible</span>
                    </article>
                  </div>
                  <div v-if="finding.provenance" class="vulnerability-provenance"><strong>Procedencia</strong> {{ finding.provenance }}</div>
                  <div class="vulnerability-resolution" v-if="finding.fix">
                    <div class="detail-col-title">Pasos de resolución</div>
                    <p>{{ finding.fix }}</p>
                  </div>
                </div>
              </div>
            </article>
          </div>
        </section>

        <!-- 4 · HALLAZGOS SIN LISTA DE CVE -->
        <section v-if="ungroupedFindings.length > 0">
          <div class="section-title">Hallazgos</div>
          <div class="findings-list">
            <div class="finding-item" v-for="(f, fi) in ungroupedFindings" :key="'f-'+fi">
              <div class="finding-header" @click="toggleFinding('f-' + fi)">
                <div class="finding-badges">
                  <span class="badge" :class="(f.severity || 'info').toLowerCase()">{{ sevLabel(f.severity) }}</span>
                  <span class="badge cat" v-if="f.category">{{ f.category }}</span>
                </div>
                <div class="finding-title">{{ f.title }}</div>
                <svg class="icon icon-sm finding-chevron" :class="{ open: openFindings['f-' + fi] }"><use href="#lca-i-chevron"></use></svg>
              </div>
              <div class="finding-body" :class="{ open: openFindings['f-' + fi] }">
                <div class="detail-grid" v-if="f.evidence || f.fix">
                  <!-- La evidencia no depende del fix: un hallazgo informativo sin pasos que dar
                       sigue teniendo algo que contar, y colgarla del mismo v-if la escondía. -->
                  <div class="detail-col" v-if="f.evidence">
                    <div class="detail-col-title">Impacto (Evidencia)</div>
                    <pre class="detail-evidence">{{ f.evidence }}</pre>
                  </div>
                  <div class="detail-col" v-if="f.fix">
                    <div class="detail-col-title">Pasos de Resolución</div>
                    <div class="fix-steps" v-if="!f.isCommand">
                      <div class="fix-step" v-for="(st, si) in parseFixStepsRich(f.fix)" :key="si">
                        <span class="fix-num">{{ si + 1 }}</span>
                        <template v-if="st.cmd">
                          <span class="fix-step-body">
                            <span v-if="st.label" class="fix-step-label">{{ st.label }}</span>
                            <span class="command-box command-inline">
                              <code class="command-text">{{ st.cmd }}</code>
                              <button @click.stop="copyCommand(st.cmd)"
                                      :class="{ copied: copiedKey === st.cmd }"
                                      class="command-btn">
                                <svg class="icon icon-sm" v-if="copiedKey === st.cmd"><use href="#lca-i-check"></use></svg>{{ copiedKey === st.cmd ? ' Copiado' : 'Copiar' }}
                              </button>
                            </span>
                          </span>
                        </template>
                        <template v-else>{{ st.text }}</template>
                      </div>
                    </div>
                    <p v-if="f.isCommand" class="cmd-intro">
                      Comando sugerido<span class="cmd-origin">{{ originLabel(f.source) }}</span>:
                    </p>
                    <div v-if="f.isCommand" class="command-box">
                      <code class="command-text">{{ f.command || f.fix }}</code>
                      <button @click.stop="copyCommand(f.command || f.fix)"
                              :class="{ copied: copiedKey === (f.command || f.fix) }"
                              class="command-btn">
                        <svg class="icon icon-sm" v-if="copiedKey === (f.command || f.fix)"><use href="#lca-i-check"></use></svg>{{ copiedKey === (f.command || f.fix) ? ' Copiado' : 'Copiar' }}
                      </button>
                    </div>
                    <p v-if="fixNote(f)" class="cmd-note">{{ fixNote(f) }}</p>
                    <div v-if="fixHasCmd(f)" class="cmd-warn">
                      <strong>LoCoAudit no ejecuta este comando por ti.</strong>
                      Cópialo y ejecútalo en tu terminal después de revisarlo.
                    </div>
                    <div v-if="/(^|\s)sudo(\s|$)/.test(f.fix || '')" class="cmd-sudo">
                      <svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg>
                      Requiere privilegios de administrador: pedirá tu contraseña de usuario. Revísalo bien antes de ejecutarlo.
                    </div>
                  </div>
                </div>
                <!-- Mismos tres textos que en el dashboard de host: sin pasos que dar, lo
                     honesto es decir si es que no hacen falta o es que no los tenemos. -->
                <div v-if="!f.fix" class="nofix-note">
                  <template v-if="f.noAction">
                    Este hallazgo es informativo. No requiere acción inmediata.
                  </template>
                  <template v-else-if="f.primaryUrl">
                    LoCoAudit no tiene un paso concreto para este hallazgo.
                    <a :href="f.primaryUrl" target="_blank" rel="noopener">Más información <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                  </template>
                  <template v-else>
                    Este hallazgo es informativo. No requiere acción inmediata.
                  </template>
                </div>

                <!-- ── Chat con IA ── -->
                <div class="lca-chat-wrap" v-if="llmAvailable === true">
                  <button class="ai-ask-btn" @click.stop="toggleChat(chatKey(f, fi), f)">
                    <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                    {{ chatOpen[chatKey(f, fi)] ? 'Cerrar asistente' : 'Preguntar a la IA' }}
                  </button>
                  <div class="lca-chat" v-if="chatOpen[chatKey(f, fi)]">
                    <!-- Cabecera con el modelo: /locoaudit/chat/status YA devuelve
                         `model` (llm-config.js) y hasta ahora se tiraba. Quien lee la
                         respuesta necesita saber quién la ha escrito. -->
                    <div class="lca-chat-head">
                      <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                      <span class="lca-chat-head-title">Asistente</span>
                      <span class="lca-chat-model" v-if="llmModel">{{ llmModel }}</span>
                    </div>
                    <div class="lca-chat-msgs">
                      <div v-for="(cm, ci) in (chatMessages[chatKey(f, fi)] || [])" :key="ci"
                           class="chat-msg" :class="cm.role === 'user' ? 'chat-user' : 'chat-ai'">
                        <div class="chat-bubble" :class="{ 'chat-error': cm.error }">
                          <template v-for="(seg, si) in parseChatContent(cm.content)" :key="si">
                            <div v-if="seg.type === 'text'" class="chat-text" v-html="seg.html"></div>
                            <div v-else class="command-box">
                              <code class="command-text">{{ seg.code }}</code>
                              <button @click.stop="copyCommand(seg.code)"
                                      :class="{ copied: copiedKey === seg.code }"
                                      class="command-btn">
                                <svg class="icon icon-sm" v-if="copiedKey === seg.code"><use href="#lca-i-check"></use></svg>{{ copiedKey === seg.code ? ' Copiado' : 'Copiar' }}
                              </button>
                            </div>
                          </template>
                        </div>
                      </div>
                      <div v-if="chatLoading[chatKey(f, fi)]" class="chat-msg chat-ai">
                        <div class="chat-bubble chat-loading">
                          <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
                        </div>
                      </div>
                    </div>
                    <div class="lca-chat-input">
                      <input type="text" v-model="chatInput[chatKey(f, fi)]"
                             placeholder="Escribe tu pregunta…"
                             :disabled="chatLoading[chatKey(f, fi)]"
                             @keydown.enter.prevent="sendChat(chatKey(f, fi), f)">
                      <button class="chat-send-btn"
                              :disabled="chatLoading[chatKey(f, fi)]"
                              @click.stop="sendChat(chatKey(f, fi), f)">Enviar</button>
                    </div>
                    <!-- El aviso va al pie y no en un modal: se lee después de la
                         respuesta, que es cuando el usuario decide si actuar. -->
                    <div class="lca-chat-foot">
                      Un modelo de lenguaje puede equivocarse. Contrasta lo que te diga
                      con la evidencia del hallazgo antes de ejecutar nada.
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Sin hallazgos (nunca si no se ha auditado: eso no es un "todo bien") -->
        <div v-if="sortedPorts.length === 0 && ungroupedFindings.length === 0 && vulnerabilityGroups.length === 0 && !notAudited"
             class="lca-state-center lca-state-inline">
          <svg class="icon icon-xl lca-state-ico"><use href="#lca-i-check-circle"></use></svg>
          <h3 class="lca-state-title">¡Sin hallazgos!</h3>
          <p class="lca-state-desc">No se encontraron puertos de riesgo en esta auditoría.</p>
        </div>

        <!-- Footer -->
        <div class="report-foot" v-if="auditData.scanMeta">
          <div class="report-foot-item">
            <span class="report-foot-key">Herramienta</span>
            <span class="report-foot-val">LoCoAudit · auditoría de red</span>
          </div>
          <div class="report-foot-item">
            <span class="report-foot-key">Fuentes</span>
            <span class="report-foot-val">{{ srcLabel }} · modo {{ modeLabel }}</span>
          </div>
          <div class="report-foot-item">
            <span class="report-foot-key">Generado</span>
            <span class="report-foot-val">{{ scanTime }}</span>
          </div>
        </div>

      </main>

    </div>
  </div>
</template>

<script>
export default {
  data() {
    return {
      state: 'idle',
      auditData: null,
      openFindings: {},
      copiedKey: null,
      // Filtro por severidad: clic en una barra de "Exposición por severidad".
      filterSev: 'all',
      openVulnerabilityGroups: {},
      // ── Chat con LLM (asistente IA) ──
      chatOpen: {},        // por findingKey: panel abierto/cerrado
      chatMessages: {},    // por findingKey: [{ role, content, error? }]
      chatInput: {},       // por findingKey: texto en curso
      chatLoading: {},     // por findingKey: esperando respuesta
      chatEpoch: 0,        // se incrementa con cada escaneo: descarta respuestas en vuelo
      llmAvailable: null,  // null = sin comprobar; true/false tras comprobar
      llmModel: null,      // modelo que responde; /locoaudit/chat/status ya lo devuelve

      // ── Tokens de color leídos del CSS ───────────────────────────────────────
      // Los colores que acaban en una cadena de estilo (las barras de severidad, los
      // puntos del desglose) no los alcanza ningún var(), así que antes estaban
      // escritos a mano aquí abajo. Eso los convertía en una segunda fuente de verdad
      // para el color, que es exactamente lo que desincronizó el gauge de Lynis en el
      // dashboard de host. Ahora se LEEN del :root con getComputedStyle.
      // Vacíos hasta la primera lectura: un valor vacío no pinta nada, mientras que
      // una constante de respaldo volvería a ser la segunda fuente que sobra.
      tok: {
        critical: '', high: '', medium: '', low: '', info: '',
        criticalText: '', highText: '', mediumText: '', lowText: '', infoText: '',
        surface: '', textMuted: '', textSecondary: ''
      }
    };
  },

  computed: {
    maxSev() {
      return (this.auditData && this.auditData.summary && this.auditData.summary.maxSeverity) || 'info';
    },

    counts() {
      var c = (this.auditData && this.auditData.summary && this.auditData.summary.counts) || {};
      return {
        critical: c.critical || 0,
        high:     c.high     || 0,
        medium:   c.medium   || 0,
        low:      c.low      || 0,
        info:     c.info     || 0
      };
    },

    allInfo() {
      var c = this.counts;
      return c.critical === 0 && c.high === 0 && c.medium === 0 && c.low === 0;
    },

    // ── Estado del objetivo ──────────────────────────────────────────────────
    // Lo decide host-discovery.js (nmap -sn), NUNCA la severidad ni el número
    // de puertos: 0 puertos en un equipo que no responde no es "sin riesgo",
    // es "no se ha auditado". Payloads viejos no traen el campo → 'reachable'.
    targetState() {
      var meta = this.auditData && this.auditData.scanMeta;
      return (meta && meta.targetState) || 'reachable';
    },

    // Único interruptor del modo neutro en toda la vista.
    notAudited() {
      return this.targetState === 'unreachable';
    },

    // ¿Hay un recuento de puertos que enseñar? Dos formas de que no lo haya, y
    // las dos acaban en la misma cifra: el objetivo no respondió, o el escaneo
    // no llegó a terminar. Cero puertos por no haber mirado y cero puertos por
    // no haber ninguno abierto NO pueden renderizarse igual.
    // `notAudited` se queda para lo que ya decidía (la insignia y los textos de
    // "No auditado"); esto es solo la pregunta del contador.
    noPortData() {
      var meta = this.auditData && this.auditData.scanMeta;
      return this.notAudited || (meta && meta.scanStatus === 'inconclusive');
    },

    riskClass() {
      return this.notAudited ? 'not-audited' : this.maxSev;
    },

    riskLabel() {
      if (this.notAudited) return 'No auditado';
      var MAP = {
        critical: 'Riesgo Crítico', high: 'Riesgo Alto',
        medium: 'Riesgo Moderado', low: 'Riesgo Bajo', info: 'Sin Riesgo'
      };
      return MAP[this.maxSev] || this.maxSev;
    },

    portCountLabel() {
      return this.noPortData ? '—' : this.donutTotal;
    },

    scanWarn() {
      var meta = this.auditData && this.auditData.scanMeta;
      var st = meta && meta.scanStatus;

      // 1. El objetivo no responde: no hay auditoría que interpretar.
      if (this.notAudited) {
        var disc = (meta && meta.discovery) || {};
        var host = this.targetLabel || 'el objetivo';
        // El motivo solo afina el texto; la decisión ya está tomada arriba.
        var causa = (disc.reason === 'host-unreach' || disc.reason === 'net-unreach')
          ? 'Este equipo no sabe por dónde llegar hasta ' + host + ': no es que no conteste, es que no hay ruta de red hasta él.'
          : host + ' no ha respondido a la comprobación previa.';
        return {
          neutral: true,
          title: 'No se ha podido auditar ' + host,
          desc: causa + '\n' +
                'Causas posibles: el equipo está apagado, la dirección IP no es la correcta, ' +
                'no hay ruta de red hasta él (otra subred) o hay una VPN levantada que cambia el camino.\n' +
                'Comprueba primero que responde: ping ' + host + '\n' +
                'No se ha escaneado ningún puerto: la ausencia de hallazgos NO significa que el equipo esté protegido.' +
                (meta && meta.forceScan ? ' (Se ha escaneado de todas formas por tener activada la opción "Escanear aunque el equipo no responda".)' : '')
        };
      }

      if (!st || st === 'ok') return null;
      if (st === 'inconclusive') {
        return {
          title: 'Escaneo no concluyente',
          desc: 'El escaneo no terminó (posible firewall que lo ralentiza). ' +
                'Un resultado de 0 puertos NO garantiza que el host sea seguro. ' +
                'Prueba el modo Completo o aumenta el timeout.'
        };
      }
      return {
        title: 'El host no respondió al descubrimiento',
        desc: 'Puede estar protegido por un firewall. El nodo ya usa -Pn; ' +
              'prueba el modo Completo para un rango de puertos mayor.'
      };
    },

    scanTime() {
      var ts = this.auditData && this.auditData.timestamp;
      if (!ts) return '—';
      return new Date(ts).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    durLabel() {
      var ms = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.durationMs;
      if (!ms) return '—';
      return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
    },

    srcLabel() {
      // Nmap es el único escáner del nodo: portSource solo vale 'nmap' o 'none'
      // (cuando Nmap no está instalado y no se ha escaneado nada).
      var src = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.portSource;
      return src === 'nmap' ? 'Nmap' : 'Nmap no disponible';
    },

    modeLabel() {
      var MAP = { rapido: 'Rápido', standard: 'Estándar', full: 'Completo', custom: 'Personalizado' };
      var mode = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.scanMode;
      return MAP[mode] || mode || 'Estándar';
    },

    targetLabel() {
      var meta = this.auditData && this.auditData.scanMeta;
      if (!meta) return null;
      return meta.target || meta.customTarget || null;
    },

    hostnameLabel() {
      var meta = this.auditData && this.auditData.scanMeta;
      var h = meta && meta.hostname;
      // Sin PTR no se pinta NADA — ni un guion: un guion sugiere "se comprobó y
      // no tiene nombre", cuando lo que ocurre es que no hay dato que enseñar.
      // Se comporta como el resto de campos opcionales de la tira.
      if (!h) return null;
      // Si el PTR repite literalmente el target, la píldora sería la misma
      // información dos veces seguidas (caso "localhost").
      if (h === this.targetLabel) return null;
      return h;
    },

    rangeLabel() {
      var meta = this.auditData && this.auditData.scanMeta;
      return (meta && meta.portRange) || null;
    },

    sortedPorts() {
      var ports = this.auditData && this.auditData.raw && this.auditData.raw.ports;
      if (!Array.isArray(ports)) return [];
      var SEV_ORDER = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      return ports.slice().sort(function(a, b) {
        return (SEV_ORDER[(b.severity || 'info').toLowerCase()] || 0) -
               (SEV_ORDER[(a.severity || 'info').toLowerCase()] || 0);
      });
    },

    sortedFindings() {
      var findings = this.auditData && this.auditData.findings;
      if (!Array.isArray(findings)) return [];
      var SEV_ORDER = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      return findings.slice().sort(function(a, b) {
        return (SEV_ORDER[(b.severity || 'info').toLowerCase()] || 0) -
               (SEV_ORDER[(a.severity || 'info').toLowerCase()] || 0);
      });
    },

    // Filtro por severidad (clic en una barra de "Exposición por severidad").
    visiblePorts() {
      var self = this;
      if (this.filterSev === 'all') return this.sortedPorts;
      return this.sortedPorts.filter(function(p) {
        return (p.severity || 'info').toLowerCase() === self.filterSev;
      });
    },
    visibleFindings() {
      var self = this;
      if (this.filterSev === 'all') return this.sortedFindings;
      return this.sortedFindings.filter(function(f) {
        return (f.severity || 'info').toLowerCase() === self.filterSev;
      });
    },

    ungroupedFindings() {
      return this.visibleFindings.filter(function(f) {
        return !Array.isArray(f.vulnerabilities) || !f.vulnerabilities.length;
      });
    },

    vulnerabilityGroups() {
      var rank = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      var groups = {};
      this.visibleFindings.forEach(function(f) {
        if (!Array.isArray(f.vulnerabilities) || !f.vulnerabilities.length || !Number.isInteger(f.port)) return;
        var protocol = f.protocol || 'tcp';
        var key = f.port + '/' + protocol;
        if (!groups[key]) {
          groups[key] = {
            key: key, port: f.port, protocol: protocol, service: f.service,
            findings: [], maxSeverity: 'info'
          };
        }
        var group = groups[key];
        group.findings.push(f);
        group.vulnerabilityCount = (group.vulnerabilityCount || 0) + f.vulnerabilities.length;
        if ((rank[f.severity] || 0) > (rank[group.maxSeverity] || 0)) group.maxSeverity = f.severity;
      });
      return Object.keys(groups).map(function(key) {
        var group = groups[key];
        group.findings.forEach(function(f) {
          f.vulnerabilities.sort(function(a, b) {
            return (b.cvss == null ? -1 : b.cvss) - (a.cvss == null ? -1 : a.cvss);
          });
        });
        return group;
      }).sort(function(a, b) {
        return (rank[b.maxSeverity] || 0) - (rank[a.maxSeverity] || 0) || a.port - b.port;
      });
    },

    barCols() {
      var ports = this.sortedPorts;
      // El color va a una cadena de estilo: ningún var() llega ahí, así que se lee
      // del :root. `low` deja de ser gris y `info` deja de ser el cian de acento:
      // los dos convergen con la paleta de severidad del proyecto, que es la de host.
      var T = this.tok;
      // Dos colores por columna: `color` rellena la barra —identidad— y `textColor`
      // pinta la cifra de encima, que es TEXTO sobre blanco y con el tono base no
      // llega al mínimo legible.
      var defs = [
        { sev: 'high',   label: 'Alto',  color: T.high,   textColor: T.highText },
        { sev: 'medium', label: 'Medio', color: T.medium, textColor: T.mediumText },
        { sev: 'info',   label: 'Info',  color: T.info,   textColor: T.infoText },
        { sev: 'low',    label: 'Bajo',  color: T.low,    textColor: T.lowText }
      ];
      var cols = defs.map(function(d) {
        var matching = ports.filter(function(p) {
          return (p.severity || 'info').toLowerCase() === d.sev;
        });
        return {
          sev:   d.sev,
          label: d.label,
          color: d.color,
          textColor: d.textColor,
          count: matching.length,
          ports: matching.slice(0, 3).map(function(p) { return p.port; })
        };
      });
      var maxCount = Math.max.apply(null, cols.map(function(c) { return c.count; }));
      if (maxCount === 0) maxCount = 1;
      cols.forEach(function(c) {
        c.height = Math.max(4, Math.round((c.count / maxCount) * 110));
      });
      return cols;
    },

    donutTotal() {
      var meta = this.auditData && this.auditData.scanMeta;
      var open = meta && meta.portsOpen;
      return (open != null ? open : null) || this.sortedPorts.length;
    }
  },

  watch: {
    msg: {
      deep: false,
      handler(newMsg) {
        if (!newMsg) return;
        if (!newMsg.payload || !newMsg.payload.findings) {
          this.state = 'scanning';
          return;
        }
        this.auditData    = newMsg.payload;
        this.state        = 'done';
        this.readTokens();   // síncrono: el primer pintado de los resultados ya va con color
        this.openFindings = {};
        this.resetChats();
      }
    }
  },

  methods: {
    // ── Lectura de los tokens de color ────────────────────────────────────────
    // El CSS es la única autoridad del color; esto solo lo consulta para los sitios
    // que ningún var() alcanza: atributos SVG y cadenas de estilo en JS.
    //
    // getPropertyValue devuelve la cadena CON el espacio inicial del CSS y solo
    // resuelve con el elemento ya en el documento, de ahí el .trim() y el momento de
    // la llamada: mounted() y, otra vez, al llegar cada payload —síncrono, antes del
    // re-render, así que el primer pintado ya tiene color—. Si una lectura vuelve
    // vacía se conserva la anterior: nunca se cae a una constante de respaldo.
    readTokens() {
      var cs;
      try { cs = getComputedStyle(document.documentElement); } catch (e) { return; }
      var NOMBRES = {
        critical: '--critical', high: '--high', medium: '--medium', low: '--low',
        info: '--info', surface: '--surface', textMuted: '--text-muted',
        textSecondary: '--text-secondary',
        // El tono legible, para los sitios donde el color va como TEXTO.
        criticalText: '--critical-text', highText: '--high-text',
        mediumText: '--medium-text', lowText: '--low-text', infoText: '--info-text'
      };
      var next = Object.assign({}, this.tok), got = false;
      Object.keys(NOMBRES).forEach(function(k) {
        var v = (cs.getPropertyValue(NOMBRES[k]) || '').trim();
        if (v) { next[k] = v; got = true; }
      });
      if (got) this.tok = next;
    },

    toggleFinding(key) {
      this.openFindings = Object.assign({}, this.openFindings, { [key]: !this.openFindings[key] });
    },
    isVulnerabilityGroupOpen(key) {
      return this.openVulnerabilityGroups[key] !== false;
    },
    toggleVulnerabilityGroup(key) {
      this.openVulnerabilityGroups = Object.assign({}, this.openVulnerabilityGroups, {
        [key]: !this.isVulnerabilityGroupOpen(key)
      });
    },
    // Filtro por severidad: clic en la barra activa/desactiva ese filtro.
    toggleSevFilter(sev) {
      this.filterSev = this.filterSev === sev ? 'all' : sev;
    },

    // Origen HONESTO del comando: lo genera LoCoAudit; si el hallazgo vino de una
    // herramienta, se indica a partir de qué análisis (Trivy/Lynis/Nmap).
    originLabel(source) {
      var M = {
        trivy: '· a partir del análisis de Trivy',
        lynis: '· a partir de Lynis',
        nmap:  '· a partir de la detección de Nmap',
        native: '· recomendación de LoCoAudit',
      };
      return M[source] || '· recomendación de LoCoAudit';
    },

    // ── Descarga de reporte (HTML imprimible + JSON) ──────────────────────────
    _escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    },
    _reportBasename(ext) {
      var d = new Date();
      var p = function(n) { return String(n).padStart(2, '0'); };
      var stamp = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                  '_' + p(d.getHours()) + p(d.getMinutes());
      var type = (this.auditData && this.auditData.auditType) || 'audit';
      return 'locoaudit-' + type + '-' + stamp + '.' + ext;
    },
    _triggerDownload(filename, content, mime) {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    },
    downloadJson() {
      if (!this.auditData) return;
      this._triggerDownload(this._reportBasename('json'),
        JSON.stringify(this.auditData, null, 2), 'application/json');
    },
    downloadHtml() {
      if (!this.auditData) return;
      this._triggerDownload(this._reportBasename('html'),
        this._buildHtmlReport(), 'text/html;charset=utf-8');
    },
    _buildHtmlReport() {
      try {
        // LCA:SNAPSHOT:START — única fuente: lib/snapshot-body.txt (build-dashboards.js). NO EDITAR.
      // Snapshot del DOM ya renderizado del dashboard: fidelidad exacta, no
      // puede divergir (el export ES el dashboard, sin re-render alternativo).
      var payload = this.auditData || {};
      var auditType = payload.auditType || '';
      // 1. CSS del propio dashboard (sentinel por nodo) — fuente ÚNICA de estilo.
      var css = '', i, styles = document.querySelectorAll('style');
      var tag = 'LCA-STYLE-DASH:' + auditType;
      for (i = 0; i < styles.length; i++) { if (styles[i].textContent.indexOf(tag) >= 0) { css = styles[i].textContent; break; } }
      if (!css) for (i = 0; i < styles.length; i++) { if (styles[i].textContent.indexOf('LCA-STYLE-DASH') >= 0) { css = styles[i].textContent; break; } }
      if (!css) for (i = 0; i < styles.length; i++) { if (styles[i].textContent.length > css.length) css = styles[i].textContent; }
      // 2. Foto del contenedor de resultados de ESTE dashboard (this.$el primero,
      //    por si hay varios dashboards en la misma página).
      var root = (this.$el && this.$el.querySelector && this.$el.querySelector('.lca-report-root')) || document.querySelector('.lca-report-root') || this.$el;
      var clone = root.cloneNode(true);
      // Quitar lo que necesita servidor (chat IA) y los botones de descarga.
      clone.querySelectorAll('.dl-group,.ia-dl-group,.lca-chat-wrap,.ai-ask-btn,.ia-ask-btn,[class*="chat"]').forEach(function (n) { n.remove(); });
      // 3. Convertir los grupos y hallazgos en acordeón interactivo (como el
      //    ui_template): la cabecera lleva data-lca-acc y su cuerpo (el hermano
      //    siguiente) se abre/cierra con el toggle vanilla embebido. Estado
      //    inicial = igual que el dashboard: grupos ABIERTOS, detalles CERRADOS.
      clone.querySelectorAll('[class*="group-header"]').forEach(function (h) {
        h.setAttribute('data-lca-acc', 'g');
        var b = h.nextElementSibling;
        if (b) { b.style.display = ''; b.classList.add('open'); b.setAttribute('data-lca-open', '1');
          var cv = h.querySelector('[class*="chevron"]'); if (cv) cv.classList.add('open'); }
      });
      clone.querySelectorAll('[class*="finding-row"],[class*="finding-header"]').forEach(function (h) {
        h.setAttribute('data-lca-acc', 'f');
        var b = h.nextElementSibling;
        if (b) { b.classList.remove('open'); b.setAttribute('data-lca-open', '0'); }
      });
      // 4. CSS extra del export + toggle/copiar (vanilla) + documento autocontenido.
      // El detalle del alcance (subcarpetas analizadas / excluidas / sin
      // analizar) va plegado en el dashboard con v-show, así que en el clon
      // llega con display:none. En un informe descargado no hay nada que
      // desplegar: se fuerza visible y se retira su botón.
      var extra = '.dl-group,.ia-dl-group,.lca-chat-wrap,.ai-ask-btn,.ia-ask-btn,.scope-toggle{display:none!important}'
        + '.scope-detail{display:block!important}'
        + '[data-lca-acc]{cursor:pointer}.command-btn,.ia-copy-btn{cursor:pointer}'
        + '@media print{[class*="finding-detail"],[class*="finding-body"],[class*="group-body"],[class*="group-findings"]{display:block!important;max-height:none!important;opacity:1!important;overflow:visible!important}}';
      var toggleJs = "(function(){document.addEventListener('click',function(e){var cb=e.target.closest('.command-btn,.ia-copy-btn');if(cb){var box=cb.parentElement,c=box&&box.querySelector('code');var t=c?c.textContent:'';try{navigator.clipboard.writeText(t);}catch(_){}var o=cb.textContent;cb.textContent='\\u2713 Copiado';setTimeout(function(){cb.textContent=o;},1500);return;}var h=e.target.closest('[data-lca-acc]');if(!h)return;var b=h.nextElementSibling;if(!b)return;var willOpen=b.getAttribute('data-lca-open')==='0';b.style.display=willOpen?'':'none';b.classList.toggle('open',willOpen);b.setAttribute('data-lca-open',willOpen?'1':'0');var cv=h.querySelector('[class*=chevron]');if(cv)cv.classList.toggle('open',willOpen);});})();";
      var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var hn = (payload.host && payload.host.hostname) || '';
      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">'
        + '<meta name="viewport" content="width=device-width,initial-scale=1">'
        + '<title>LoCoAudit — ' + esc(titleMap[auditType] || 'Auditoria') + ' — ' + esc(hn) + '</title>'
        + '<style>' + css + '\n' + extra + '</style></head><body><div class="lca-export">'
        + clone.innerHTML + '</div><script>' + toggleJs + '<\/script></body></html>';
        // LCA:SNAPSHOT:END
      } catch (e) {
        console.error('[LoCoAudit] export snapshot fallo, uso tabla de respaldo:', e);
        return this._buildHtmlReportFallback();
      }
    },
    _buildHtmlReportFallback() {
      var esc = this._escHtml;
      var a = this.auditData || {};
      var host = a.host || {};
      var counts = (a.summary && a.summary.counts) || {};
      var findings = a.findings || [];
      var meta = a.scanMeta || {};
      var sevOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
      var sevLabelMap = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
      var sevColor = { critical: '#B91C1C', high: '#C2410C', medium: '#A16207', low: '#15803D', info: '#0369A1' };

      var rank = function(f) {
        var r = sevOrder[(f.severity || 'info').toLowerCase()];
        return r === undefined ? 9 : r;
      };
      var sorted = findings.slice().sort(function(x, y) { return rank(x) - rank(y); });

      var rows = sorted.map(function(f) {
        var sev = (f.severity || 'info').toLowerCase();
        var origen = f.image || f.category || '—';
        return '<tr>' +
          '<td><span class="sev" style="background:' + sevColor[sev] + '">' + esc(sevLabelMap[sev] || sev) + '</span></td>' +
          '<td class="mono">' + esc(f.id) + '</td>' +
          '<td class="mono">' + esc(origen) + '</td>' +
          '<td>' + esc(f.title) + '</td>' +
          '<td>' + esc(f.evidence) + '</td>' +
          '<td>' + (f.fix ? '<code>' + esc(f.fix) + '</code>' : '—') + '</td>' +
          '</tr>';
      }).join('');

      var sumChips = ['critical', 'high', 'medium', 'low', 'info'].map(function(s) {
        return '<span class="chip" style="border-color:' + sevColor[s] + ';color:' + sevColor[s] + '">' +
          (sevLabelMap[s]) + ': <b>' + (counts[s] || 0) + '</b></span>';
      }).join(' ');

      var dur = meta.durationMs ? (meta.durationMs / 1000).toFixed(1) + ' s' : '—';
      var titleMap = { image: 'Imagen', host: 'Host', network: 'Red' };
      var auditTitle = titleMap[a.auditType] || 'Auditoría';

      // Misma regla que el dashboard: si el objetivo no respondió, el informe
      // no puede leerse como "sin hallazgos = seguro".
      var notAudited = meta.targetState === 'unreachable';
      var notice = notAudited
        ? '<div class="notice"><b>Auditoría no realizada.</b> No se pudo contactar con ' +
          esc(meta.target || meta.customTarget || 'el objetivo') +
          ', por lo que no se escaneó ningún puerto. La ausencia de hallazgos NO indica que el equipo esté protegido.</div>'
        : '';

      return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
        '<title>LoCoAudit — ' + esc(auditTitle) + ' — ' + esc(host.hostname || '') + '</title>' +
        '<style>' +
        'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1e1b2e;margin:32px;background:#fff}' +
        'h1{color:#7C3AED;margin:0 0 4px}.sub{color:#666;margin:0 0 20px}' +
        '.meta{font-size:13px;color:#444;margin-bottom:16px}.meta b{color:#1e1b2e}' +
        '.chips{margin:12px 0 24px}.chip{display:inline-block;border:1px solid;border-radius:12px;padding:2px 10px;margin-right:6px;font-size:12px}' +
        'table{border-collapse:collapse;width:100%;font-size:12.5px}' +
        'th,td{border:1px solid #e5dcfa;padding:6px 8px;text-align:left;vertical-align:top}' +
        'th{background:#f3effc;color:#7C3AED}.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:nowrap}' +
        '.sev{color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}' +
        'code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f6f4fc;padding:1px 4px;border-radius:4px}' +
        'footer{margin-top:24px;color:#999;font-size:11px}@media print{body{margin:0}}' +
        '.notice{border:1px solid #cbd5e1;border-left:4px solid #64748b;background:#f8fafc;' +
        'color:#334155;padding:10px 12px;border-radius:6px;margin:0 0 16px;font-size:13px}' +
        '</style></head><body>' +
        '<h1>LoCoAudit · Auditoría de ' + esc(auditTitle) + '</h1>' +
        '<p class="sub">' + esc(host.hostname || '') + ' · ' + esc(host.platform || '') + '</p>' +
        notice +
        '<div class="meta">Fecha: <b>' + esc(this.scanTime || new Date().toLocaleString()) + '</b> · ' +
        'Duración: <b>' + esc(dur) + '</b> · Hallazgos: <b>' + findings.length + '</b></div>' +
        '<div class="chips">' + sumChips + '</div>' +
        '<table><thead><tr><th>Severidad</th><th>ID</th><th>Origen</th><th>Título</th><th>Evidencia</th><th>Recomendación</th></tr></thead>' +
        '<tbody>' + (rows || '<tr><td colspan="6">Sin hallazgos.</td></tr>') + '</tbody></table>' +
        '<footer>Generado por LoCoAudit · ' + esc(new Date().toISOString()) + '</footer>' +
        '</body></html>';
    },

    parseFixSteps(fix) {
      if (!fix) return [];
      if (fix.indexOf('\n') >= 0) {
        return fix.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
      }
      if (fix.indexOf('. ') >= 0) {
        var parts = fix.split('. ').map(function(s) { return s.trim(); }).filter(Boolean);
        return parts.map(function(s, i) { return i < parts.length - 1 ? s + '.' : s; });
      }
      return [fix];
    },

    // Detecta si un paso de resolución es (o contiene) un comando ejecutable.
    // Soporta dos formas: la línea entera es comando, o "Etiqueta: comando".
    stepCmd(step) {
      var s = (step || '').trim();
      var CMD = /^(sudo|brew|npm|yarn|pip|composer|go|apt|dnf|yum|winget|choco|lsof|nslookup|kill|systemctl|launchctl|bundle|cargo|rabbitmqctl|jupyter|auditpol|nginx|netsh|net\s+stop|netstat|ufw|apachectl|systemsetup)\b/i;
      if (CMD.test(s)) return { label: '', cmd: s };
      var idx = s.indexOf(': ');
      if (idx >= 0) {
        var after = s.slice(idx + 2).trim();
        if (CMD.test(after)) return { label: s.slice(0, idx + 1), cmd: after };
      }
      return null;
    },

    // Pasos enriquecidos: cada paso es { label, cmd } (comando copiable) o { text }.
    // El fix puede traer el comando en la 1ª línea y una nota explicativa debajo.
    // El botón copia SOLO el comando (finding.command); la nota se muestra aparte,
    // para que un pegado en terminal nunca arrastre texto no ejecutable.
    fixNote(f) {
      if (!f || !f.command || !f.fix) return "";
      return String(f.fix).split("\n").slice(1).join("\n").trim();
    },
    // ¿El paso de resolución contiene algún comando (directo o dentro de un paso)?
    fixHasCmd(f) {
      if (!f || !f.fix) return false;
      if (f.command) return true;
      try { return this.parseFixStepsRich(f.fix).some(function (s) { return !!s.cmd; }); }
      catch (e) { return false; }
    },
    parseFixStepsRich(fix) {
      var self = this;
      return this.parseFixSteps(fix).map(function(step) {
        var c = self.stepCmd(step);
        return c ? { label: c.label, cmd: c.cmd, text: null }
                 : { label: null, cmd: null, text: step };
      });
    },

    sevLabel(sev) {
      var MAP = { high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info', critical: 'Crítico' };
      return MAP[(sev || '').toLowerCase()] || (sev || '').toUpperCase();
    },

    formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    async copyCommand(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      } catch(e) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      }
    },

    // ── Chat con LLM ──────────────────────────────────────────

    // Clave estable por hallazgo: el historial vive en finding.id, no en la
    // posición de la lista (que cambia al filtrar por severidad).
    chatKey(f, fi) {
      return (f && f.id) ? 'id:' + f.id : 'idx:' + fi;
    },

    // Escaneo nuevo = findings nuevos: se borran todas las conversaciones para
    // no arrastrar contexto de hallazgos que ya no existen.
    resetChats() {
      this.chatEpoch++;
      this.chatOpen     = {};
      this.chatMessages = {};
      this.chatInput    = {};
      this.chatLoading  = {};
    },

    toggleChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (willOpen && !(this.chatMessages[findingKey] && this.chatMessages[findingKey].length)) {
        this.sendChat(findingKey, finding,
          'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
      }
    },

    async sendChat(findingKey, finding, presetQuestion) {
      var question = presetQuestion != null
        ? presetQuestion
        : (this.chatInput[findingKey] || '').trim();
      if (!question || this.chatLoading[findingKey]) return;

      var epoch = this.chatEpoch;
      var history = (this.chatMessages[findingKey] || []).slice().map(function(m) {
        return { role: m.role, content: m.content };
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            finding: finding, question: question, history: history,
            auditType: this.auditData && this.auditData.auditType,
            platform: this.auditData && this.auditData.host && this.auditData.host.platform
          })
        });
        var data = await res.json();
        reply = (data && data.ok)
          ? { role: 'assistant', content: data.content }
          : { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      // Llegó un escaneo nuevo mientras esperábamos: la respuesta ya no aplica.
      if (epoch !== this.chatEpoch) return;

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    parseChatContent(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    mdInline(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    this.readTokens();
    // Segunda pasada en nextTick: si la hoja del componente aún no estuviera en el
    // head al montar, la primera lectura vuelve vacía y se conserva lo anterior.
    this.$nextTick(this.readTokens);

    // Detecta si hay un nodo llm-config desplegado para mostrar (o no) el chat.
    // `model` ya venía en la respuesta y se descartaba; ahora lo enseña la cabecera
    // del chat, para que se sepa quién firma cada contestación.
    var self = this;
    fetch('/locoaudit/chat/status')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        self.llmAvailable = !!(d && d.available);
        self.llmModel = (d && d.model) || null;
      })
      .catch(function() { self.llmAvailable = false; });
  }
};
</script>

<style>
  /*LCA-STYLE-DASH:network — fuente única de estilo del export*/
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ═══ TOKENS ═══════════════════════════════════════════════════════════════
     El vocabulario es el de host, que es la referencia de diseño del proyecto.
     Lo que había antes eran los MISMOS conceptos con otros nombres —las 20
     `--sev-*`— más un tinte celeste propio del chrome. Cuidado con el
     desplazamiento del renombrado, ya aplicado aquí:

       --sev-X-bg     → --X-bg       (fondo pálido)
       --sev-X-border → --X          (el COLOR SÓLIDO)
       --sev-X-badge  → --X-border   (el borde claro)
       --sev-X-text   → --X          (el token -text vale lo mismo que la base)

     Invertir los dos de en medio intercambia el color sólido con el borde claro. */
  :root {
    /* Severidad. Idéntica a la de host. Es lo que lee readTokens() para los
       colores que acaban en una cadena de estilo. */
    --critical: #DC2626;
    --critical-bg: #FEF2F2;
    --critical-border: #FECACA;
    --high: #EA580C;
    --high-bg: #FFF7ED;
    --high-border: #FED7AA;
    --medium: #D97706;
    --medium-bg: #FFFBEB;
    --medium-border: #FDE68A;
    /* `low` deja de ser el gris slate que tenía. Era una decisión —severidad
       despreciable, sin color— y se descarta a conciencia: una escala en la que un
       nivel no tiene color no se puede leer como escala. */
    --low: #65A30D;
    --low-bg: #F7FEE7;
    --low-border: #D9F99D;
    /* `info` deja de ser el cian #06B6D4 que también hacía de acento. Un color no
       puede ser a la vez un nivel de severidad y la identidad de la interfaz. */
    --info: #0EA5E9;
    --info-bg: #F0F9FF;
    --info-border: #BAE6FD;

    /* Tono 700, para cuando el color va como TEXTO.
       REVOCA la antigua regla `--X-text = var(--X)`, que se decidió por coherencia
       sin medir. Medido sobre el fondo pálido del propio nivel, el tono base da
       4,41 / 3,35 / 3,07 / 2,98 / 2,60 (critical / high / medium / low / info) y el
       mínimo WCAG AA es 4,5: falla en los cinco. Con el 700 son 5,91 / 4,88 / 4,75 /
       4,82 / 5,57.
       El tono base sigue siendo la IDENTIDAD —bordes, puntos, rellenos sólidos,
       arcos, barras—; el 700 es el que se lee. */
    --critical-text: #B91C1C;
    --high-text: #C2410C;
    --medium-text: #A16207;
    --low-text: #4D7C0F;
    --info-text: #0369A1;

    /* Chrome. Pierde el tinte celeste (--bg #F0F9FF, --card-border #BAE6FD): eran
       la identidad cromática de network y se retiran a propósito. El módulo se
       identifica por icono y etiqueta; el color queda para la severidad. */
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    --surface: #F1F5F9;
    --text-muted: #94A3B8;

    /* Acento compartido por los tres dashboards. El cian de network desaparece del
       vocabulario: no es un token con otro valor, es un token que deja de existir. */
    --accent: #7C3AED;
    --accent-bg: #F5F3FF;
    --accent-border: #DDD6FE;
    --accent-light: #C4B5FD;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 100px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);

    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Fira Code", monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
  }

  /* ── Iconos ────────────────────────────────────────────────────────────────
     Un solo <symbol> por icono, referenciado con <use>. El sprite es el primer
     hijo de .lca-report-root para que el clon del export se lo lleve; escondido
     con position/size y no con display:none, que en el informe descargado podría
     verse pisado por alguna regla !important del CSS extra. */
  .lca-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: -3px;
  }
  .icon-sm { width: 13px; height: 13px; vertical-align: -2px; }
  .icon-xl { width: 44px; height: 44px; stroke-width: 1.25; }

  /* Sin pasos de resolución: informa de qué falta, sin fingir un veredicto.
     El color ya no lleva fallback: --text-secondary está declarado arriba. Antes
     era `var(--text-secondary, #6B7280)` con el token SIN declarar, así que pintaba
     el gris de Tailwind del fallback mientras el resto del fichero usaba slate: una
     declaración escondida que no aparecía en ningún :root. */
  .nofix-note {
    padding: 12px 0;
    font-style: italic;
    color: var(--text-secondary);
    font-size: 12.5px;
  }
  .nofix-note a { color: inherit; font-style: normal; text-decoration: underline; }

  /* ═══ CABECERA ═════════════════════════════════════════════════════════════
     Misma anatomía que host. El fondo oscuro que tenía network desaparece con su
     identidad cromática: era lo que obligaba a tener una paleta de texto propia
     (blancos y slate claros) y de ahí venía el bug de contraste del aviso. */
  .header-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 26px 28px;
    display: flex;
    align-items: stretch;
    gap: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .header-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--text-muted);
  }
  .header-card.critical::before    { background: var(--critical); }
  .header-card.high::before        { background: var(--high); }
  .header-card.medium::before      { background: var(--medium); }
  .header-card.low::before         { background: var(--low); }
  .header-card.info::before        { background: var(--info); }
  /* "No auditado" no es un nivel de riesgo: es ausencia de datos. Gris. */
  .header-card.not-audited::before { background: var(--text-muted); }

  .header-main { flex: 1; min-width: 0; }
  .header-eyebrow {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .host-name {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -.4px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .host-name .icon { width: 20px; height: 20px; color: var(--text-secondary); }
  /* Mono: el hostname es un identificador. */
  .host-name-text {
    font-family: var(--font-mono);
    font-size: 24px;
    overflow-wrap: anywhere;
  }

  .header-idline {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .1px;
  }
  /* Cada nivel con SU familia entera: fondo pálido, texto sólido y borde claro del
     MISMO color. La versión anterior mezclaba familias —`.high` traía marco naranja
     (#EA580C) con texto y punto ROJOS (#FCA5A5 / #EF4444)—, así que un `high` se
     leía como un `critical`. */
  .risk-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1.5px solid var(--critical-border); }
  .risk-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1.5px solid var(--high-border); }
  .risk-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1.5px solid var(--medium-border); }
  .risk-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1.5px solid var(--low-border); }
  .risk-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1.5px solid var(--info-border); }
  /* Ausencia de datos, no ausencia de riesgo. Gris neutro, nunca verde. */
  .risk-badge.not-audited { background: var(--surface); color: var(--text-secondary); border: 1.5px solid var(--border); }
  .risk-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .risk-note { font-size: 13px; color: var(--text-secondary); }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 14px 22px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-key {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--text-secondary);
  }
  .meta-val { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  /* Mono solo donde hay una dirección, un rango o un identificador. */
  .meta-val-mono { font-family: var(--font-mono); font-size: 12px; }
  .meta-item-actions { grid-column: span 2; }
  .meta-item-wide { grid-column: span 3; }
  @media (max-width: 1100px) { .meta-item-wide { grid-column: span 2; } }
  .meta-item-actions .dl-group { margin-top: 1px; flex-wrap: nowrap; }
  /* En el informe exportado el prune ELIMINA .dl-group del clon, así que esta celda
     se quedaría con su etiqueta "Exportar" y nada debajo. */
  .meta-item-actions:not(:has(.dl-btn)) { display: none; }

  .dl-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 11px;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .dl-btn:hover { background: var(--accent); color: #fff; }

  /* Columna derecha: el hueco que en host ocupa el gauge de Lynis. */
  .header-aside {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
    min-width: 190px;
    padding-left: 28px;
    border-left: 1px solid var(--border);
  }
  .aside-label-top {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--text-secondary);
  }
  .port-count-num {
    font-family: var(--font-mono);
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--text);
  }
  /* Todos los puertos son informativos: no hay nada que arreglar. */
  .port-count-num.all-info { color: var(--low); }
  /* Objetivo no auditado: gris apagado, nunca el verde de "todo correcto". Un 0
     grande y verde sobre un escaneo que no ocurrió es el falso verde que la regla
     "fallo de herramienta ≠ dato negativo" existe para impedir. */
  .port-count-num.no-data { color: var(--text-secondary); }
  .port-count-note { font-size: 11px; color: var(--text-secondary); text-align: center; }

  .port-breakdown {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
    margin-top: 4px;
  }
  .port-breakdown-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  .port-breakdown-row.is-zero { opacity: .5; }
  .port-breakdown-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .port-breakdown-name { color: var(--text-secondary); flex: 1; }
  .port-breakdown-val { font-weight: 700; color: var(--text); font-family: var(--font-mono); }

  @media (max-width: 820px) {
    .header-card { flex-direction: column; }
    .header-aside { padding-left: 0; padding-top: 20px; border-left: none; border-top: 1px solid var(--border); align-self: stretch; }
  }

  /* ═══ AVISOS ═══════════════════════════════════════════════════════════════
     El mismo componente que host: un solo .lca-notice en tres niveles.
     El nivel manda en el peso, el tono en el color, y son independientes.

     Lo que sustituye —.scan-warn— tenía además un bug de contraste grave: su
     descripción era #CBD5E1 sobre el fondo claro #F0F9FF, o sea 1,39:1 cuando el
     mínimo legible es 4,5:1. Los colores venían de cuando el aviso vivía sobre la
     cabecera oscura y se quedaron ahí al moverlo. El mensaje afectado era "no se ha
     podido auditar": el más importante del panel, y prácticamente invisible. */
  .lca-notice {
    --notice-accent: var(--text-secondary);
    --notice-bg: var(--card);
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--notice-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--notice-accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .lca-notice-icon { color: var(--notice-accent); margin-top: 1px; }
  .lca-notice-main { flex: 1; min-width: 0; }
  .lca-notice-title { font-weight: 700; color: var(--text); }
  .lca-notice-lead { font-size: 12.5px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .lca-notice-body { font-size: 12.5px; color: var(--text); line-height: 1.6; margin-top: 6px; }
  .lca-notice-body.is-strong { font-weight: 600; }
  /* `scanWarn.desc` trae sus propios saltos de línea: son la estructura del texto
     (causa, causas posibles, qué comprobar), no un accidente del formato. */
  .lca-notice-body.is-prewrap { white-space: pre-line; }
  .lca-notice-list {
    margin: 8px 0 0; padding-left: 20px;
    font-size: 12.5px; color: var(--text); line-height: 1.7;
  }
  .lca-notice-list li { margin-bottom: 2px; }
  .lca-notice-hint {
    font-size: 12px; color: var(--text-secondary); margin-top: 8px;
    font-family: var(--font-mono);
  }
  .lca-notice-foot {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.08);
    font-size: 11.5px; color: var(--text-secondary);
  }

  .lca-notice.is-ok      { --notice-accent: var(--low);      --notice-bg: var(--low-bg);      border-color: var(--low-border); }
  .lca-notice.is-warn    { --notice-accent: var(--medium);   --notice-bg: var(--medium-bg);   border-color: var(--medium-border); }
  .lca-notice.is-info    { --notice-accent: var(--info);     --notice-bg: var(--info-bg);     border-color: var(--info-border); }
  .lca-notice.is-neutral { --notice-accent: var(--text-secondary); --notice-bg: var(--card);  border-color: var(--border); }
  .lca-notice.is-ok   .lca-notice-title { color: #3F6212; }
  .lca-notice.is-warn .lca-notice-title { color: #92400E; }

  .lca-notice.lvl-1 { padding: 16px 20px; margin-bottom: 14px; }
  .lca-notice.lvl-1 .lca-notice-title { font-size: 15px; }
  .lca-notice.lvl-1 .lca-notice-icon  { width: 18px; height: 18px; }
  .lca-notice.lvl-2 .lca-notice-title { font-size: 14px; }
  .lca-notice.lvl-3 {
    --notice-bg: var(--card);
    border-color: var(--border);
    padding: 12px 16px;
  }
  .lca-notice.lvl-3 .lca-notice-title { font-size: 13px; color: var(--text); }
  .lca-notice.lvl-3 .lca-notice-body,
  .lca-notice.lvl-3 .lca-notice-lead  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-icon  { width: 14px; height: 14px; }

  /* ═══ PIE DEL INFORME ══════════════════════════════════════════════════════ */
  .report-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 28px;
    margin-top: 20px;
    padding: 14px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .report-foot-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .report-foot-key {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .7px; color: var(--text-secondary);
  }
  .report-foot-val { font-size: 11.5px; color: var(--text-secondary); overflow-wrap: anywhere; }

  /* ── MAIN CONTENT ─────────────────────────────────────────────── */
  .main { padding: 24px 28px; display: flex; flex-direction: column; gap: 24px; }

  /* ── SECTION TITLE ───────────────────────────────────────────── */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-secondary);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
