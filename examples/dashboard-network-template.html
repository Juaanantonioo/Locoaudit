<!--
  LoCoAudit — Dashboard de Auditoría de Red
  Template para nodo "ui_template" de @flowfuse/node-red-dashboard (Dashboard 2.0 · Vue 3)

  CÓMO USAR:
  1. Arrastra un nodo "ui_template" al lienzo
  2. Conecta:  [inject] → [audit-network] → [ui_template]
  3. Doble click en ui_template → campo "Template": pega TODO este fichero
  4. En el nodo: Group → ancho 6 o más, tipo "Widget"
  5. Despliega y abre http://127.0.0.1:1880/dashboard

  Diseño de referencia: LoCoAudit - Dashboard de Red.html
-->
<template>
  <div>

    <!-- ── Sin datos ── -->
    <div v-show="state === 'idle'" class="lca-state-center">
      <div class="lca-state-ico">🌐</div>
      <h3 class="lca-state-title">Esperando auditoría de red...</h3>
      <p class="lca-state-desc">Pulsa el botón de inicio en Node-RED para escanear los puertos de tu equipo.</p>
    </div>

    <!-- ── Escaneando ── -->
    <div v-show="state === 'scanning'" class="lca-state-center">
      <div class="lca-spinner"></div>
      <p class="lca-state-desc">Escaneando puertos...</p>
    </div>

    <!-- ── Resultados ── -->
    <div v-if="state === 'done' && auditData">

      <!-- ══ HEADER ══ -->
      <header class="header">
        <div class="header-row1">
          <div class="header-icon">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4M3.5 3.5a14 14 0 0 0 0 17M20.5 3.5a14 14 0 0 1 0 17"/>
            </svg>
          </div>
          <div class="header-title-block">
            <div class="header-title">{{ auditData.host && auditData.host.hostname }}</div>
            <div class="header-subtitle">Auditoría de Red &nbsp;·&nbsp; {{ auditData.host && auditData.host.platform }}</div>
          </div>
          <div class="header-right">
            <div class="risk-badge" :class="riskClass">
              <span class="dot"></span>
              <span>{{ riskLabel }}</span>
            </div>
            <div class="port-count-block">
              <div class="port-count-num" :class="{ 'all-info': allInfo }">{{ donutTotal }}</div>
              <div class="port-count-label">puertos abiertos</div>
            </div>
          </div>
        </div>
        <div class="header-row2">
          <span class="pill"><span class="pill-label">Fuente</span><span class="pill-sep">·</span>{{ srcLabel }}</span>
          <span class="pill"><span class="pill-label">Modo</span><span class="pill-sep">·</span>{{ modeLabel }}</span>
          <span class="pill" v-if="auditData.scanMeta && auditData.scanMeta.durationMs">
            <span class="pill-label">Duración</span><span class="pill-sep">·</span>{{ durLabel }}
          </span>
          <span class="pill"><span class="pill-label">Fecha</span><span class="pill-sep">·</span>{{ scanTime }}</span>
        </div>
      </header>

      <!-- ══ MAIN ══ -->
      <main class="main">

        <!-- 1 · MAPA DE PUERTOS -->
        <section>
          <div class="section-title">Mapa de puertos</div>
          <div class="port-grid" v-if="sortedPorts.length > 0">
            <div v-for="(p, i) in sortedPorts" :key="'pg-'+i"
                 class="port-card" :class="'sev-' + (p.severity || 'info').toLowerCase()">
              <span class="port-sev-badge" :class="(p.severity || 'info').toLowerCase()">
                {{ sevLabel(p.severity) }}
              </span>
              <div class="port-number">{{ p.port }}</div>
              <div class="port-service">{{ p.service || 'unknown' }}</div>
              <div class="port-meta" v-if="p.process || p.version">
                <div class="port-meta-item" v-if="p.process">
                  <span class="meta-key">Proceso</span>
                  <code>{{ p.process }}{{ p.pid != null ? ' (' + p.pid + ')' : '' }}</code>
                </div>
                <div class="port-meta-item" v-if="p.version">
                  <span class="meta-key">Versión</span>
                  <code>{{ p.version }}</code>
                </div>
                <div class="port-meta-item" v-if="p.protocol">
                  <span class="meta-key">Proto</span>
                  <code>{{ p.protocol }}</code>
                </div>
              </div>
            </div>
          </div>
          <div class="empty-state" v-else>
            <div class="check">✅</div>
            <div class="empty-title">Sin puertos expuestos</div>
            <div class="empty-sub">El escaneo no encontró puertos abiertos.<br>Tu equipo no tiene servicios de red visibles.</div>
          </div>
        </section>

        <!-- 2 · BARRA DE SEVERIDAD + TABLA DE PUERTOS -->
        <div class="two-col" v-if="sortedPorts.length > 0">

          <!-- Gráfico de barras -->
          <div class="card">
            <div class="section-title" style="margin-bottom:0">Exposición por severidad</div>
            <div class="bar-chart">
              <div class="bar-col" v-for="col in barCols" :key="col.sev">
                <div class="bar-count" :style="{ color: col.count > 0 ? col.color : 'var(--text-subtle)' }">{{ col.count }}</div>
                <div class="bar-fill"
                     :style="{ background: col.color, height: col.height + 'px', opacity: col.count > 0 ? '1' : '0.18' }">
                  <div class="bar-ports">
                    <div class="bar-port-num" v-for="p in col.ports" :key="p">{{ p }}</div>
                  </div>
                </div>
                <div class="bar-label">{{ col.label }}</div>
              </div>
            </div>
            <div class="bar-axis"></div>
            <div class="bar-total-label">
              <strong>{{ donutTotal }}</strong> puerto{{ donutTotal !== 1 ? 's' : '' }} abierto{{ donutTotal !== 1 ? 's' : '' }}
            </div>
          </div>

          <!-- Tabla resumen -->
          <div class="card" style="padding:18px">
            <div class="section-title" style="margin-bottom:12px">Resumen de puertos</div>
            <table class="port-table">
              <thead>
                <tr>
                  <th>Puerto</th>
                  <th>Servicio</th>
                  <th>Proceso</th>
                  <th>Severidad</th>
                </tr>
              </thead>
              <tbody>
                <tr v-for="(p, i) in sortedPorts" :key="'tr-'+i">
                  <td class="td-port">{{ p.port }}</td>
                  <td class="td-service">{{ p.service || 'unknown' }}</td>
                  <td class="td-process">{{ p.process || '—' }}</td>
                  <td>
                    <span class="badge" :class="(p.severity || 'info').toLowerCase()">{{ sevLabel(p.severity) }}</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 3 · HALLAZGOS -->
        <section v-if="sortedFindings.length > 0">
          <div class="section-title">Hallazgos</div>
          <div class="findings-list">
            <div class="finding-item" v-for="(f, fi) in sortedFindings" :key="'f-'+fi">
              <div class="finding-header" @click="toggleFinding('f-' + fi)">
                <div class="finding-badges">
                  <span class="badge" :class="(f.severity || 'info').toLowerCase()">{{ sevLabel(f.severity) }}</span>
                  <span class="badge cat" v-if="f.category">{{ f.category }}</span>
                </div>
                <div class="finding-title">{{ f.title }}</div>
                <svg class="finding-chevron" :class="{ open: openFindings['f-' + fi] }"
                     viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="4,6 8,10 12,6"/>
                </svg>
              </div>
              <div class="finding-body" :class="{ open: openFindings['f-' + fi] }">
                <div class="detail-grid" v-if="f.fix">
                  <div class="detail-col">
                    <div class="detail-col-title">Impacto (Evidencia)</div>
                    <pre class="detail-evidence">{{ f.evidence }}</pre>
                  </div>
                  <div class="detail-col">
                    <div class="detail-col-title">Pasos de Resolución</div>
                    <div class="fix-steps" v-if="!f.isCommand">
                      <div class="fix-step" v-for="(step, si) in parseFixSteps(f.fix)" :key="si">
                        <span class="fix-num">{{ si + 1 }}</span>{{ step }}
                      </div>
                    </div>
                    <p v-if="f.isCommand" style="font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:10px;">
                      {{ f.title }}. Ejecuta el siguiente comando para aplicar la corrección:
                    </p>
                    <div v-if="f.isCommand" class="command-box">
                      <code class="command-text">{{ f.fix }}</code>
                      <button @click.stop="copyCommand(f.fix)"
                              :class="{ copied: copiedKey === f.fix }"
                              class="command-btn">
                        {{ copiedKey === f.fix ? '✓ Copiado' : 'Copiar' }}
                      </button>
                    </div>
                  </div>
                </div>
                <div v-if="!f.fix" style="padding:12px 0;font-style:italic;color:#6B7280;font-size:12.5px;">
                  Este hallazgo es informativo. No requiere acción inmediata.
                </div>

                <!-- ── Chat con IA ── -->
                <div class="lca-chat-wrap" v-if="llmAvailable === true">
                  <button class="ai-ask-btn" @click.stop="toggleChat('f-' + fi, f)">
                    🤖 {{ chatOpen['f-' + fi] ? 'Cerrar asistente' : 'Preguntar a la IA' }}
                  </button>
                  <div class="lca-chat" v-if="chatOpen['f-' + fi]">
                    <div class="lca-chat-msgs">
                      <div v-for="(cm, ci) in (chatMessages['f-' + fi] || [])" :key="ci"
                           class="chat-msg" :class="cm.role === 'user' ? 'chat-user' : 'chat-ai'">
                        <div class="chat-bubble" :class="{ 'chat-error': cm.error }">
                          <template v-for="(seg, si) in parseChatContent(cm.content)" :key="si">
                            <div v-if="seg.type === 'text'" class="chat-text" v-html="seg.html"></div>
                            <div v-else class="command-box">
                              <code class="command-text">{{ seg.code }}</code>
                              <button @click.stop="copyCommand(seg.code)"
                                      :class="{ copied: copiedKey === seg.code }"
                                      class="command-btn">
                                {{ copiedKey === seg.code ? '✓ Copiado' : 'Copiar' }}
                              </button>
                            </div>
                          </template>
                        </div>
                      </div>
                      <div v-if="chatLoading['f-' + fi]" class="chat-msg chat-ai">
                        <div class="chat-bubble chat-loading">
                          <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
                        </div>
                      </div>
                    </div>
                    <div class="lca-chat-input">
                      <input type="text" v-model="chatInput['f-' + fi]"
                             placeholder="Escribe tu pregunta…"
                             :disabled="chatLoading['f-' + fi]"
                             @keydown.enter.prevent="sendChat('f-' + fi, f)">
                      <button class="chat-send-btn"
                              :disabled="chatLoading['f-' + fi]"
                              @click.stop="sendChat('f-' + fi, f)">Enviar</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Sin hallazgos -->
        <div v-if="sortedPorts.length === 0 && sortedFindings.length === 0"
             class="lca-state-center" style="padding:40px 0">
          <div class="lca-state-ico">✅</div>
          <h3 class="lca-state-title">¡Sin hallazgos!</h3>
          <p class="lca-state-desc">No se encontraron puertos de riesgo en esta auditoría.</p>
        </div>

        <!-- Footer -->
        <div style="text-align:center;padding:16px 0 8px;font-size:11px;color:var(--text-subtle);"
             v-if="auditData.scanMeta">
          LoCoAudit · Escáner: {{ srcLabel }} · Modo: {{ modeLabel }} · {{ scanTime }}
        </div>

      </main>
    </div>
  </div>
</template>

<script>
export default {
  data() {
    return {
      state: 'idle',
      auditData: null,
      openFindings: {},
      copiedKey: null,
      // ── Chat con LLM (asistente IA) ──
      chatOpen: {},        // por findingKey: panel abierto/cerrado
      chatMessages: {},    // por findingKey: [{ role, content, error? }]
      chatInput: {},       // por findingKey: texto en curso
      chatLoading: {},     // por findingKey: esperando respuesta
      llmAvailable: null   // null = sin comprobar; true/false tras comprobar
    };
  },

  computed: {
    maxSev() {
      return (this.auditData && this.auditData.summary && this.auditData.summary.maxSeverity) || 'info';
    },

    counts() {
      var c = (this.auditData && this.auditData.summary && this.auditData.summary.counts) || {};
      return {
        critical: c.critical || 0,
        high:     c.high     || 0,
        medium:   c.medium   || 0,
        low:      c.low      || 0,
        info:     c.info     || 0
      };
    },

    allInfo() {
      var c = this.counts;
      return c.critical === 0 && c.high === 0 && c.medium === 0 && c.low === 0;
    },

    riskClass() {
      return this.maxSev;
    },

    riskLabel() {
      var MAP = {
        critical: 'Riesgo Crítico', high: 'Riesgo Alto',
        medium: 'Riesgo Moderado', low: 'Riesgo Bajo', info: 'Sin Riesgo'
      };
      return MAP[this.maxSev] || this.maxSev;
    },

    scanTime() {
      var ts = this.auditData && this.auditData.timestamp;
      if (!ts) return '—';
      return new Date(ts).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    durLabel() {
      var ms = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.durationMs;
      if (!ms) return '—';
      return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms';
    },

    srcLabel() {
      var src = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.portSource;
      return src === 'nmap' ? 'Nmap' : 'Nativo';
    },

    modeLabel() {
      var MAP = { standard: 'Estándar', full: 'Completo', custom: 'Personalizado' };
      var mode = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.scanMode;
      return MAP[mode] || mode || 'Estándar';
    },

    sortedPorts() {
      var ports = this.auditData && this.auditData.raw && this.auditData.raw.ports;
      if (!Array.isArray(ports)) return [];
      var SEV_ORDER = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      return ports.slice().sort(function(a, b) {
        return (SEV_ORDER[(b.severity || 'info').toLowerCase()] || 0) -
               (SEV_ORDER[(a.severity || 'info').toLowerCase()] || 0);
      });
    },

    sortedFindings() {
      var findings = this.auditData && this.auditData.findings;
      if (!Array.isArray(findings)) return [];
      var SEV_ORDER = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      return findings.slice().sort(function(a, b) {
        return (SEV_ORDER[(b.severity || 'info').toLowerCase()] || 0) -
               (SEV_ORDER[(a.severity || 'info').toLowerCase()] || 0);
      });
    },

    barCols() {
      var ports = this.sortedPorts;
      var defs = [
        { sev: 'high',   label: 'Alto',  color: '#EA580C' },
        { sev: 'medium', label: 'Medio', color: '#D97706' },
        { sev: 'info',   label: 'Info',  color: '#06B6D4' },
        { sev: 'low',    label: 'Bajo',  color: '#94A3B8' }
      ];
      var cols = defs.map(function(d) {
        var matching = ports.filter(function(p) {
          return (p.severity || 'info').toLowerCase() === d.sev;
        });
        return {
          sev:   d.sev,
          label: d.label,
          color: d.color,
          count: matching.length,
          ports: matching.slice(0, 3).map(function(p) { return p.port; })
        };
      });
      var maxCount = Math.max.apply(null, cols.map(function(c) { return c.count; }));
      if (maxCount === 0) maxCount = 1;
      cols.forEach(function(c) {
        c.height = Math.max(4, Math.round((c.count / maxCount) * 110));
      });
      return cols;
    },

    donutTotal() {
      var meta = this.auditData && this.auditData.scanMeta;
      var open = meta && meta.portsOpen;
      return (open != null ? open : null) || this.sortedPorts.length;
    }
  },

  watch: {
    msg: {
      deep: false,
      handler(newMsg) {
        if (!newMsg) return;
        if (!newMsg.payload || !newMsg.payload.findings) {
          this.state = 'scanning';
          return;
        }
        this.auditData    = newMsg.payload;
        this.state        = 'done';
        this.openFindings = {};
      }
    }
  },

  methods: {
    toggleFinding(key) {
      this.openFindings = Object.assign({}, this.openFindings, { [key]: !this.openFindings[key] });
    },

    parseFixSteps(fix) {
      if (!fix) return [];
      if (fix.indexOf('\n') >= 0) {
        return fix.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
      }
      if (fix.indexOf('. ') >= 0) {
        var parts = fix.split('. ').map(function(s) { return s.trim(); }).filter(Boolean);
        return parts.map(function(s, i) { return i < parts.length - 1 ? s + '.' : s; });
      }
      return [fix];
    },

    sevLabel(sev) {
      var MAP = { high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info', critical: 'Crítico' };
      return MAP[(sev || '').toLowerCase()] || (sev || '').toUpperCase();
    },

    formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    async copyCommand(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      } catch(e) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      }
    },

    // ── Chat con LLM ──────────────────────────────────────────
    toggleChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (willOpen && !(this.chatMessages[findingKey] && this.chatMessages[findingKey].length)) {
        this.sendChat(findingKey, finding,
          'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
      }
    },

    async sendChat(findingKey, finding, presetQuestion) {
      var question = presetQuestion != null
        ? presetQuestion
        : (this.chatInput[findingKey] || '').trim();
      if (!question || this.chatLoading[findingKey]) return;

      var history = (this.chatMessages[findingKey] || []).slice().map(function(m) {
        return { role: m.role, content: m.content };
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ finding: finding, question: question, history: history })
        });
        var data = await res.json();
        reply = (data && data.ok)
          ? { role: 'assistant', content: data.content }
          : { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    parseChatContent(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    mdInline(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    // Detecta si hay un nodo llm-config desplegado para mostrar (o no) el chat.
    var self = this;
    fetch('/locoaudit/chat/status')
      .then(function(r) { return r.json(); })
      .then(function(d) { self.llmAvailable = !!(d && d.available); })
      .catch(function() { self.llmAvailable = false; });
  }
};
</script>

<style>

    --bg: #F0F9FF;
    --header: #0F172A;
    --accent: #06B6D4;
    --accent-dim: rgba(6,182,212,.15);
    --card-bg: #ffffff;
    --card-border: #BAE6FD;

    --text-muted: #64748B;
    --text-subtle: #94A3B8;

    --sev-high-bg: #FFF7ED;
    --sev-high-border: #EA580C;
    --sev-high-text: #C2410C;
    --sev-high-badge: #FED7AA;

    --sev-medium-bg: #FFFBEB;
    --sev-medium-border: #D97706;
    --sev-medium-text: #B45309;
    --sev-medium-badge: #FDE68A;

    --sev-info-bg: #F0F9FF;
    --sev-info-border: #06B6D4;
    --sev-info-text: #0369A1;
    --sev-info-badge: #BAE6FD;

    --sev-low-bg: #F8FAFC;
    --sev-low-border: #94A3B8;
    --sev-low-text: #475569;
    --sev-low-badge: #E2E8F0;

    --sev-critical-bg: #FEF2F2;
    --sev-critical-border: #DC2626;
    --sev-critical-text: #991B1B;
    --sev-critical-badge: #FECACA;

    --mono: 'SF Mono', 'Consolas', 'Courier New', monospace;
    --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
