    findingIsCVE(f) {
      return f.id && f.id.startsWith('IMG-CVE');
    },

    // ¿El finding trae metadatos estructurados de Trivy para la tira de detalles?
    hasMeta(f) {
      return !!(f.pkg || f.installedVersion || f.fixedVersion ||
                (f.cvss != null) || f.cveCount || f.primaryUrl);
    },

    findingIsConfig(f) {
      return f.id && !f.id.startsWith('IMG-CVE');
    },

    // nombre canónico de la imagen, igual que el f.image que pone el normalizer
    imageFullName(img) {
      return img.name || (img.repository + ':' + img.tag);
    },

    // cuenta findings CVE asociados a una imagen.
    // Match ESTRICTO por f.image: cada finding CVE ya lo lleva fiable. Antes se
    // usaba un fallback difuso (title.includes(repository)) que cross-contaba
    // imágenes con el mismo repository (nginx:latest vs nginx:alpine).
    cvesForImage(img) {
      var fullName = this.imageFullName(img);
      var findings = (this.auditData && this.auditData.findings) || [];
      return findings.filter(function(f) {
        return f.id && f.id.startsWith('IMG-CVE') && f.image === fullName;
      }).length;
    },

    // severidad máxima de findings asociados a una imagen (match estricto por f.image)
    maxSevForImage(img) {
      var fullName = this.imageFullName(img);
      var findings = (this.auditData && this.auditData.findings) || [];
      var order = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      var best = null;
      findings.forEach(function(f) {
        if (f.image !== fullName) return;
        var sev = (f.severity || 'info').toLowerCase();
        if (!best || (order[sev] || 0) > (order[best] || 0)) best = sev;
      });
      return best;
    },

    // findings cuyo title / target / evidence contienen el nombre del contenedor
    relatedFindings(containerName) {
      var findings = (this.auditData && this.auditData.findings) || [];
      return findings.filter(function(f) {
        return (f.title    || '').includes(containerName) ||
               f.target === containerName ||
               (f.evidence || '').includes(containerName);
      });
    },

    // severidad máxima entre findings relacionados con un contenedor
    containerRisk(containerName) {
      var related = this.relatedFindings(containerName);
      var order = { critical: 5, high: 4, medium: 3, low: 2, info: 1 };
      var best = 'none';
      related.forEach(function(f) {
        var sev = (f.severity || 'info').toLowerCase();
        if (best === 'none' || (order[sev] || 0) > (order[best] || 0)) best = sev;
      });
      return best;
    },

    // conteo de hallazgos por severidad para el badge de un contenedor
    sevCountFor(containerName, sev) {
      return this.relatedFindings(containerName).filter(function(f) {
        return f.severity === sev;
      }).length;
    },

    // Añade transparencia a un color de token.
    //
    // getPropertyValue devuelve el token tal cual está escrito en el :root, que aquí
    // es un hex de 6 dígitos: no hay forma de pedirle un rgba() con alfa. En vez de
    // declarar una segunda familia de tokens en notación rgb —que sería el mismo
    // color escrito dos veces, o sea la duplicación que este trabajo elimina—, la
    // transparencia se DERIVA del hex en el momento de usarlo.
    //
    // Si el token no fuera un hex reconocible se devuelve tal cual, opaco: un color
    // sólido de más se ve raro, pero uno inválido no pinta nada y la tira desaparece
    // sin que nadie se entere.
    alfa(color, a) {
      var m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(color || '').trim());
      if (!m) return color;
      var h = m[1];
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      var n = parseInt(h, 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    },

    // Color de las tiras decorativas de capa del contenedor. El riesgo lo decide
    // containerRisk(); aquí solo se traduce a color, con la opacidad escalonada que
    // sugiere las capas de la imagen.
    containerStripColor(containerName, i) {
      var risk = this.containerRisk(containerName);
      var T = this.tok;
      if (risk === 'critical') return this.alfa(T.critical, (0.7 - i * 0.2).toFixed(2));
      if (risk === 'high')     return this.alfa(T.high,     (0.7 - i * 0.2).toFixed(2));
      if (risk === 'medium')   return this.alfa(T.medium,   (0.7 - i * 0.2).toFixed(2));
      // Sin riesgo: el acento, más apagado todavía.
      return this.alfa(T.accent, (0.5 - i * 0.15).toFixed(2));
    },

    parseFixSteps(fix) {
      if (!fix) return [];
      if (fix.indexOf('\n') >= 0) {
        return fix.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
      }
      if (fix.indexOf('. ') >= 0) {
        var parts = fix.split('. ').map(function(s) { return s.trim(); }).filter(Boolean);
        return parts.map(function(s, i) { return i < parts.length - 1 ? s + '.' : s; });
      }
      return [fix];
    },

    // Detecta si un paso de resolución es (o contiene) un comando ejecutable.
    // Soporta dos formas: la línea entera es comando, o "Etiqueta: comando".
    stepCmd(step) {
      var s = (step || '').trim();
      var CMD = /^(sudo|brew|npm|yarn|pip|composer|go|apt|dnf|yum|winget|choco|lsof|nslookup|kill|systemctl|launchctl|bundle|cargo|rabbitmqctl|jupyter|auditpol|nginx|netsh|net\s+stop|netstat|ufw|apachectl|systemsetup|docker)\b/i;
      if (CMD.test(s)) return { label: '', cmd: s };
      var idx = s.indexOf(': ');
      if (idx >= 0) {
        var after = s.slice(idx + 2).trim();
        if (CMD.test(after)) return { label: s.slice(0, idx + 1), cmd: after };
      }
      return null;
    },

    // Pasos enriquecidos: cada paso es { label, cmd } (comando copiable) o { text }.
    // El fix puede traer el comando en la 1ª línea y una nota explicativa debajo.
    // El botón copia SOLO el comando (finding.command); la nota se muestra aparte,
    // para que un pegado en terminal nunca arrastre texto no ejecutable.
    fixNote(f) {
      if (!f || !f.command || !f.fix) return "";
      return String(f.fix).split("\n").slice(1).join("\n").trim();
    },
    // ¿El paso de resolución contiene algún comando (directo o dentro de un paso)?
    fixHasCmd(f) {
      if (!f || !f.fix) return false;
      if (f.command) return true;
      try { return this.parseFixStepsRich(f.fix).some(function (s) { return !!s.cmd; }); }
      catch (e) { return false; }
    },
    parseFixStepsRich(fix) {
      var self = this;
      return this.parseFixSteps(fix).map(function(step) {
        var c = self.stepCmd(step);
        return c ? { label: c.label, cmd: c.cmd, text: null }
                 : { label: null, cmd: null, text: step };
      });
    },

    sevLabel(sev) {
      var MAP = { critical: 'Crítico', high: 'Alto', medium: 'Medio', low: 'Bajo', info: 'Info' };
      return MAP[(sev || '').toLowerCase()] || (sev || '').toUpperCase();
    },

    formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    fmtBytes(b) {
      if (!b) return '—';
      if (b >= 1e9) return (b / 1e9).toFixed(1) + ' GB';
      return (b / 1e6).toFixed(0) + ' MB';
    },

    async copyCommand(text) {
      try {
        await navigator.clipboard.writeText(text);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      } catch(e) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        this.copiedKey = text;
        setTimeout(() => { this.copiedKey = null; }, 2000);
      }
    },

    // ── Chat con LLM ──────────────────────────────────────────

    // Clave estable por hallazgo, con el grupo (imagen) como prefijo: el mismo
    // CVE puede aparecer en dos imágenes y son conversaciones distintas.
    chatKey(f, groupKey, fi) {
      return (f && f.id) ? groupKey + '|id:' + f.id : groupKey + '|idx:' + fi;
    },

    // Escaneo nuevo = findings nuevos: se borran todas las conversaciones para
    // no arrastrar contexto de hallazgos que ya no existen.
    resetChats() {
      this.chatEpoch++;
      this.chatOpen     = {};
      this.chatMessages = {};
      this.chatInput    = {};
      this.chatLoading  = {};
    },

    // Cerrar el asistente solo oculta el panel: el historial se conserva.
    toggleChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (willOpen && !(this.chatMessages[findingKey] && this.chatMessages[findingKey].length)) {
        this.sendChat(findingKey, finding,
          'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
      }
    },

    async sendChat(findingKey, finding, presetQuestion) {
      var question = presetQuestion != null
        ? presetQuestion
        : (this.chatInput[findingKey] || '').trim();
      if (!question || this.chatLoading[findingKey]) return;

      var epoch = this.chatEpoch;
      var history = (this.chatMessages[findingKey] || []).slice().map(function(m) {
        return { role: m.role, content: m.content };
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            finding: finding, question: question, history: history,
            auditType: this.auditData && this.auditData.auditType,
            platform: this.auditData && this.auditData.host && this.auditData.host.platform
          })
        });
        var data = await res.json();
        reply = (data && data.ok)
          ? { role: 'assistant', content: data.content }
          : { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      // Llegó un escaneo nuevo mientras esperábamos: la respuesta ya no aplica.
      if (epoch !== this.chatEpoch) return;

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    parseChatContent(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.mdInline(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    mdInline(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    this.readTokens();
    // Segunda pasada en nextTick: si la hoja del componente aún no estuviera en el
    // head al montar, la primera lectura vuelve vacía y se conserva lo anterior.
    this.$nextTick(this.readTokens);

    // Detecta si hay un nodo llm-config desplegado para mostrar (o no) el chat.
    // `model` ya venía en la respuesta y se descartaba; ahora lo enseña la cabecera
    // del chat, para que se sepa quién firma cada contestación.
    var self = this;
    fetch('/locoaudit/chat/status')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        self.llmAvailable = !!(d && d.available);
        self.llmModel = (d && d.model) || null;
      })
      .catch(function() { self.llmAvailable = false; });
  }
};
</script>

<style>
  /*LCA-STYLE-DASH:image — fuente única de estilo del export*/
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ═══ TOKENS ═══════════════════════════════════════════════════════════════
     El vocabulario es el de host, que es la referencia de diseño del proyecto.
     image era el último fichero con nombres propios: --indigo, --accent-light,
     --accent-mid, --accent-pale, --accent-soft, --mono, --sans.

     Y era también el que más lejos estaba en VALOR: la severidad usaba la familia
     500 de Tailwind mientras host y network usan la 600/700. Medido sobre blanco,
     esa familia no llega al mínimo de contraste legible: #EAB308 da 1,92:1 y
     #22C55E da 2,28:1, cuando el mínimo para texto pequeño es 4,5:1. La
     convergencia no es solo coherencia, es legibilidad. */
  :root {
    --critical: #DC2626;
    --critical-bg: #FEF2F2;
    --critical-border: #FECACA;
    --high: #EA580C;
    --high-bg: #FFF7ED;
    --high-border: #FED7AA;
    --medium: #D97706;
    --medium-bg: #FFFBEB;
    --medium-border: #FDE68A;
    --low: #65A30D;
    --low-bg: #F7FEE7;
    --low-border: #D9F99D;
    --info: #0EA5E9;
    --info-bg: #F0F9FF;
    --info-border: #BAE6FD;

    /* Tono 700 para TEXTO sobre el fondo pálido del mismo nivel. No es un color
       nuevo del vocabulario: es el que image ya usaba en sus badges, ahora con
       nombre. Existe porque está MEDIDO: el color base sobre su propio fondo pálido
       da 4,41 / 3,35 / 3,07 / 2,98 / 2,60 para critical / high / medium / low / info,
       y el mínimo legible es 4,5. Con el tono 700 son 5,91 / 4,88 / 4,75 / 4,82 /
       5,57. El base sigue siendo la identidad —bordes, puntos, rellenos sólidos—;
       este es el que se lee. */
    --critical-text: #B91C1C;
    --high-text: #C2410C;
    --medium-text: #A16207;
    --low-text: #4D7C0F;
    --info-text: #0369A1;

    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    --surface: #F1F5F9;
    --text-muted: #94A3B8;

    /* El acento sigue siendo el morado, que ya era el de image: aquí no cambia de
       valor, solo de nombre y de escala. `--accent-soft` desaparece: su #f3effc era
       este mismo --accent-bg escrito a mano, y encima vivía de un fallback porque
       NADIE declaraba el token, en ningún fichero del proyecto. Un nombre menos. */
    --accent: #7C3AED;
    --accent-bg: #F5F3FF;
    --accent-border: #DDD6FE;
    --accent-light: #C4B5FD;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 100px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);

    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Fira Code", monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track  { background: var(--surface); }
  ::-webkit-scrollbar-thumb  { background: var(--text-muted); border-radius: 3px; }

  /* ── Iconos ────────────────────────────────────────────────────────────────
     Un solo <symbol> por icono, referenciado con <use>. El sprite es el primer
     hijo de .lca-report-root para que el clon del export se lo lleve; escondido
     con position/size y no con display:none, que en el informe descargado podría
     verse pisado por alguna regla !important del CSS extra. */
  .lca-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: -3px;
  }
  .icon-sm { width: 13px; height: 13px; vertical-align: -2px; }
  .icon-xl { width: 44px; height: 44px; stroke-width: 1.25; }

  /* Utilidad de mono para valores técnicos sueltos (versiones, identificadores). */
  .is-mono { font-family: var(--font-mono); }

  /* Sin pasos de resolución: informa de qué falta, sin fingir un veredicto.
     Ya sin fallback: --text-secondary está declarado arriba. */
  .nofix-note {
    padding: 12px 0;
    font-style: italic;
    color: var(--text-secondary);
    font-size: 12.5px;
  }
  .nofix-note a { color: inherit; font-style: normal; text-decoration: underline; }

  /* ── Estados idle / scanning ───────────────────────────────────────────────── */
  .lca-state-center {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 20px; text-align: center;
    color: var(--text-secondary);
  }
  .lca-state-inline { padding: 40px 0; }
  .lca-state-ico {
    color: var(--text-muted);
    margin-bottom: 14px;
    animation: lcaPulse 2.2s ease-in-out infinite;
  }
  .lca-state-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .lca-state-desc  { font-size: .88rem; line-height: 1.4; }
  .lca-spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: lcaSpin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes lcaPulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  @keyframes lcaSpin  { to { transform: rotate(360deg); } }

  /* ═══ CABECERA ═════════════════════════════════════════════════════════════ */
  .header-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 26px 28px;
    display: flex;
    align-items: stretch;
    gap: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .header-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--text-muted);
  }
  .header-card.critical::before { background: var(--critical); }
  .header-card.high::before     { background: var(--high); }
  .header-card.medium::before   { background: var(--medium); }
  .header-card.low::before      { background: var(--low); }
  .header-card.info::before     { background: var(--info); }

  .header-main { flex: 1; min-width: 0; }
  .header-eyebrow {
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .host-name {
    font-size: 26px; font-weight: 700; color: var(--text);
    letter-spacing: -.4px;
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .host-name .icon { width: 20px; height: 20px; color: var(--text-secondary); }
  /* Mono: el hostname es un identificador. */
  .host-name-text { font-family: var(--font-mono); font-size: 24px; overflow-wrap: anywhere; }

  .header-idline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .risk-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px; font-weight: 600; letter-spacing: .1px;
  }
  /* Cada nivel con su familia entera: fondo pálido, texto sólido, borde claro.
     La versión anterior pintaba el badge con el color sólido de fondo y texto
     BLANCO encima: #EF4444 con blanco da 3,76:1, por debajo del mínimo de 4,5. */
  .risk-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1.5px solid var(--critical-border); }
  .risk-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1.5px solid var(--high-border); }
  .risk-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1.5px solid var(--medium-border); }
  .risk-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1.5px solid var(--low-border); }
  .risk-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1.5px solid var(--info-border); }
  .risk-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .risk-note { font-size: 13px; color: var(--text-secondary); }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 14px 22px;
    margin-top: 18px; padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-key {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px;
    color: var(--text-secondary);
  }
  .meta-val { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  .meta-val-mono { font-family: var(--font-mono); font-size: 12px; }
  .meta-item-actions { grid-column: span 2; }
  .meta-item-actions .dl-group { margin-top: 1px; flex-wrap: nowrap; }
  /* En el informe exportado el prune ELIMINA .dl-group del clon, así que esta celda
     se quedaría con su etiqueta "Exportar" y nada debajo. */
  .meta-item-actions:not(:has(.dl-btn)) { display: none; }

  .dl-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 11px;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .dl-btn:hover { background: var(--accent); color: #fff; }

  /* Columna derecha: el hueco que en host ocupa el gauge y en network el contador
     de puertos. Aquí, el inventario Docker en tres cifras apiladas. */
  .header-aside {
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    gap: 10px;
    flex-shrink: 0; min-width: 200px;
    padding-left: 28px;
    border-left: 1px solid var(--border);
  }
  .aside-label-top {
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .8px;
    color: var(--text-secondary);
  }
  .stat-row { display: flex; align-items: baseline; gap: 8px; width: 100%; }
  .stat-row .icon { color: var(--text-secondary); align-self: center; }
  .stat-row.is-accent .icon { color: var(--accent); }
  .stat-num {
    font-family: var(--font-mono);
    font-size: 26px; font-weight: 700; line-height: 1;
    letter-spacing: -1px; color: var(--text);
    min-width: 2ch;
  }
  .stat-row.is-accent .stat-num { color: var(--accent); }
  .stat-label { font-size: 12px; color: var(--text-secondary); }

  @media (max-width: 820px) {
    .header-card { flex-direction: column; }
    .header-aside { padding-left: 0; padding-top: 20px; border-left: none; border-top: 1px solid var(--border); align-self: stretch; }
  }

  /* ── MAIN ─────────────────────────────────────────────────── */
  .main {
    width: 100%;
    max-width: 1200px; margin: 0 auto;
    padding: 20px 24px 40px;
    display: flex; flex-direction: column; gap: 24px;
  }

  .lca-report-root { width: 100%; min-width: 0; }
  .lca-report-root > .main {
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
    align-self: stretch;
  }
  .lca-report-root > .main > * { width: 100%; max-width: none; }

  /* ── SECTION LABEL ────────────────────────────────────────── */
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700;
    color: var(--accent);
    text-transform: uppercase; letter-spacing: .1em;
    margin-bottom: 10px;
  }
  .title-bar {
    width: 3px; height: 16px;
    background: var(--accent); border-radius: 2px;
    display: inline-block; flex-shrink: 0;
  }
  .section-count {
    font-weight: 400; color: var(--text-secondary);
    text-transform: none; letter-spacing: 0;
  }

  /* ═══ AVISOS ═══════════════════════════════════════════════════════════════
     El mismo componente que host y network: un solo .lca-notice en tres niveles.
     El nivel manda en el peso, el tono en el color, y son independientes.
     Sustituye al panel `notice` propio de image, que se anunciaba a sí mismo como
     "Hallazgos de carácter informativo" cuando lo que describe no es un hallazgo
     sino una limitación del objeto auditado. */
  .lca-notice {
    --notice-accent: var(--text-secondary);
    --notice-bg: var(--card);
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--notice-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--notice-accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .lca-notice-icon { color: var(--notice-accent); margin-top: 1px; }
  .lca-notice-main { flex: 1; min-width: 0; }
  .lca-notice-title { font-weight: 700; color: var(--text); }
  .lca-notice-lead { font-size: 12.5px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .lca-notice-body { font-size: 12.5px; color: var(--text); line-height: 1.6; margin-top: 6px; }
  .lca-notice-body.is-strong { font-weight: 600; }
  .lca-notice-body.is-prewrap { white-space: pre-line; }
  .lca-notice-list {
    margin: 8px 0 0; padding-left: 20px;
    font-size: 12.5px; color: var(--text); line-height: 1.7;
  }
  .lca-notice-list li { margin-bottom: 2px; }
  /* Variante con estado por delante: sin viñeta, porque la viñeta y la etiqueta de
     estado compiten por el mismo sitio. */
  .lca-notice-list.is-stated { list-style: none; padding-left: 0; margin-top: 10px; }
  .lca-notice-list.is-stated li {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; padding: 3px 0; margin-bottom: 0;
    border-top: 1px solid var(--border);
  }
  .lca-notice-state {
    flex: 0 0 auto; min-width: 78px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px; color: var(--text-secondary);
  }
  .lca-notice-list.is-stated li.chk-failed .lca-notice-state { color: var(--medium); }
  .lca-notice-name { color: var(--text); }
  /* Variante con icono por opción: las cuatro vías de mitigación de una imagen. */
  .lca-notice-list.is-iconed { list-style: none; padding-left: 0; margin-top: 10px; }
  .lca-notice-list.is-iconed li {
    display: flex; align-items: flex-start; gap: 9px;
    margin-bottom: 6px; line-height: 1.55;
  }
  .lca-notice-list.is-iconed .icon { color: var(--text-secondary); margin-top: 3px; }
  .lca-notice-hint {
    font-size: 12px; color: var(--text-secondary); margin-top: 8px;
    font-family: var(--font-mono);
  }
  .lca-notice-foot {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.08);
    font-size: 11.5px; color: var(--text-secondary);
  }

  .lca-notice.is-ok      { --notice-accent: var(--low);      --notice-bg: var(--low-bg);      border-color: var(--low-border); }
  .lca-notice.is-warn    { --notice-accent: var(--medium);   --notice-bg: var(--medium-bg);   border-color: var(--medium-border); }
  .lca-notice.is-info    { --notice-accent: var(--info);     --notice-bg: var(--info-bg);     border-color: var(--info-border); }
  .lca-notice.is-neutral { --notice-accent: var(--text-secondary); --notice-bg: var(--card);  border-color: var(--border); }
  .lca-notice.is-ok   .lca-notice-title { color: #3F6212; }
  .lca-notice.is-warn .lca-notice-title { color: #92400E; }

  .lca-notice.lvl-1 { padding: 16px 20px; margin-bottom: 14px; }
  .lca-notice.lvl-1 .lca-notice-title { font-size: 15px; }
  .lca-notice.lvl-1 .lca-notice-icon  { width: 18px; height: 18px; }
  .lca-notice.lvl-2 .lca-notice-title { font-size: 14px; }
  .lca-notice.lvl-3 {
    --notice-bg: var(--card);
    border-color: var(--border);
    padding: 12px 16px;
  }
  .lca-notice.lvl-3 .lca-notice-title { font-size: 13px; color: var(--text); }
  .lca-notice.lvl-3 .lca-notice-body,
  .lca-notice.lvl-3 .lca-notice-lead  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-list  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-icon  { width: 14px; height: 14px; }

  /* ═══ TIRA DE SEVERIDADES ══════════════════════════════════════════════════
     Una sola tarjeta con celdas separadas por un filete, igual que host. */
  .sev-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .sev-strip { display: flex; flex-wrap: wrap; }
  .sev-cell {
    flex: 1 1 150px;
    min-width: 0;
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 2px;
    border-left: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
    position: relative;
  }
  .sev-cell:first-child { border-left: none; }
  .sev-cell:hover { background: var(--surface); }
  .sev-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sev-cell-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .sev-cell-num { font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; }
  .sev-cell-sub { font-size: 11px; color: var(--text-secondary); }

  .sev-cell.critical { background: var(--critical-bg); }
  .sev-cell.high     { background: var(--high-bg); }
  .sev-cell.medium   { background: var(--medium-bg); }
  .sev-cell.low      { background: var(--low-bg); }
  .sev-cell.critical .sev-cell-label, .sev-cell.critical .sev-cell-num { color: var(--critical-text); }
  .sev-cell.high     .sev-cell-label, .sev-cell.high     .sev-cell-num { color: var(--high-text); }
  .sev-cell.medium   .sev-cell-label, .sev-cell.medium   .sev-cell-num { color: var(--medium-text); }
  .sev-cell.low      .sev-cell-label, .sev-cell.low      .sev-cell-num { color: var(--low-text); }
  /* El subtítulo dentro de una celda tintada toma el tono del propio nivel. En gris
     daba 4,35:1 sobre el tinte crítico —por debajo del mínimo de 4,5— porque el
     fondo deja de ser blanco. La jerarquía la siguen marcando el tamaño y el peso,
     no el color. */
  .sev-cell.critical .sev-cell-sub { color: var(--critical-text); }
  .sev-cell.high     .sev-cell-sub { color: var(--high-text); }
  .sev-cell.medium   .sev-cell-sub { color: var(--medium-text); }
  .sev-cell.low      .sev-cell-sub { color: var(--low-text); }

  /* A cero: gris. Un color de alarma sobre un cero es ruido. */
  .sev-cell.zero { background: var(--card); }
  .sev-cell.zero .sev-cell-label { color: var(--text-secondary); }
  .sev-cell.zero .sev-cell-num   { color: var(--text-secondary); }

  .sev-cell.active::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }
  .sev-cell.active { background: var(--surface); }

  /* ── CONTAINER CARDS ──────────────────────────────────────── */
  .empty-dashed {
    background: #fff;
    border: 1px dashed var(--accent-border);
    border-radius: 10px;
    padding: 32px; text-align: center; color: var(--text-secondary);
  }

  .container-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .container-card {
    background: #fff;
    border: 2px solid var(--accent-border);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 4px 16px rgba(124,58,237,.06);
  }
  .container-card.crisk-critical { border-color: var(--critical); box-shadow: 0 4px 16px rgba(239,68,68,.15); }
  .container-card.crisk-high     { border-color: var(--high);     box-shadow: 0 4px 16px rgba(249,115,22,.12); }
  .container-card.crisk-medium   { border-color: var(--medium);   box-shadow: 0 4px 16px rgba(234,179,8,.12); }
  .container-card.crisk-low      { border-color: var(--low);      }
