<template>
  <div>

    <!-- ── Sin datos ── -->
    <!-- Icono en línea: este estado queda fuera de .lca-report-root y no ve el sprite. -->
    <div v-show="state === 'idle'" class="lca-state-center">
      <svg class="icon icon-xl lca-state-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="10" width="4" height="4" rx="1"></rect><rect x="7" y="10" width="4" height="4" rx="1"></rect>
        <rect x="12" y="10" width="4" height="4" rx="1"></rect><rect x="7" y="5.5" width="4" height="4" rx="1"></rect>
        <path d="M2 14c0 4 3 6.5 7 6.5s7.5-2.5 8.5-6.5h3"></path>
      </svg>
      <h3 class="lca-state-title">Esperando auditoría de imagen…</h3>
      <p class="lca-state-desc">Pulsa el botón de inicio en Node-RED para auditar las imágenes Docker.</p>
    </div>

    <!-- ── Escaneando ── -->
    <div v-show="state === 'scanning'" class="lca-state-center">
      <div class="lca-spinner"></div>
      <p class="lca-state-desc">Analizando imágenes y contenedores…</p>
    </div>

    <!-- ── Resultados ── -->
    <div v-if="state === 'done' && auditData" class="lca-report-root">

      <!-- ══ SPRITE DE ICONOS ══ -->
      <!-- Primer hijo de .lca-report-root para que el sprite viaje con el clon del export.
           No renombrar la clase: no debe casar con el prune del export ni con el @media print. -->
      <svg class="lca-sprite" aria-hidden="true" focusable="false"><defs>
        <symbol id="lca-i-docker" viewBox="0 0 24 24"><rect x="2" y="10" width="4" height="4" rx="1"></rect><rect x="7" y="10" width="4" height="4" rx="1"></rect><rect x="12" y="10" width="4" height="4" rx="1"></rect><rect x="7" y="5.5" width="4" height="4" rx="1"></rect><path d="M2 14c0 4 3 6.5 7 6.5s7.5-2.5 8.5-6.5h3"></path></symbol>
        <symbol id="lca-i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path><path d="m3 17 9 5 9-5"></path></symbol>
        <symbol id="lca-i-box" viewBox="0 0 24 24"><path d="M21 8.5v7a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4a2 2 0 0 1-1-1.7v-7a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4a2 2 0 0 1 1 1.7z"></path><path d="m3.3 7.5 8.7 5 8.7-5M12 22v-9.5"></path></symbol>
        <symbol id="lca-i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"></path></symbol>
        <symbol id="lca-i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect></symbol>
        <symbol id="lca-i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"></path></symbol>
        <symbol id="lca-i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.5 2.5 4.5-5"></path></symbol>
        <symbol id="lca-i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></symbol>
        <symbol id="lca-i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></symbol>
        <symbol id="lca-i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"></path></symbol>
        <symbol id="lca-i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></symbol>
        <symbol id="lca-i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"></path></symbol>
        <symbol id="lca-i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></symbol>
        <symbol id="lca-i-sparkles" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"></path><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9z"></path></symbol>
        <symbol id="lca-i-tag" viewBox="0 0 24 24"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h8l8.6 8.6a2 2 0 0 1 0 1.8z"></path><path d="M7.5 7.5h.01"></path></symbol>
        <symbol id="lca-i-gauge" viewBox="0 0 24 24"><path d="M3 18a9 9 0 1 1 18 0"></path><path d="m12 14 4-4"></path></symbol>
        <symbol id="lca-i-puzzle" viewBox="0 0 24 24"><path d="M9 3h6v3a2 2 0 0 0 4 0V3h2v6h-3a2 2 0 0 0 0 4h3v6h-6v-3a2 2 0 0 0-4 0v3H5v-6h3a2 2 0 0 0 0-4H5V3h4z"></path></symbol>
        <symbol id="lca-i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></symbol>
        <symbol id="lca-i-link" viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 .5l2.5-2.5a4 4 0 0 0-5.7-5.7L11.5 6.7"></path><path d="M14 11a4 4 0 0 0-6-.5L5.5 13a4 4 0 0 0 5.7 5.7l1.3-1.3"></path></symbol>
        <symbol id="lca-i-plug" viewBox="0 0 24 24"><path d="M9 3v6M15 3v6M6 9h12v3a6 6 0 0 1-12 0z"></path><path d="M12 18v3"></path></symbol>
        <symbol id="lca-i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4.5L3 9"></path><path d="M4 13a8 8 0 0 0 14 4.5L21 15"></path><path d="M3 4v5h5M21 20v-5h-5"></path></symbol>
        <symbol id="lca-i-note" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5M8 13h8M8 17h5"></path></symbol>
        <symbol id="lca-i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></symbol>
        <symbol id="lca-i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></symbol>
      </defs></svg>

      <!-- ══ HEADER ══ -->
      <!-- Misma anatomía que host y network; a la derecha, los recuentos del inventario Docker.
           La barra toma el color del riesgo real (claseRiesgo), igual que el badge. -->
      <div class="header-card" :class="claseRiesgo">
        <div class="header-main">
          <div class="header-eyebrow">LoCoAudit · Auditoría de imagen</div>
          <div class="host-name">
            <svg class="icon"><use href="#lca-i-docker"></use></svg>
            <span class="host-name-text">{{ auditData.host && auditData.host.hostname }}</span>
          </div>
          <div class="header-idline">
            <span class="risk-badge" :class="claseRiesgo">
              <span class="risk-badge-dot"></span>
              {{ etiquetaRiesgo }}
            </span>
            <!-- Texto corto: el mismo recuento que el donut enseña en grande. -->
            <span class="risk-note"><template v-if="totalDonut > 0">{{ totalDonut + ' requieren tu atención' }}</template><template v-else>Nada que arreglar</template></span>
          </div>

          <div class="meta-grid">
            <div class="meta-item">
              <span class="meta-key">Plataforma</span>
              <span class="meta-val">{{ auditData.host && auditData.host.platform }}</span>
            </div>
            <div class="meta-item" v-if="auditData.scanMeta && auditData.scanMeta.durationMs">
              <span class="meta-key">Duración</span>
              <span class="meta-val">{{ etiquetaDuracion }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-key">Análisis</span>
              <span class="meta-val">{{ horaEscaneo }}</span>
            </div>
            <div class="meta-item meta-item-actions">
              <span class="meta-key">Exportar</span>
              <span class="dl-group">
                <button class="dl-btn" @click="descargarHtml" title="Descargar informe HTML (imprimible a PDF)">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> HTML
                </button>
                <button class="dl-btn" @click="descargarJson" title="Descargar datos JSON">
                  <svg class="icon icon-sm"><use href="#lca-i-download"></use></svg> JSON
                </button>
              </span>
            </div>
          </div>
        </div>

        <!-- Columna derecha: el inventario Docker, tres cifras apiladas. -->
        <div class="header-aside">
          <span class="aside-label-top">Inventario Docker</span>
          <div class="stat-row">
            <svg class="icon icon-sm"><use href="#lca-i-layers"></use></svg>
            <span class="stat-num">{{ (auditData.scanMeta && auditData.scanMeta.imagesFound) || 0 }}</span>
            <span class="stat-label">imágenes</span>
          </div>
          <div class="stat-row">
            <svg class="icon icon-sm"><use href="#lca-i-box"></use></svg>
            <span class="stat-num">{{ (auditData.scanMeta && auditData.scanMeta.containersFound) || 0 }}</span>
            <span class="stat-label">contenedores</span>
          </div>
          <div class="stat-row">
            <svg class="icon icon-sm"><use href="#lca-i-play"></use></svg>
            <span class="stat-num">{{ (auditData.scanMeta && auditData.scanMeta.containersRunning) || 0 }}</span>
            <span class="stat-label">activos</span>
          </div>
        </div>
      </div>

      <div class="main">

        <!-- ══ SEVERIDADES ══ -->
        <!-- Una sola tira de severidades, como host; los niveles a cero van en gris.
             Va pegada a la cabecera y antes de los avisos. -->
        <div class="sev-block">
          <div class="sev-strip">
            <div v-for="card in tarjetasUrgencia" :key="card.sev"
                 class="sev-cell" :class="[card.sev, { 'active': filterSev === card.sev, 'zero': !conteos[card.sev] }]"
                 role="button" tabindex="0"
                 :aria-pressed="pulsado(card.sev)"
                 @click="alternarFiltroSeveridad(card.sev)"
                 @keydown.enter.prevent="alternarFiltroSeveridad(card.sev)"
                 @keydown.space.prevent="alternarFiltroSeveridad(card.sev)"
                 :title="'Filtrar por severidad ' + etiquetaSeveridad(card.sev)">
              <span class="sev-cell-label">{{ etiquetaSeveridad(card.sev) }}</span>
              <span class="sev-cell-num">{{ conteos[card.sev] }}</span>
              <span class="sev-cell-sub">{{ card.action }}</span>
            </div>
          </div>
        </div>

        <!-- ══ AVISOS ══ .lca-notice en los mismos niveles que host y network.
             Image no tiene nivel 1 (veredicto): no existe un estadoSinHallazgos para él. -->

        <!-- ── Nivel 2 · COBERTURA ──────────────────────────────────────────── -->
        <!-- Comprobaciones no realizadas en un solo bloque: son alcance, no problemas de las imágenes. -->
        <div class="lca-notice lvl-2" v-if="omitidas"
             :class="claseAviso()">
          <svg class="icon lca-notice-icon"><use :href="iconoAviso()"></use></svg>
          <div class="lca-notice-main">
            <div class="lca-notice-title">{{ omitidas.title }}</div>
            <div class="lca-notice-body" v-for="(frase, i) in omitidas.evidence.split('\n\n')" :key="i">
              {{ frase }}
            </div>
            <ul class="lca-notice-list is-stated">
              <li v-for="it in omitidas.items" :key="it.id" :class="'chk-' + it.estado">
                <span class="lca-notice-state"><template v-if="it.estado === 'failed'">no se pudo</template><template v-else-if="it.estado === 'not-applicable'">no aplica</template><template v-else>desactivada</template></span>
                <span class="lca-notice-name">{{ it.title }}<span v-if="it.reason && it.id.indexOf('IMG-SCAN-ERR') === 0" class="lca-notice-reason">{{ it.reason }}</span></span>
              </li>
            </ul>
          </div>
        </div>

        <!-- ── Nivel 3 · CONTEXTO ───────────────────────────────────────────── -->
        <!-- La inmutabilidad es un límite del objeto auditado, no un hallazgo: nivel 3 y en gris. -->
        <div class="lca-notice lvl-3 is-neutral">
          <svg class="icon lca-notice-icon"><use href="#lca-i-info"></use></svg>
          <div class="lca-notice-main">
            <div class="lca-notice-title">Una imagen Docker no se puede corregir en sitio</div>
            <div class="lca-notice-body">
              A diferencia del host o la red, una <strong>imagen Docker es inmutable</strong>:
              sus paquetes no se actualizan una vez construida, por lo que LoCoAudit no puede
              aplicar una corrección directa sobre ella. Estas son las opciones generales de
              mitigación, comunes a todos los hallazgos:
            </div>
            <ul class="lca-notice-list is-iconed">
              <li>
                <svg class="icon icon-sm"><use href="#lca-i-tag"></use></svg>
                <span><strong>Actualizar el tag</strong> — cambia a un tag más reciente que ya incluya la corrección (comprueba en Docker Hub / GHCR).</span>
              </li>
              <li>
                <svg class="icon icon-sm"><use href="#lca-i-box"></use></svg>
                <span><strong>Cambiar de imagen base</strong> — alpine o distroless en vez de debian: menos paquetes = menos superficie de ataque.</span>
              </li>
              <li>
                <svg class="icon icon-sm"><use href="#lca-i-note"></use></svg>
                <span><strong>Aceptar el riesgo</strong> — si el mantenedor aún no ha publicado parche, documenta el riesgo aceptado y vigila el upstream.</span>
              </li>
              <li>
                <svg class="icon icon-sm"><use href="#lca-i-refresh"></use></svg>
                <span><strong>Reconstruir la imagen</strong> — si es propia, reconstrúyela sobre una base actualizada (FROM al día) y vuelve a escanear.</span>
              </li>
            </ul>
          </div>
        </div>


        <!-- ══ CONTENEDORES ACTIVOS ══ -->
        <section>
          <div class="section-label">
            <span class="title-bar"></span>
            Contenedores activos
            <span class="section-count">({{ contenedoresActivos.length }})</span>
          </div>

          <div v-if="contenedoresActivos.length === 0" class="empty-dashed">
            No hay contenedores activos
          </div>
          <div v-else class="container-grid">
            <div v-for="c in contenedoresActivos" :key="c.id"
                 class="container-card"
                 :class="'crisk-' + riesgoContenedor(c.name)">
              <!-- Layer strips (decorative) -->
              <div class="layer-strip strip-0"
                   :style="{ background: colorFranjaContenedor(c.name, 0) }"></div>
              <div class="layer-strip strip-1"
                   :style="{ background: colorFranjaContenedor(c.name, 1) }"></div>
              <div class="layer-strip strip-2"
                   :style="{ background: colorFranjaContenedor(c.name, 2) }"></div>

              <div class="container-body">
                <div class="container-top">
                  <div>
                    <div class="container-name">{{ c.name }}</div>
                    <code class="container-image">{{ c.image }}</code>
                  </div>
                  <div class="status-badge" :class="claseEstado(c)">
                    <svg class="icon icon-sm"><use :href="iconoEstado(c)"></use></svg>
                    <template v-if="c.running"> Activo</template><template v-else> Detenido</template>
                  </div>
                </div>

                <div class="ports-row" v-if="c.ports && c.ports.length > 0">
                  <span v-for="p in c.ports" :key="p" class="port-chip"><svg class="icon icon-sm"><use href="#lca-i-plug"></use></svg> {{ p }}</span>
                </div>

                <div class="container-findings" v-if="hallazgosRelacionados(c.name).length > 0">
                  <span class="findings-prefix">
                    {{ hallazgosRelacionados(c.name).length }} hallazgo<template v-if="hallazgosRelacionados(c.name).length > 1">s</template><template v-else></template>:
                  </span>
                  <template v-for="sev in ['critical','high','medium','low']" :key="'csev-'+sev">
                    <span v-if="conteoSeveridad(c.name, sev) > 0"
                          class="mini-sev-badge"
                          :class="'' + sev">
                      {{ conteoSeveridad(c.name, sev) }} {{ etiquetaSeveridad(sev) }}
                    </span>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ══ DONUT + IMÁGENES ══ -->
        <div class="mid-row">

          <!-- Distribución de hallazgos (donut SVG puro) -->
          <div class="card">
            <div class="section-label">
              <span class="title-bar"></span>
              Distribución de hallazgos
            </div>
            <div class="donut-wrap">
              <svg class="donut-svg" viewBox="0 0 160 160">
                <!-- track -->
                <circle cx="80" cy="80" r="60" fill="none" :stroke="tok.surface" stroke-width="20"></circle>
                <!-- segments -->
                <circle v-for="seg in segmentosDonut" :key="'ds-' + seg.key"
                        cx="80" cy="80" r="60" fill="none"
                        :stroke="seg.color" stroke-width="20"
                        :stroke-dasharray="seg.dasharray"
                        :stroke-dashoffset="seg.dashoffset"></circle>
                <!-- inner disc -->
                <circle cx="80" cy="80" r="48" :fill="tok.card"></circle>
                <text x="80" y="74"  text-anchor="middle" class="donut-total">{{ totalDonut }}</text>
                <text x="80" y="90"  text-anchor="middle" class="donut-sub">de {{ totalHallazgos }} · a revisar</text>
              </svg>
              <div class="donut-legend">
                <div v-for="seg in segmentosDonut" :key="'dl-' + seg.key" class="legend-item">
                  <span class="legend-dot" :style="{ background: seg.color }"></span>
                  <span class="legend-name">{{ etiquetaSeveridad(seg.key) }}</span>
                  <div class="legend-bar-track">
                    <div class="legend-bar-fill"
                         :style="{ width: anchoBarra(seg), background: seg.color }"></div>
                  </div>
                  <span class="legend-count" :style="{ color: seg.textColor }">{{ seg.count }}</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Imágenes escaneadas -->
          <div class="card">
            <div class="section-label">
              <span class="title-bar"></span>
              Imágenes escaneadas
            </div>
            <div class="images-list">
              <div v-for="img in imagenes" :key="img.id" class="image-row">
                <!-- Layer icon (stacked slabs) -->
                <div class="layer-icon">
                  <div class="layer-slab slab-0"
                       :class="claseCapa(img)"></div>
                  <div class="layer-slab slab-1"
                       :class="claseCapa(img)"
                       style="opacity:0.6"></div>
                  <div class="layer-slab slab-2"
                       :class="claseCapa(img)"
                       style="opacity:0.35"></div>
                </div>

                <div class="image-info">
                  <div class="image-name">{{ img.name || (img.repository + ':' + img.tag) }}</div>
                  <div class="image-meta">
                    <span v-if="img.os">{{ img.os }}</span>
                    <span v-if="img.os && (img.sizeBytes || img.created)"> · </span>
                    <span v-if="img.sizeBytes">{{ formatearBytes(img.sizeBytes) }}</span>
                    <span v-if="img.sizeBytes && img.created"> · </span>
                    <span v-if="img.created">creada {{ img.created }}</span>
                  </div>
                </div>

                <div class="image-badge-wrap">
                  <span v-if="cvesDeImagen(img) > 0"
                        class="cve-badge"
                        :class="claseCve(img)">
                    {{ cvesDeImagen(img) }} CVE<template v-if="cvesDeImagen(img) > 1">s</template><template v-else></template>
                  </span>
                  <span v-else-if="img.cveScan === undefined || img.cveScan === 'analizada'" class="clean-badge"><svg class="icon icon-sm"><use href="#lca-i-check"></use></svg> Limpia</span>
                  <span v-else class="unscanned-badge" title="Trivy no ha analizado esta imagen: que no tenga CVE listados no significa que no los haya"><svg class="icon icon-sm"><use href="#lca-i-info"></use></svg> Sin analizar</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ══ HALLAZGOS ══ -->
        <section>
          <div class="findings-header">
            <div class="section-label" style="margin-bottom:0">
              <span class="title-bar"></span>
              Hallazgos
              <span class="section-count">
                ({{ hallazgosFiltrados.length }}<template v-if="filterSev !== 'all' || filterType !== 'all'"> filtrados</template><template v-else></template>)
              </span>
            </div>
            <div class="filter-bar">
              <button v-for="ft in filtrosTipo" :key="ft.val"
                      class="filter-btn"
                      :class="{ active: filterType === ft.val }"
                      @click="filterType = ft.val">{{ ft.label }}</button>
              <button v-if="filterSev !== 'all' || filterType !== 'all'"
                      class="filter-btn clear-btn"
                      @click="filterSev = 'all'; filterType = 'all'"><svg class="icon icon-sm"><use href="#lca-i-close"></use></svg> Limpiar</button>
            </div>
          </div>

          <div v-if="hallazgosFiltrados.length === 0" class="empty-dashed" style="margin-top:10px">
            No hay hallazgos para los filtros seleccionados
          </div>

          <div v-else class="findings-list">
            <template v-for="grp in gruposHallazgos" :key="grp.key">
            <div v-if="mostrarGrupos" class="group-header"
                 :class="{ open: grupoAbierto(grp.key) }"
                 @click="alternarGrupo(grp.key)">
              <svg class="icon icon-sm group-chevron" :class="{ open: grupoAbierto(grp.key) }"><use href="#lca-i-chevron"></use></svg>
              <span class="group-name"><svg class="icon icon-sm"><use href="#lca-i-layers"></use></svg> {{ grp.label }}</span>
              <span v-if="grp.os" class="group-os">{{ grp.os }}</span>
              <span class="group-sevs">
                <span v-if="grp.sev.critical" class="gsev critical">{{ grp.sev.critical }}</span>
                <span v-if="grp.sev.high"     class="gsev high">{{ grp.sev.high }}</span>
                <span v-if="grp.sev.medium"   class="gsev medium">{{ grp.sev.medium }}</span>
                <span v-if="grp.sev.low"      class="gsev low">{{ grp.sev.low }}</span>
                <span v-if="grp.sev.info"     class="gsev info">{{ grp.sev.info }}</span>
              </span>
              <span class="group-count">{{ grp.findings.length }}</span>
            </div>
            <div class="group-body" v-show="!mostrarGrupos || grupoAbierto(grp.key)">
            <div v-for="(f, fi) in grp.findings" :key="f.id || fi" class="finding-item"
                 :class="{ 'finding-open': openFindings[f.id || fi] }">
              <button class="finding-row" @click="alternarHallazgo(f.id || fi)">
                <!-- Sin modificador de color: el tipo lo dice la palabra, no el tinte. -->
                <span class="type-badge">
                  <template v-if="esCve(f)">CVE</template><template v-else-if="esSecreto(f)">Secreto</template><template v-else>Config</template>
                </span>
                <span class="sev-badge" :class="f.severity || 'info'">
                  {{ etiquetaSeveridad(f.severity) }}
                </span>
                <span class="finding-title">{{ f.title }}</span>
                <span v-if="f.image" class="finding-img-badge">{{ f.image }}</span>
                <span class="finding-id">{{ f.id }}</span>
                <svg class="icon icon-sm finding-chevron" :class="{ open: openFindings[f.id || fi] }"><use href="#lca-i-chevron"></use></svg>
              </button>

              <div class="finding-detail" :class="{ open: openFindings[f.id || fi] }">
                <!-- Un panel plano con secciones. No renombrar .detail-stack (lo usa el export). -->
                <div class="detail-stack" v-if="f.evidence || f.fix">
                  <!-- La evidencia se muestra aunque no haya fix. -->
                  <div class="detail-col" v-if="f.evidence">
                    <div class="detail-col-title">Evidencia</div>
                    <p class="detail-evidence">{{ f.evidence }}</p>
                    <!-- Tira de metadatos: datos estructurados de Trivy (findings CVE) -->
                    <div v-if="tieneMeta(f)" class="meta-strip">
                      <div v-if="f.pkg" class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-box"></use></svg> Paquete</span>
                        <span class="meta-value">{{ f.pkg }}</span>
                      </div>
                      <div v-if="f.installedVersion" class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-tag"></use></svg> Instalada</span>
                        <span class="meta-value is-mono">{{ f.installedVersion }}</span>
                      </div>
                      <div v-if="f.fixedVersion" class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-check"></use></svg> Corregida</span>
                        <span class="meta-value is-mono meta-fixed">{{ f.fixedVersion }}</span>
                      </div>
                      <div v-else-if="f.pkg" class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-check"></use></svg> Corregida</span>
                        <span class="meta-value meta-nofix">sin parche</span>
                      </div>
                      <div v-if="f.cvss != null" class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-gauge"></use></svg> CVSS</span>
                        <span class="meta-value">
                          {{ f.cvss }}
                          <span class="cvss-chip" :class="f.severity || 'info'">{{ etiquetaSeveridad(f.severity) }}</span>
                        </span>
                      </div>
                      <div v-if="f.cveCount > 1" class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-puzzle"></use></svg> CVEs</span>
                        <span class="meta-value">{{ f.cveCount }}</span>
                      </div>
                      <div class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-search"></use></svg> Fuente</span>
                        <span class="meta-value">{{ etiquetaOrigen(f.source) }}</span>
                      </div>
                      <div class="meta-cell">
                        <span class="meta-label"><svg class="icon icon-sm"><use href="#lca-i-link"></use></svg> Advisory</span>
                        <a v-if="f.primaryUrl" class="meta-value meta-link" :href="f.primaryUrl" target="_blank" rel="noopener">{{ f.advisoryLabel || 'Ver' }} <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                        <span v-else class="meta-value meta-muted" title="Trivy no aporta una URL pública fiable para este hallazgo">no disponible</span>
                      </div>
                    </div>
                  </div>
                  <!-- Resolución para cualquier hallazgo con fix, también los CVE (solucionImagen). -->
                  <div class="detail-col" v-if="f.fix">
                    <div class="detail-col-title">Resolución</div>
                    <!-- Una rama por alternativa excluyente; dentro de cada rama, pasos en orden (<ol>). -->
                    <!-- v-for sobre un array de un elemento: parsea el fix una sola vez. -->
                    <div class="fix-plan" v-for="(fx, xi) in [pasosDeSolucion(f.fix)]" :key="xi">
                      <!-- La intro describe el contexto y va sin numerar. -->
                      <p v-for="(ln, ii) in fx.intro" :key="'i' + ii" class="fix-intro">{{ ln }}</p>
                      <p v-for="(nt, ni) in fx.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                      <div class="fix-branch" v-for="(br, bi) in fx.branches" :key="bi">
                        <div v-if="br.heading" class="fix-branch-title">{{ br.heading }}</div>
                        <ol class="fix-steps" v-if="br.steps.length"
                            :class="{ 'fix-steps-single': br.steps.length === 1 && !br.heading }">
                          <li class="fix-step" v-for="(st, si) in br.steps" :key="si">
                            <span v-if="st.label" class="fix-step-label">{{ st.label }}</span>
                            <!-- El comando va DENTRO del paso que lo usa, no como paso aparte. -->
                            <span v-if="st.cmd" class="command-box command-inline">
                              <code class="command-text">{{ st.cmd }}</code>
                              <button @click.stop="copiarComando(st.cmd)"
                                      :class="{ copied: copiedKey === st.cmd }"
                                      class="command-btn">
                                <svg class="icon icon-sm" v-if="copiedKey === st.cmd"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === st.cmd"> Copiado</template><template v-else>Copiar</template>
                              </button>
                            </span>
                          </li>
                        </ol>
                        <p v-for="(nt, ni) in br.notes" :key="'n' + ni" class="fix-note-line">{{ nt }}</p>
                      </div>
                    </div>
                    <p v-if="notaSolucion(f)" class="cmd-note">{{ notaSolucion(f) }}</p>
                    <!-- Una sola nota neutra por ficha; el ámbar se reserva para la severidad Media. -->
                    <div v-if="solucionConComando(f)" class="cmd-note cmd-note-safety">
                      <svg class="icon icon-sm"><use href="#lca-i-shield"></use></svg>
                      <span>LoCoAudit no ejecuta estos comandos: cópialos y revísalos antes de ejecutarlos.<template v-if="solucionConSudo(f)"> Requieren privilegios de administrador.</template></span>
                    </div>
                  </div>
                </div>
                <!-- Mismos tres textos que host: distingue "no hace falta" de "no tenemos el paso". -->
                <div v-if="!f.fix" class="nofix-note">
                  <template v-if="f.noAction">
                    Este hallazgo es informativo. No requiere acción inmediata.
                  </template>
                  <template v-else-if="f.primaryUrl">
                    LoCoAudit no tiene un paso concreto para este hallazgo.
                    <a :href="f.primaryUrl" target="_blank" rel="noopener">Más información <svg class="icon icon-sm"><use href="#lca-i-external"></use></svg></a>
                  </template>
                  <template v-else>
                    Este hallazgo es informativo. No requiere acción inmediata.
                  </template>
                </div>

                <!-- ── Chat con IA ── -->
                <div class="lca-chat-wrap" v-if="llmAvailable === true">
                  <button class="ai-ask-btn" @click.stop="alternarChat(claveChat(f, grp.key, fi), f)">
                    <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                    <template v-if="chatOpen[claveChat(f, grp.key, fi)]"> Cerrar asistente</template><template v-else> Preguntar a la IA</template>
                  </button>
                  <div class="lca-chat" v-if="chatOpen[claveChat(f, grp.key, fi)]">
                    <!-- Cabecera con el modelo, para saber quién ha escrito la respuesta. -->
                    <div class="lca-chat-head">
                      <svg class="icon icon-sm"><use href="#lca-i-sparkles"></use></svg>
                      <span class="lca-chat-head-title">Asistente</span>
                      <span class="lca-chat-model" v-if="llmModel">{{ llmModel }}</span>
                    </div>
                    <div class="lca-chat-msgs">
                      <div v-for="(cm, ci) in (chatMessages[claveChat(f, grp.key, fi)] || [])" :key="ci"
                           class="chat-msg" :class="claseMensaje(cm)">
                        <div class="chat-bubble" :class="{ 'chat-error': cm.error }">
                          <template v-for="(seg, si) in trocearRespuesta(cm.content)" :key="si">
                            <div v-if="seg.type === 'text'" class="chat-text" v-html="seg.html"></div>
                            <div v-else class="command-box">
                              <code class="command-text">{{ seg.code }}</code>
                              <button class="command-btn"
                                      :class="{ copied: copiedKey === seg.code }"
                                      @click.stop="copiarComando(seg.code)">
                                <svg class="icon icon-sm" v-if="copiedKey === seg.code"><use href="#lca-i-check"></use></svg><template v-if="copiedKey === seg.code"> Copiado</template><template v-else>Copiar</template>
                              </button>
                            </div>
                          </template>
                        </div>
                      </div>
                      <div v-if="chatLoading[claveChat(f, grp.key, fi)]" class="chat-msg chat-ai">
                        <div class="chat-bubble chat-loading">
                          <span class="chat-dot"></span><span class="chat-dot"></span><span class="chat-dot"></span>
                        </div>
                      </div>
                    </div>
                    <div class="lca-chat-input">
                      <input type="text" v-model="chatInput[claveChat(f, grp.key, fi)]"
                             placeholder="Escribe tu pregunta…"
                             :disabled="chatLoading[claveChat(f, grp.key, fi)]"
                             @keydown.enter.prevent="enviarChat(claveChat(f, grp.key, fi), f)">
                      <button class="chat-send-btn"
                              :disabled="chatLoading[claveChat(f, grp.key, fi)]"
                              @click.stop="enviarChat(claveChat(f, grp.key, fi), f)">Enviar</button>
                    </div>
                    <!-- Aviso al pie: se lee después de la respuesta, antes de actuar. -->
                    <div class="lca-chat-foot">
                      Un modelo de lenguaje puede equivocarse. Contrasta lo que te diga
                      con la evidencia del hallazgo antes de ejecutar nada.
                    </div>
                  </div>
                </div>
              </div>
            </div>
            </div>
            </template>
          </div>
        </section>

        <!-- Footer -->
        <!-- Pie con la misma rejilla clave/valor que host y network. -->
        <div class="report-foot" v-if="auditData.scanMeta">
          <div class="report-foot-item">
            <span class="report-foot-key">Herramienta</span>
            <span class="report-foot-val">LoCoAudit · auditoría de imagen</span>
          </div>
          <div class="report-foot-item" v-if="herramientas">
            <span class="report-foot-key">Fuentes</span>
            <span class="report-foot-val">{{ herramientas }}</span>
          </div>
          <div class="report-foot-item" v-if="(auditData.scanMeta.modulesRun || []).length">
            <span class="report-foot-key">Módulos</span>
            <span class="report-foot-val">{{ (auditData.scanMeta.modulesRun || []).join(', ') }}</span>
          </div>
          <div class="report-foot-item">
            <span class="report-foot-key">Generado</span>
            <span class="report-foot-val">{{ horaEscaneo }}</span>
          </div>
        </div>

      </div><!-- /main -->

    </div><!-- /done -->
  </div>
</template>

<script>
export default {
  data() {
    return {
      state: 'idle',
      auditData: null,
      openFindings: {},
      copiedKey: null,
      filterSev: 'all',
      filterType: 'all',
      // ── Chat con LLM (asistente IA) ──
      chatOpen: {},        // por findingKey: panel abierto/cerrado
      chatMessages: {},    // por findingKey: [{ role, content, error? }]
      chatInput: {},       // por findingKey: texto en curso
      chatLoading: {},     // por findingKey: esperando respuesta
      chatEpoch: 0,        // se incrementa con cada escaneo: descarta respuestas en vuelo
      chatModel: {},       // por findingKey: modelo con el que empezó la conversación
      llmAvailable: null,  // null = sin comprobar; true/false tras comprobar
      llmModel: null,      // modelo que responde; /locoaudit/chat/status ya lo devuelve
      openGroups: {},      // por grupo de imagen: desplegado (true) / colapsado (def. false)

      // ── Tokens de color leídos del :root (ver leerTokens) para el donut SVG y estilos en JS.
      // Vacíos hasta la primera lectura: sin constantes de respaldo que dupliquen el CSS.
      tok: {
        critical: '', high: '', medium: '', low: '', info: '',
        criticalText: '', highText: '', mediumText: '', lowText: '', infoText: '',
        accent: '', surface: '', card: '', textMuted: '', textSecondary: ''
      }
    };
  },

  computed: {
    severidadMaxima() {
      return (this.auditData && this.auditData.summary && this.auditData.summary.maxSeverity) || 'info';
    },

    conteos() {
      var c = (this.auditData && this.auditData.summary && this.auditData.summary.counts) || {};
      return {
        critical: c.critical || 0,
        high:     c.high     || 0,
        medium:   c.medium   || 0,
        low:      c.low      || 0
      };
    },

    etiquetaRiesgo() {
      var MAP = {
        critical: 'Riesgo Crítico', high: 'Riesgo Alto',
        medium: 'Riesgo Moderado', low: 'Riesgo Bajo', info: 'Sin Riesgo'
      };
      return MAP[this.severidadMaxima] || this.severidadMaxima;
    },

    claseRiesgo() {
      return this.severidadMaxima;
    },

    // Herramientas con su versión desde scanMeta; sin versión se muestra solo el nombre.
    herramientas() {
      var m = (this.auditData && this.auditData.scanMeta) || {};
      var out = [];
      if (m.trivyVersion) out.push('Trivy ' + m.trivyVersion);
      else if ((m.modulesRun || []).indexOf('trivy-image') >= 0) out.push('Trivy');
      if (m.engineVersion) out.push('Docker ' + m.engineVersion);
      else if ((m.modulesRun || []).indexOf('docker-api') >= 0) out.push('Docker');
      if (out.length) {
        return out.join(' · ');
      } else {
        return null;
      }
    },

    horaEscaneo() {
      var ts = this.auditData && this.auditData.timestamp;
      if (!ts) return '—';
      return new Date(ts).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' });
    },

    etiquetaDuracion() {
      var ms = this.auditData && this.auditData.scanMeta && this.auditData.scanMeta.durationMs;
      if (!ms) return '—';
      if (ms >= 1000) {
        return (ms / 1000).toFixed(1) + 's';
      } else {
        return ms + 'ms';
      }
    },

    contenedoresActivos() {
      var docker = this.auditData && this.auditData.raw && this.auditData.raw.docker;
      var containers = docker && docker.containers;
      if (!Array.isArray(containers)) return [];
      return containers.filter(function(c) { return c.running; });
    },

    todosLosContenedores() {
      var docker = this.auditData && this.auditData.raw && this.auditData.raw.docker;
      var containers = docker && docker.containers;
      if (Array.isArray(containers)) {
        return containers;
      } else {
        return [];
      }
    },

    imagenes() {
      var docker = this.auditData && this.auditData.raw && this.auditData.raw.docker;
      var imgs = docker && docker.images;
      // Modo local: usar los metadatos ricos de `docker images` (sin cambios).
      if (Array.isArray(imgs) && imgs.length) return imgs;
      // Imagen remota / sin daemon Docker: caer a la lista derivada de Trivy.
      var scanned = this.auditData && this.auditData.scannedImages;
      if (Array.isArray(scanned)) {
        return scanned;
      } else {
        return [];
      }
    },

    // Resumen de resumenOmitidas(), el mismo helper que audit-host.
    omitidas() {
      var m = this.auditData && this.auditData.scanMeta;
      return (m && m.checksSkipped) || null;
    },

    hallazgosFiltrados() {
      var findings = (this.auditData && this.auditData.findings) || [];
      var self = this;
      return findings.filter(function(f) {
        // Las comprobaciones no realizadas se muestran agregadas en su bloque, no como hallazgos.
        if (f.skipped === true) return false;
        if (self.filterSev !== 'all' && f.severity !== self.filterSev) return false;
        if (self.filterType === 'cve' && !self.esCve(f)) return false;
        if (self.filterType === 'config' && !self.esConfig(f)) return false;
        if (self.filterType === 'secret' && !self.esSecreto(f)) return false;
        return true;
      });
    },

    // Agrupa por imagen (f.image); los que no tienen imagen van a "General".
    gruposHallazgos() {
      // SO por imagen, reutilizando el mismo dato de la tarjeta "Imágenes escaneadas"
      var osByImage = {};
      (this.imagenes || []).forEach(function(img) {
        var name = img.name || (img.repository + ':' + img.tag);
        if (name) osByImage[name] = img.os || '';
      });
      var groups = [];
      var byKey = {};
      this.hallazgosFiltrados.forEach(function(f) {
        var label = f.image || 'General';
        if (!byKey[label]) {
          byKey[label] = {
            key: label, label: label, os: osByImage[label] || '', findings: [],
            sev: { critical: 0, high: 0, medium: 0, low: 0, info: 0 }
          };
          groups.push(byKey[label]);
        }
        byKey[label].findings.push(f);
        var s = (f.severity || 'info').toLowerCase();
        if (byKey[label].sev[s] !== undefined) byKey[label].sev[s]++;
      });
      // "General" siempre al final si hay grupos de imagen
      groups.sort(function(a, b) {
        if (a.label === 'General') return 1;
        if (b.label === 'General') return -1;
        return 0;
      });
      return groups;
    },

    // Cabeceras de grupo solo con 2+ imágenes con hallazgos.
    mostrarGrupos() {
      return this.gruposHallazgos.filter(function(g) { return g.label !== 'General'; }).length > 1;
    },

    // Todos los hallazgos, informativos incluidos; el donut solo dibuja los que piden atención.
    totalHallazgos() {
      return ((this.auditData && this.auditData.findings) || []).length;
    },

    totalDonut() {
      var c = this.conteos;
      return c.critical + c.high + c.medium + c.low;
    },

    // Donut SVG puro — r=60, cx=cy=80, C≈376.99
    segmentosDonut() {
      var C = 2 * Math.PI * 60;
      var c = this.conteos;
      var total = this.totalDonut;
      if (total === 0) return [];
      // El color va a un :stroke, donde no llega var(): se lee del :root.
      var T = this.tok;
      // `color` rellena arco y punto; `textColor` (tono 700) pinta la cifra con contraste suficiente.
      var sevs = [
        { key: 'critical', color: T.critical, textColor: T.criticalText, count: c.critical },
        { key: 'high',     color: T.high,     textColor: T.highText,     count: c.high     },
        { key: 'medium',   color: T.medium,   textColor: T.mediumText,   count: c.medium   },
        { key: 'low',      color: T.low,      textColor: T.lowText,      count: c.low      }
      ].filter(function(s) { return s.count > 0; });

      var offset = C / 4; // start at 12 o'clock
      return sevs.map(function(s) {
        var arc = (s.count / total) * C;
        var seg = {
          key:        s.key,
          color:      s.color,
          textColor:  s.textColor,
          count:      s.count,
          dasharray:  arc.toFixed(2) + ' ' + (C - arc).toFixed(2),
          dashoffset: offset.toFixed(2)
        };
        offset -= arc;
        return seg;
      });
    },

    tarjetasUrgencia() {
      return [
        // Sin `icon`: el color de la celda ya lo dice.
        { sev: 'critical', action: 'Acción inmediata'     },
        { sev: 'high',     action: 'Resolver esta semana' },
        { sev: 'medium',   action: 'Cuando puedas'        },
        { sev: 'low',      action: 'Opcional'             }
      ];
    },

    filtrosTipo() {
      return [
        { val: 'all',    label: 'Todo'     },
        { val: 'cve',    label: 'CVE'    },
        { val: 'secret', label: 'Secretos' },
        { val: 'config', label: 'Config' }
      ];
    }
  },

  watch: {
    msg: {
      deep: false,
      handler(newMsg) {
        if (!newMsg) return;
        if (!newMsg.payload || !newMsg.payload.findings) {
          this.state = 'scanning';
          return;
        }
        this.auditData    = newMsg.payload;
        this.state        = 'done';
        this.leerTokens();   // síncrono: el primer pintado de los resultados ya va con color
        this.openFindings = {};
        this.filterSev    = 'all';
        this.filterType   = 'all';
        this.reiniciarChats();
        this.consultarEstadoLlm();   // la cabecera del chat muestra el modelo del llm-config de este resultado
      }
    }
  },

  methods: {
    pulsado(sev) {
      if (this.filterSev === sev) {
        return 'true';
      } else {
        return 'false';
      }
    },

    alternarFiltroSeveridad(sev) {
      if (this.filterSev === sev) {
        this.filterSev = 'all';
      } else {
        this.filterSev = sev;
      }
    },

    claseAviso() {
      if (this.omitidas.failed > 0) {
        return 'is-warn';
      } else {
        return 'is-neutral';
      }
    },

    iconoAviso() {
      if (this.omitidas.failed > 0) {
        return '#lca-i-alert';
      } else {
        return '#lca-i-info';
      }
    },

    claseEstado(c) {
      if (c.running) {
        return 'running';
      } else {
        return 'stopped';
      }
    },

    iconoEstado(c) {
      if (c.running) {
        return '#lca-i-play';
      } else {
        return '#lca-i-stop';
      }
    },

    anchoBarra(seg) {
      let ancho;
      if (this.totalDonut > 0) {
        ancho = seg.count / this.totalDonut * 100;
      } else {
        ancho = 0;
      }
      return ancho + '%';
    },

    claseCapa(img) {
      if (this.severidadMaximaImagen(img)) {

        if (f.image !== fullName) return;

      var lineas = String(fix).split('\n')

          var nota = s.slice(2).trim();
          // Antes de la primera rama la nota cuelga del bloque introductorio.

          if (!ultimo || ultimo.cmd) actual.steps.push({ label: '', cmd: cmd });

        .catch(function() { return null; });
    },

    // Cerrar conserva el historial. Al abrir se vuelve a preguntar el modelo: si no es el de la
    // conversación guardada, se descarta y empieza otra con la pregunta automática.
    alternarChat(findingKey, finding) {
      var willOpen = !this.chatOpen[findingKey];
      this.chatOpen = Object.assign({}, this.chatOpen, { [findingKey]: willOpen });
      if (!willOpen) return;
      var self = this;
      var epoch = this.chatEpoch;
      this.consultarEstadoLlm().then(function(d) {
        // Escaneo nuevo o panel cerrado mientras se consultaba: no se toca nada.
        if (epoch !== self.chatEpoch || !self.chatOpen[findingKey]) return;
        if (d && !d.available) return;
        // Con una respuesta en vuelo no se borra: acabaría en la conversación nueva.
        if (self.chatLoading[findingKey]) return;
        var model = (d && d.model) || null;
        var prev = self.chatMessages[findingKey];
        if (d && prev && prev.length && model !== self.chatModel[findingKey]) {
          self.chatMessages = Object.assign({}, self.chatMessages, { [findingKey]: [] });
          prev = null;
        }
        if (!(prev && prev.length)) {
          self.chatModel = Object.assign({}, self.chatModel, { [findingKey]: model });
          self.enviarChat(findingKey, finding,
            'Explícame este hallazgo de forma sencilla: qué significa, por qué importa y cómo lo soluciono.');
        }
      });
    },

    async enviarChat(findingKey, finding, presetQuestion) {
      var question;
      if (presetQuestion != null) {
        question = presetQuestion;
      } else {
        question = (this.chatInput[findingKey] || '').trim();
      }
      if (!question || this.chatLoading[findingKey]) return;

      var epoch = this.chatEpoch;
      var history = [];
      (this.chatMessages[findingKey] || []).forEach(function(m) {
        // Un error no es respuesta del modelo: fuera él y la pregunta que lo provocó.
        if (m.error) {
          if (history.length && history[history.length - 1].role === 'user') history.pop();
          return;
        }
        history.push({ role: m.role, content: m.content });
      });

      var withUser = (this.chatMessages[findingKey] || []).concat([{ role: 'user', content: question }]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: withUser });
      this.chatInput = Object.assign({}, this.chatInput, { [findingKey]: '' });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: true });

      var reply;
      try {
        var res = await fetch('/locoaudit/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            finding: finding, question: question, history: history,
            auditType: this.auditData && this.auditData.auditType,
            platform: this.auditData && this.auditData.host && this.auditData.host.platform,
            llmConfigId: (this.auditData && this.auditData.llmConfigId) || null
          })
        });
        var data = await res.json();
        if (data && data.ok) {
          reply = { role: 'assistant', content: data.content };
        } else {
          reply = { role: 'assistant', content: (data && data.error) || 'Error desconocido del asistente.', error: true };
        }
      } catch (e) {
        reply = { role: 'assistant', content: 'No se pudo contactar con el asistente: ' + (e.message || e), error: true };
      }

      // Llegó un escaneo nuevo mientras esperábamos: la respuesta ya no aplica.
      if (epoch !== this.chatEpoch) return;

      var cur = (this.chatMessages[findingKey] || []).concat([reply]);
      this.chatMessages = Object.assign({}, this.chatMessages, { [findingKey]: cur });
      this.chatLoading = Object.assign({}, this.chatLoading, { [findingKey]: false });
    },

    trocearRespuesta(content) {
      var text = String(content || '');
      var segments = [];
      var regex = /```[a-zA-Z0-9_-]*\n?([\s\S]*?)```/g;
      var lastIndex = 0;
      var m;
      while ((m = regex.exec(text)) !== null) {
        if (m.index > lastIndex) {
          segments.push({ type: 'text', html: this.markdownEnLinea(text.slice(lastIndex, m.index)) });
        }
        segments.push({ type: 'code', code: m[1].replace(/\n$/, '') });
        lastIndex = regex.lastIndex;
      }
      if (lastIndex < text.length) {
        segments.push({ type: 'text', html: this.markdownEnLinea(text.slice(lastIndex)) });
      }
      if (segments.length === 0) segments.push({ type: 'text', html: '' });
      return segments;
    },

    markdownEnLinea(str) {
      var esc = String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      esc = esc.replace(/`([^`]+)`/g, '<code class="chat-inline-code">$1</code>');
      esc = esc.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return esc.trim().replace(/\n/g, '<br>');
    }
  },

  mounted() {
    this.leerTokens();
    // Segunda lectura por si la hoja aún no estaba en el head al montar.
    this.$nextTick(this.leerTokens);

    // Comprueba si hay un llm-config desplegado y qué modelo responde.
    var self = this;
    this.consultarEstadoLlm().then(function(d) { if (!d) self.llmAvailable = false; });
  }
};
</script>

<style>
  /*LCA-STYLE-DASH:image — fuente única de estilo del export*/
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ═══ TOKENS ═══ Mismo vocabulario y valores que host (familia 600/700, legible sobre blanco). */
  :root {
    --critical: #DC2626;
    --critical-bg: #FEF2F2;
    --critical-border: #FECACA;
    --high: #EA580C;
    --high-bg: #FFF7ED;
    --high-border: #FED7AA;
    --medium: #D97706;
    --medium-bg: #FFFBEB;
    --medium-border: #FDE68A;
    --low: #65A30D;
    --low-bg: #F7FEE7;
    --low-border: #D9F99D;
    --info: #0EA5E9;
    --info-bg: #F0F9FF;
    --info-border: #BAE6FD;

    /* Tono 700 para texto: el tono base no llega a 4,5:1 sobre el fondo pálido de su nivel.
       El tono base queda para bordes, puntos y rellenos. */
    --critical-text: #B91C1C;
    --high-text: #C2410C;
    --medium-text: #A16207;
    --low-text: #4D7C0F;
    --info-text: #0369A1;

    --bg: #F8FAFC;
    --card: #FFFFFF;
    --text: #1E293B;
    --text-secondary: #64748B;
    --border: #E2E8F0;
    --surface: #F1F5F9;
    --text-muted: #94A3B8;

    /* Acento morado, compartido con host y network. */
    --accent: #7C3AED;
    --accent-bg: #F5F3FF;
    --accent-border: #DDD6FE;
    --accent-light: #C4B5FD;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 100px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);

    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Fira Code", monospace;
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
    padding: 24px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track  { background: var(--surface); }
  ::-webkit-scrollbar-thumb  { background: var(--text-muted); border-radius: 3px; }

  /* ── Iconos: sprite de <symbol> usado con <use>, primer hijo de .lca-report-root.

  .lca-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
    vertical-align: -3px;
  }
  .icon-sm { width: 13px; height: 13px; vertical-align: -2px; }
  .icon-xl { width: 44px; height: 44px; stroke-width: 1.25; }

  /* Utilidad de mono para valores técnicos sueltos (versiones, identificadores). */
  .is-mono { font-family: var(--font-mono); }

  /* Sin pasos de resolución: informa de qué falta, sin fingir un veredicto. */
  .nofix-note {
    padding: 12px 0;
    font-style: italic;
    color: var(--text-secondary);
    font-size: 12.5px;
  }
  .nofix-note a { color: inherit; font-style: normal; text-decoration: underline; }

  /* ── Estados idle / scanning ───────────────────────────────────────────────── */
  .lca-state-center {

    padding: 60px 20px; text-align: center;
    color: var(--text-secondary);
