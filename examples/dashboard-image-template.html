  .lca-state-inline { padding: 40px 0; }
  .lca-state-ico {
    color: var(--text-muted);
    margin-bottom: 14px;
    animation: lcaPulse 2.2s ease-in-out infinite;
  }
  .lca-state-title { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
  .lca-state-desc  { font-size: .88rem; line-height: 1.4; }
  .lca-spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: lcaSpin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes lcaPulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  @keyframes lcaSpin  { to { transform: rotate(360deg); } }

  /* ═══ CABECERA ═════════════════════════════════════════════════════════════ */
  .header-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 26px 28px;
    display: flex;
    align-items: stretch;
    gap: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .header-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--text-muted);
  }
  .header-card.critical::before { background: var(--critical); }
  .header-card.high::before     { background: var(--high); }
  .header-card.medium::before   { background: var(--medium); }
  .header-card.low::before      { background: var(--low); }
  .header-card.info::before     { background: var(--info); }

  .header-main { flex: 1; min-width: 0; }
  .header-eyebrow {
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .host-name {
    font-size: 26px; font-weight: 700; color: var(--text);
    letter-spacing: -.4px;
    display: flex; align-items: center; gap: 10px; min-width: 0;
  }
  .host-name .icon { width: 20px; height: 20px; color: var(--text-secondary); }
  /* Mono: el hostname es un identificador. */
  .host-name-text { font-family: var(--font-mono); font-size: 24px; overflow-wrap: anywhere; }

  .header-idline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .risk-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px; font-weight: 600; letter-spacing: .1px;
  }
  /* Cada nivel con su familia completa: fondo pálido, texto y borde del mismo color. */
  .risk-badge.critical { background: var(--critical-bg); color: var(--critical-text); border: 1.5px solid var(--critical-border); }
  .risk-badge.high     { background: var(--high-bg);     color: var(--high-text);     border: 1.5px solid var(--high-border); }
  .risk-badge.medium   { background: var(--medium-bg);   color: var(--medium-text);   border: 1.5px solid var(--medium-border); }
  .risk-badge.low      { background: var(--low-bg);      color: var(--low-text);      border: 1.5px solid var(--low-border); }
  .risk-badge.info     { background: var(--info-bg);     color: var(--info-text);     border: 1.5px solid var(--info-border); }
  .risk-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .risk-note { font-size: 13px; color: var(--text-secondary); }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(126px, 1fr));
    gap: 14px 22px;
    margin-top: 18px; padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-key {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px;
    color: var(--text-secondary);
  }
  .meta-val { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  .meta-val-mono { font-family: var(--font-mono); font-size: 12px; }
  .meta-item-actions { grid-column: span 2; }
  .meta-item-actions .dl-group { margin-top: 1px; flex-wrap: nowrap; }
  /* En el export se poda .dl-group: sin .dl-btn la celda "Exportar" se oculta entera. */
  .meta-item-actions:not(:has(.dl-btn)) { display: none; }

  .dl-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .dl-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 11px;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .dl-btn:hover { background: var(--accent); color: #fff; }

  /* Columna derecha: el inventario Docker en tres cifras apiladas. */
  .header-aside {
    display: flex; flex-direction: column;
    align-items: flex-start; justify-content: center;
    gap: 10px;
    flex-shrink: 0; min-width: 200px;
    padding-left: 28px;
    border-left: 1px solid var(--border);
  }
  .aside-label-top {
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .8px;
    color: var(--text-secondary);
  }
  .stat-row { display: flex; align-items: baseline; gap: 8px; width: 100%; }
  .stat-row .icon { color: var(--text-secondary); align-self: center; }
  .stat-num {
    font-family: var(--font-mono);
    font-size: 26px; font-weight: 700; line-height: 1;
    letter-spacing: -1px; color: var(--text);
    min-width: 2ch;
  }
  .stat-label { font-size: 12px; color: var(--text-secondary); }

  @media (max-width: 820px) {
    .header-card { flex-direction: column; }
    .header-aside { padding-left: 0; padding-top: 20px; border-left: none; border-top: 1px solid var(--border); align-self: stretch; }
  }

  /* ── MAIN ─────────────────────────────────────────────────── */
  .main {
    width: 100%;
    max-width: 1200px; margin: 0 auto;
    padding: 20px 24px 40px;
    display: flex; flex-direction: column; gap: 24px;
  }

  .lca-report-root { width: 100%; min-width: 0; }
  .lca-report-root > .main {
    width: auto;
    max-width: none;
    margin: 0;
    padding: 0;
    align-self: stretch;
  }
  .lca-report-root > .main > * { width: 100%; max-width: none; }

  /* ── SECTION LABEL ────────────────────────────────────────── */
  /* Como .section-title de host: gris, porque un título no se pulsa. */
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .1em;
    margin-bottom: 10px;
  }
  .title-bar {
    width: 3px; height: 16px;
    background: var(--text-muted); border-radius: 2px;
    display: inline-block; flex-shrink: 0;
  }
  .section-count {
    font-weight: 400; color: var(--text-secondary);
    text-transform: none; letter-spacing: 0;
  }

  /* ═══ AVISOS ═══ Mismo .lca-notice de host y network: el nivel marca el peso y el tono el color. */
  .lca-notice {
    --notice-accent: var(--text-secondary);
    --notice-bg: var(--card);
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--notice-bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--notice-accent);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .lca-notice-icon { color: var(--notice-accent); margin-top: 1px; }
  .lca-notice-main { flex: 1; min-width: 0; }
  .lca-notice-title { font-weight: 700; color: var(--text); }
  .lca-notice-lead { font-size: 12.5px; font-weight: 700; color: var(--text); margin-top: 4px; }
  .lca-notice-body { font-size: 12.5px; color: var(--text); line-height: 1.6; margin-top: 6px; }
  .lca-notice-body.is-strong { font-weight: 600; }
  .lca-notice-body.is-prewrap { white-space: pre-line; }
  .lca-notice-list {
    margin: 8px 0 0; padding-left: 20px;
    font-size: 12.5px; color: var(--text); line-height: 1.7;
  }
  .lca-notice-list li { margin-bottom: 2px; }
  /* Con estado delante y sin viñeta: competirían por el mismo sitio. */
  .lca-notice-list.is-stated { list-style: none; padding-left: 0; margin-top: 10px; }
  .lca-notice-list.is-stated li {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; padding: 3px 0; margin-bottom: 0;
    border-top: 1px solid var(--border);
  }
  .lca-notice-state {
    flex: 0 0 auto; min-width: 78px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .3px; color: var(--text-secondary);
  }
  .lca-notice-list.is-stated li.chk-failed .lca-notice-state { color: var(--medium-text); }
  .lca-notice-name { color: var(--text); }
  /* Motivo del fallo de cada imagen, bajo su nombre. */
  .lca-notice-reason { display: block; margin-top: 2px; font-size: 11.5px; color: var(--text-secondary); }
  /* Variante con icono por opción: las cuatro vías de mitigación de una imagen. */
  .lca-notice-list.is-iconed { list-style: none; padding-left: 0; margin-top: 10px; }
  .lca-notice-list.is-iconed li {
    display: flex; align-items: flex-start; gap: 9px;
    margin-bottom: 6px; line-height: 1.55;
  }
  .lca-notice-list.is-iconed .icon { color: var(--text-secondary); margin-top: 3px; }
  .lca-notice-hint {
    font-size: 12px; color: var(--text-secondary); margin-top: 8px;
    font-family: var(--font-mono);
  }
  .lca-notice-foot {
    margin-top: 10px; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,.08);
    font-size: 11.5px; color: var(--text-secondary);
  }

  .lca-notice.is-ok      { --notice-accent: var(--low);      --notice-bg: var(--low-bg);      border-color: var(--low-border); }
  .lca-notice.is-warn    { --notice-accent: var(--medium);   --notice-bg: var(--medium-bg);   border-color: var(--medium-border); }
  .lca-notice.is-info    { --notice-accent: var(--info);     --notice-bg: var(--info-bg);     border-color: var(--info-border); }
  .lca-notice.is-neutral { --notice-accent: var(--text-secondary); --notice-bg: var(--card);  border-color: var(--border); }
  .lca-notice.is-ok   .lca-notice-title { color: #3F6212; }
  .lca-notice.is-warn .lca-notice-title { color: #92400E; }

  .lca-notice.lvl-1 { padding: 16px 20px; margin-bottom: 14px; }
  .lca-notice.lvl-1 .lca-notice-title { font-size: 15px; }
  .lca-notice.lvl-1 .lca-notice-icon  { width: 18px; height: 18px; }
  .lca-notice.lvl-2 .lca-notice-title { font-size: 14px; }
  .lca-notice.lvl-3 {
    --notice-bg: var(--card);
    border-color: var(--border);
    padding: 12px 16px;
  }
  .lca-notice.lvl-3 .lca-notice-title { font-size: 13px; color: var(--text); }
  .lca-notice.lvl-3 .lca-notice-body,
  .lca-notice.lvl-3 .lca-notice-lead  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-list  { color: var(--text-secondary); font-size: 12px; }
  .lca-notice.lvl-3 .lca-notice-icon  { width: 14px; height: 14px; }

  /* ═══ TIRA DE SEVERIDADES ═══ Una sola tarjeta con celdas separadas por un filete. */
  .sev-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .sev-strip { display: flex; flex-wrap: wrap; }
  .sev-cell {
    flex: 1 1 150px;
    min-width: 0;
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 2px;
    border-left: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
    position: relative;
  }
  .sev-cell:first-child { border-left: none; }
  .sev-cell:hover { background: var(--surface); }
  .sev-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .sev-cell-label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .sev-cell-num { font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px; }
  .sev-cell-sub { font-size: 11px; color: var(--text-secondary); }

  .sev-cell.critical { background: var(--critical-bg); }
  .sev-cell.high     { background: var(--high-bg); }
  .sev-cell.medium   { background: var(--medium-bg); }
  .sev-cell.low      { background: var(--low-bg); }
  .sev-cell.critical .sev-cell-label, .sev-cell.critical .sev-cell-num { color: var(--critical-text); }
  .sev-cell.high     .sev-cell-label, .sev-cell.high     .sev-cell-num { color: var(--high-text); }
  .sev-cell.medium   .sev-cell-label, .sev-cell.medium   .sev-cell-num { color: var(--medium-text); }
  .sev-cell.low      .sev-cell-label, .sev-cell.low      .sev-cell-num { color: var(--low-text); }
  /* Sobre la celda tintada el gris no llega a 4,5:1: el subtítulo toma el tono de su nivel. */
  .sev-cell.critical .sev-cell-sub { color: var(--critical-text); }
  .sev-cell.high     .sev-cell-sub { color: var(--high-text); }
  .sev-cell.medium   .sev-cell-sub { color: var(--medium-text); }
  .sev-cell.low      .sev-cell-sub { color: var(--low-text); }

  /* A cero: gris. Un color de alarma sobre un cero es ruido. */
  .sev-cell.zero { background: var(--card); }
  .sev-cell.zero .sev-cell-label { color: var(--text-secondary); }
  .sev-cell.zero .sev-cell-num   { color: var(--text-secondary); }

  .sev-cell.active::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }
  .sev-cell.active { background: var(--surface); }

  /* ── CONTAINER CARDS ──────────────────────────────────────── */
  .empty-dashed {
    background: #fff;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 32px; text-align: center; color: var(--text-secondary);
  }

  .container-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .container-card {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow);
  }
  .container-card.crisk-critical { border-color: var(--critical); box-shadow: 0 4px 16px rgba(239,68,68,.15); }
  .container-card.crisk-high     { border-color: var(--high);     box-shadow: 0 4px 16px rgba(249,115,22,.12); }
  .container-card.crisk-medium   { border-color: var(--medium);   box-shadow: 0 4px 16px rgba(234,179,8,.12); }
  .container-card.crisk-low      { border-color: var(--low);      }

  /* Layer strips (decorative top bars) */
  .layer-strip {
    position: absolute; top: 0; right: 0;
    height: 3px;
    border-bottom-left-radius: 2px;
  }
  .strip-0 { width: 95%; }
  .strip-1 { width: 89%; }
  .strip-2 { width: 83%; }

  .container-body { padding: 16px 16px 14px; }

  .container-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px;
  }
  .container-name {
    font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px;
  }
  .container-image {
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-secondary); background: var(--bg);
    padding: 2px 6px; border-radius: 4px; display: inline-block;
  }
  .status-badge {
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
    flex-shrink: 0;
  }
  .running { background: var(--low-bg); color: var(--low-text); border: 1px solid var(--low-border); }
  .stopped { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--border); }

  .ports-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .port-chip {
    font-family: var(--font-mono); font-size: 11px;
    background: var(--surface); color: var(--text-secondary);
    padding: 2px 7px; border-radius: 4px;
  }

  .container-findings {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  }
  .findings-prefix { font-size: 11px; color: var(--text-secondary); }

  /* Severity badges (shared) */
  .mini-sev-badge, .sev-badge, .cve-badge {
    display: inline-block;
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 4px;
    border: 1px solid transparent;
  }
  /* Con ámbito y no `.critical` suelto, que alcanzaría también a .header-card.critical. */
  .sev-badge.critical, .mini-sev-badge.critical, .cve-badge.critical, .gsev.critical, .cvss-chip.critical,
  .status-badge.critical { background: var(--critical-bg); color: var(--critical-text); border-color: var(--critical-border); }
  .sev-badge.high, .mini-sev-badge.high, .cve-badge.high, .gsev.high, .cvss-chip.high { background: var(--high-bg); color: var(--high-text); border-color: var(--high-border); }
  .sev-badge.medium, .mini-sev-badge.medium, .cve-badge.medium, .gsev.medium, .cvss-chip.medium { background: var(--medium-bg); color: var(--medium-text); border-color: var(--medium-border); }
  .sev-badge.low, .mini-sev-badge.low, .cve-badge.low, .gsev.low, .cvss-chip.low { background: var(--low-bg); color: var(--low-text); border-color: var(--low-border); }
  .sev-badge.info, .mini-sev-badge.info, .cve-badge.info, .gsev.info, .cvss-chip.info { background: var(--info-bg); color: var(--info-text); border-color: var(--info-border); }

  /* ── DONUT + IMAGES ROW ───────────────────────────────────── */
  .mid-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr);
    gap: 16px;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    min-width: 0;
  }

  .donut-wrap {
    display: flex; align-items: center; gap: 20px; min-width: 0;
  }
  .donut-svg {
    width: clamp(120px, 35%, 160px); height: auto; flex-shrink: 0;
  }
  .donut-total {
    font-size: 28px; font-weight: 700; fill: var(--text);
    font-family: var(--font-sans);
  }
  .donut-sub {
    font-size: 10px; fill: var(--text-secondary);
    font-family: var(--font-sans);
  }

  .donut-legend { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .legend-item  { display: flex; align-items: center; gap: 8px; }
  .legend-dot   { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-name  { font-size: 12px; font-weight: 600; color: var(--text); min-width: 44px; }
  .legend-bar-track {
    flex: 1; height: 6px; background: var(--surface);
    border-radius: 3px; overflow: hidden;
  }
  .legend-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width .8s ease;
  }
  .legend-count { font-size: 12px; font-weight: 700; min-width: 24px; text-align: right; }

  /* Images list */
  .images-list { display: flex; flex-direction: column; gap: 8px; }
  .image-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
  }

  /* Layer icon (stacked slabs) */
  .layer-icon {
    width: 32px; height: 32px; flex-shrink: 0;
    position: relative;
  }
  .layer-slab {
    position: absolute; height: 6px; border-radius: 2px;
    border: 1px solid;
  }
  .slab-0 { width: 28px; bottom: 0;  left: 0; }
  .slab-1 { width: 22px; bottom: 6px; left: 3px; }
  .slab-2 { width: 16px; bottom: 12px; left: 6px; }

  .slab-critical, .slab-critical { background: var(--critical-border); border-color: var(--critical); }
  .slab-high     { background: var(--high-border);     border-color: var(--high); }
  .slab-medium   { background: var(--medium-border);   border-color: var(--medium); }
  .slab-low      { background: var(--low-border);      border-color: var(--low); }
  .slab-clean    { background: var(--surface);         border-color: var(--border); }

  .image-info { flex: 1; min-width: 0; }
  .image-name {
    font-family: var(--font-mono); font-size: 13px; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .image-meta { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }

  .image-badge-wrap { flex-shrink: 0; }
  .cve-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
  .clean-badge {
    font-size: 11px; font-weight: 600;
    background: var(--low-bg); color: var(--low-text);
    border: 1px solid var(--low-border);
    padding: 2px 8px; border-radius: 6px;
  }
  .unscanned-badge {
    font-size: 11px; font-weight: 600;
    background: var(--card); color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 6px;
  }

  /* ── FINDINGS SECTION ─────────────────────────────────────── */
  .findings-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
  }

  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    padding: 4px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--accent-border);
    background: #fff; color: var(--accent);
    transition: all .15s;
  }
  .filter-btn.active {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
  }
  .filter-btn:hover:not(.active) { background: var(--bg); }
  .clear-btn {
    border-color: var(--critical-border);
    background: var(--critical-bg); color: var(--critical-text);
  }
  .clear-btn:hover { background: var(--critical-border); }

  .findings-list { display: flex; flex-direction: column; gap: 6px; }

  /* Gris: la cabecera de grupo no es un control violeta. No renombrar .group-header (lo usa el export). */
  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 2px;
    padding: 6px 10px;
    background: var(--surface);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .group-header:hover { background: var(--bg); }
  .group-header:first-child { margin-top: 0; }
  .group-chevron {
    font-size: 11px;
    color: var(--text-muted);
    width: 12px;
    flex: 0 0 auto;
  }
  .group-name { font-family: var(--font-mono); color: var(--text); }
  /* El icono hereda del nombre: se fija el mismo gris que .group-icon de host. */
  .group-name .icon { color: var(--text-secondary); }
  .group-os {
    font-weight: 600;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .group-sevs {
    margin-left: auto;
    display: flex;
    gap: 4px;
  }
  .gsev {
    font-size: 10px;
    font-weight: 700;
    border-radius: 8px;
    padding: 0 6px;
    line-height: 16px;
  }
  /* Misma píldora de recuento que host. */
  .group-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: var(--radius-pill);
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
    flex: 0 0 auto;
  }
  .group-body { display: flex; flex-direction: column; gap: 6px; }
  .finding-img-badge {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 7px;
    margin-right: 8px;
    white-space: nowrap;
  }

  .finding-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s;
  }
  .finding-item.finding-open {
    border-color: var(--border);
    box-shadow: var(--shadow-md);
  }

  .finding-row {
    width: 100%; background: none; border: none; cursor: pointer;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 8px;
    text-align: left;
  }
  .finding-row:hover { background: var(--bg); }

  /* Etiqueta de tipo neutra, como .badge.cat de network: dice de dónde sale, no cuánto importa. */
  .type-badge {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    background: var(--card); color: var(--text-secondary);
    border: 1px solid var(--border);
  }

  .sev-badge {
    font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 4px;
    flex-shrink: 0;
  }
  .finding-title {
    font-size: 13px; font-weight: 600; color: var(--text); flex: 1;
  }
  .finding-id {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); flex-shrink: 0;
  }
  .finding-chevron {
    color: var(--border); font-size: 14px;
    transition: transform .2s; flex-shrink: 0;
  }
  .finding-chevron.open { transform: rotate(180deg); }

  /* Expanded detail */
  .finding-detail {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid var(--bg);
    animation: iaSlideDown .15s ease;
  }
  .finding-detail.open { display: block; }
  @keyframes iaSlideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* Detalle: un panel plano con secciones. No renombrar .detail-stack (lo usa el export). */
  .detail-stack {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }

  /* Sin caja propia: a partir de la segunda sección, línea discontinua. */
  .detail-col + .detail-col {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  /* Gris: un rótulo de sección no se pulsa. */
  .detail-col-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .detail-evidence {
    font-size: 12.5px; color: var(--text); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    margin: 0;
  }

  /* ── Tira de metadatos del hallazgo ───────────────────────── */
  /* Borde gris, no violeta: es un separador, no algo que se pulse. */
  .meta-strip {
    display: flex; flex-wrap: wrap;
    gap: 10px 22px;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .meta-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .meta-label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em;
    color: var(--text-secondary);
  }
  .meta-value {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    display: inline-flex; align-items: center; gap: 6px;
    word-break: break-word;
  }
  .meta-value.is-mono { font-family: var(--font-mono); font-weight: 500; font-size: 11.5px; }
  .meta-fixed { color: #047857; }
  .meta-nofix { color: #B45309; font-style: italic; font-weight: 500; }
  .cvss-chip {
    font-size: 9.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em;
    padding: 1px 6px; border-radius: 999px;
  }
  .meta-link { color: var(--accent); text-decoration: none; }
  .meta-link:hover { text-decoration: underline; }
  .meta-muted { color: var(--text-secondary); font-weight: 500; font-style: italic; }

  /* ── Pasos de resolución. Rama = alternativa excluyente; subtítulo un nivel por debajo. */
  .fix-branch + .fix-branch { margin-top: 14px; }
  .fix-branch-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .fix-steps {
    list-style: decimal;
    /* Números del navegador, tabulares y en gris. */
    padding-left: 20px;
    font-variant-numeric: tabular-nums;
  }
  .fix-steps::marker, .fix-step::marker { color: var(--text-secondary); }
  /* Un párrafo suelto no es una secuencia: sin marcador y sin sangría. */
  .fix-steps-single { list-style: none; padding-left: 0; }
  .fix-step {
    font-size: 12.5px;
    color: var(--text);
    line-height: 1.5;
    padding-left: 2px;
  }
  .fix-step + .fix-step { margin-top: 8px; }
  .fix-step-label  { color: var(--text); }
  .command-inline  { margin-top: 6px; }
  /* Intro y notas: contexto sin marcador ni sangría, para no leerse como pasos. */
  .fix-intro { font-size: 12.5px; line-height: 1.5; color: var(--text); }
  .fix-intro + .fix-intro { margin-top: 6px; }
  .fix-intro + .fix-branch, .fix-note-line + .fix-branch { margin-top: 12px; }
  .fix-note-line {
    margin-top: 8px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  /* Nota explicativa que acompaña a un comando: nunca entra en el portapapeles. */
  .cmd-note {
    margin-top: 6px; font-size: 12px; line-height: 1.55; color: var(--text-secondary);
    white-space: pre-wrap;
  }
  /* Nota neutra de funcionamiento; fondo --bg por contraste (sobre --surface no llega a 4,5:1). */
  .cmd-note-safety {
    display: flex; align-items: flex-start; gap: 7px;
    background: var(--bg); color: var(--text-secondary);
    border-radius: var(--radius-sm); padding: 9px 11px;
    white-space: normal;
  }
  .cmd-note-safety .icon { flex-shrink: 0; margin-top: 2px; }

  /* Command box */
  .command-box {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px;
    background: var(--text);
    border-radius: 8px; padding: 10px 14px;
  }
  .command-text {
    flex: 1; font-family: var(--font-mono); font-size: 12px;
    color: var(--border);
    overflow-x: auto; white-space: nowrap;
  }
  .command-btn {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 6px;
    padding: 4px 10px; font-size: 11px; font-weight: 600;
    cursor: pointer; transition: background .2s;
  }
  .command-btn:hover  { background: #6D28D9; }
  .command-btn.copied { background: var(--low); }

  /* ── FOOTER ───────────────────────────────────────────────── */
  /* ═══ PIE DEL INFORME ══════════════════════════════════════════════════════ */
  .report-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 28px;
    margin-top: 20px;
    padding: 14px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .report-foot-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .report-foot-key {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .7px; color: var(--text-secondary);
  }
  .report-foot-val { font-size: 11.5px; color: var(--text-secondary); overflow-wrap: anywhere; }

  /* ── Chat con IA ──────────────────────────────────────────── */
  .lca-chat-wrap { margin-top: 12px; }
  .ai-ask-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .ai-ask-btn:hover { background: var(--accent-border); }
  .lca-chat {
    margin-top: 12px;
    border: 1px solid var(--accent-border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    padding: 12px;
  }
  .lca-chat-msgs {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 360px;
    overflow-y: auto;
    margin-bottom: 10px;
  }
  .chat-msg { display: flex; }
  .chat-user { justify-content: flex-end; }
  .chat-ai   { justify-content: flex-start; }
  .chat-bubble {
    max-width: 85%;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .chat-user .chat-bubble {
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-ai .chat-bubble {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--accent-border);
    border-bottom-left-radius: 4px;
  }
  .chat-bubble.chat-error {
    background: var(--critical-bg);
    color: var(--critical-text);
    border: 1px solid var(--critical-border);
  }
  .chat-text { word-break: break-word; }
  .chat-text + .command-box { margin-top: 10px; }
  .chat-inline-code {
    font-family: var(--font-mono);
    background: rgba(124,58,237,.1);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11.5px;
  }
  .chat-user .chat-inline-code { background: rgba(255,255,255,.22); }
  .chat-loading { display: flex; gap: 4px; align-items: center; }
  .chat-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-secondary);
    animation: iaChatBlink 1.2s infinite ease-in-out both;
  }
  .chat-dot:nth-child(2) { animation-delay: .2s; }
  .chat-dot:nth-child(3) { animation-delay: .4s; }
  @keyframes iaChatBlink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
